pect(r.messagingProvider).toBe('mock');\n    expect(r.relayLookupSupported).toBe(true);\n  });\n\n  it('reconcileAmbiguousSms recovery abandoned resend path', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        return chainable({\n          data: [\n            {\n              id: '1',\n              lead_id: 'L',\n              message_sid: 'mlf:recovery:L:abandoned:99',\n              status: 'abandoned_retry',\n            },\n          ],\n          error: null,\n        });\n      }\n      if (table === 'leads') {\n        return chainable({\n          data: {\n            id: 'L',\n            opted_out: false,\n            caller_phone: '+12135550100',\n            sms_outbound_sid: 'mlf:recovery:L',\n            businesses: {\n              id: 'B',\n              name: 'Acme',\n              timezone: 'America/New_York',\n              vertical: 'plumbing',\n              settings: {},\n            },\n          },\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n    const r = await reconcileAmbiguousSms();\n    expect(r.requeued).toBeGreaterThanOrEqual(1);\n  });\n\n  it('processDueCampaigns increments skipped when claim returns null', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        // listClaimable returns an id; claim update returns empty → null token\n        const b = chainable({ data: [{ id: 'enr-1' }], error: null });\n        b.update = vi.fn(() => {\n          const u = chainable({ data: [], error: null });\n          u.select = vi.fn(() => chainable({ data: [], error: null }));\n          return u;\n        });\n        return b;\n      }\n      return chainable({ data: [], error: null });\n    });\n    const r = await processDueCampaigns();\n    expect(r.skipped).toBeGreaterThanOrEqual(1);\n    expect(r.processed).toBe(0);\n  });\n\n  it('processDueCampaigns catch path parks enrollment and counts error', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        const enrollmentRow = {\n          id: 'enr-1',\n          current_step: 2,\n          status: 'active',\n          claim_token: 'tok',\n          leads: {\n            id: 'L',\n            caller_phone: '+12135550100',\n            opted_out: false,\n            issue: '',\n            businesses: {\n              id: 'B',\n              name: 'Acme',\n              timezone: 'America/New_York',\n            },\n          },\n          campaigns: { id: 'C', name: 'Standard' },\n        };\n        const b = chainable({ data: [{ id: 'enr-1' }], error: null });\n        b.single = vi.fn(async () => ({ data: enrollmentRow, error: null }));\n        b.update = vi.fn((payload: unknown) => {\n          (b as { _updates?: unknown[] })._updates = [\n            ...((b as { _updates?: unknown[] })._updates ?? []),\n            payload,\n          ];\n          const u = chainable({\n            data: [{ id: 'enr-1', claim_token: 'tok' }],\n            error: null,\n          });\n          u.select = vi.fn(() =>\n            chainable({\n              data: [{ id: 'enr-1', claim_token: 'tok' }],\n              error: null,\n            })\n          );\n          return u;\n        });\n        return b;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({\n          data: [\n            { step_number: 1, delay_minutes: 0, template_key: 'a' },\n            { step_number: 2, delay_minutes: 60, template_key: 'b' },\n          ],\n          error: null,\n        });\n      }\n      return chainable({ data: [], error: null });\n    });\n    mockSendMessage.mockRejectedValue(new Error('boom'));\n    const r = await processDueCampaigns();\n    expect(r.errors).toBeGreaterThanOrEqual(1);\n  });\n\n  it('claimDueEnrollment returns token on due hit', async () => {\n    mockFrom.mockImplementation(() => {\n      const b = chainable({\n        data: [{ id: 'enr-1', claim_token: 'x' }],\n        error: null,\n      });\n      b.update = vi.fn(() => {\n        const u = chainable({\n          data: [{ id: 'enr-1', claim_token: 'x' }],\n          error: null,\n        });\n        u.select = vi.fn(() =>\n          chainable({ data: [{ id: 'enr-1' }], error: null })\n        );\n        return u;\n      });\n      return b;\n    });\n    const tok = await claimDueEnrollment('enr-1');\n    expect(tok).toBeTruthy();\n    expect(typeof tok).toBe('string');\n  });\n\n  it('leadHasActiveEnrollment is true only for status active', async () => {\n    mockFrom.mockImplementation(() =>\n      chainable({\n        data: { id: 'e', status: 'active', lead_id: 'L' },\n        error: null,\n      })\n    );\n    await expect(leadHasActiveEnrollment('L')).resolves.toBe(true);\n\n    mockFrom.mockImplementation(() =>\n      chainable({\n        data: { id: 'e', status: 'paused', lead_id: 'L' },\n        error: null,\n      })\n    );\n    await expect(leadHasActiveEnrollment('L')).resolves.toBe(false);\n\n    mockFrom.mockImplementation(() =>\n      chainable({ data: null, error: null })\n    );\n    await expect(leadHasActiveEnrollment('L')).resolves.toBe(false);\n  });\n});\n"},"src/services/campaigns.reconcile.di.test.ts":{"tests":[{"id":"236","name":"campaigns reconcile post-pass DI > abandoned campaign requeues exact step with payload","location":{"start":{"column":3,"line":113}}},{"id":"237","name":"campaigns reconcile post-pass DI > confirmed campaign advances with reconcileAdvancePayload","location":{"start":{"column":3,"line":177}}},{"id":"238","name":"campaigns reconcile post-pass DI > confirmed last step completes enrollment","location":{"start":{"column":3,"line":237}}},{"id":"239","name":"campaigns reconcile post-pass DI > recovery abandoned clears outbound sid then resends","location":{"start":{"column":3,"line":292}}},{"id":"240","name":"sendCampaignSMS park / needs_review payload > ambiguous parks with far-future next_send_at","location":{"start":{"column":3,"line":410}}},{"id":"241","name":"sendCampaignSMS park / needs_review payload > needs_review marks terminal status (no re-park)","location":{"start":{"column":3,"line":427}}}],"source":"/**\n * Drive reconcile post-pass helpers (advanceAfter / requeue / resend) and\n * sendCampaignSMS park / needs_review with payload assertions.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSendMessage = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'mock',\n    sendMessage: vi.fn(),\n    checkLookupSupport: vi.fn(async () => ({ supported: true })),\n  }),\n}));\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    sendMessage: (...a: unknown[]) => mockSendMessage(...a),\n    reconcileAmbiguousSms: vi.fn(async () => ({\n      unknownCount: 0,\n      stuckSendingCount: 0,\n      requeued: 0,\n      confirmed: 0,\n      parked: 0,\n      needsReview: 0,\n      alert: false,\n    })),\n  };\n});\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...a: unknown[]) => isPhoneSuppressed(...a),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/sms', () => ({\n  processDeferredRecoveries: vi.fn(async () => ({\n    sent: 0,\n    deferred: 0,\n    errors: 0,\n  })),\n  sendRecoverySMS: vi.fn(async () => undefined),\n}));\n\nimport { reconcileAmbiguousSms, sendCampaignSMS } from './campaigns';\nimport { ENROLLMENT_STATUS, SMS_STATUS } from '@/services/db-strings';\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'like',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn(() => {\n    const nested = chainable(result);\n    nested.then = (\n      resolve: (v: unknown) => unknown,\n      reject?: (e: unknown) => unknown\n    ) => Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.update = vi.fn((payload: unknown) => {\n    obj._lastUpdate = payload;\n    const u = chainable(result);\n    u.select = vi.fn(() => chainable(result));\n    u._payload = payload;\n    return u;\n  });\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('campaigns reconcile post-pass DI', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  it('abandoned campaign requeues exact step with payload', async () => {\n    const updates: unknown[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        const b = chainable({\n          data: [\n            {\n              id: '1',\n              lead_id: 'L',\n              message_sid: 'mlf:campaign:enr1:camp1:step:2:abandoned:9',\n              status: 'abandoned_retry',\n            },\n          ],\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push({ table, payload });\n          return chainable({ data: null, error: null });\n        });\n        return b;\n      }\n      if (table === 'campaign_enrollments') {\n        const b = chainable({\n          data: {\n            id: 'enr1',\n            campaign_id: 'camp1',\n            status: 'active',\n            current_step: 3,\n            claim_token: null,\n          },\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push({ table, payload });\n          const u = chainable({ data: [{ id: 'enr1' }], error: null });\n          u.select = vi.fn(() =>\n            chainable({ data: [{ id: 'enr1' }], error: null })\n          );\n          return u;\n        });\n        return b;\n      }\n      return chainable({ data: [], error: null });\n    });\n\n    const r = await reconcileAmbiguousSms();\n    expect(r.requeued).toBeGreaterThanOrEqual(1);\n    expect(\n      updates.some(\n        (u) =>\n          (u as { table: string; payload: Record<"+"string, unknown> }).table ===\n            'campaign_enrollments' &&\n          (u as { payload: Record<"+"string, unknown> }).payload.current_step === 2\n      )\n    ).toBe(true);\n    expect(\n      updates.some(\n        (u) =>\n          (u as { payload: Record<"+"string, unknown> }).payload.status ===\n          SMS_STATUS.abandonedDone\n      )\n    ).toBe(true);\n  });\n\n  it('confirmed campaign advances with reconcileAdvancePayload', async () => {\n    const updates: unknown[] = [];\n    let smsPass = 0;\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        smsPass += 1;\n        // first query: abandoned (empty); second: confirmed\n        if (smsPass === 1) {\n          return chainable({ data: [], error: null });\n        }\n        return chainable({\n          data: [\n            {\n              id: 'c1',\n              lead_id: 'L',\n              message_sid: 'mlf:campaign:enr1:camp1:step:1',\n              status: 'delivered',\n            },\n          ],\n          error: null,\n        });\n      }\n      if (table === 'campaign_enrollments') {\n        const b = chainable({\n          data: {\n            id: 'enr1',\n            campaign_id: 'camp1',\n            status: 'active',\n            current_step: 1,\n            claim_token: null,\n          },\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push(payload);\n          return chainable({ data: [{ id: 'enr1' }], error: null });\n        });\n        return b;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({\n          data: [\n            { step_number: 1, delay_minutes: 0 },\n            { step_number: 2, delay_minutes: 30 },\n          ],\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n\n    await reconcileAmbiguousSms();\n    expect(updates.length).toBeGreaterThan(0);\n    expect(updates[0]).toMatchObject({\n      current_step: 2,\n      claim_token: null,\n      claimed_at: null,\n    });\n  });\n\n  it('confirmed last step completes enrollment', async () => {\n    const updates: unknown[] = [];\n    let smsPass = 0;\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        smsPass += 1;\n        if (smsPass === 1) return chainable({ data: [], error: null });\n        return chainable({\n          data: [\n            {\n              id: 'c1',\n              message_sid: 'mlf:campaign:enr1:camp1:step:2',\n              status: 'delivered',\n            },\n          ],\n          error: null,\n        });\n      }\n      if (table === 'campaign_enrollments') {\n        const b = chainable({\n          data: {\n            id: 'enr1',\n            campaign_id: 'camp1',\n            status: 'active',\n            current_step: 2,\n            claim_token: null,\n          },\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push(payload);\n          return chainable({ data: [{ id: 'enr1' }], error: null });\n        });\n        return b;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({\n          data: [\n            { step_number: 1, delay_minutes: 0 },\n            { step_number: 2, delay_minutes: 30 },\n          ],\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n\n    await reconcileAmbiguousSms();\n    expect(updates[0]).toMatchObject({\n      status: ENROLLMENT_STATUS.completed,\n      next_send_at: null,\n      claim_token: null,\n    });\n  });\n\n  it('recovery abandoned clears outbound sid then resends', async () => {\n    const { sendRecoverySMS } = await import('@/services/sms');\n    const updates: unknown[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        const b = chainable({\n          data: [\n            {\n              id: '1',\n              lead_id: 'L',\n              message_sid: 'mlf:recovery:L:abandoned:1',\n              status: 'abandoned_retry',\n            },\n          ],\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push({ table, payload });\n          return chainable({ data: null, error: null });\n        });\n        return b;\n      }\n      if (table === 'leads') {\n        const b = chainable({\n          data: {\n            id: 'L',\n            opted_out: false,\n            caller_phone: '+12135550100',\n            sms_outbound_sid: 'mlf:recovery:L',\n            businesses: {\n              id: 'B',\n              name: 'Acme',\n              timezone: 'America/New_York',\n              vertical: 'plumbing',\n              settings: {},\n            },\n          },\n          error: null,\n        });\n        b.update = vi.fn((payload: unknown) => {\n          updates.push({ table, payload });\n          return b;\n        });\n        return b;\n      }\n      return chainable({ data: null, error: null });\n    });\n\n    const r = await reconcileAmbiguousSms();\n    expect(r.requeued).toBeGreaterThanOrEqual(1);\n    expect(\n      updates.some(\n        (u) =>\n          (u as { table: string; payload: Record<"+"string, unknown> }).table ===\n            'leads' &&\n          (u as { payload: Record<"+"string, unknown> }).payload\n            .sms_outbound_sid === null\n      )\n    ).toBe(true);\n    expect(sendRecoverySMS).toHaveBeenCalled();\n  });\n});\n\ndescribe('sendCampaignSMS park / needs_review payload', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  const enrollmentRow = {\n    id: 'enr-1',\n    current_step: 2,\n    status: 'active',\n    claim_token: 'tok',\n    leads: {\n      id: 'lead-1',\n      caller_phone: '+12135550100',\n      opted_out: false,\n      issue: '',\n      timezone: 'America/Los_Angeles',\n      businesses: {\n        id: 'b',\n        name: 'Acme',\n        timezone: 'America/Los_Angeles',\n      },\n    },\n    campaigns: { id: 'camp-std', name: 'Standard', urgency_filter: null },\n  };\n\n  function mockDb(capture: { updates: unknown[] }) {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        const b = chainable({ data: enrollmentRow, error: null });\n        b.single = vi.fn(async () => ({ data: enrollmentRow, error: null }));\n        b.update = vi.fn((payload: unknown) => {\n          capture.updates.push(payload);\n          const u = chainable({ data: [{ id: 'enr-1' }], error: null });\n          u.select = vi.fn(() =>\n            chainable({ data: [{ id: 'enr-1' }], error: null })\n          );\n          return u;\n        });\n        return b;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({\n          data: [\n            { step_number: 1, delay_minutes: 0, template_key: 'a' },\n            { step_number: 2, delay_minutes: 60, template_key: 'b' },\n          ],\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n  }\n\n  it('ambiguous parks with far-future next_send_at', async () => {\n    const capture = { updates: [] as unknown[] };\n    mockDb(capture);\n    mockSendMessage.mockResolvedValue({\n      kind: 'ambiguous',\n      sid: 's',\n      reason: 'recent_send',\n      nextRetryAt: '2099-01-01T00:00:00.000Z',\n    });\n    await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(false);\n    expect(capture.updates.length).toBeGreaterThan(0);\n    expect(capture.updates[0]).toMatchObject({\n      claim_token: null,\n      next_send_at: '2099-01-01T00:00:00.000Z',\n    });\n  });\n\n  it('needs_review marks terminal status (no re-park)', async () => {\n    const capture = { updates: [] as unknown[] };\n    mockDb(capture);\n    mockSendMessage.mockResolvedValue({\n      kind: 'needs_review',\n      sid: 's',\n      reason: 'max_attempts',\n    });\n    await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(false);\n    expect(capture.updates[0]).toMatchObject({\n      status: ENROLLMENT_STATUS.needsReview,\n      next_send_at: null,\n      claim_token: null,\n    });\n  });\n});\n"},"src/services/sms.di.test.ts":{"tests":[{"id":"242","name":"buildRecoveryBody > uses vertical template / custom / general fallback","location":{"start":{"column":3,"line":163}}},{"id":"243","name":"fallbackDeferIso > is ~8h ahead","location":{"start":{"column":3,"line":183}}},{"id":"244","name":"persistDeferredRecoveryWithDeps > selects id,status by message_sid and updates existing","location":{"start":{"column":3,"line":190}}},{"id":"245","name":"persistDeferredRecoveryWithDeps > inserts when absent; handles 23505 race; logs non-unique errors","location":{"start":{"column":3,"line":211}}},{"id":"246","name":"persistDeferredRecoveryWithDeps > insert payload uses deferred/outbound constants","location":{"start":{"column":3,"line":261}}},{"id":"247","name":"sendRecoverySMSWithDeps > persists deferred and logs recovery_deferred","location":{"start":{"column":3,"line":282}}},{"id":"248","name":"sendRecoverySMSWithDeps > logs distinct events per outcome kind (kills case-label mutants)","location":{"start":{"column":3,"line":303}}},{"id":"249","name":"processDeferredRecoveriesWithDeps > query error → errors:1 and logs","location":{"start":{"column":3,"line":357}}},{"id":"250","name":"processDeferredRecoveriesWithDeps > filters deferred by status+next_retry_at columns","location":{"start":{"column":3,"line":372}}},{"id":"251","name":"processDeferredRecoveriesWithDeps > sends / re-defers / abandons / parks / catches","location":{"start":{"column":3,"line":400}}},{"id":"252","name":"processDeferredRecoveriesWithDeps > missing business increments errors and does not send","location":{"start":{"column":3,"line":546}}},{"id":"253","name":"processDeferredRecoveriesWithDeps > null lead increments errors and does not send","location":{"start":{"column":3,"line":580}}},{"id":"254","name":"processDeferredRecoveriesWithDeps > ignore (never_sent) leaves counters unchanged and does not abandon","location":{"start":{"column":3,"line":614}}},{"id":"255","name":"processDeferredRecoveriesWithDeps > ignore path caps retries then abandons","location":{"start":{"column":3,"line":665}}},{"id":"256","name":"processDeferredRecoveriesWithDeps > re_defer persists exact leadId/body/nextSendAt (not empty payload)","location":{"start":{"column":3,"line":706}}},{"id":"257","name":"sendFollowUpSMSWithDeps (QC r6 P2 suppression restore) > skips when suppressed / lookup failed / opted out and logs events","location":{"start":{"column":3,"line":747}}},{"id":"258","name":"sendFollowUpSMSWithDeps (QC r6 P2 suppression restore) > sends and inserts when clear; non-sent skips insert","location":{"start":{"column":3,"line":796}}},{"id":"259","name":"sendFollowUpSMSWithDeps (QC r6 P2 suppression restore) > rethrows non-suppression errors","location":{"start":{"column":3,"line":866}}},{"id":"260","name":"sendFollowUpSMSWithDeps (QC r6 P2 suppression restore) > null lead row still sends (opted_out optional chain)","location":{"start":{"column":3,"line":881}}}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport {\n  buildRecoveryBody,\n  fallbackDeferIso,\n  persistDeferredRecoveryWithDeps,\n  processDeferredRecoveriesWithDeps,\n  sendFollowUpSMSWithDeps,\n  sendRecoverySMSWithDeps,\n  SMS_TEMPLATES,\n  type SmsDeps,\n  type SmsLogger,\n} from './sms';\nimport { SuppressionLookupError } from '@/services/suppressions';\nimport { recoveryMessageSid } from '@/services/sms-sid';\nimport type { SendOutcome } from '@/services/send/types';\nimport {\n  COL,\n  DIRECTION_OUTBOUND,\n  KIND_MANUAL,\n  KIND_RECOVERY,\n  SMS_SELECT_DEFERRED,\n  SMS_SELECT_ID_STATUS,\n  SMS_STATUS,\n  TABLE,\n} from '@/services/db-strings';\n\ntype Business = {\n  id: string;\n  name: string;\n  vertical: string;\n  timezone: string;\n  settings: Record<"+"string, unknown>;\n};\n\nconst business: Business = {\n  id: 'B',\n  name: 'Acme Plumbing',\n  vertical: 'plumbing',\n  timezone: 'America/Los_Angeles',\n  settings: {},\n};\n\nfunction makeLogger(): SmsLogger & { calls: Array<"+"{ level: string; args: unknown[] }> } {\n  const calls: Array<"+"{ level: string; args: unknown[] }> = [];\n  return {\n    calls,\n    log: (...args: unknown[]) => {\n      calls.push({ level: 'log', args });\n    },\n    warn: (...args: unknown[]) => {\n      calls.push({ level: 'warn', args });\n    },\n    error: (...args: unknown[]) => {\n      calls.push({ level: 'error', args });\n    },\n  };\n}\n\nfunction makeDb(state: {\n  existing?: { id: string; status: string } | null;\n  insertError?: { code: string; message: string } | null;\n  deferredRows?: Array<"+"Record<"+"string, unknown>>;\n  lead?: Record<"+"string, unknown> | null;\n  queryError?: { message: string } | null;\n}) {\n  const calls: Array<"+"{ table: string; op: string; args: unknown[] }> = [];\n  return {\n    calls,\n    from: (table: string) => {\n      const api: Record<"+"string, unknown> = {};\n      const chain = () => api;\n      const asList = () => ({\n        ...api,\n        then: (\n          resolve: (v: unknown) => unknown,\n          reject?: (e: unknown) => unknown\n        ) => {\n          if (table === TABLE.smsMessages && state.deferredRows !== undefined) {\n            return Promise.resolve({\n              data: state.deferredRows,\n              error: state.queryError ?? null,\n            }).then(resolve, reject);\n          }\n          return Promise.resolve({\n            data: null,\n            error: state.insertError ?? null,\n          }).then(resolve, reject);\n        },\n      });\n      for (const m of ['eq', 'lte', 'limit', 'order']) {\n        api[m] = (...args: unknown[]) => {\n          calls.push({ table, op: m, args });\n          return asList();\n        };\n      }\n      api.select = (...args: unknown[]) => {\n        calls.push({ table, op: 'select', args });\n        return asList();\n      };\n      api.insert = (payload: unknown) => {\n        calls.push({ table, op: 'insert', args: [payload] });\n        return {\n          then: (\n            resolve: (v: unknown) => unknown,\n            reject?: (e: unknown) => unknown\n          ) =>\n            Promise.resolve({\n              data: null,\n              error: state.insertError ?? null,\n            }).then(resolve, reject),\n        };\n      };\n      api.update = (payload: unknown) => {\n        calls.push({ table, op: 'update', args: [payload] });\n        return asList();\n      };\n      api.maybeSingle = async () => {\n        calls.push({ table, op: 'maybeSingle', args: [] });\n        if (table === TABLE.smsMessages) {\n          return { data: state.existing ?? null, error: null };\n        }\n        if (table === TABLE.leads) {\n          return { data: state.lead ?? null, error: null };\n        }\n        return { data: null, error: null };\n      };\n      api.single = async () => {\n        calls.push({ table, op: 'single', args: [] });\n        return { data: state.lead ?? null, error: null };\n      };\n      return api;\n    },\n  };\n}\n\nfunction deps(\n  overrides: Partial<"+"SmsDeps> & { dbImpl?: ReturnType<"+"typeof makeDb>; logImpl?: ReturnType<"+"typeof makeLogger> } = {}\n): SmsDeps {\n  const dbImpl = overrides.dbImpl ?? makeDb({});\n  const logImpl = overrides.logImpl ?? makeLogger();\n  return {\n    db: () => dbImpl as never,\n    clock: () => new Date('2026-06-15T18:00:00.000Z'),\n    sendMessage: async () =>\n      ({\n        kind: 'sent',\n        sid: 's',\n        messageId: 'm',\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      }) satisfies SendOutcome,\n    isPhoneSuppressed: async () => false,\n    SuppressionLookupError,\n    log: logImpl,\n    ...overrides,\n    // keep log/db after spread if provided via overrides without wiping\n    ...(overrides.log ? {} : { log: logImpl }),\n    ...(overrides.db ? {} : { db: () => dbImpl as never }),\n  };\n}\n\ndescribe('buildRecoveryBody', () => {\n  it('uses vertical template / custom / general fallback', () => {\n    expect(buildRecoveryBody(business as never)).toContain('plumbing');\n    expect(buildRecoveryBody(business as never)).toContain('STOP');\n    expect(\n      buildRecoveryBody({\n        ...business,\n        vertical: 'unknown',\n        settings: {},\n      } as never)\n    ).toContain(SMS_TEMPLATES.general.split('{business}')[0].slice(0, 10));\n    expect(\n      buildRecoveryBody({\n        ...business,\n        settings: { smsTemplate: 'Custom {business} hi' },\n      } as never)\n    ).toContain('Custom Acme Plumbing hi');\n  });\n});\n\ndescribe('fallbackDeferIso', () => {\n  it('is ~8h ahead', () => {\n    const now = new Date('2026-01-01T00:00:00.000Z');\n    expect(fallbackDeferIso(now)).toBe('2026-01-01T08:00:00.000Z');\n  });\n});\n\ndescribe('persistDeferredRecoveryWithDeps', () => {\n  it('selects id,status by message_sid and updates existing', async () => {\n    const db = makeDb({ existing: { id: '1', status: 'sending' } });\n    await persistDeferredRecoveryWithDeps(deps({ dbImpl: db }), {\n      leadId: 'L',\n      body: 'b',\n      nextSendAt: 't',\n    });\n    expect(db.calls).toContainEqual({\n      table: TABLE.smsMessages,\n      op: 'select',\n      args: [SMS_SELECT_ID_STATUS],\n    });\n    expect(db.calls).toContainEqual({\n      table: TABLE.smsMessages,\n      op: 'eq',\n      args: [COL.messageSid, 'mlf:recovery:L'],\n    });\n    const upd = db.calls.find((c) => c.op === 'update');\n    expect(upd?.args[0]).toMatchObject({ status: SMS_STATUS.deferred, body: 'b' });\n  });\n\n  it('inserts when absent; handles 23505 race; logs non-unique errors', async () => {\n    const db = makeDb({\n      existing: null,\n      insertError: { code: '23505', message: 'dup' },\n    });\n    const log = makeLogger();\n    await persistDeferredRecoveryWithDeps(deps({ dbImpl: db, logImpl: log }), {\n      leadId: 'L',\n      body: 'b',\n      nextSendAt: 't',\n    });\n    expect(db.calls.some((c) => c.op === 'insert')).toBe(true);\n    const raceUpdates = db.calls.filter((c) => c.op === 'update');\n    expect(raceUpdates.length).toBeGreaterThan(0);\n    expect(raceUpdates[0]?.args[0]).toEqual({\n      status: SMS_STATUS.deferred,\n      next_retry_at: 't',\n      body: 'b',\n    });\n    // Unique race must NOT log insert_failed\n    expect(log.calls.some((c) => c.args[0] === 'persist_deferred_insert_failed')).toBe(\n      false\n    );\n\n    const dbErr = makeDb({\n      existing: null,\n      insertError: { code: '42501', message: 'perm' },\n    });\n    const logErr = makeLogger();\n    await persistDeferredRecoveryWithDeps(\n      deps({ dbImpl: dbErr, logImpl: logErr }),\n      { leadId: 'L', body: 'b', nextSendAt: 't' }\n    );\n    expect(logErr.calls.some((c) => c.args[0] === 'persist_deferred_insert_failed')).toBe(\n      true\n    );\n    // Non-unique error must NOT take the unique-race update path\n    expect(dbErr.calls.filter((c) => c.op === 'update')).toHaveLength(0);\n\n    // Clean insert (no error) must NOT update (kills error?.code === PG_UNIQUE → true)\n    const dbOk = makeDb({ existing: null, insertError: null });\n    await persistDeferredRecoveryWithDeps(deps({ dbImpl: dbOk }), {\n      leadId: 'L',\n      body: 'b',\n      nextSendAt: 't',\n    });\n    expect(dbOk.calls.some((c) => c.op === 'insert')).toBe(true);\n    expect(dbOk.calls.filter((c) => c.op === 'update')).toHaveLength(0);\n  });\n\n  it('insert payload uses deferred/outbound constants', async () => {\n    const db = makeDb({ existing: null });\n    await persistDeferredRecoveryWithDeps(deps({ dbImpl: db }), {\n      leadId: 'L',\n      body: 'hello',\n      nextSendAt: '2026-01-01T00:00:00.000Z',\n    });\n    const insert = db.calls.find((c) => c.op === 'insert');\n    expect(insert?.args[0]).toEqual({\n      lead_id: 'L',\n      direction: DIRECTION_OUTBOUND,\n      body: 'hello',\n      message_sid: 'mlf:recovery:L',\n      status: SMS_STATUS.deferred,\n      next_retry_at: '2026-01-01T00:00:00.000Z',\n      key_supported_at_send: false,\n    });\n  });\n});\n\ndescribe('sendRecoverySMSWithDeps', () => {\n  it('persists deferred and logs recovery_deferred', async () => {\n    const db = makeDb({ existing: null });\n    const log = makeLogger();\n    await sendRecoverySMSWithDeps(\n      deps({\n        dbImpl: db,\n        logImpl: log,\n        sendMessage: async () => ({\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: '2026-06-16T12:00:00.000Z',\n        }),\n      }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    expect(db.calls.some((c) => c.op === 'insert' || c.op === 'update')).toBe(true);\n    expect(log.calls.some((c) => c.args[0] === 'recovery_deferred')).toBe(true);\n  });\n\n  it('logs distinct events per outcome kind (kills case-label mutants)', async () => {\n    const cases: Array<"+"{ outcome: SendOutcome; event: string; level: string }> = [\n      {\n        outcome: { kind: 'blocked', reason: 'suppressed' },\n        event: 'recovery_blocked',\n        level: 'log',\n      },\n      {\n        outcome: { kind: 'skipped', reason: 'x' },\n        event: 'recovery_blocked',\n        level: 'log',\n      },\n      {\n        outcome: { kind: 'needs_review', sid: 's', reason: 'r' },\n        event: 'recovery_needs_review',\n        level: 'error',\n      },\n      {\n        outcome: { kind: 'ambiguous', sid: 's', reason: 'r' },\n        event: 'recovery_ambiguous',\n        level: 'warn',\n      },\n      {\n        outcome: {\n          kind: 'sent',\n          sid: 's',\n          messageId: 'm',\n          providerStatus: 'queued',\n          keySupportedAtSend: true,\n        },\n        event: 'recovery_sent',\n        level: 'log',\n      },\n    ];\n    for (const c of cases) {\n      const log = makeLogger();\n      await sendRecoverySMSWithDeps(\n        deps({\n          dbImpl: makeDb({}),\n          logImpl: log,\n          sendMessage: async () => c.outcome,\n        }),\n        'L',\n        business as never,\n        '+12135550100'\n      );\n      expect(log.calls.some((x) => x.level === c.level && x.args[0] === c.event)).toBe(\n        true\n      );\n    }\n  });\n});\n\ndescribe('processDeferredRecoveriesWithDeps', () => {\n  it('query error → errors:1 and logs', async () => {\n    const log = makeLogger();\n    const r = await processDeferredRecoveriesWithDeps(\n      deps({\n        logImpl: log,\n        dbImpl: makeDb({\n          deferredRows: [],\n          queryError: { message: 'boom' },\n        }),\n      })\n    );\n    expect(r).toEqual({ sent: 0, deferred: 0, errors: 1 });\n    expect(log.calls.some((c) => c.args[0] === 'deferred_query_failed')).toBe(true);\n  });\n\n  it('filters deferred by status+next_retry_at columns', async () => {\n    const db = makeDb({ deferredRows: [], lead: null });\n    await processDeferredRecoveriesWithDeps(deps({ dbImpl: db }));\n    expect(db.calls).toContainEqual({\n      table: TABLE.smsMessages,\n      op: 'select',\n      args: [SMS_SELECT_DEFERRED],\n    });\n    expect(db.calls).toContainEqual({\n      table: TABLE.smsMessages,\n      op: 'eq',\n      args: [COL.status, SMS_STATUS.deferred],\n    });\n    expect(\n      db.calls.some(\n        (c) => c.op === 'lte' && c.args[0] === COL.nextRetryAt\n      )\n    ).toBe(true);\n    expect(\n      db.calls.some(\n        (c) =>\n          c.op === 'order' &&\n          c.args[0] === COL.nextRetryAt &&\n          (c.args[1] as { ascending?: boolean })?.ascending === true\n      )\n    ).toBe(true);\n  });\n\n  it('sends / re-defers / abandons / parks / catches', async () => {\n    const lead = {\n      id: 'L',\n      caller_phone: '+12135550100',\n      businesses: business,\n    };\n    const rows = [\n      {\n        id: '1',\n        lead_id: 'L',\n        message_sid: 'mlf:recovery:L',\n        body: 'hi',\n        next_retry_at: '2026-01-01T00:00:00.000Z',\n      },\n    ];\n\n    let r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead }),\n        sendMessage: async (req) => {\n          expect(req.kind).toBe(KIND_RECOVERY);\n          expect(req.skipQuietHours).toBe(false);\n          // mut.py #57 — stable recovery sid, not Date.now()\n          expect(req.idempotencyKey).toBe(recoveryMessageSid(lead.id));\n          expect(req.idempotencyKey).not.toMatch(/:\\d{10,}$/);\n          return {\n            kind: 'sent',\n            sid: 's',\n            messageId: 'm',\n            providerStatus: 'queued',\n            keySupportedAtSend: true,\n          } as SendOutcome;\n        },\n      })\n    );\n    expect(r.sent).toBe(1);\n\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead, existing: null }),\n        sendMessage: async () => ({\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't',\n        }),\n      })\n    );\n    expect(r.deferred).toBe(1);\n\n    // quiet hours without nextSendAt → fallback\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead, existing: null }),\n        sendMessage: async () => ({\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n        }),\n      })\n    );\n    expect(r.deferred).toBe(1);\n\n    const dbAbandon = makeDb({ deferredRows: rows, lead });\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: dbAbandon,\n        sendMessage: async () => ({ kind: 'blocked', reason: 'suppressed' }),\n      })\n    );\n    expect(\n      dbAbandon.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { status?: string })?.status === SMS_STATUS.abandonedDone\n      )\n    ).toBe(true);\n    expect(\n      dbAbandon.calls.some((c) => c.op === 'eq' && c.args[0] === COL.id && c.args[1] === '1')\n    ).toBe(true);\n\n    // skipped also abandons\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead }),\n        sendMessage: async () => ({ kind: 'skipped', reason: 'x' }),\n      })\n    );\n    expect(r.sent).toBe(0);\n\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead }),\n        sendMessage: async () => ({\n          kind: 'needs_review',\n          sid: 's',\n          reason: 'r',\n        }),\n      })\n    );\n    expect(r.deferred).toBe(1);\n\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: rows, lead }),\n        sendMessage: async () => ({\n          kind: 'ambiguous',\n          sid: 's',\n          reason: 'r',\n        }),\n      })\n    );\n    expect(r.deferred).toBe(1);\n\n    // empty body → buildRecoveryBody\n    const emptyBodyRows = [{ ...rows[0], body: '' }];\n    const send = vi.fn(async () => ({\n      kind: 'sent' as const,\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    }));\n    await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: makeDb({ deferredRows: emptyBodyRows, lead }),\n        sendMessage: send,\n      })\n    );\n    expect(String((send.mock.calls[0] as unknown as [Record<"+"string, unknown>])[0].body)).toContain(\n      'plumbing'\n    );\n\n    // throw → errors++\n    const log = makeLogger();\n    r = await processDeferredRecoveriesWithDeps(\n      deps({\n        logImpl: log,\n        dbImpl: makeDb({ deferredRows: rows, lead }),\n        sendMessage: async () => {\n          throw new Error('relay down');\n        },\n      })\n    );\n    expect(r.errors).toBe(1);\n    expect(log.calls.some((c) => c.args[0] === 'deferred_row_failed')).toBe(true);\n  });\n\n  it('missing business increments errors and does not send', async () => {\n    const send = vi.fn();\n    const log = { calls: [] as Array<"+"{ level: string; args: unknown[] }> };\n    const logger = {\n      log: (...args: unknown[]) => log.calls.push({ level: 'log', args }),\n      warn: (...args: unknown[]) => log.calls.push({ level: 'warn', args }),\n      error: (...args: unknown[]) => log.calls.push({ level: 'error', args }),\n    };\n    const r = await processDeferredRecoveriesWithDeps(\n      deps({\n        sendMessage: send,\n        log: logger,\n        dbImpl: makeDb({\n          deferredRows: [\n            {\n              id: '1',\n              lead_id: 'L',\n              message_sid: 'x',\n              body: 'b',\n              next_retry_at: 't',\n            },\n          ],\n          lead: { id: 'L', businesses: null },\n        }),\n      })\n    );\n    expect(r.errors).toBe(1);\n    expect(send).not.toHaveBeenCalled();\n    // Must take the explicit !business branch (not the catch) — kills empty-block mutants.\n    expect(log.calls.some((c) => c.args[0] === 'deferred_row_failed')).toBe(\n      false\n    );\n  });\n\n  it('null lead increments errors and does not send', async () => {\n    const send = vi.fn();\n    const log = { calls: [] as Array<"+"{ level: string; args: unknown[] }> };\n    const logger = {\n      log: (...args: unknown[]) => log.calls.push({ level: 'log', args }),\n      warn: (...args: unknown[]) => log.calls.push({ level: 'warn', args }),\n      error: (...args: unknown[]) => log.calls.push({ level: 'error', args }),\n    };\n    const r = await processDeferredRecoveriesWithDeps(\n      deps({\n        sendMessage: send,\n        log: logger,\n        dbImpl: makeDb({\n          deferredRows: [\n            {\n              id: '1',\n              lead_id: 'L',\n              message_sid: 'x',\n              body: 'b',\n              next_retry_at: 't',\n            },\n          ],\n          lead: null,\n        }),\n      })\n    );\n    expect(r.errors).toBe(1);\n    expect(send).not.toHaveBeenCalled();\n    // Explicit !lead continue — not catch — kills empty-block / force-false mutants.\n    expect(log.calls.some((c) => c.args[0] === 'deferred_row_failed')).toBe(\n      false\n    );\n  });\n\n  it('ignore (never_sent) leaves counters unchanged and does not abandon', async () => {\n    const lead = {\n      id: 'L',\n      caller_phone: '+12135550100',\n      businesses: business,\n    };\n    const db = makeDb({\n      deferredRows: [\n        {\n          id: '1',\n          lead_id: 'L',\n          message_sid: 'x',\n          body: 'b',\n          next_retry_at: 't',\n        },\n      ],\n      lead,\n    });\n    const log = { calls: [] as Array<"+"{ level: string; args: unknown[] }> };\n    const logger = {\n      log: (...args: unknown[]) => log.calls.push({ level: 'log', args }),\n      warn: (...args: unknown[]) => log.calls.push({ level: 'warn', args }),\n      error: (...args: unknown[]) => log.calls.push({ level: 'error', args }),\n    };\n    const r = await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: db,\n        log: logger,\n        sendMessage: async () =>\n          ({ kind: 'never_sent', sid: 's', requeued: true }) as SendOutcome,\n      })\n    );\n    expect(r).toEqual({ sent: 0, deferred: 0, errors: 0 });\n    expect(\n      db.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { status?: string })?.status === SMS_STATUS.abandonedDone\n      )\n    ).toBe(false);\n    expect(\n      db.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { reconcile_attempts?: number })?.reconcile_attempts ===\n            1\n      )\n    ).toBe(true);\n    expect(log.calls.some((c) => c.args[0] === 'deferred_ignored')).toBe(true);\n  });\n\n  it('ignore path caps retries then abandons', async () => {\n    const lead = {\n      id: 'L',\n      caller_phone: '+12135550100',\n      businesses: business,\n    };\n    const db = makeDb({\n      deferredRows: [\n        {\n          id: '1',\n          lead_id: 'L',\n          message_sid: 'x',\n          body: 'hi',\n          next_retry_at: 't',\n          reconcile_attempts: 4,\n        },\n      ],\n      lead,\n    });\n    const log = makeLogger();\n    await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: db,\n        logImpl: log,\n        sendMessage: async () =>\n          ({ kind: 'never_sent', sid: 's', requeued: true }) as SendOutcome,\n      })\n    );\n    expect(\n      db.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { status?: string })?.status ===\n            SMS_STATUS.abandonedDone\n      )\n    ).toBe(true);\n    expect(log.calls.some((c) => c.args[0] === 'deferred_ignore_capped')).toBe(\n      true\n    );\n  });\n\n  it('re_defer persists exact leadId/body/nextSendAt (not empty payload)', async () => {\n    const lead = {\n      id: 'L',\n      caller_phone: '+12135550100',\n      businesses: business,\n    };\n    const db = makeDb({\n      deferredRows: [\n        {\n          id: '1',\n          lead_id: 'L',\n          message_sid: 'x',\n          body: 'hi-body',\n          next_retry_at: 't',\n        },\n      ],\n      lead,\n      existing: null,\n    });\n    await processDeferredRecoveriesWithDeps(\n      deps({\n        dbImpl: db,\n        sendMessage: async () => ({\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: '2026-06-01T12:00:00.000Z',\n        }),\n      })\n    );\n    const inserts = db.calls.filter((c) => c.op === 'insert');\n    expect(inserts.length).toBeGreaterThan(0);\n    expect(inserts[0].args[0]).toMatchObject({\n      lead_id: 'L',\n      body: 'hi-body',\n      next_retry_at: '2026-06-01T12:00:00.000Z',\n      status: SMS_STATUS.deferred,\n    });\n  });\n});\n\ndescribe('sendFollowUpSMSWithDeps (QC r6 P2 suppression restore)', () => {\n  it('skips when suppressed / lookup failed / opted out and logs events', async () => {\n    const send = vi.fn();\n    const log = makeLogger();\n    await sendFollowUpSMSWithDeps(\n      deps({\n        logImpl: log,\n        isPhoneSuppressed: async () => true,\n        sendMessage: send,\n      }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    expect(send).not.toHaveBeenCalled();\n    expect(log.calls.some((c) => c.args[0] === 'followup_suppressed')).toBe(true);\n\n    const log2 = makeLogger();\n    await sendFollowUpSMSWithDeps(\n      deps({\n        logImpl: log2,\n        isPhoneSuppressed: async () => {\n          throw new SuppressionLookupError('x');\n        },\n        sendMessage: send,\n      }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    expect(send).not.toHaveBeenCalled();\n    expect(\n      log2.calls.some((c) => c.args[0] === 'followup_suppression_lookup_failed')\n    ).toBe(true);\n\n    const log3 = makeLogger();\n    await sendFollowUpSMSWithDeps(\n      deps({\n        logImpl: log3,\n        dbImpl: makeDb({ lead: { opted_out: true } }),\n        sendMessage: send,\n      }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    expect(send).not.toHaveBeenCalled();\n    expect(log3.calls.some((c) => c.args[0] === 'followup_opted_out')).toBe(true);\n  });\n\n  it('sends and inserts when clear; non-sent skips insert', async () => {\n    const db = makeDb({ lead: { opted_out: false } });\n    const send = vi.fn(async () => ({\n      kind: 'sent' as const,\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    }));\n    await sendFollowUpSMSWithDeps(\n      deps({ dbImpl: db, sendMessage: send }),\n      'L',\n      business as never,\n      '+12135550100',\n      'Custom follow'\n    );\n    expect(send).toHaveBeenCalled();\n    const [sentReq] = send.mock.calls[0] as unknown as [Record<"+"string, unknown>];\n    expect(sentReq).toMatchObject({\n      kind: KIND_MANUAL,\n      skipQuietHours: true,\n      to: '+12135550100',\n    });\n    const insert = db.calls.find((c) => c.op === 'insert');\n    expect(insert?.args[0]).toEqual({\n      lead_id: 'L',\n      direction: DIRECTION_OUTBOUND,\n      body: expect.stringContaining('Custom follow'),\n      message_sid: 's',\n      status: 'queued',\n    });\n    expect(db.calls).toContainEqual({\n      table: TABLE.leads,\n      op: 'eq',\n      args: [COL.id, 'L'],\n    });\n\n    // blocked → no insert (kills outcome.kind === 'sent' → true)\n    const db2 = makeDb({ lead: { opted_out: false } });\n    await sendFollowUpSMSWithDeps(\n      deps({\n        dbImpl: db2,\n        sendMessage: async () => ({ kind: 'blocked', reason: 'suppressed' }),\n      }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    expect(db2.calls.some((c) => c.op === 'insert')).toBe(false);\n\n    // default body when no customMessage\n    const db3 = makeDb({ lead: { opted_out: false } });\n    const send3 = vi.fn(async () => ({\n      kind: 'sent' as const,\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    }));\n    await sendFollowUpSMSWithDeps(\n      deps({ dbImpl: db3, sendMessage: send3 }),\n      'L',\n      business as never,\n      '+12135550100'\n    );\n    const followReq = (send3.mock.calls[0] as unknown as [Record<"+"string, unknown>])[0];\n    expect(String(followReq.body)).toContain('Acme Plumbing');\n    expect(String(followReq.body)).toContain('following up');\n  });\n\n  it('rethrows non-suppression errors', async () => {\n    await expect(\n      sendFollowUpSMSWithDeps(\n        deps({\n          isPhoneSuppressed: async () => {\n            throw new Error('network');\n          },\n        }),\n        'L',\n        business as never,\n        '+12135550100'\n      )\n    ).rejects.toThrow('network');\n  });\n\n  it('null lead row still sends (opted_out optional chain)', async () => {\n    const send = vi.fn(async () => ({\n      kind: 'sent' as const,\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    }));\n    await sendFollowUpSMSWithDeps(\n      deps({\n        dbImpl: makeDb({ lead: null }),\n        sendMessage: send,\n      }),\n      'L',\n      business as never,\n      '+12135550100',\n      'hi'\n    );\n    expect(send).toHaveBeenCalled();\n  });\n});\n"},"src/services/opt-out.r7.test.ts":{"tests":[{"id":"261","name":"QC r7 opt-out whole-message vs keyword-in-sentence > whole-message carrier keywords → opt_out","location":{"start":{"column":3,"line":81}}},{"id":"262","name":"QC r7 opt-out whole-message vs keyword-in-sentence > keyword as whole word in longer message → ambiguous (not opt_out)","location":{"start":{"column":3,"line":102}}},{"id":"263","name":"QC r7 opt-out whole-message vs keyword-in-sentence > stopped/ending as substrings are not whole-word keywords","location":{"start":{"column":3,"line":118}}},{"id":"264","name":"QC r7 opt-out whole-message vs keyword-in-sentence > ≥50 negative fixtures of normal replies are not auto-suppressed","location":{"start":{"column":3,"line":125}}},{"id":"265","name":"QC r7 opt-out whole-message vs keyword-in-sentence > empty / whitespace → not_opt_out","location":{"start":{"column":3,"line":133}}},{"id":"266","name":"QC r7 opt-out whole-message vs keyword-in-sentence > shared lists power both exact and compact backfill helpers","location":{"start":{"column":3,"line":138}}},{"id":"267","name":"QC r7 opt-out whole-message vs keyword-in-sentence > sqlQuotedList escapes apostrophes for SQL IN lists","location":{"start":{"column":3,"line":147}}},{"id":"268","name":"app ↔ SQL backfill parity on shared corpus > wouldBackfillSuppress ≡ classifyOptOut.opt_out on the same corpus","location":{"start":{"column":3,"line":165}}},{"id":"269","name":"app ↔ SQL backfill parity on shared corpus > mid-sentence END/CANCEL never backfill-suppress","location":{"start":{"column":3,"line":173}}},{"id":"270","name":"app ↔ SQL backfill parity on shared corpus > normalize is stable for parity keys","location":{"start":{"column":3,"line":180}}},{"id":"271","name":"app ↔ SQL backfill parity on shared corpus > normalize is idempotent for trailing punct+space (CI flake \"! ,\")","location":{"start":{"column":3,"line":185}}}],"source":"/**\n * QC r7 opt-out: whole-message auto-suppress, keyword-in-sentence → ambiguous,\n * ≥50 negative fixtures of normal service replies, app↔SQL parity.\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  classifyOptOut,\n  normalizeOptOutText,\n  wouldBackfillSuppress,\n} from './opt-out';\nimport {\n  OPT_OUT_WHOLE_MESSAGE,\n  OPT_OUT_WHOLE_MESSAGE_COMPACT,\n  optOutBackfillCompactList,\n  optOutBackfillExactList,\n  sqlQuotedList,\n} from './opt-out-data';\n\n/** QC r7 §5 examples + normal booking replies — must NOT auto-suppress. */\nexport const NEGATIVE_SERVICE_REPLIES: string[] = [\n  'Can you come next weekend?',\n  'end of day is fine',\n  \"I'll send pics\",\n  'My friend referred me',\n  'The leak stopped but came back',\n  'Quite urgent please',\n  'recommend a time?',\n  'calendar is open',\n  'pending insurance',\n  'I need a quote, can you send someone',\n  'Yes please send someone today',\n  'Do you do weekends?',\n  'Tuesday works, my AC quit',\n  'Can you come by end of day?',\n  'I need to cancel and reschedule to Friday',\n  'weekend works',\n  'What time can you come?',\n  'Morning is better for me',\n  'Please call me back',\n  'The water heater is out',\n  'No heat since last night',\n  'AC not cooling upstairs',\n  'How much for a tune up?',\n  'Are you available tomorrow?',\n  'Someone will be home after 5',\n  'Gate code is 1234',\n  'Park in the driveway',\n  'Dog is friendly',\n  'Use the side entrance',\n  'We already called another company',\n  'Still waiting on parts',\n  'Is this covered by warranty?',\n  'Can you text me an ETA?',\n  'Running late, still coming?',\n  'Thanks for coming out yesterday',\n  'Invoice looked good',\n  'Need a second opinion',\n  'The drain is clogged again',\n  'Toilet keeps running',\n  'Furnace making noise',\n  'Breaker keeps tripping',\n  'Smell gas near the stove',\n  'Basement has standing water',\n  'Roof leak over the garage',\n  'Ice maker stopped working',\n  'Garbage disposal jammed',\n  'Dishwasher will not drain',\n  'Sump pump failed overnight',\n  'Generator will not start',\n  'Pool pump is quiet now',\n  'Sprinklers overshoot the sidewalk',\n  'Fence gate will not latch',\n  'Garage door opener quit working mid-cycle wait no just stuck',\n  'The appointment at the end of next week works',\n  'Please do not cancel the visit, just move it',\n  'Can you stop by after lunch?',\n];\n\ndescribe('QC r7 opt-out whole-message vs keyword-in-sentence', () => {\n  it('whole-message carrier keywords → opt_out', () => {\n    for (const token of [\n      'STOP',\n      'stop',\n      'Stop!',\n      'STOPALL',\n      'UNSUBSCRIBE',\n      'CANCEL',\n      'END',\n      'QUIT',\n      'OPT OUT',\n      'opt-out',\n      'REVOKE',\n      'please stop',\n      'STOP PLEASE',\n      'S T O P',\n    ]) {\n      expect(classifyOptOut(token).kind, token).toBe('opt_out');\n    }\n  });\n\n  it('keyword as whole word in longer message → ambiguous (not opt_out)', () => {\n    const cases = [\n      'cancel my appointment',\n      'end of day is fine',\n      'Tuesday works, my AC quit',\n      'I need to cancel and reschedule to Friday',\n      'Can you come by end of day?',\n      'Please do not cancel the visit, just move it',\n      'Can you stop by after lunch?',\n    ];\n    for (const body of cases) {\n      const v = classifyOptOut(body);\n      expect(v.kind, body).toBe('ambiguous');\n    }\n  });\n\n  it('stopped/ending as substrings are not whole-word keywords', () => {\n    expect(classifyOptOut('The leak stopped but came back').kind).toBe(\n      'not_opt_out'\n    );\n    expect(classifyOptOut('pending insurance').kind).toBe('not_opt_out');\n  });\n\n  it('≥50 negative fixtures of normal replies are not auto-suppressed', () => {\n    expect(NEGATIVE_SERVICE_REPLIES.length).toBeGreaterThanOrEqual(50);\n    for (const body of NEGATIVE_SERVICE_REPLIES) {\n      const v = classifyOptOut(body);\n      expect(v.kind, body).not.toBe('opt_out');\n    }\n  });\n\n  it('empty / whitespace → not_opt_out', () => {\n    expect(classifyOptOut('').kind).toBe('not_opt_out');\n    expect(classifyOptOut('   ').kind).toBe('not_opt_out');\n  });\n\n  it('shared lists power both exact and compact backfill helpers', () => {\n    expect(optOutBackfillExactList()).toEqual([...OPT_OUT_WHOLE_MESSAGE]);\n    expect(optOutBackfillCompactList()).toEqual([\n      ...OPT_OUT_WHOLE_MESSAGE_COMPACT,\n    ]);\n    expect(OPT_OUT_WHOLE_MESSAGE.length).toBeGreaterThan(20);\n    expect(OPT_OUT_WHOLE_MESSAGE_COMPACT).toContain('STOP');\n  });\n\n  it('sqlQuotedList escapes apostrophes for SQL IN lists', () => {\n    expect(sqlQuotedList([\"DON'T TEXT ME\", 'STOP'])).toBe(\n      \"'DON''T TEXT ME', 'STOP'\"\n    );\n    expect(sqlQuotedList(OPT_OUT_WHOLE_MESSAGE.slice(0, 3))).toContain(\"'STOP'\");\n  });\n});\n\ndescribe('app ↔ SQL backfill parity on shared corpus', () => {\n  const CORPUS = [\n    ...OPT_OUT_WHOLE_MESSAGE.slice(0, 20),\n    ...NEGATIVE_SERVICE_REPLIES,\n    'STOP',\n    'cancel my appointment',\n    'end of day',\n    'Can you come next weekend?',\n  ];\n\n  it('wouldBackfillSuppress ≡ classifyOptOut.opt_out on the same corpus', () => {\n    for (const body of CORPUS) {\n      const app = classifyOptOut(body).kind === 'opt_out';\n      const sql = wouldBackfillSuppress(body);\n      expect(sql, body).toBe(app);\n    }\n  });\n\n  it('mid-sentence END/CANCEL never backfill-suppress', () => {\n    expect(wouldBackfillSuppress('Can you come by end of day?')).toBe(false);\n    expect(\n      wouldBackfillSuppress('I need to cancel and reschedule to Friday')\n    ).toBe(false);\n  });\n\n  it('normalize is stable for parity keys', () => {\n    expect(normalizeOptOutText('  stop!!! ')).toBe('STOP');\n    expect(normalizeOptOutText('Opt Out')).toBe('OPT OUT');\n  });\n\n  it('normalize is idempotent for trailing punct+space (CI flake \"! ,\")', () => {\n    for (const s of ['! ,', 'STOP?! ', ' , ', 'end.', 'cancel…']) {\n      const once = normalizeOptOutText(s);\n      expect(normalizeOptOutText(once)).toBe(once);\n    }\n  });\n});\n"},"src/services/campaign-reconcile-plan.test.ts":{"tests":[{"id":"272","name":"campaign-reconcile-plan > coalesceRows null → [] (not filler)","location":{"start":{"column":3,"line":13}}},{"id":"273","name":"campaign-reconcile-plan > planAbandonedSidAction routes campaign/recovery/ignore","location":{"start":{"column":3,"line":19}}},{"id":"274","name":"campaign-reconcile-plan > planAbandonedSidAction property: requeue iff all AND conjuncts hold","location":{"start":{"column":3,"line":110}}},{"id":"275","name":"campaign-reconcile-plan > shouldResendRecovery is AND of lead && !optedOut && business","location":{"start":{"column":3,"line":150}}},{"id":"276","name":"campaign-reconcile-plan > planPostConfirmAdvance skips on claim / mismatch / empty steps","location":{"start":{"column":3,"line":181}}},{"id":"277","name":"campaign-reconcile-plan > planPostConfirmAdvance advances or completes","location":{"start":{"column":3,"line":244}}},{"id":"278","name":"campaign-reconcile-plan > planConfirmedRowAction property: only campaign with ids advances","location":{"start":{"column":3,"line":305}}},{"id":"279","name":"campaign-reconcile-plan > shouldResendRecovery property: true iff all three gates pass","location":{"start":{"column":3,"line":362}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  coalesceRows,\n  planAbandonedSidAction,\n  planConfirmedRowAction,\n  planPostConfirmAdvance,\n  shouldResendRecovery,\n} from './campaign-reconcile-plan';\nimport { KIND_CAMPAIGN, KIND_RECOVERY } from '@/services/db-strings';\n\ndescribe('campaign-reconcile-plan', () => {\n  it('coalesceRows null → [] (not filler)', () => {\n    expect(coalesceRows(null)).toEqual([]);\n    expect(coalesceRows(undefined)).toEqual([]);\n    expect(coalesceRows([1, 2])).toEqual([1, 2]);\n  });\n\n  it('planAbandonedSidAction routes campaign/recovery/ignore', () => {\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 2,\n      })\n    ).toEqual({\n      type: 'requeue_campaign',\n      enrollmentId: 'E',\n      campaignId: 'C',\n      stepNumber: 2,\n    });\n    expect(\n      planAbandonedSidAction({ kind: KIND_RECOVERY, leadId: 'L' })\n    ).toEqual({ type: 'resend_recovery', leadId: 'L' });\n    expect(planAbandonedSidAction({ kind: 'other' })).toEqual({\n      type: 'ignore',\n    });\n\n    // AND-chain: missing any campaign field → ignore (kills || mutants)\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        // stepNumber missing\n      }).type\n    ).toBe('ignore');\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        campaignId: 'C',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n    // recovery without leadId → ignore (|| mutant would still match kind)\n    expect(\n      planAbandonedSidAction({ kind: KIND_RECOVERY }).type\n    ).toBe('ignore');\n    // stepNumber 0 is valid (!= null)\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 0,\n      }).type\n    ).toBe('requeue_campaign');\n\n    // kind≠campaign with ALL campaign fields still ignore\n    // (kills `kind === CAMPAIGN && …` → `kind === CAMPAIGN || …`)\n    expect(\n      planAbandonedSidAction({\n        kind: 'other',\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n\n    // campaign missing step but leadId present must NOT become recovery\n    // (kills `kind === RECOVERY && leadId` → `kind === RECOVERY || leadId`)\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        leadId: 'L',\n      }).type\n    ).toBe('ignore');\n\n    // empty-string ids are falsy → ignore (not ConditionalExpression:true)\n    expect(\n      planAbandonedSidAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: '',\n        campaignId: 'C',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n  });\n\n  it('planAbandonedSidAction property: requeue iff all AND conjuncts hold', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(KIND_CAMPAIGN, KIND_RECOVERY, 'x', ''),\n        fc.option(fc.constantFrom('E', ''), { nil: undefined }),\n        fc.option(fc.constantFrom('C', ''), { nil: undefined }),\n        fc.option(fc.integer({ min: 0, max: 5 }), { nil: undefined }),\n        fc.option(fc.constantFrom('L', ''), { nil: undefined }),\n        (kind, enrollmentId, campaignId, stepNumber, leadId) => {\n          const a = planAbandonedSidAction({\n            kind,\n            enrollmentId,\n            campaignId,\n            stepNumber,\n            leadId,\n          });\n          const campaignOk =\n            kind === KIND_CAMPAIGN &&\n            Boolean(enrollmentId) &&\n            Boolean(campaignId) &&\n            stepNumber != null;\n          const recoveryOk = kind === KIND_RECOVERY && Boolean(leadId);\n          if (campaignOk) {\n            expect(a).toEqual({\n              type: 'requeue_campaign',\n              enrollmentId,\n              campaignId,\n              stepNumber,\n            });\n          } else if (recoveryOk) {\n            expect(a).toEqual({ type: 'resend_recovery', leadId });\n          } else {\n            expect(a).toEqual({ type: 'ignore' });\n          }\n        }\n      ),\n      { numRuns: 80 }\n    );\n  });\n\n  it('shouldResendRecovery is AND of lead && !optedOut && business', () => {\n    expect(\n      shouldResendRecovery({\n        leadFound: true,\n        optedOut: false,\n        businessFound: true,\n      })\n    ).toBe(true);\n    expect(\n      shouldResendRecovery({\n        leadFound: true,\n        optedOut: true,\n        businessFound: true,\n      })\n    ).toBe(false);\n    expect(\n      shouldResendRecovery({\n        leadFound: false,\n        optedOut: false,\n        businessFound: true,\n      })\n    ).toBe(false);\n    expect(\n      shouldResendRecovery({\n        leadFound: true,\n        optedOut: false,\n        businessFound: false,\n      })\n    ).toBe(false);\n  });\n\n  it('planPostConfirmAdvance skips on claim / mismatch / empty steps', () => {\n    expect(\n      planPostConfirmAdvance({\n        enrollmentFound: true,\n        campaignId: 'C',\n        stepNumber: 1,\n        enrollmentCampaignId: 'C',\n        enrollmentStep: 1,\n        hasClaimToken: true,\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        nowMs: 0,\n        statusCompleted: 'completed',\n      }).type\n    ).toBe('skip');\n\n    expect(\n      planPostConfirmAdvance({\n        enrollmentFound: true,\n        campaignId: 'C',\n        stepNumber: 1,\n        enrollmentCampaignId: 'C',\n        enrollmentStep: 1,\n        hasClaimToken: false,\n        steps: [],\n        nowMs: 0,\n        statusCompleted: 'completed',\n      }).type\n    ).toBe('skip');\n\n    // eligibility false via campaign mismatch (not force-true)\n    expect(\n      planPostConfirmAdvance({\n        enrollmentFound: true,\n        campaignId: 'C',\n        stepNumber: 1,\n        enrollmentCampaignId: 'OTHER',\n        enrollmentStep: 1,\n        hasClaimToken: false,\n        steps: [\n          { step_number: 1, delay_minutes: 0 },\n          { step_number: 2, delay_minutes: 1 },\n        ],\n        nowMs: 0,\n        statusCompleted: 'completed',\n      }).type\n    ).toBe('skip');\n\n    // null steps coalesce to empty → skip\n    expect(\n      planPostConfirmAdvance({\n        enrollmentFound: true,\n        campaignId: 'C',\n        stepNumber: 1,\n        enrollmentCampaignId: 'C',\n        enrollmentStep: 1,\n        hasClaimToken: false,\n        steps: null,\n        nowMs: 0,\n        statusCompleted: 'completed',\n      }).type\n    ).toBe('skip');\n  });\n\n  it('planPostConfirmAdvance advances or completes', () => {\n    const nowMs = Date.parse('2026-06-15T12:00:00.000Z');\n    const adv = planPostConfirmAdvance({\n      enrollmentFound: true,\n      campaignId: 'C',\n      stepNumber: 1,\n      enrollmentCampaignId: 'C',\n      enrollmentStep: 1,\n      hasClaimToken: false,\n      steps: [\n        { step_number: 1, delay_minutes: 0 },\n        { step_number: 2, delay_minutes: 10 },\n      ],\n      nowMs,\n      statusCompleted: 'completed',\n    });\n    expect(adv.type).toBe('advance');\n    if (adv.type === 'advance') {\n      expect(adv.payload).toMatchObject({ current_step: 2 });\n    }\n\n    const done = planPostConfirmAdvance({\n      enrollmentFound: true,\n      campaignId: 'C',\n      stepNumber: 2,\n      enrollmentCampaignId: 'C',\n      enrollmentStep: 2,\n      hasClaimToken: false,\n      steps: [\n        { step_number: 1, delay_minutes: 0 },\n        { step_number: 2, delay_minutes: 10 },\n      ],\n      nowMs,\n      statusCompleted: 'completed',\n    });\n    expect(done.type).toBe('complete');\n\n    // Force-true on the eligibility negation would always skip — must advance\n    // when eligible (kills ConditionalExpression:true on `if (!eligibility)`).\n    expect(adv.type).not.toBe('skip');\n    expect(done.type).not.toBe('skip');\n\n    // hasClaimToken true must skip even with matching step/campaign\n    expect(\n      planPostConfirmAdvance({\n        enrollmentFound: true,\n        campaignId: 'C',\n        stepNumber: 1,\n        enrollmentCampaignId: 'C',\n        enrollmentStep: 1,\n        hasClaimToken: true,\n        steps: [\n          { step_number: 1, delay_minutes: 0 },\n          { step_number: 2, delay_minutes: 10 },\n        ],\n        nowMs,\n        statusCompleted: 'completed',\n      }).type\n    ).toBe('skip');\n  });\n\n  it('planConfirmedRowAction property: only campaign with ids advances', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(KIND_CAMPAIGN, KIND_RECOVERY, 'x'),\n        fc.option(fc.string({ minLength: 1, maxLength: 4 }), { nil: undefined }),\n        (kind, id) => {\n          const a = planConfirmedRowAction({\n            kind,\n            enrollmentId: id,\n            campaignId: id,\n            stepNumber: 1,\n          });\n          if (kind === KIND_CAMPAIGN && id) {\n            expect(a.type).toBe('advance');\n          } else {\n            expect(a.type).toBe('ignore');\n          }\n        }\n      ),\n      { numRuns: 40 }\n    );\n\n    // Partial campaign fields → ignore (AND not OR)\n    expect(\n      planConfirmedRowAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n    expect(\n      planConfirmedRowAction({\n        kind: KIND_CAMPAIGN,\n        campaignId: 'C',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n    // non-campaign with full ids → ignore (|| after kind would advance)\n    expect(\n      planConfirmedRowAction({\n        kind: 'x',\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 1,\n      }).type\n    ).toBe('ignore');\n    // stepNumber 0 valid\n    expect(\n      planConfirmedRowAction({\n        kind: KIND_CAMPAIGN,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 0,\n      }).type\n    ).toBe('advance');\n  });\n\n  it('shouldResendRecovery property: true iff all three gates pass', () => {\n    fc.assert(\n      fc.property(fc.boolean(), fc.boolean(), fc.boolean(), (l, o, b) => {\n        expect(\n          shouldResendRecovery({\n            leadFound: l,\n            optedOut: o,\n            businessFound: b,\n          })\n        ).toBe(l && !o && b);\n      }),\n      { numRuns: 40 }\n    );\n  });\n});\n"},"src/services/campaign-io-plans.test.ts":{"tests":[{"id":"280","name":"campaign-io-plans > sortCampaignSteps is stable ascending by step_number","location":{"start":{"column":3,"line":30}}},{"id":"281","name":"campaign-io-plans > stepsOrEmpty coalesces null/undefined","location":{"start":{"column":3,"line":44}}},{"id":"282","name":"campaign-io-plans > payload builders exact shapes","location":{"start":{"column":3,"line":50}}},{"id":"283","name":"campaign-io-plans > nextStepDelayMs / computeNextSendAt arithmetic","location":{"start":{"column":3,"line":195}}},{"id":"284","name":"campaign-io-plans > REPLY_ACTION tokens","location":{"start":{"column":3,"line":202}}},{"id":"285","name":"campaign-io-plans > property: sort is idempotent and length-preserving","location":{"start":{"column":3,"line":210}}},{"id":"286","name":"rowFound / staleBeforeIso > rowFound requires row AND !error (not OR)","location":{"start":{"column":3,"line":234}}},{"id":"287","name":"rowFound / staleBeforeIso > staleBeforeIso subtracts (not adds) staleMs","location":{"start":{"column":3,"line":243}}},{"id":"288","name":"rowFound / staleBeforeIso > holdUntilIso adds (not subtracts) holdMs","location":{"start":{"column":3,"line":251}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  REPLY_ACTION,\n  advanceStepPayload,\n  claimDuePayload,\n  clearOutboundSidPayload,\n  completeEnrollmentPayload,\n  computeNextSendAt,\n  enrollmentInsertPayload,\n  needsReviewEnrollmentPayload,\n  nextStepDelayMs,\n  pauseEnrollmentPayload,\n  processDueErrorParkPayload,\n  quietHoursReviewLeadPayload,\n  reclaimStalePayload,\n  reconcileAdvancePayload,\n  reconcileCompletePayload,\n  releaseClaimPayload,\n  requeueStepPayload,\n  holdUntilIso,\n  rowFound,\n  sortCampaignSteps,\n  staleBeforeIso,\n  stepsOrEmpty,\n  switchUpdatePayload,\n} from './campaign-io-plans';\n\ndescribe('campaign-io-plans', () => {\n  it('sortCampaignSteps is stable ascending by step_number', () => {\n    expect(\n      sortCampaignSteps([\n        { step_number: 3 },\n        { step_number: 1 },\n        { step_number: 2 },\n      ]).map((s) => s.step_number)\n    ).toEqual([1, 2, 3]);\n    // slice so original is untouched\n    const orig = [{ step_number: 2 }, { step_number: 1 }];\n    sortCampaignSteps(orig);\n    expect(orig[0].step_number).toBe(2);\n  });\n\n  it('stepsOrEmpty coalesces null/undefined', () => {\n    expect(stepsOrEmpty(null)).toEqual([]);\n    expect(stepsOrEmpty(undefined)).toEqual([]);\n    expect(stepsOrEmpty([{ step_number: 1 }])).toHaveLength(1);\n  });\n\n  it('payload builders exact shapes', () => {\n    expect(\n      enrollmentInsertPayload({\n        leadId: 'L',\n        campaignId: 'C',\n        currentStep: 1,\n        status: 'active',\n        nextSendAt: 't',\n      })\n    ).toEqual({\n      lead_id: 'L',\n      campaign_id: 'C',\n      current_step: 1,\n      status: 'active',\n      next_send_at: 't',\n      claimed_at: null,\n      claim_token: null,\n    });\n\n    expect(\n      switchUpdatePayload({\n        targetCampaignId: 'T',\n        currentStep: 1,\n        status: 'active',\n        nextSendAt: 't',\n        nowIso: 'n',\n      })\n    ).toMatchObject({\n      campaign_id: 'T',\n      current_step: 1,\n      paused_at: null,\n      completed_at: null,\n      updated_at: 'n',\n    });\n\n    expect(\n      advanceStepPayload({\n        nextStepNumber: 2,\n        nextSendAt: 't',\n        nowIso: 'n',\n      })\n    ).toEqual({\n      current_step: 2,\n      next_send_at: 't',\n      claimed_at: null,\n      claim_token: null,\n      updated_at: 'n',\n    });\n\n    expect(\n      completeEnrollmentPayload({ status: 'completed', nowIso: 'n' })\n    ).toMatchObject({\n      status: 'completed',\n      completed_at: 'n',\n      next_send_at: null,\n    });\n\n    expect(\n      pauseEnrollmentPayload({ status: 'paused', nowIso: 'n' })\n    ).toMatchObject({ status: 'paused', paused_at: 'n', next_send_at: null });\n\n    expect(\n      needsReviewEnrollmentPayload({ status: 'needs_review', nowIso: 'n' })\n    ).toMatchObject({\n      status: 'needs_review',\n      paused_at: 'n',\n      next_send_at: null,\n    });\n\n    expect(claimDuePayload({ nowIso: 'n', token: 'tok' })).toEqual({\n      next_send_at: null,\n      claimed_at: 'n',\n      claim_token: 'tok',\n      updated_at: 'n',\n    });\n\n    expect(reclaimStalePayload({ nowIso: 'n', token: 'tok' })).toEqual({\n      claimed_at: 'n',\n      claim_token: 'tok',\n      updated_at: 'n',\n    });\n\n    expect(\n      releaseClaimPayload({ nextSendAt: 't', nowIso: 'n' })\n    ).toEqual({\n      claimed_at: null,\n      claim_token: null,\n      next_send_at: 't',\n      updated_at: 'n',\n    });\n\n    expect(\n      reconcileAdvancePayload({\n        nextStepNumber: 2,\n        nextSendAt: 't',\n        nowIso: 'n',\n      })\n    ).toEqual({\n      current_step: 2,\n      next_send_at: 't',\n      claimed_at: null,\n      claim_token: null,\n      updated_at: 'n',\n    });\n\n    expect(\n      reconcileCompletePayload({ status: 'completed', nowIso: 'n' })\n    ).toMatchObject({\n      status: 'completed',\n      completed_at: 'n',\n      next_send_at: null,\n      claim_token: null,\n    });\n\n    expect(requeueStepPayload({ stepNumber: 3, nowIso: 'n' })).toEqual({\n      current_step: 3,\n      next_send_at: 'n',\n      claimed_at: null,\n      claim_token: null,\n      updated_at: 'n',\n    });\n\n    expect(clearOutboundSidPayload({ nowIso: 'n' })).toEqual({\n      sms_outbound_sid: null,\n      updated_at: 'n',\n    });\n\n    expect(\n      processDueErrorParkPayload({ nextSendAt: 'park', nowIso: 'n' })\n    ).toEqual({\n      claim_token: null,\n      claimed_at: null,\n      next_send_at: 'park',\n      updated_at: 'n',\n    });\n\n    expect(\n      quietHoursReviewLeadPayload({ reason: 'quiet_hours', nowIso: 'n' })\n    ).toEqual({\n      needs_human_review: true,\n      needs_human_review_at: 'n',\n      needs_human_review_reason: 'quiet_hours',\n    });\n  });\n\n  it('nextStepDelayMs / computeNextSendAt arithmetic', () => {\n    expect(nextStepDelayMs(0)).toBe(0);\n    expect(nextStepDelayMs(1)).toBe(60_000);\n    expect(nextStepDelayMs(60)).toBe(3_600_000);\n    expect(computeNextSendAt(0, 1)).toBe(new Date(60_000).toISOString());\n  });\n\n  it('REPLY_ACTION tokens', () => {\n    expect(REPLY_ACTION.deferSwitch).toBe('defer_switch');\n    expect(REPLY_ACTION.switch).toBe('switch');\n    expect(REPLY_ACTION.pause).toBe('pause');\n    expect(REPLY_ACTION.enroll).toBe('enroll');\n    expect(REPLY_ACTION.noop).toBe('noop');\n  });\n\n  it('property: sort is idempotent and length-preserving', () => {\n    fc.assert(\n      fc.property(\n        fc.array(fc.record({ step_number: fc.integer({ min: 0, max: 20 }) }), {\n          maxLength: 8,\n        }),\n        (steps) => {\n          const once = sortCampaignSteps(steps);\n          const twice = sortCampaignSteps(once);\n          expect(twice).toEqual(once);\n          expect(once).toHaveLength(steps.length);\n          for (let i = 1; i <"+" once.length; i++) {\n            expect(once[i].step_number).toBeGreaterThanOrEqual(\n              once[i - 1].step_number\n            );\n          }\n        }\n      ),\n      { numRuns: 40 }\n    );\n  });\n});\n\ndescribe('rowFound / staleBeforeIso', () => {\n  it('rowFound requires row AND !error (not OR)', () => {\n    expect(rowFound({ id: 1 }, null)).toBe(true);\n    expect(rowFound(null, null)).toBe(false);\n    expect(rowFound({ id: 1 }, { message: 'x' })).toBe(false);\n    expect(rowFound(null, { message: 'x' })).toBe(false);\n    // || mutant: Boolean(row) || !error → true when error is null even if row null\n    expect(rowFound(undefined, null)).toBe(false);\n  });\n\n  it('staleBeforeIso subtracts (not adds) staleMs', () => {\n    const now = Date.parse('2026-06-15T12:00:00.000Z');\n    const staleMs = 60_000;\n    const iso = staleBeforeIso(now, staleMs);\n    expect(iso).toBe(new Date(now - staleMs).toISOString());\n    expect(iso).not.toBe(new Date(now + staleMs).toISOString());\n  });\n\n  it('holdUntilIso adds (not subtracts) holdMs', () => {\n    const now = Date.parse('2026-06-15T12:00:00.000Z');\n    const holdMs = 60_000;\n    expect(holdUntilIso(now, holdMs)).toBe(\n      new Date(now + holdMs).toISOString()\n    );\n    expect(holdUntilIso(now, holdMs)).not.toBe(\n      new Date(now - holdMs).toISOString()\n    );\n  });\n});\n"},"src/services/campaign-runtime.di.test.ts":{"tests":[{"id":"289","name":"campaign-runtime DI send path > sent → advanceEnrollment update (current_step/status payload)","location":{"start":{"column":3,"line":151}}},{"id":"290","name":"campaign-runtime DI send path > quiet_hours_deferred → release with nextSendAt","location":{"start":{"column":3,"line":183}}},{"id":"291","name":"campaign-runtime DI send path > quiet_hours_unresolved → lead review + release","location":{"start":{"column":3,"line":200}}},{"id":"292","name":"campaign-runtime DI send path > ambiguous → park release (next_send_at set)","location":{"start":{"column":3,"line":214}}},{"id":"293","name":"campaign-runtime DI send path > opted_out outcome → pause enrollment","location":{"start":{"column":3,"line":232}}},{"id":"294","name":"campaign-runtime DI send path > needs_review → terminal needs_review status (not advance)","location":{"start":{"column":3,"line":243}}},{"id":"295","name":"campaign-runtime DI send path > never_sent → park clears claim (not advance)","location":{"start":{"column":3,"line":260}}},{"id":"296","name":"campaign-runtime DI send path > blocked unknown reason → noop_release clears claim (kills empty noop handler)","location":{"start":{"column":3,"line":276}}},{"id":"297","name":"campaign-runtime DI send path > template uses business name + issue; name arg is empty string","location":{"start":{"column":3,"line":289}}},{"id":"298","name":"campaign-runtime DI send path > flag_unresolved_tz writes needs_human_review lead payload (not empty object)","location":{"start":{"column":3,"line":310}}},{"id":"299","name":"campaign-runtime DI send path > clock injected into pause payload nowIso","location":{"start":{"column":3,"line":319}}},{"id":"300","name":"campaign-runtime DI send path > claimDueEnrollment uses deps.uuid + clock","location":{"start":{"column":3,"line":327}}},{"id":"301","name":"camp
