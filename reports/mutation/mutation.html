DefiniteOptOut('STOP, PLEASE')).toBe(false);\n  });\n});\n\ndescribe('hasWholeWordStem space vs hyphen branch (L87–88)', () => {\n  it('matches hyphenated OPT-OUT via escaped pattern', () => {\n    expect(hasWholeWordStem('PLEASE OPT-OUT NOW', 'OPT-OUT')).toBe(true);\n    expect(classifyOptOut('PLEASE OPT-OUT NOW')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n  });\n\n  it('matches spaced OPT OUT via multiword stem branch', () => {\n    expect(hasWholeWordStem('PLEASE OPT OUT NOW', 'OPT OUT')).toBe(true);\n    expect(classifyOptOut('PLEASE OPT OUT NOW')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n  });\n\n  it('matches single-token stems without escape path', () => {\n    expect(hasWholeWordStem('PLEASE STOP NOW', 'STOP')).toBe(true);\n    expect(hasWholeWordStem('XXXENDYYY', 'END')).toBe(false);\n  });\n\n  it('covers hyphen-only word stem in OPT_OUT_WORD_STEMS', () => {\n    expect(OPT_OUT_WORD_STEMS).toContain('OPT-OUT');\n    expect(hasWholeWordStem('X OPT-OUT Y', 'OPT-OUT')).toBe(true);\n  });\n});\n\ndescribe('empty normalized early return (L102, L170)', () => {\n  it('emoji-only body normalizes empty → not_opt_out / no backfill', () => {\n    expect(normalizeOptOutText('🛑')).toBe('');\n    expect(classifyOptOut('🛑')).toEqual({ kind: 'not_opt_out' });\n    expect(wouldBackfillSuppress('🛑')).toBe(false);\n  });\n\n  it('whitespace-only → not_opt_out and wouldBackfillSuppress false', () => {\n    expect(wouldBackfillSuppress('')).toBe(false);\n    expect(wouldBackfillSuppress('   \\u200b  ')).toBe(false);\n  });\n});\n\ndescribe('classifyOptOut whole-message OR branches (L112)', () => {\n  it('matches on normalized alone', () => {\n    expect(classifyOptOut('STOP').kind).toBe('opt_out');\n    expect(wouldBackfillSuppress('STOP')).toBe(true);\n  });\n\n  it('matches on compact alone (spaced letters)', () => {\n    expect(classifyOptOut('S T O P').kind).toBe('opt_out');\n    expect(wouldBackfillSuppress('S T O P')).toBe(true);\n    expect(compactOptOutText(normalizeOptOutText('S T O P'))).toBe('STOP');\n  });\n\n  it('matches on collapsed alone (spaced letters + trailing words)', () => {\n    expect(classifyOptOut('S T O P PLEASE').kind).toBe('opt_out');\n    expect(wouldBackfillSuppress('S T O P PLEASE')).toBe(true);\n    expect(collapseSpacedLetterTokens(normalizeOptOutText('S T O P PLEASE'))).toBe(\n      'STOP PLEASE'\n    );\n  });\n\n  it('matches when collapsed compact hits STOPSTOP (collapsed text not in exact set)', () => {\n    const body = 'S T O P S T O P';\n    const normalized = normalizeOptOutText(body);\n    expect(normalized).toBe('S T O P S T O P');\n    expect(collapseSpacedLetterTokens(normalized)).toBe('STOPSTOP');\n    expect(classifyOptOut(body).kind).toBe('opt_out');\n    expect(wouldBackfillSuppress(body)).toBe(true);\n  });\n});\n\ndescribe('ambiguous stem OR on normalized vs collapsed (L123, L131)', () => {\n  it('STOP stem matches only after collapseSpacedLetterTokens', () => {\n    const body = 'S T O P BY TODAY';\n    const normalized = normalizeOptOutText(body);\n    expect(hasWholeWordStem(normalized, 'STOP')).toBe(false);\n    expect(hasWholeWordStem(collapseSpacedLetterTokens(normalized), 'STOP')).toBe(\n      true\n    );\n    expect(classifyOptOut(body)).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n  });\n\n  it('multiword STOP ALL stem matches on collapsed text', () => {\n    const body = 'S T O P  ALL please stop texts';\n    const normalized = normalizeOptOutText(body);\n    expect(hasWholeWordStem(normalized, 'STOP ALL')).toBe(false);\n    expect(\n      hasWholeWordStem(collapseSpacedLetterTokens(normalized), 'STOP ALL')\n    ).toBe(true);\n    expect(classifyOptOut(body)).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n    expect(OPT_OUT_MULTIWORD_STEMS).toContain('STOP ALL');\n  });\n});\n\ndescribe('collapseSpacedLetterTokens regex (L143–144)', () => {\n  it('collapses runs with multiple spaces between letters', () => {\n    expect(collapseSpacedLetterTokens('S  T  O  P')).toBe('STOP');\n    expect(collapseSpacedLetterTokens('S  T  O  P PLEASE')).toBe('STOP PLEASE');\n  });\n\n  it('feeds classifyOptOut when normalize already collapsed outer whitespace', () => {\n    expect(normalizeOptOutText('S  T  O  P')).toBe('S T O P');\n    expect(classifyOptOut('S  T  O  P').kind).toBe('opt_out');\n  });\n});\n\ndescribe('opt-out-data sqlQuotedList and backfill lists', () => {\n  it('sqlQuotedList doubles apostrophes for SQL literals', () => {\n    expect(sqlQuotedList([\"DON'T TEXT ME\", 'PLAIN'])).toBe(\n      \"'DON''T TEXT ME', 'PLAIN'\"\n    );\n    const apostropheTokens = OPT_OUT_WHOLE_MESSAGE.filter((t) => t.includes(\"'\"));\n    expect(apostropheTokens.length).toBeGreaterThan(0);\n    for (const token of apostropheTokens) {\n      const quoted = sqlQuotedList([token]);\n      expect(quoted.startsWith(\"'\")).toBe(true);\n      expect(quoted.endsWith(\"'\")).toBe(true);\n      expect(quoted).toContain(\"''\");\n      expect(quoted).toBe(`'${token.replace(/'/g, \"''\")}'`);\n    }\n  });\n\n  it('backfill list helpers mirror const arrays (length + contents)', () => {\n    expect(optOutBackfillExactList()).toHaveLength(OPT_OUT_WHOLE_MESSAGE.length);\n    expect(optOutBackfillExactList()).toEqual([...OPT_OUT_WHOLE_MESSAGE]);\n    expect(optOutBackfillCompactList()).toHaveLength(\n      OPT_OUT_WHOLE_MESSAGE_COMPACT.length\n    );\n    expect(optOutBackfillCompactList()).toEqual([\n      ...OPT_OUT_WHOLE_MESSAGE_COMPACT,\n    ]);\n  });\n\n  it('sqlQuotedList joins multiple tokens with comma-space', () => {\n    expect(sqlQuotedList(['A', 'B'])).toBe(\"'A', 'B'\");\n  });\n});\n"},"src/services/campaign-advance-plan.test.ts":{"tests":[{"id":"490","name":"campaign-advance-plan > nextStepNumberOf adds 1 (not subtracts)","location":{"start":{"column":3,"line":11}}},{"id":"491","name":"campaign-advance-plan > findStepByNumber matches === (not !==)","location":{"start":{"column":3,"line":23}}},{"id":"492","name":"campaign-advance-plan > plans advance when next step exists, else complete","location":{"start":{"column":3,"line":34}}},{"id":"493","name":"campaign-advance-plan > ownershipHit requires !error AND data.length (not AND inverted)","location":{"start":{"column":3,"line":73}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  findStepByNumber,\n  nextStepNumberOf,\n  ownershipHit,\n  planAdvanceEnrollment,\n} from './campaign-advance-plan';\n\ndescribe('campaign-advance-plan', () => {\n  it('nextStepNumberOf adds 1 (not subtracts)', () => {\n    expect(nextStepNumberOf(1)).toBe(2);\n    expect(nextStepNumberOf(0)).toBe(1);\n    fc.assert(\n      fc.property(fc.integer({ min: 0, max: 20 }), (n) => {\n        expect(nextStepNumberOf(n)).toBe(n + 1);\n        expect(nextStepNumberOf(n)).not.toBe(n - 1);\n      }),\n      { numRuns: 30 }\n    );\n  });\n\n  it('findStepByNumber matches === (not !==)', () => {\n    const steps = [\n      { step_number: 1, delay_minutes: 0 },\n      { step_number: 2, delay_minutes: 10 },\n    ];\n    expect(findStepByNumber(steps, 2)?.delay_minutes).toBe(10);\n    expect(findStepByNumber(steps, 3)).toBeUndefined();\n    // ArrowFunction → undefined mutant: must still find\n    expect(findStepByNumber(steps, 1)?.step_number).toBe(1);\n  });\n\n  it('plans advance when next step exists, else complete', () => {\n    const steps = [\n      { step_number: 1, delay_minutes: 0 },\n      { step_number: 2, delay_minutes: 15 },\n    ];\n    const nowMs = Date.parse('2026-06-15T12:00:00.000Z');\n    const adv = planAdvanceEnrollment({\n      currentStepNumber: 1,\n      steps,\n      nowMs,\n      statusCompleted: 'completed',\n    });\n    expect(adv.type).toBe('advance');\n    if (adv.type === 'advance') {\n      expect(adv.nextStepNumber).toBe(2);\n      expect(adv.payload).toMatchObject({\n        current_step: 2,\n        claim_token: null,\n      });\n      expect(adv.nextSendAt).toBe(\n        new Date(nowMs + 15 * 60_000).toISOString()\n      );\n    }\n\n    const done = planAdvanceEnrollment({\n      currentStepNumber: 2,\n      steps,\n      nowMs,\n      statusCompleted: 'completed',\n    });\n    expect(done.type).toBe('complete');\n    if (done.type === 'complete') {\n      expect(done.payload).toMatchObject({\n        status: 'completed',\n        claim_token: null,\n      });\n    }\n  });\n\n  it('ownershipHit requires !error AND data.length (not AND inverted)', () => {\n    expect(ownershipHit(null, [{ id: 1 }])).toBe(true);\n    expect(ownershipHit({ message: 'x' }, [{ id: 1 }])).toBe(false);\n    expect(ownershipHit(null, [])).toBe(false);\n    expect(ownershipHit(null, null)).toBe(false);\n    // error && !data?.length mutant would be true when error set and empty — still false for hit\n    expect(ownershipHit({ x: 1 }, [])).toBe(false);\n  });\n});\n"},"src/services/campaign-logic.test.ts":{"tests":[{"id":"494","name":"campaignStepMessageSid includes campaign > differs across campaigns for the same enrollment step","location":{"start":{"column":3,"line":30}}},{"id":"495","name":"campaignStepMessageSid includes campaign > shouldSendCampaignStep does not treat other-campaign sids as dupes","location":{"start":{"column":3,"line":38}}},{"id":"496","name":"decideReplyEnrollmentAction > returns noop when enrollment missing","location":{"start":{"column":3,"line":50}}},{"id":"497","name":"decideReplyEnrollmentAction > pauses active enrollment when target campaign missing and replyMode pause","location":{"start":{"column":3,"line":56}}},{"id":"498","name":"decideReplyEnrollmentAction > noops when target campaign missing and replyMode continue","location":{"start":{"column":3,"line":66}}},{"id":"499","name":"decideReplyEnrollmentAction > noops when target campaign missing and enrollment not active","location":{"start":{"column":3,"line":76}}},{"id":"500","name":"decideReplyEnrollmentAction > switches Standard → Emergency when not claimed","location":{"start":{"column":3,"line":86}}},{"id":"501","name":"decideReplyEnrollmentAction > defers switch while a fresh claim is held (mid-send)","location":{"start":{"column":3,"line":95}}},{"id":"502","name":"decideReplyEnrollmentAction > pauses on matching campaign when replyMode=pause","location":{"start":{"column":3,"line":112}}},{"id":"503","name":"decideReplyEnrollmentAction > continues (noop) on matching campaign when replyMode=continue","location":{"start":{"column":3,"line":122}}},{"id":"504","name":"hasFreshClaim / claimables > detects fresh vs stale claims","location":{"start":{"column":3,"line":136}}},{"id":"505","name":"hasFreshClaim / claimables > reclaims stale claims","location":{"start":{"column":3,"line":150}}},{"id":"506","name":"planEnrollmentStart / selectCampaign > skips Standard initial when recovery sent","location":{"start":{"column":3,"line":170}}},{"id":"507","name":"planEnrollmentStart / selectCampaign > staging (c): Emergency switch keeps step 1 even when recovery sent","location":{"start":{"column":3,"line":180}}},{"id":"508","name":"planEnrollmentStart / selectCampaign > selects Standard when urgency null","location":{"start":{"column":3,"line":191}}},{"id":"509","name":"planEnrollmentStart / selectCampaign > selects exact urgency match","location":{"start":{"column":3,"line":195}}},{"id":"510","name":"planEnrollmentStart / selectCampaign > throws when campaign has no steps","location":{"start":{"column":3,"line":199}}},{"id":"511","name":"planEnrollmentStart / selectCampaign > when only initial skipped and no further steps","location":{"start":{"column":3,"line":205}}},{"id":"512","name":"misc helpers > classifies insert errors","location":{"start":{"column":3,"line":220}}},{"id":"513","name":"misc helpers > ages leads","location":{"start":{"column":3,"line":225}}},{"id":"514","name":"misc helpers > reads reply mode and production runtime","location":{"start":{"column":3,"line":231}}},{"id":"515","name":"misc helpers > parkedNextSendAt adds 30 minutes","location":{"start":{"column":3,"line":241}}},{"id":"516","name":"misc helpers > hasFreshClaim rejects invalid dates","location":{"start":{"column":3,"line":246}}},{"id":"517","name":"misc helpers > isLeadWithinLookupAge rejects invalid created_at","location":{"start":{"column":3,"line":251}}},{"id":"518","name":"misc helpers > isEnrollmentClaimable due when next_send_at passed","location":{"start":{"column":3,"line":255}}},{"id":"519","name":"misc helpers > isEnrollmentClaimable false when not active","location":{"start":{"column":3,"line":269}}},{"id":"520","name":"misc helpers > classifyMessageInsertError failed for other codes","location":{"start":{"column":3,"line":278}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  CLAIM_STALE_MS,\n  campaignStepMessageSid,\n  classifyMessageInsertError,\n  decideReplyEnrollmentAction,\n  getCampaignReplyMode,\n  hasFreshClaim,\n  isEnrollmentClaimable,\n  isLeadWithinLookupAge,\n  isProductionRuntime,\n  planEnrollmentStart,\n  parkedNextSendAt,\n  selectCampaignForUrgency,\n  shouldSendCampaignStep,\n} from './campaign-logic';\n\nconst CAMPAIGNS = [\n  { id: 'c-em', name: 'Emergency Follow-up', urgency_filter: 'emergency' },\n  { id: 'c-hi', name: 'High Priority Follow-up', urgency_filter: 'high' },\n  { id: 'c-std', name: 'Standard Follow-up', urgency_filter: null },\n];\n\nconst STANDARD_STEPS = [\n  { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n  { step_number: 2, delay_minutes: 240, template_key: 'standard_followup_1' },\n];\n\ndescribe('campaignStepMessageSid includes campaign', () => {\n  it('differs across campaigns for the same enrollment step', () => {\n    const std = campaignStepMessageSid('enr-1', 'c-std', 2);\n    const em = campaignStepMessageSid('enr-1', 'c-em', 2);\n    expect(std).toBe('mlf:campaign:enr-1:c-std:step:2');\n    expect(em).toBe('mlf:campaign:enr-1:c-em:step:2');\n    expect(std).not.toBe(em);\n  });\n\n  it('shouldSendCampaignStep does not treat other-campaign sids as dupes', () => {\n    const stdSid = campaignStepMessageSid('enr-1', 'c-std', 2);\n    expect(\n      shouldSendCampaignStep('enr-1', 'c-em', 2, [stdSid])\n    ).toBe(true);\n    expect(\n      shouldSendCampaignStep('enr-1', 'c-std', 2, [stdSid])\n    ).toBe(false);\n  });\n});\n\ndescribe('decideReplyEnrollmentAction', () => {\n  it('returns noop when enrollment missing', () => {\n    expect(decideReplyEnrollmentAction(null, CAMPAIGNS[0])).toEqual({\n      action: 'noop',\n    });\n  });\n\n  it('pauses active enrollment when target campaign missing and replyMode pause', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-std', status: 'active' },\n        undefined,\n        { replyMode: 'pause' }\n      )\n    ).toEqual({ action: 'pause' });\n  });\n\n  it('noops when target campaign missing and replyMode continue', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-std', status: 'active' },\n        undefined,\n        { replyMode: 'continue' }\n      )\n    ).toEqual({ action: 'noop' });\n  });\n\n  it('noops when target campaign missing and enrollment not active', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-std', status: 'paused' },\n        undefined,\n        { replyMode: 'pause' }\n      )\n    ).toEqual({ action: 'noop' });\n  });\n\n  it('switches Standard → Emergency when not claimed', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-std', status: 'active', claimed_at: null },\n        CAMPAIGNS[0]\n      )\n    ).toEqual({ action: 'switch', targetCampaignId: 'c-em' });\n  });\n\n  it('defers switch while a fresh claim is held (mid-send)', () => {\n    const now = new Date('2026-10-28T12:00:00.000Z');\n    expect(\n      decideReplyEnrollmentAction(\n        {\n          id: 'e1',\n          campaign_id: 'c-std',\n          status: 'active',\n          claimed_at: '2026-10-28T11:55:00.000Z',\n          claim_token: 'tok',\n        },\n        CAMPAIGNS[0],\n        { now }\n      )\n    ).toEqual({ action: 'defer_switch', targetCampaignId: 'c-em' });\n  });\n\n  it('pauses on matching campaign when replyMode=pause', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-em', status: 'active' },\n        CAMPAIGNS[0],\n        { replyMode: 'pause' }\n      )\n    ).toEqual({ action: 'pause' });\n  });\n\n  it('continues (noop) on matching campaign when replyMode=continue', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e1', campaign_id: 'c-em', status: 'active' },\n        CAMPAIGNS[0],\n        { replyMode: 'continue' }\n      )\n    ).toEqual({ action: 'noop' });\n  });\n});\n\ndescribe('hasFreshClaim / claimables', () => {\n  const now = new Date('2026-10-28T12:20:00.000Z');\n\n  it('detects fresh vs stale claims', () => {\n    expect(hasFreshClaim({ claimed_at: '2026-10-28T12:15:00.000Z' }, now)).toBe(\n      true\n    );\n    expect(\n      hasFreshClaim(\n        {\n          claimed_at: new Date(now.getTime() - CLAIM_STALE_MS - 1).toISOString(),\n        },\n        now\n      )\n    ).toBe(false);\n  });\n\n  it('reclaims stale claims', () => {\n    expect(\n      isEnrollmentClaimable(\n        {\n          status: 'active',\n          next_send_at: null,\n          claimed_at: new Date(now.getTime() - CLAIM_STALE_MS - 1).toISOString(),\n        },\n        now\n      )\n    ).toBe(true);\n  });\n});\n\nconst EMERGENCY_STEPS = [\n  { step_number: 1, delay_minutes: 0, template_key: 'emergency_initial' },\n  { step_number: 2, delay_minutes: 60, template_key: 'emergency_followup_1' },\n];\n\ndescribe('planEnrollmentStart / selectCampaign', () => {\n  it('skips Standard initial when recovery sent', () => {\n    const plan = planEnrollmentStart(STANDARD_STEPS, {\n      recoveryAlreadySent: true,\n      treatRecoveryAsInitial: true,\n      now: new Date('2026-10-28T12:00:00.000Z'),\n    });\n    expect(plan.currentStep).toBe(2);\n    expect(plan.skippedInitial).toBe(true);\n  });\n\n  it('staging (c): Emergency switch keeps step 1 even when recovery sent', () => {\n    const plan = planEnrollmentStart(EMERGENCY_STEPS, {\n      recoveryAlreadySent: true,\n      treatRecoveryAsInitial: false,\n      now: new Date('2026-10-28T12:00:00.000Z'),\n    });\n    expect(plan.currentStep).toBe(1);\n    expect(plan.skippedInitial).toBe(false);\n    expect(plan.nextSendAt.toISOString()).toBe('2026-10-28T12:00:00.000Z');\n  });\n\n  it('selects Standard when urgency null', () => {\n    expect(selectCampaignForUrgency(CAMPAIGNS, null)?.id).toBe('c-std');\n  });\n\n  it('selects exact urgency match', () => {\n    expect(selectCampaignForUrgency(CAMPAIGNS, 'high')?.id).toBe('c-hi');\n  });\n\n  it('throws when campaign has no steps', () => {\n    expect(() =>\n      planEnrollmentStart([], { recoveryAlreadySent: false })\n    ).toThrow('Campaign has no steps');\n  });\n\n  it('when only initial skipped and no further steps', () => {\n    const plan = planEnrollmentStart(\n      [{ step_number: 1, delay_minutes: 0, template_key: 'only' }],\n      {\n        recoveryAlreadySent: true,\n        treatRecoveryAsInitial: true,\n        now: new Date('2026-10-28T12:00:00.000Z'),\n      }\n    );\n    expect(plan.skippedInitial).toBe(true);\n    expect(plan.currentStep).toBe(1);\n  });\n});\n\ndescribe('misc helpers', () => {\n  it('classifies insert errors', () => {\n    expect(classifyMessageInsertError({ code: '23505' })).toBe('duplicate');\n    expect(classifyMessageInsertError(null)).toBe('ok');\n  });\n\n  it('ages leads', () => {\n    const now = new Date('2026-10-28T00:00:00.000Z');\n    expect(isLeadWithinLookupAge('2026-10-27T00:00:00.000Z', now)).toBe(true);\n    expect(isLeadWithinLookupAge('2026-10-01T00:00:00.000Z', now)).toBe(false);\n  });\n\n  it('reads reply mode and production runtime', () => {\n    expect(getCampaignReplyMode({ CAMPAIGN_REPLY_MODE: 'continue' })).toBe(\n      'continue'\n    );\n    expect(getCampaignReplyMode({})).toBe('pause');\n    expect(getCampaignReplyMode({ CAMPAIGN_REPLY_MODE: 'PAUSE' })).toBe('pause');\n    expect(isProductionRuntime({ NODE_ENV: 'production' })).toBe(true);\n    expect(isProductionRuntime({ VERCEL_ENV: 'preview' })).toBe(false);\n  });\n\n  it('parkedNextSendAt adds 30 minutes', () => {\n    const now = new Date('2026-10-28T12:00:00.000Z');\n    expect(parkedNextSendAt(now)).toBe('2026-10-28T12:30:00.000Z');\n  });\n\n  it('hasFreshClaim rejects invalid dates', () => {\n    expect(hasFreshClaim({ claimed_at: 'not-a-date' })).toBe(false);\n    expect(hasFreshClaim({ claimed_at: null })).toBe(false);\n  });\n\n  it('isLeadWithinLookupAge rejects invalid created_at', () => {\n    expect(isLeadWithinLookupAge('invalid')).toBe(false);\n  });\n\n  it('isEnrollmentClaimable due when next_send_at passed', () => {\n    const now = new Date('2026-10-28T12:00:00.000Z');\n    expect(\n      isEnrollmentClaimable(\n        {\n          status: 'active',\n          next_send_at: '2026-10-28T11:00:00.000Z',\n          claimed_at: null,\n        },\n        now\n      )\n    ).toBe(true);\n  });\n\n  it('isEnrollmentClaimable false when not active', () => {\n    expect(\n      isEnrollmentClaimable(\n        { status: 'paused', next_send_at: null, claimed_at: null },\n        new Date()\n      )\n    ).toBe(false);\n  });\n\n  it('classifyMessageInsertError failed for other codes', () => {\n    expect(classifyMessageInsertError({ code: 'XX' })).toBe('failed');\n  });\n});\n"},"src/lib/messaging/dry-run-guard.test.ts":{"tests":[{"id":"521","name":"dry-run production guard > allows dry-run outside production","location":{"start":{"column":3,"line":13}}},{"id":"522","name":"dry-run production guard > throws if dry-run when isProductionRuntime is true (VERCEL_ENV or NODE_ENV)","location":{"start":{"column":3,"line":20}}},{"id":"523","name":"isProductionRuntime > is true for NODE_ENV=production or VERCEL_ENV=production","location":{"start":{"column":3,"line":28}}}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest';\nimport { getMessagingAdapter, resetMessagingAdapterCache } from './index';\nimport * as logic from '@/services/campaign-logic';\n\ndescribe('dry-run production guard', () => {\n  afterEach(() => {\n    delete process.env.MESSAGING_PROVIDER;\n    delete process.env.VERCEL_ENV;\n    vi.restoreAllMocks();\n    resetMessagingAdapterCache();\n  });\n\n  it('allows dry-run outside production', () => {\n    process.env.MESSAGING_PROVIDER = 'dry-run';\n    process.env.VERCEL_ENV = 'preview';\n    vi.spyOn(logic, 'isProductionRuntime').mockReturnValue(false);\n    expect(getMessagingAdapter().name).toBe('dry-run');\n  });\n\n  it('throws if dry-run when isProductionRuntime is true (VERCEL_ENV or NODE_ENV)', () => {\n    process.env.MESSAGING_PROVIDER = 'dry-run';\n    vi.spyOn(logic, 'isProductionRuntime').mockReturnValue(true);\n    expect(() => getMessagingAdapter()).toThrow(/forbidden.*production/i);\n  });\n});\n\ndescribe('isProductionRuntime', () => {\n  it('is true for NODE_ENV=production or VERCEL_ENV=production', () => {\n    expect(logic.isProductionRuntime({ NODE_ENV: 'production' })).toBe(true);\n    expect(\n      logic.isProductionRuntime({ VERCEL_ENV: 'production', NODE_ENV: 'test' })\n    ).toBe(true);\n    expect(\n      logic.isProductionRuntime({ VERCEL_ENV: 'preview', NODE_ENV: 'test' })\n    ).toBe(false);\n  });\n});\n"},"src/lib/phone.test.ts":{"tests":[{"id":"524","name":"normalizeToE164 > keeps already-E.164 numbers","location":{"start":{"column":3,"line":11}}},{"id":"525","name":"normalizeToE164 > adds +1 for 10-digit NANP","location":{"start":{"column":3,"line":15}}},{"id":"526","name":"normalizeToE164 > handles 11-digit leading 1","location":{"start":{"column":3,"line":19}}},{"id":"527","name":"normalizeToE164 > converts 00 international prefix without making +001…","location":{"start":{"column":3,"line":23}}},{"id":"528","name":"normalizeToE164 > strips extensions instead of appending them","location":{"start":{"column":3,"line":33}}},{"id":"529","name":"normalizeToE164 > rejects 7-digit numbers like 555-1234","location":{"start":{"column":3,"line":39}}},{"id":"530","name":"normalizeToE164 > tryNormalize returns null on empty / non-numeric","location":{"start":{"column":3,"line":44}}},{"id":"531","name":"normalizeToE164 > digitCount ignores punctuation","location":{"start":{"column":3,"line":50}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  digitCount,\n  normalizeInternationalPrefix,\n  normalizeToE164,\n  stripExtension,\n  tryNormalizeToE164,\n} from './phone';\n\ndescribe('normalizeToE164', () => {\n  it('keeps already-E.164 numbers', () => {\n    expect(normalizeToE164('+12125551234')).toBe('+12125551234');\n  });\n\n  it('adds +1 for 10-digit NANP', () => {\n    expect(normalizeToE164('(212) 555-1234')).toBe('+12125551234');\n  });\n\n  it('handles 11-digit leading 1', () => {\n    expect(normalizeToE164('12125551234')).toBe('+12125551234');\n  });\n\n  it('converts 00 international prefix without making +001…', () => {\n    expect(normalizeInternationalPrefix('0012125551234')).toBe('+12125551234');\n    expect(normalizeToE164('0012125551234')).toBe('+12125551234');\n    expect(normalizeToE164('0012125551234')).not.toMatch(/^\\+001/);\n    // Classic QC fixture: 001555… must not become +001555…\n    expect(normalizeInternationalPrefix('0015551234567')).toBe('+15551234567');\n    expect(normalizeToE164('0015551234567')).toBe('+15551234567');\n    expect(normalizeToE164('0015551234567')).not.toBe('+0015551234567');\n  });\n\n  it('strips extensions instead of appending them', () => {\n    expect(stripExtension('+12125551234x123')).toBe('+12125551234');\n    expect(stripExtension('212-555-1234 ext. 99')).toBe('212-555-1234');\n    expect(normalizeToE164('+1 212 555 1234;ext=88')).toBe('+12125551234');\n  });\n\n  it('rejects 7-digit numbers like 555-1234', () => {\n    expect(tryNormalizeToE164('555-1234')).toBeNull();\n    expect(() => normalizeToE164('5551234')).toThrow(/Invalid phone/);\n  });\n\n  it('tryNormalize returns null on empty / non-numeric', () => {\n    expect(tryNormalizeToE164('')).toBeNull();\n    expect(tryNormalizeToE164('not-a-phone')).toBeNull();\n    expect(tryNormalizeToE164('Customer')).toBeNull();\n  });\n\n  it('digitCount ignores punctuation', () => {\n    expect(digitCount('(212) 555-1234')).toBe(10);\n  });\n});\n"},"src/services/campaign-decisions.survivors.test.ts":{"tests":[{"id":"532","name":"campaign-decisions survivors > only_initial requires skipped + same step + length 1","location":{"start":{"column":3,"line":11}}},{"id":"533","name":"campaign-decisions survivors > pending park only when not recoveryConfirmed","location":{"start":{"column":3,"line":49}}},{"id":"534","name":"campaign-decisions survivors > decideSkipRecoveryGate firstStepNumber undefined","location":{"start":{"column":3,"line":74}}},{"id":"535","name":"campaign-decisions survivors > decideCampaignSendDispatch exact type strings","location":{"start":{"column":3,"line":84}}},{"id":"536","name":"campaign-decisions survivors > decideCampaignLeadGates optedOut wins with suppressed","location":{"start":{"column":3,"line":141}}},{"id":"537","name":"campaign-decisions survivors > reconcile advance: each flag independently blocks","location":{"start":{"column":3,"line":151}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  decideCampaignLeadGates,\n  decideCampaignSendDispatch,\n  decideEnrollmentPlan,\n  decideReconcileAdvanceEligibility,\n  decideSkipRecoveryGate,\n} from './campaign-decisions';\n\ndescribe('campaign-decisions survivors', () => {\n  it('only_initial requires skipped + same step + length 1', () => {\n    // skipped but multiple steps → ok (kills length===1 → true)\n    expect(\n      decideEnrollmentPlan({\n        steps: [\n          { step_number: 1, delay_minutes: 0 },\n          { step_number: 2, delay_minutes: 10 },\n        ],\n        recoveryState: 'confirmed',\n        recoveryConfirmed: true,\n        treatRecoveryAsInitial: true,\n        now: new Date('2026-01-01T00:00:00Z'),\n      }).ok\n    ).toBe(true);\n\n    // not skipped (Emergency) single step → ok (kills skippedInitial → true)\n    expect(\n      decideEnrollmentPlan({\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        recoveryState: 'confirmed',\n        recoveryConfirmed: true,\n        treatRecoveryAsInitial: false,\n        now: new Date('2026-01-01T00:00:00Z'),\n      })\n    ).toMatchObject({ ok: true, currentStep: 1 });\n\n    // all three: skipped + same step + length 1 → only_initial_already_sent\n    expect(\n      decideEnrollmentPlan({\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        recoveryState: 'confirmed',\n        recoveryConfirmed: true,\n        treatRecoveryAsInitial: true,\n        now: new Date('2026-01-01T00:00:00Z'),\n      })\n    ).toEqual({ ok: false, reason: 'only_initial_already_sent' });\n  });\n\n  it('pending park only when not recoveryConfirmed', () => {\n    const parked = '2099-01-01T00:00:00.000Z';\n    expect(\n      decideEnrollmentPlan({\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        recoveryState: 'pending',\n        recoveryConfirmed: true, // sid present\n        treatRecoveryAsInitial: false,\n        parkedIso: parked,\n        now: new Date('2026-01-01T12:00:00Z'),\n      })\n    ).not.toMatchObject({ nextSendAt: parked });\n\n    expect(\n      decideEnrollmentPlan({\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        recoveryState: 'absent',\n        recoveryConfirmed: false,\n        treatRecoveryAsInitial: true,\n        parkedIso: parked,\n        now: new Date('2026-01-01T12:00:00Z'),\n      })\n    ).not.toMatchObject({ nextSendAt: parked });\n  });\n\n  it('decideSkipRecoveryGate firstStepNumber undefined', () => {\n    expect(\n      decideSkipRecoveryGate({\n        delayMinutes: 0,\n        currentStep: 1,\n        firstStepNumber: undefined,\n      })\n    ).toBe(true);\n  });\n\n  it('decideCampaignSendDispatch exact type strings', () => {\n    const park = 'p';\n    const cases: Array<"+"{\n      o: Parameters<"+"typeof decideCampaignSendDispatch>[0];\n      type: string;\n      success: boolean;\n    }> = [\n      {\n        o: {\n          kind: 'skipped',\n          reason: 'recovery_already_sent_skip_step_1',\n        },\n        type: 'advance',\n        success: true,\n      },\n      {\n        o: { kind: 'blocked', reason: 'quiet_hours_unresolved' },\n        type: 'flag_unresolved_tz',\n        success: false,\n      },\n      {\n        o: { kind: 'blocked', reason: 'invalid_phone' },\n        type: 'noop_false',\n        success: false,\n      },\n      {\n        o: { kind: 'needs_review', sid: 's', reason: 'r' },\n        type: 'needs_review_terminal',\n        success: false,\n      },\n      {\n        o: { kind: 'blocked', reason: 'suppressed' },\n        type: 'pause_opt_out',\n        success: true,\n      },\n      {\n        o: {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't',\n        },\n        type: 'release',\n        success: true,\n      },\n      {\n        o: { kind: 'ambiguous', sid: 's', reason: 'r' },\n        type: 'park',\n        success: false,\n      },\n    ];\n    for (const c of cases) {\n      const d = decideCampaignSendDispatch(c.o, park);\n      expect(d.type).toBe(c.type);\n      expect(d.success).toBe(c.success);\n    }\n  });\n\n  it('decideCampaignLeadGates optedOut wins with suppressed', () => {\n    expect(\n      decideCampaignLeadGates({\n        optedOut: true,\n        suppressed: true,\n        suppressionLookupFailed: true,\n      })\n    ).toEqual({ action: 'pause', success: true });\n  });\n\n  it('reconcile advance: each flag independently blocks', () => {\n    expect(\n      decideReconcileAdvanceEligibility({\n        enrollmentFound: true,\n        campaignMatches: true,\n        stepMatches: true,\n        hasClaimToken: false,\n      })\n    ).toBe(true);\n    expect(\n      decideReconcileAdvanceEligibility({\n        enrollmentFound: false,\n        campaignMatches: true,\n        stepMatches: true,\n        hasClaimToken: false,\n      })\n    ).toBe(false);\n    expect(\n      decideReconcileAdvanceEligibility({\n        enrollmentFound: true,\n        campaignMatches: false,\n        stepMatches: true,\n        hasClaimToken: false,\n      })\n    ).toBe(false);\n    expect(\n      decideReconcileAdvanceEligibility({\n        enrollmentFound: true,\n        campaignMatches: true,\n        stepMatches: false,\n        hasClaimToken: false,\n      })\n    ).toBe(false);\n    expect(\n      decideReconcileAdvanceEligibility({\n        enrollmentFound: true,\n        campaignMatches: true,\n        stepMatches: true,\n        hasClaimToken: true,\n      })\n    ).toBe(false);\n  });\n});\n"},"src/services/send/send-io-plans.test.ts":{"tests":[{"id":"538","name":"send-io-plans > sending insert keeps key_supported_at_send false","location":{"start":{"column":3,"line":15}}},{"id":"539","name":"send-io-plans > claim deferred / confirm / park / abandoned / needs_review shapes","location":{"start":{"column":3,"line":34}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  clearLeadOutboundSidPayload,\n  leadOutboundSidPayload,\n  smsAbandonedRetryPayload,\n  smsClaimDeferredPayload,\n  smsConfirmSentPayload,\n  smsNeedsReviewPayload,\n  smsParkAmbiguousPayload,\n  smsSendingInsertPayload,\n  smsStatusOnlyPayload,\n} from './send-io-plans';\n\ndescribe('send-io-plans', () => {\n  it('sending insert keeps key_supported_at_send false', () => {\n    expect(\n      smsSendingInsertPayload({\n        leadId: 'L',\n        body: 'hi',\n        sid: 's',\n        direction: 'outbound',\n        status: 'sending',\n      })\n    ).toEqual({\n      lead_id: 'L',\n      direction: 'outbound',\n      body: 'hi',\n      message_sid: 's',\n      status: 'sending',\n      key_supported_at_send: false,\n    });\n  });\n\n  it('claim deferred / confirm / park / abandoned / needs_review shapes', () => {\n    expect(\n      smsClaimDeferredPayload({ status: 'sending', body: 'b' })\n    ).toEqual({\n      status: 'sending',\n      next_retry_at: null,\n      body: 'b',\n    });\n    expect(\n      smsConfirmSentPayload({\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      })\n    ).toEqual({\n      status: 'queued',\n      key_supported_at_send: true,\n    });\n    expect(smsStatusOnlyPayload('needs_review')).toEqual({\n      status: 'needs_review',\n    });\n    expect(\n      smsParkAmbiguousPayload({\n        status: 'unknown',\n        nextAttempts: 2,\n        nextRetryAt: 't',\n      })\n    ).toEqual({\n      status: 'unknown',\n      reconcile_attempts: 2,\n      next_retry_at: 't',\n    });\n    expect(\n      smsAbandonedRetryPayload({\n        status: 'abandoned_retry',\n        abandonedSid: 's:abandoned:1',\n      })\n    ).toEqual({\n      status: 'abandoned_retry',\n      message_sid: 's:abandoned:1',\n    });\n    expect(smsNeedsReviewPayload({ status: 'needs_review' })).toEqual({\n      status: 'needs_review',\n      next_retry_at: null,\n    });\n    expect(leadOutboundSidPayload('sid')).toEqual({ sms_outbound_sid: 'sid' });\n    expect(clearLeadOutboundSidPayload()).toEqual({ sms_outbound_sid: null });\n  });\n});\n"},"src/lib/messaging/dry-run.test.ts":{"tests":[{"id":"540","name":"dry-run phone redaction (QC r6 P2) > US numbers keep only last 4","location":{"start":{"column":3,"line":5}}},{"id":"541","name":"dry-run phone redaction (QC r6 P2) > international numbers keep only last 4 (no 6-digit leak)","location":{"start":{"column":3,"line":10}}},{"id":"542","name":"dry-run phone redaction (QC r6 P2) > strips extension before redacting","location":{"start":{"column":3,"line":17}}},{"id":"543","name":"dry-run phone redaction (QC r6 P2) > DryRunAdapter logs use redactPhonesInText and redactPhone (kills #51/#52)","location":{"start":{"column":3,"line":23}}}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { DryRunAdapter, redactPhonesInText } from './dry-run';\n\ndescribe('dry-run phone redaction (QC r6 P2)', () => {\n  it('US numbers keep only last 4', () => {\n    expect(redactPhonesInText('call +12125550100 now')).toMatch(/\\*\\*\\*-\\*\\*\\*-0100/);\n    expect(redactPhonesInText('call +12125550100 now')).not.toMatch(/212/);\n  });\n\n  it('international numbers keep only last 4 (no 6-digit leak)', () => {\n    const out = redactPhonesInText('UK +442071234567 office');\n    expect(out).toMatch(/\\*\\*\\*-\\*\\*\\*-4567/);\n    expect(out).not.toMatch(/234567/);\n    expect(out).not.toMatch(/207/);\n  });\n\n  it('strips extension before redacting', () => {\n    const out = redactPhonesInText('212 555 0101 ext 5');\n    expect(out).toMatch(/\\*\\*\\*-\\*\\*\\*-0101/);\n    expect(out).not.toMatch(/1015/);\n  });\n\n  it('DryRunAdapter logs use redactPhonesInText and redactPhone (kills #51/#52)', async () => {\n    const log = vi.spyOn(console, 'log').mockImplementation(() => {});\n    const adapter = new DryRunAdapter();\n    await adapter.sendMessage({\n      to: '+442071234567',\n      body: 'Call back +442071234567 please',\n    });\n    const line = String(log.mock.calls[0]?.[0] ?? '');\n    expect(line).toContain('***-***-4567');\n    expect(line).not.toContain('442071234567');\n    expect(line).not.toContain('+442071234567');\n    // Source must call the helpers (mut.py string revert)\n    const src = await import('fs').then((fs) =>\n      fs.readFileSync(new URL('./dry-run.ts', import.meta.url), 'utf8')\n    );\n    expect(src).toContain('redactPhonesInText(input.body)');\n    expect(src).toContain('redactPhone(input.to)');\n    log.mockRestore();\n  });\n});\n"},"src/services/campaign-logic.survivors.test.ts":{"tests":[{"id":"544","name":"getCampaignReplyMode / selectCampaignForUrgency > defaults to pause; only continue when explicitly set","location":{"start":{"column":3,"line":24}}},{"id":"545","name":"getCampaignReplyMode / selectCampaignForUrgency > exact urgency wins; null filter is catch-all; missing → undefined","location":{"start":{"column":3,"line":33}}},{"id":"546","name":"planEnrollmentStart > sorts by step_number ascending (not reverse / broken compare)","location":{"start":{"column":3,"line":51}}},{"id":"547","name":"planEnrollmentStart > skips delay-0 when recoveryAlreadySent + treatRecoveryAsInitial","location":{"start":{"column":3,"line":61}}},{"id":"548","name":"planEnrollmentStart > does not skip when treatRecoveryAsInitial is false","location":{"start":{"column":3,"line":73}}},{"id":"549","name":"planEnrollmentStart > throws on empty steps","location":{"start":{"column":3,"line":83}}},{"id":"550","name":"parkedNextSendAt / shouldSendCampaignStep > parks exactly PARKED_SEND_MS ahead (not behind)","location":{"start":{"column":3,"line":91}}},{"id":"551","name":"parkedNextSendAt / shouldSendCampaignStep > blocks when sid already present (some not every)","location":{"start":{"column":3,"line":98}}},{"id":"552","name":"decideReplyEnrollmentAction / hasFreshClaim > noop without enrollment; pause active when no target + pause mode","location":{"start":{"column":3,"line":109}}},{"id":"553","name":"decideReplyEnrollmentAction / hasFreshClaim > switches when campaign differs and claim is stale","location":{"start":{"column":3,"line":129}}},{"id":"554","name":"decideReplyEnrollmentAction / hasFreshClaim > defers switch when claim is fresh","location":{"start":{"column":3,"line":144}}},{"id":"555","name":"decideReplyEnrollmentAction / hasFreshClaim > pauses same campaign when active + pause mode","location":{"start":{"column":3,"line":160}}},{"id":"556","name":"decideReplyEnrollmentAction / hasFreshClaim > hasFreshClaim uses strict <"+" staleMs (not <"+"=)","location":{"start":{"column":3,"line":170}}},{"id":"557","name":"isLeadWithinLookupAge / isEnrollmentClaimable > age window is inclusive 0..max days","location":{"start":{"column":3,"line":190}}},{"id":"558","name":"isLeadWithinLookupAge / isEnrollmentClaimable > claimable only when active, not fresh-claimed, and due","location":{"start":{"column":3,"line":210}}},{"id":"559","name":"classifyMessageInsertError / isProductionRuntime > maps null / 23505 / other","location":{"start":{"column":3,"line":251}}},{"id":"560","name":"classifyMessageInsertError / isProductionRuntime > production when VERCEL_ENV or NODE_ENV is production","location":{"start":{"column":3,"line":257}}}],"source":"/**\n * Targeted behavioural killers for campaign-logic.ts Stryker survivors (QC r7).\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  CLAIM_STALE_MS,\n  LEAD_LOOKUP_MAX_AGE_DAYS,\n  PARKED_SEND_MS,\n  classifyMessageInsertError,\n  decideReplyEnrollmentAction,\n  getCampaignReplyMode,\n  hasFreshClaim,\n  isEnrollmentClaimable,\n  isLeadWithinLookupAge,\n  isProductionRuntime,\n  parkedNextSendAt,\n  planEnrollmentStart,\n  selectCampaignForUrgency,\n  shouldSendCampaignStep,\n} from './campaign-logic';\n\ndescribe('getCampaignReplyMode / selectCampaignForUrgency', () => {\n  it('defaults to pause; only continue when explicitly set', () => {\n    expect(getCampaignReplyMode({})).toBe('pause');\n    expect(getCampaignReplyMode({ CAMPAIGN_REPLY_MODE: '' })).toBe('pause');\n    expect(getCampaignReplyMode({ CAMPAIGN_REPLY_MODE: 'PAUSE' })).toBe('pause');\n    expect(getCampaignReplyMode({ CAMPAIGN_REPLY_MODE: 'continue' })).toBe(\n      'continue'\n    );\n  });\n\n  it('exact urgency wins; null filter is catch-all; missing → undefined', () => {\n    const camps = [\n      { id: 'e', name: 'E', urgency_filter: 'emergency' },\n      { id: 's', name: 'S', urgency_filter: null },\n    ];\n    expect(selectCampaignForUrgency(camps, 'emergency')?.id).toBe('e');\n    expect(selectCampaignForUrgency(camps, 'high')?.id).toBe('s');\n    expect(selectCampaignForUrgency(camps, null)?.id).toBe('s');\n    expect(selectCampaignForUrgency([], 'emergency')).toBeUndefined();\n  });\n});\n\ndescribe('planEnrollmentStart', () => {\n  const steps = [\n    { step_number: 2, delay_minutes: 30 },\n    { step_number: 1, delay_minutes: 0 },\n  ];\n\n  it('sorts by step_number ascending (not reverse / broken compare)', () => {\n    const now = new Date('2026-01-01T00:00:00.000Z');\n    const p = planEnrollmentStart(steps, {\n      recoveryAlreadySent: false,\n      now,\n    });\n    expect(p.currentStep).toBe(1);\n    expect(p.nextSendAt.toISOString()).toBe(now.toISOString());\n  });\n\n  it('skips delay-0 when recoveryAlreadySent + treatRecoveryAsInitial', () => {\n    const now = new Date('2026-01-01T00:00:00.000Z');\n    const p = planEnrollmentStart(steps, {\n      recoveryAlreadySent: true,\n      treatRecoveryAsInitial: true,\n      now,\n    });\n    expect(p.currentStep).toBe(2);\n    expect(p.skippedInitial).toBe(true);\n    expect(p.nextSendAt.getTime()).toBe(now.getTime() + 30 * 60 * 1000);\n  });\n\n  it('does not skip when treatRecoveryAsInitial is false', () => {\n    const p = planEnrollmentStart(steps, {\n      recoveryAlreadySent: true,\n      treatRecoveryAsInitial: false,\n      now: new Date('2026-01-01T00:00:00.000Z'),\n    });\n    expect(p.currentStep).toBe(1);\n    expect(p.skippedInitial).toBe(false);\n  });\n\n  it('throws on empty steps', () => {\n    expect(() =>\n      planEnrollmentStart([], { recoveryAlreadySent: false })\n    ).toThrow(/no steps/i);\n  });\n});\n\ndescribe('parkedNextSendAt / shouldSendCampaignStep', () => {\n  it('parks exactly PARKED_SEND_MS ahead (not behind)', () => {\n    const now = new Date('2026-06-01T12:00:00.000Z');\n    expect(parkedNextSendAt(now)).toBe(\n      new Date(now.getTime() + PARKED_SEND_MS).toISOString()\n    );\n  });\n\n  it('blocks when sid already present (some not every)', () => {\n    expect(\n      shouldSendCampaignStep('E', 'C', 1, [null, 'mlf:campaign:E:C:step:1'])\n    ).toBe(false);\n    expect(shouldSendCampaignStep('E', 'C', 1, [null, 'other'])).toBe(true);\n  });\n});\n\ndescribe('decideReplyEnrollmentAction / hasFreshClaim', () => {\n  const now = new Date('2026-06-15T12:00:00.000Z');\n\n  it('noop without enrollment; pause active when no target + pause mode', () => {\n    expect(\n      decideReplyEnrollmentAction(null, undefined, { now })\n    ).toEqual({ action: 'noop' });\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e', campaign_id: 'c', status: 'active' },\n        undefined,\n        { replyMode: 'pause', now }\n      )\n    ).toEqual({ action: 'pause' });\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e', campaign_id: 'c', status: 'active' },\n        undefined,\n        { replyMode: 'continue', now }\n      )\n    ).toEqual({ action: 'noop' });\n  });\n\n  it('switches when campaign differs and claim is stale', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        {\n          id: 'e',\n          campaign_id: 'old',\n          status: 'active',\n          claimed_at: '2000-01-01T00:00:00.000Z',\n        },\n        { id: 'new', name: 'N', urgency_filter: 'emergency' },\n        { now }\n      )\n    ).toEqual({ action: 'switch', targetCampaignId: 'new' });\n  });\n\n  it('defers switch when claim is fresh', () => {\n    const claimed = new Date(now.getTime() - 1000).toISOString();\n    expect(\n      decideReplyEnrollmentAction(\n        {\n          id: 'e',\n          campaign_id: 'old',\n          status: 'active',\n          claimed_at: claimed,\n        },\n        { id: 'new', name: 'N', urgency_filter: 'emergency' },\n        { now, claimStaleMs: CLAIM_STALE_MS }\n      )\n    ).toEqual({ action: 'defer_switch', targetCampaignId: 'new' });\n  });\n\n  it('pauses same campaign when active + pause mode', () => {\n    expect(\n      decideReplyEnrollmentAction(\n        { id: 'e', campaign_id: 'c', status: 'active' },\n        { id: 'c', name: 'S', urgency_filter: null },\n        { replyMode: 'pause', now }\n      )\n    ).toEqual({ action: 'pause' });\n  });\n\n  it('hasFreshClaim uses strict <"+" staleMs (not <"+"=)', () => {\n    const claimed = new Date(now.getTime() - CLAIM_STALE_MS).toISOString();\n    expect(hasFreshClaim({ claimed_at: claimed }, now, CLAIM_STALE_MS)).toBe(\n      false\n    );\n    expect(\n      hasFreshClaim(\n        { claimed_at: new Date(now.getTime() - CLAIM_STALE_MS + 1).toISOString() },\n        now,\n        CLAIM_STALE_MS\n      )\n    ).toBe(true);\n    expect(hasFreshClaim({ claimed_at: null }, now)).toBe(false);\n    expect(hasFreshClaim({ claimed_at: 'not-a-date' }, now)).toBe(false);\n  });\n});\n\ndescribe('isLeadWithinLookupAge / isEnrollmentClaimable', () => {\n  const now = new Date('2026-06-15T12:00:00.000Z');\n\n  it('age window is inclusive 0..max days', () => {\n    expect(isLeadWithinLookupAge(now, now)).toBe(true);\n    expect(\n      isLeadWithinLookupAge(\n        new Date(now.getTime() - LEAD_LOOKUP_MAX_AGE_DAYS * 86400000),\n        now\n      )\n    ).toBe(true);\n    expect(\n      isLeadWithinLookupAge(\n        new Date(now.getTime() - LEAD_LOOKUP_MAX_AGE_DAYS * 86400000 - 1),\n        now\n      )\n    ).toBe(false);\n    expect(isLeadWithinLookupAge('bogus', now)).toBe(false);\n    expect(\n      isLeadWithinLookupAge(new Date(now.getTime() + 1000), now)\n    ).toBe(false);\n  });\n\n  it('claimable only when active, not fresh-claimed, and due', () => {\n    expect(\n      isEnrollmentClaimable(\n        { status: 'paused', next_send_at: null, claimed_at: null },\n        now\n      )\n    ).toBe(false);\n    expect(\n      isEnrollmentClaimable(\n        {\n          status: 'active',\n          next_send_at: null,\n          claimed_at: new Date(now.getTime() - 1000).toISOString(),\n        },\n        now\n      )\n    ).toBe(false);\n    expect(\n      isEnrollmentClaimable(\n        {\n          status: 'active',\n          next_send_at: new Date(now.getTime() - 1000).toISOString(),\n          claimed_at: null,\n        },\n        now\n      )\n    ).toBe(true);\n    expect(\n      isEnrollmentClaimable(\n        {\n          status: 'active',\n          next_send_at: new Date(now.getTime() + 60_000).toISOString(),\n          claimed_at: null,\n        },\n        now\n      )\n    ).toBe(false);\n  });\n});\n\ndescribe('classifyMessageInsertError / isProductionRuntime', () => {\n  it('maps null / 23505 / other', () => {\n    expect(classifyMessageInsertError(null)).toBe('ok');\n    expect(classifyMessageInsertError({ code: '23505' })).toBe('duplicate');\n    expect(classifyMessageInsertError({ code: 'xx' })).toBe('failed');\n  });\n\n  it('production when VERCEL_ENV or NODE_ENV is production', () => {\n    expect(isProductionRuntime({})).toBe(false);\n    expect(isProductionRuntime({ NODE_ENV: 'production' })).toBe(true);\n    expect(isProductionRuntime({ VERCEL_ENV: 'production' })).toBe(true);\n    expect(isProductionRuntime({ NODE_ENV: 'test' })).toBe(false);\n  });\n});\n"},"src/services/reconcile-logic.test.ts":{"tests":[{"id":"561","name":"decideOnDuplicateSid > advances only on confirmed; failed → needs_review","location":{"start":{"column":3,"line":10}}},{"id":"562","name":"normalizeLookupOutcome > never treats missing outcome as never_sent when found:true","location":{"start":{"column":3,"line":18}}},{"id":"563","name":"normalizeLookupOutcome > maps failed status to failed","location":{"start":{"column":3,"line":25}}},{"id":"564","name":"normalizeLookupOutcome > explicit found:false is never_sent; outcome string wins when present","location":{"start":{"column":3,"line":35}}},{"id":"565","name":"normalizeLookupOutcome > defaults missing status to queued; preserves explicit outcomes","location":{"start":{"column":3,"line":48}}},{"id":"566","name":"normalizeLookupOutcome > found:true without id/status stays unknown; status alone → sent","location":{"start":{"column":3,"line":66}}},{"id":"567","name":"normalizeLookupOutcome > found:true + failed status without outcome → failed","location":{"start":{"column":3,"line":85}}},{"id":"568","name":"normalizeLookupOutcome > explicit sent + non-failed status stays sent (&& failed would wrongly flip)","location":{"start":{"column":3,"line":91}}},{"id":"569","name":"decideReconcileRow > confirms sent","location":{"start":{"column":3,"line":102}}},{"id":"570","name":"decideReconcileRow > confirm defaults missing providerStatus to queued","location":{"start":{"column":3,"line":113}}},{"id":"571","name":"decideReconcileRow > parks unknown; requeues never_sent only with key support","location":{"start":{"column":3,"line":122}}},{"id":"572","name":"decideReconcileRow > failed → needs_review","location":{"start":{"column":3,"line":142}}},{"id":"573","name":"decideReconcileRow > sent + failed provider status → needs_review","location":{"start":{"column":3,"line":154}}},{"id":"574","name":"decideReconcileRow > never_sent without key support includes reason","location":{"start":{"column":3,"line":167}}},{"id":"575","name":"decideReconcileRow > max attempts reason is max_attempts","location":{"start":{"column":3,"line":179}}},{"id":"576","name":"decideReconcileRow > never_sent with unknown sid parks (not recovery)","location":{"start":{"column":3,"line":188}}},{"id":"577","name":"decideReconcileRow > recovery never_sent with key support → requeue_recovery","location":{"start":{"column":3,"line":198}}}],"source":"import { describe, expect, it } from 'vitest';\nimport { campaignStepMessageSid, recoveryMessageSid } from './sms-sid';\nimport {\n  decideOnDuplicateSid,\n  decideReconcileRow,\n  normalizeLookupOutcome,\n} from './reconcile-logic';\n\ndescribe('decideOnDuplicateSid', () => {\n  it('advances only on confirmed; failed → needs_review', () => {\n    expect(decideOnDuplicateSid('queued').action).toBe('advance');\n    expect(decideOnDuplicateSid('failed').action).toBe('needs_review');\n    expect(decideOnDuplicateSid('sending').action).toBe('park');\n  });\n});\n\ndescribe('normalizeLookupOutcome', () => {\n  it('never treats missing outcome as never_sent when found:true', () => {\n    expect(\n      normalizeLookupOutcome({ found: true, id: 'x', status: 'queued' }).outcome\n    ).toBe('sent');\n    expect(normalizeLookupOutcome({}).outcome).toBe('unknown');\n  });\n\n  it('maps failed status to failed', () => {\n    expect(\n      normalizeLookupOutcome({\n        found: true,\n        id: 'x',\n        status: 'failed',\n      }).outcome\n    ).toBe('failed');\n  });\n\n  it('explicit found:false is never_sent; outcome string wins when present', () => {\n    expect(normalizeLookupOutcome({ found: false })).toEqual({\n      outcome: 'never_sent',\n      providerStatus: 'queued',\n    });\n    expect(\n      normalizeLookupOutcome({ outcome: 'never_sent', found: true }).outcome\n    ).toBe('never_sent');\n    expect(\n      normalizeLookupOutcome({ outcome: 'sent', status: 'failed' })\n    ).toEqual({ outcome: 'failed', providerStatus: 'failed' });\n  });\n\n  it('defaults missing status to queued; preserves explicit outcomes', () => {\n    expect(normalizeLookupOutcome({ outcome: 'sent' })).toEqual({\n      outcome: 'sent',\n      providerStatus: 'queued',\n    });\n    expect(normalizeLookupOutcome({ outcome: 'unknown' })).toEqual({\n      outcome: 'unknown',\n      providerStatus: 'queued',\n    });\n    expect(normalizeLookupOutcome({ outcome: 'failed' })).toEqual({\n      outcome: 'failed',\n      providerStatus: 'queued',\n    });\n    expect(\n      normalizeLookupOutcome({ outcome: 'never_sent', status: 'sent' })\n    ).toEqual({ outcome: 'never_sent', providerStatus: 'sent' });\n  });\n\n  it('found:true without id/status stays unknown; status alone → sent', () => {\n    // lookup.id || lookup.status — status-only must still confirm sent\n    expect(normalizeLookupOutcome({ found: true, status: 'delivered' })).toEqual(\n      {\n        outcome: 'sent',\n        providerStatus: 'delivered',\n      }\n    );\n    expect(normalizeLookupOutcome({ found: true, id: 'sid-1' })).toEqual({\n      outcome: 'sent',\n      providerStatus: 'queued',\n    });\n    // found:true with neither id nor status → do not invent sent\n    expect(normalizeLookupOutcome({ found: true })).toEqual({\n      outcome: 'unknown',\n      providerStatus: 'queued',\n    });\n  });\n\n  it('found:true + failed status without outcome → failed', () => {\n    expect(\n      normalizeLookupOutcome({ found: true, status: 'failed' })\n    ).toEqual({ outcome: 'failed', providerStatus: 'failed' });\n  });\n\n  it('explicit sent + non-failed status stays sent (&& failed would wrongly flip)', () => {\n    expect(\n      normalizeLookupOutcome({ outcome: 'sent', status: 'delivered' })\n    ).toEqual({ outcome: 'sent', providerStatus: 'delivered' });\n  });\n});\n\n\ndescribe('decideReconcileRow', () => {\n  const sid = campaignStepMessageSid('E1', 'C-em', 2);\n\n  it('confirms sent', () => {\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'sent',\n        providerStatus: 'delivered',\n        keySupportedAtSend: true,\n      })\n    ).toMatchObject({ action: 'confirm', providerStatus: 'delivered' });\n  });\n\n  it('confirm defaults missing providerStatus to queued', () => {\n    const d = decideReconcileRow({\n      sid,\n      outcome: 'sent',\n      keySupportedAtSend: true,\n    });\n    expect(d).toMatchObject({ action: 'confirm', providerStatus: 'queued' });\n  });\n\n  it('parks unknown; requeues never_sent only with key support', () => {\n    expect(decideReconcileRow({ sid, outcome: 'unknown' }).action).toBe(\n      'park'\n    );\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: true,\n      })\n    ).toMatchObject({ action: 'requeue_campaign', stepNumber: 2 });\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: false,\n      }).action\n    ).toBe('needs_review');\n  });\n\n  it('failed → needs_review', () => {\n    const d = decideReconcileRow({\n      sid,\n      outcome: 'failed',\n      keySupportedAtSend: true,\n    });\n    expect(d.action).toBe('needs_review');\n    if (d.action === 'needs_review') {\n      expect(d.reason).toBe('relay_status_failed');\n    }\n  });\n\n  it('sent + failed provider status → needs_review', () => {\n    const d = decideReconcileRow({\n      sid,\n      outcome: 'sent',\n      providerStatus: 'failed',\n      keySupportedAtSend: true,\n    });\n    expect(d).toMatchObject({\n      action: 'needs_review',\n      reason: 'relay_status_failed',\n    });\n  });\n\n  it('never_sent without key support includes reason', () => {\n    const d = decideReconcileRow({\n      sid,\n      outcome: 'never_sent',\n      keySupportedAtSend: false,\n    });\n    expect(d).toMatchObject({\n      action: 'needs_review',\n      reason: 'never_sent_without_key_support',\n    });\n  });\n\n  it('max attempts reason is max_attempts', () => {\n    const d = decideReconcileRow({\n      sid,\n      outcome: 'unknown',\n      reconcileAttempts: 4,\n    });\n    expect(d).toMatchObject({ action: 'needs_review', reason: 'max_attempts' });\n  });\n\n  it('never_sent with unknown sid parks (not recovery)', () => {\n    expect(\n      decideReconcileRow({\n        sid: 'mlf:not-a-real-sid',\n        outcome: 'never_sent',\n        keySupportedAtSend: true,\n      }).action\n    ).toBe('park');\n  });\n\n  it('recovery never_sent with key support → requeue_recovery', () => {\n    expect(\n      decideReconcileRow({\n        sid: recoveryMessageSid('lead-9'),\n        outcome: 'never_sent',\n        keySupportedAtSend: true,\n      })\n    ).toEqual({ action: 'requeue_recovery', leadId: 'lead-9' });\n  });\n});\n"},"src/services/missed-call-flow.test.ts":{"tests":[{"id":"578","name":"missed-call → text-back flow (mocked relay) > queues recovery SMS through the BRWN relay after a missed-call path","location":{"start":{"column":3,"line":23}}},{"id":"579","name":"missed-call → text-back flow (mocked relay) > rejects webhook auth when bearer does not match","location":{"start":{"column":3,"line":53}}},{"id":"580","name":"missed-call → text-back flow (mocked relay) > redacts phones for logs (no full number leaked)","location":{"start":{"column":3,"line":59}}},{"id":"581","name":"missed-call → text-back flow (mocked relay) > resolves business phone from payload or env fallback","location":{"start":{"column":3,"line":65}}}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest';\nimport { redactPhone } from '@/lib/pii';\nimport { bearerMatches } from '@/lib/messaging/auth';\nimport { BrwnRelayAdapter } from '@/lib/messaging/brwn-relay';\nimport { resolveBusinessPhone } from '@/services/inbound';\nimport { resetMessagingAdapterCache } from '@/lib/messaging';\n\n/**\n * Missed-call → text-back flow pieces with the relay mocked.\n * No live network, no real SMS.\n */\n\ndescribe('missed-call → text-back flow (mocked relay)', () => {\n  afterEach(() => {\n    vi.unstubAllGlobals();\n    vi.restoreAllMocks();\n    delete process.env.BRWN_RELAY_URL;\n    delete process.env.BRWN_RELAY_SENDER_TOKEN;\n    delete process.env.BRWN_DEFAULT_BUSINESS_PHONE;\n    resetMessagingAdapterCache();\n  });\n\n  it('queues recovery SMS through the BRWN relay after a missed-call path', async () => {\n    process.env.BRWN_RELAY_URL = 'https://relay.example.com';\n    process.env.BRWN_RELAY_SENDER_TOKEN = 'sender-token';\n\n    const fetchMock = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      text: async () => JSON.stringify({ id: 'msg-99', status: 'queued' }),\n    });\n    vi.stubGlobal('fetch', fetchMock);\n\n    // Simulate the text-back step that processMissedCall triggers after recording the lead\n    const adapter = new BrwnRelayAdapter();\n    const result = await adapter.sendMessage({\n      to: '+15551234567',\n      body: 'Hi, this is Acme Plumbing. We noticed we missed your call.',\n      auto: true,\n    });\n\n    expect(result).toEqual({ id: 'msg-99', status: 'queued' });\n    expect(fetchMock).toHaveBeenCalledOnce();\n    const [url, init] = fetchMock.mock.calls[0];\n    expect(url).toBe('https://relay.example.com/api/messages');\n    expect(init.headers.Authorization).toBe('Bearer sender-token');\n    const body = JSON.parse(init.body as string);\n    expect(body.to).toBe('+15551234567');\n    expect(body.body).toContain('Acme Plumbing');\n    expect(body.auto).toBe(true);\n  });\n\n  it('rejects webhook auth when bearer does not match', () => {\n    expect(bearerMatches('Bearer wrong', 'expected-secret')).toBe(false);\n    expect(bearerMatches('Bearer expected-secret', 'expected-secret')).toBe(true);\n    expect(bearerMatches(undefined, 'expected-secret')).toBe(false);\n  });\n\n  it('redacts phones for logs (no full number leaked)', () => {\n    const redacted = redactPhone('+15551234567');\n    expect(redacted).toBe('***-***-4567');\n    expect(redacted).not.toMatch(/555123/);\n  });\n\n  it('resolves business phone from payload or env fallback', () => {\n    expect(resolveBusinessPhone('+15550001111')).toBe('+15550001111');\n    expect(resolveBusinessPhone(null)).toBe(null);\n    process.env.BRWN_DEFAULT_BUSINESS_PHONE = '+15550009999';\n    expect(resolveBusinessPhone(undefined)).toBe('+15550009999');\n  });\n});\n"},"src/services/sms-sid.test.ts":{"tests":[{"id":"582","name":"sms-sid parse / confirm > parses mlf:-prefixed campaign and recovery sids","location":{"start":{"column":3,"line":11}}},{"id":"583","name":"sms-sid parse / confirm > treats only confirmed statuses as advance-safe","location":{"start":{"column":3,"line":32}}},{"id":"584","name":"relay lookup contract (FastAPI >= v1.7.6) > 405 / 404 → unknown","location":{"start":{"column":3,"line":40}}},{"id":"585","name":"relay lookup contract (FastAPI >= v1.7.6) > found:false → never_sent; found:true+failed → failed; toLast4 shape → sent","location":{"start":{"column":3,"line":52}}},{"id":"586","name":"relay lookup contract (FastAPI >= v1.7.6) > id without found is unknown (no exists/present shortcuts)","location":{"start":{"column":3,"line":83}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  campaignStepMessageSid,\n  classifyRelayLookupResponse,\n  isConfirmedSmsStatus,\n  parseMessageSid,\n  recoveryMessageSid,\n} from './sms-sid';\n\ndescribe('sms-sid parse / confirm', () => {\n  it('parses mlf:-prefixed campaign and recovery sids', () => {\n    const c = campaignStepMessageSid('E1', 'C1', 3);\n    expect(c.startsWith('mlf:')).toBe(true);\n    expect(parseMessageSid(c)).toEqual({\n      kind: 'campaign',\n      enrollmentId: 'E1',\n      campaignId: 'C1',\n      stepNumber: 3,\n    });\n    expect(parseMessageSid(`${c}:abandoned:99`)).toEqual({\n      kind: 'campaign',\n      enrollmentId: 'E1',\n      campaignId: 'C1',\n      stepNumber: 3,\n    });\n    expect(parseMessageSid(recoveryMessageSid('L9'))).toEqual({\n      kind: 'recovery',\n      leadId: 'L9',\n    });\n  });\n\n  it('treats only confirmed statuses as advance-safe', () => {\n    expect(isConfirmedSmsStatus('queued')).toBe(true);\n    expect(isConfirmedSmsStatus('failed')).toBe(false);\n    expect(isConfirmedSmsStatus('sending')).toBe(false);\n  });\n});\n\ndescribe('relay lookup contract (FastAPI >= v1.7.6)', () => {\n  it('405 / 404 → unknown', () => {\n    expect(\n      classifyRelayLookupResponse({\n        httpStatus: 405,\n        body: { detail: 'Method Not Allowed' },\n      })\n    ).toBe('unknown');\n    expect(\n      classifyRelayLookupResponse({ httpStatus: 404, body: null })\n    ).toBe('unknown');\n  });\n\n  it('found:false → never_sent; found:true+failed → failed; toLast4 shape → sent', () => {\n    expect(\n      classifyRelayLookupResponse({\n        httpStatus: 200,\n        body: { found: false },\n      })\n    ).toBe('never_sent');\n    expect(\n      classifyRelayLookupResponse({\n        httpStatus: 200,\n        body: {\n          found: true,\n          id: 'm1',\n          toLast4: '4567',\n          status: 'queued',\n          error: null,\n          created: '2026-10-28T00:00:00Z',\n          updated: '2026-10-28T00:00:01Z',\n          attempts: 0,\n          auto: true,\n        },\n      })\n    ).toBe('sent');\n    expect(\n      classifyRelayLookupResponse({\n        httpStatus: 200,\n        body: { found: true, id: 'm1', toLast4: '4567', status: 'failed' },\n      })\n    ).toBe('failed');\n  });\n\n  it('id without found is unknown (no exists/present shortcuts)', () => {\n    expect(\n      classifyRelayLookupResponse({ httpStatus: 200, body: { id: 'm1' } })\n    ).toBe('unknown');\n  });\n});\n"},"src/lib/messaging/auth.test.ts":{"tests":[{"id":"587","name":"bearerMatches > accepts the correct bearer token","location":{"start":{"column":3,"line":5}}},{"id":"588","name":"bearerMatches > rejects wrong, missing, or malformed auth","location":{"start":{"column":3,"line":9}}}],"source":"import { describe, expect, it } from 'vitest';\nimport { bearerMatches } from './auth';\n\ndescribe('bearerMatches', () => {\n  it('accepts the correct bearer token', () => {\n    expect(bearerMatches('Bearer s3cret', 's3cret')).toBe(true);\n  });\n\n  it('rejects wrong, missing, or malformed auth', () => {\n    expect(bearerMatches('Bearer wrong', 's3cret')).toBe(false);\n    expect(bearerMatches('s3cret', 's3cret')).toBe(false);\n    expect(bearerMatches(null, 's3cret')).toBe(false);\n    expect(bearerMatches('Bearer s3cret', '')).toBe(false);\n    expect(bearerMatches('Bearer s3cret-extra', 's3cret')).toBe(false);\n  });\n});\n"},"src/services/campaign-send-plan.test.ts":{"tests":[{"id":"589","name":"planCampaignSendPre > fails without enrollment or claim token","location":{"start":{"column":3,"line":20}}},{"id":"590","name":"planCampaignSendPre > pauses on opted_out / suppressed; release_fail on lookup fail","location":{"start":{"column":3,"line":48}}},{"id":"591","name":"planCampaignSendPre > release_fail on no steps / missing step","location":{"start":{"column":3,"line":89}}},{"id":"592","name":"planCampaignSendPre > send plan: skipRecoveryGate only for delay-0 first step","location":{"start":{"column":3,"line":117}}},{"id":"593","name":"planCampaignSendPost > maps sent → advance success; needs_review → terminal fail","location":{"start":{"column":3,"line":154}}},{"id":"594","name":"campaign-send-plan coalescers + effects > resolveClaimToken prefers arg over enrollment (|| not &&)","location":{"start":{"column":3,"line":178}}},{"id":"595","name":"campaign-send-plan coalescers + effects > stepsForSendPlan empties on error; coalesces null","location":{"start":{"column":3,"line":185}}},{"id":"596","name":"campaign-send-plan coalescers + effects > coalesce helpers","location":{"start":{"column":3,"line":195}}},{"id":"597","name":"campaign-send-plan coalescers + effects > shouldCheckSuppression is AND (not OR)","location":{"start":{"column":3,"line":205}}},{"id":"598","name":"campaign-send-plan coalescers + effects > planCampaignSendEffects covers every dispatch type","location":{"start":{"column":3,"line":211}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  coalesceCurrentStep,\n  coalesceIssue,\n  coalesceLeadTimezone,\n  planCampaignSendEffects,\n  planCampaignSendPost,\n  planCampaignSendPre,\n  resolveClaimToken,\n  shouldCheckSuppression,\n  stepsForSendPlan,\n} from './campaign-send-plan';\n\nconst steps = [\n  { step_number: 1, delay_minutes: 0, template_key: 'a' },\n  { step_number: 2, delay_minutes: 60, template_key: 'b' },\n];\n\ndescribe('planCampaignSendPre', () => {\n  it('fails without enrollment or claim token', () => {\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: false,\n        claimToken: 't',\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: false,\n        steps,\n        currentStep: 1,\n        leadTimezone: null,\n      })\n    ).toMatchObject({ type: 'fail', reason: 'no_enrollment' });\n\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: null,\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: false,\n        steps,\n        currentStep: 1,\n        leadTimezone: null,\n      })\n    ).toMatchObject({ type: 'fail', reason: 'no_claim_token' });\n  });\n\n  it('pauses on opted_out / suppressed; release_fail on lookup fail', () => {\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: 't',\n        optedOut: true,\n        suppressed: false,\n        suppressionLookupFailed: false,\n        steps,\n        currentStep: 1,\n        leadTimezone: null,\n      }).type\n    ).toBe('pause');\n\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: 't',\n        optedOut: false,\n        suppressed: true,\n        suppressionLookupFailed: false,\n        steps,\n        currentStep: 1,\n        leadTimezone: null,\n      }).type\n    ).toBe('pause');\n\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: 't',\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: true,\n        steps,\n        currentStep: 1,\n        leadTimezone: null,\n      })\n    ).toMatchObject({ type: 'release_fail', reason: 'suppression_lookup_failed' });\n  });\n\n  it('release_fail on no steps / missing step', () => {\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: 't',\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: false,\n        steps: [],\n        currentStep: 1,\n        leadTimezone: null,\n      })\n    ).toMatchObject({ reason: 'no_steps' });\n\n    expect(\n      planCampaignSendPre({\n        enrollmentFound: true,\n        claimToken: 't',\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: false,\n        steps,\n        currentStep: 99,\n        leadTimezone: null,\n      })\n    ).toMatchObject({ reason: 'step_missing' });\n  });\n\n  it('send plan: skipRecoveryGate only for delay-0 first step', () => {\n    const first = planCampaignSendPre({\n      enrollmentFound: true,\n      claimToken: 't',\n      optedOut: false,\n      suppressed: false,\n      suppressionLookupFailed: false,\n      steps,\n      currentStep: 1,\n      leadTimezone: 'America/New_York',\n    });\n    expect(first.type).toBe('send');\n    if (first.type === 'send') {\n      expect(first.skipRecoveryGate).toBe(false); // delay 0 first step → gate ON\n      expect(first.templateKey).toBe('a');\n      expect(first.leadTimezone).toBe('America/New_York');\n    }\n\n    const second = planCampaignSendPre({\n      enrollmentFound: true,\n      claimToken: 't',\n      optedOut: false,\n      suppressed: false,\n      suppressionLookupFailed: false,\n      steps,\n      currentStep: 2,\n      leadTimezone: null,\n    });\n    expect(second.type).toBe('send');\n    if (second.type === 'send') {\n      expect(second.skipRecoveryGate).toBe(true);\n      expect(second.templateKey).toBe('b');\n    }\n  });\n});\n\ndescribe('planCampaignSendPost', () => {\n  it('maps sent → advance success; needs_review → terminal fail', () => {\n    expect(\n      planCampaignSendPost(\n        {\n          kind: 'sent',\n          sid: 's',\n          messageId: 'm',\n          providerStatus: 'queued',\n          keySupportedAtSend: true,\n        },\n        'park'\n      )\n    ).toMatchObject({ type: 'advance', success: true });\n\n    expect(\n      planCampaignSendPost(\n        { kind: 'needs_review', sid: 's', reason: 'x' },\n        'park'\n      )\n    ).toMatchObject({ type: 'needs_review_terminal', success: false });\n  });\n});\n\ndescribe('campaign-send-plan coalescers + effects', () => {\n  it('resolveClaimToken prefers arg over enrollment (|| not &&)', () => {\n    expect(resolveClaimToken('a', 'b')).toBe('a');\n    expect(resolveClaimToken(undefined, 'b')).toBe('b');\n    expect(resolveClaimToken(undefined, null)).toBeNull();\n    expect(resolveClaimToken('', 'b')).toBe('b');\n  });\n\n  it('stepsForSendPlan empties on error; coalesces null', () => {\n    expect(stepsForSendPlan([{ step_number: 1 }], null)).toEqual([\n      { step_number: 1 },\n    ]);\n    expect(stepsForSendPlan([{ step_number: 1 }], { x: 1 })).toEqual([]);\n    expect(stepsForSendPlan(null, null)).toEqual([]);\n    // ArrayDeclaration filler must not appear\n    expect(stepsForSendPlan(undefined, null)).toEqual([]);\n  });\n\n  it('coalesce helpers', () => {\n    expect(coalesceCurrentStep(undefined)).toBe(-1);\n    expect(coalesceCurrentStep(3)).toBe(3);\n    expect(coalesceLeadTimezone(undefined)).toBeNull();\n    expect(coalesceLeadTimezone('America/Chicago')).toBe('America/Chicago');\n    expect(coalesceIssue(null)).toBe('');\n    expect(coalesceIssue('leak')).toBe('leak');\n    expect(coalesceIssue('')).toBe('');\n  });\n\n  it('shouldCheckSuppression is AND (not OR)', () => {\n    expect(shouldCheckSuppression({ id: 1 }, { id: 2 })).toBe(true);\n    expect(shouldCheckSuppression(null, { id: 2 })).toBe(false);\n    expect(shouldCheckSuppression({ id: 1 }, null)).toBe(false);\n  });\n\n  it('planCampaignSendEffects covers every dispatch type', () => {\n    expect(\n      planCampaignSendEffects({ type: 'advance', success: true }, 2).effects\n    ).toEqual([{ op: 'advance', stepNumber: 2 }]);\n    expect(\n      planCampaignSendEffects(\n        { type: 'release', success: false, nextSendAt: 't', ok: false },\n        1\n      ).effects\n    ).toEqual([{ op: 'release', nextSendAt: 't' }]);\n    expect(\n      planCampaignSendEffects(\n        { type: 'flag_unresolved_tz', success: false, nextSendAt: 't' },\n        1\n      ).effects[0].op\n    ).toBe('flag_unresolved_tz');\n    expect(\n      planCampaignSendEffects(\n        { type: 'park', success: false, nextSendAt: 't' },\n        1\n      ).effects[0].op\n    ).toBe('park');\n    expect(\n      planCampaignSendEffects({ type: 'pause_opt_out', success: true }, 1)\n        .effects\n    ).toEqual([{ op: 'pause_opt_out' }]);\n    expect(\n      planCampaignSendEffects(\n        { type: 'needs_review_terminal', success: false, reason: 'max' },\n        1\n      ).effects\n    ).toEqual([{ op: 'needs_review_terminal', reason: 'max' }]);\n    expect(\n      planCampaignSendEffects({ type: 'noop_false', success: false }, 1).effects\n    ).toEqual([{ op: 'noop_release' }]);\n  });\n});\n"},"src/services/campaign-cron-plan.test.ts":{"tests":[{"id":"599","name":"campaign-cron-plan > due counts bump independently (not -=)","location":{"start":{"column":3,"line":14}}},{"id":"600","name":"campaign-cron-plan > decideClaimTokenResult prefers due then stale; null otherwise","location":{"start":{"column":3,"line":22}}},{"id":"601","name":"campaign-cron-plan > staleClaimCutoffIso subtracts (not adds)","location":{"start":{"column":3,"line":62}}},{"id":"602","name":"campaign-cron-plan > noteExtraRequeue only increments on ok","location":{"start":{"column":3,"line":71}}},{"id":"603","name":"campaign-cron-plan > property: success/failure/skip are additive","location":{"start":{"column":3,"line":76}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  decideClaimTokenResult,\n  emptyDueCounts,\n  noteClaimSkip,\n  noteExtraRequeue,\n  noteSendFailure,\n  noteSendSuccess,\n  staleClaimCutoffIso,\n} from './campaign-cron-plan';\n\ndescribe('campaign-cron-plan', () => {\n  it('due counts bump independently (not -=)', () => {\n    let c = emptyDueCounts();\n    c = noteClaimSkip(c);\n    c = noteSendSuccess(c);\n    c = noteSendFailure(c);\n    expect(c).toEqual({ processed: 1, errors: 1, skipped: 1 });\n  });\n\n  it('decideClaimTokenResult prefers due then stale; null otherwise', () => {\n    expect(\n      decideClaimTokenResult({\n        dueError: false,\n        dueCount: 1,\n        staleError: true,\n        staleCount: 0,\n        token: 't',\n      })\n    ).toBe('t');\n    expect(\n      decideClaimTokenResult({\n        dueError: true,\n        dueCount: 0,\n        staleError: false,\n        staleCount: 1,\n        token: 't2',\n      })\n    ).toBe('t2');\n    expect(\n      decideClaimTokenResult({\n        dueError: false,\n        dueCount: 0,\n        staleError: false,\n        staleCount: 0,\n        token: 't',\n      })\n    ).toBeNull();\n    // dueError true even with dueCount>0 must fall through to stale\n    expect(\n      decideClaimTokenResult({\n        dueError: true,\n        dueCount: 5,\n        staleError: false,\n        staleCount: 1,\n        token: 'tok',\n      })\n    ).toBe('tok');\n  });\n\n  it('staleClaimCutoffIso subtracts (not adds)', () => {\n    expect(staleClaimCutoffIso(10_000, 3_000)).toBe(\n      new Date(7_000).toISOString()\n    );\n    expect(staleClaimCutoffIso(10_000, 3_000)).not.toBe(\n      new Date(13_000).toISOString()\n    );\n  });\n\n  it('noteExtraRequeue only increments on ok', () => {\n    expect(noteExtraRequeue(0, true)).toBe(1);\n    expect(noteExtraRequeue(3, false)).toBe(3);\n  });\n\n  it('property: success/failure/skip are additive', () => {\n    fc.assert(\n      fc.property(\n        fc.nat({ max: 10 }),\n        fc.nat({ max: 10 }),\n        fc.nat({ max: 10 }),\n        (s, e, k) => {\n          let c = emptyDueCounts();\n          for (let i = 0; i <"+" s; i++) c = noteSendSuccess(c);\n          for (let i = 0; i <"+" e; i++) c = noteSendFailure(c);\n          for (let i = 0; i <"+" k; i++) c = noteClaimSkip(c);\n          expect(c.processed).toBe(s);\n          expect(c.errors).toBe(e);\n          expect(c.skipped).toBe(k);\n        }\n      ),\n      { numRuns: 30 }\n    );\n  });\n});\n"},"src/services/opt-out.edges.test.ts":{"tests":[{"id":"604","name":"opt-out edge killers > empty / whitespace is not opt-out","location":{"start":{"column":3,"line":12}}},{"id":"605","name":"opt-out edge killers > service-talk STOP is ambiguous (needs review), never silent not_opt_out","location":{"start":{"column":3,"line":17}}},{"id":"606","name":"opt-out edge killers > plain service chatter falls through to not_opt_out object","location":{"start":{"column":3,"line":37}}},{"id":"607","name":"opt-out edge killers > foldConfusables maps Cyrillic te and dze","location":{"start":{"column":3,"line":47}}},{"id":"608","name":"opt-out edge killers > compact removes spaces","location":{"start":{"column":3,"line":52}}},{"id":"609","name":"opt-out edge killers > backfill tokens include STOP and STOPSTOP","location":{"start":{"column":3,"line":57}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  classifyOptOut,\n  compactOptOutText,\n  foldConfusables,\n  isDefiniteOptOut,\n  normalizeOptOutText,\n  optOutBackfillTokens,\n} from './opt-out';\n\ndescribe('opt-out edge killers', () => {\n  it('empty / whitespace is not opt-out', () => {\n    expect(classifyOptOut('')).toEqual({ kind: 'not_opt_out' });\n    expect(classifyOptOut('   ')).toEqual({ kind: 'not_opt_out' });\n  });\n\n  it('service-talk STOP is ambiguous (needs review), never silent not_opt_out', () => {\n    expect(classifyOptOut(\"won't stop leaking\")).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n    expect(classifyOptOut(\"doesn't stop dripping\")).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n    expect(classifyOptOut('stop by the office')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sen
