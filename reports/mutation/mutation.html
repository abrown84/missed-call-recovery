BLE.leads)\n      .select(COL.id)\n      .eq(COL.businessId, business.id)\n      .eq(COL.callerPhone, phoneForLookup)\n      .order(COL.createdAt, { ascending: false })\n      .limit(1)\n      .maybeSingle();\n\n    const { data: rawLead } =\n      anyLead || phoneForLookup === event.from\n        ? { data: anyLead }\n        : await supabase\n            .from(TABLE.leads)\n            .select(COL.id)\n            .eq(COL.businessId, business.id)\n            .eq(COL.callerPhone, event.from)\n            .order(COL.createdAt, { ascending: false })\n            .limit(1)\n            .maybeSingle();\n\n    const leadId = anyLead?.id || rawLead?.id;\n\n    if (fromE164) {\n      await deps.suppressPhoneForBusiness(\n        business.id,\n        fromE164,\n        OPT_OUT_SUPPRESS_REASON\n      );\n    }\n\n    if (leadId) {\n      await deps.markLeadOptedOut(leadId).catch((err) => {\n        // Stryker disable StringLiteral,CallExpression,BlockStatement: log-only (no control flow)\n        console.error(\n          'Failed to mark lead opted out:',\n          err instanceof Error ? err.message : 'unknown'\n        );\n        // Stryker restore StringLiteral,CallExpression,BlockStatement\n      });\n      await deps.pauseCampaignForLead(leadId).catch(() => undefined);\n      await supabase.from(TABLE.smsMessages).insert({\n        [COL.leadId]: leadId,\n        [COL.direction]: DIRECTION_INBOUND,\n        [COL.body]: body,\n        [COL.messageSid]: messageId,\n        [COL.status]: SMS_STATUS.received,\n      });\n      return {\n        status: 'opt_out_recorded',\n        leadId,\n      };\n    }\n\n    return { status: 'opt_out_recorded' };\n  }\n\n  if (optOutVerdict.kind === 'ambiguous') {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.warn(\n      `Ambiguous opt-out language from ${deps.redactPhone(event.from)}: needs_human_review`\n    );\n    // Stryker restore StringLiteral,CallExpression\n    const { data: anyLead } = await supabase\n      .from(TABLE.leads)\n      .select(COL.id)\n      .eq(COL.businessId, business.id)\n      .eq(COL.callerPhone, phoneForLookup)\n      .order(COL.createdAt, { ascending: false })\n      .limit(1)\n      .maybeSingle();\n\n    if (anyLead?.id) {\n      await supabase\n        .from(TABLE.leads)\n        .update({\n          [COL.needsHumanReview]: true,\n          [COL.needsHumanReviewAt]: deps.clock().toISOString(),\n          [COL.needsHumanReviewReason]: optOutVerdict.reason,\n          [COL.updatedAt]: deps.clock().toISOString(),\n        })\n        .eq(COL.id, anyLead.id);\n      await supabase.from(TABLE.smsMessages).insert({\n        [COL.leadId]: anyLead.id,\n        [COL.direction]: DIRECTION_INBOUND,\n        [COL.body]: body,\n        [COL.messageSid]: messageId,\n        [COL.status]: SMS_STATUS.received,\n      });\n      return { status: 'ambiguous_opt_out', leadId: anyLead.id };\n    }\n    return { status: 'ambiguous_opt_out' };\n  }\n\n  if (!fromE164) {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error('Invalid sender phone for inbound:', deps.redactPhone(event.from));\n    // Stryker restore StringLiteral,CallExpression\n    return { status: 'no_lead_found' };\n  }\n\n  const cutoff = new Date(\n    deps.clock().getTime() - LEAD_LOOKUP_MAX_AGE_DAYS * 24 * 60 * 60 * 1000\n  ).toISOString();\n\n  const { data: pendingLead } = await supabase\n    .from(TABLE.leads)\n    .select('*')\n    .eq(COL.businessId, business.id)\n    .eq(COL.callerPhone, fromE164)\n    .eq(COL.status, LEAD_STATUS.pending)\n    .gte(COL.createdAt, cutoff)\n    .order(COL.createdAt, { ascending: false })\n    .limit(1)\n    .maybeSingle();\n\n  let lead: Lead | null = pendingLead;\n\n  if (!lead) {\n    const { data: openLead } = await supabase\n      .from(TABLE.leads)\n      .select('*')\n      .eq(COL.businessId, business.id)\n      .eq(COL.callerPhone, fromE164)\n      .in(COL.status, [...OPEN_L ockStatement: log-only (no control flow)\n      console.error(\n        'Enrollment handling failed:',\n        err instanceof Error ? err.message : 'unknown'\n      );\n      // Stryker restore StringLiteral,CallExpression,BlockStatement\n      return { action: 'error', campaignName: undefined as string | undefined };\n    });\n\n  if (\n    classification.urgency === 'emergency' ||\n    classification.urgency === 'high'\n  ) {\n    await deps.escalateLead(lead.id, business, classification);\n  }\n\n  return {\n    status: 'processed',\n    leadId: lead.id,\n    urgency: classification.urgency,\n    enrollmentAction: enrollment.action,\n    enrolledCampaign: enrollment.campaignName,\n  };\n}\n\nexport function resolveBusinessPhone(\n  payloadTo: string | undefined | null\n): string | null {\n  const fromPayload = payloadTo?.trim();\n  if (fromPayload) return fromPayload;\n  const fromEnv = process.env[ENV_BRWN_DEFAULT_BUSINESS_PHONE]?.trim();\n  return fromEnv || null;\n}\n\nexport class InboundError extends Error {\n  constructor(\n    message: string,\n    readonly status: number\n  ) {\n    super(message);\n    this.name = 'InboundError';\n  }\n}\n"},"src/services/missed-call.ts":{"language":"typescript","mutants":[{"id":"174","mutatorName":"CallExpression","replacement":";","statusReason":"log-only (no control flow)","status":"Ignored","static":false,"location":{"end":{"column":7,"line":52},"start":{"column":5,"line":49}}},{"id":"175","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"log-only (no control flow)","status":"Ignored","static":false,"location":{"end":{"column":39,"line":50},"start":{"column":7,"line":50}}},{"id":"193","mutatorName":"CallExpression","replacement":";","statusReason":"log-only (no control flow)","status":"Ignored","static":false,"location":{"end":{"column":71,"line":87},"start":{"column":5,"line":87}}},{"id":"194","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"log-only (no control flow)","status":"I edCallId: string;\n  leadId: string;\n}\n\nexport type { MissedCallDeps };\nexport { defaultMissedCallDeps };\n\nexport async function processMissedCall(\n  event: MissedCallEvent\n): Promise<"+"MissedCallResult> {\n  return processMissedCallWithDeps(defaultMissedCallDeps(), event);\n}\n\nexport async function processMissedCallWithDeps(\n  deps: MissedCallDeps,\n  event: MissedCallEvent\n): Promise<"+"MissedCallResult> {\n  const supabase = deps.db();\n\n  const { data: business, error: bizError } = await supabase\n    .from(TABLE.businesses)\n    .select('*')\n    .eq(COL.phone, event.businessPhone)\n    .single();\n\n  if (bizError || !business) {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error(\n      'Business not found for number:',\n      deps.redactPhone(event.businessPhone)\n    );\n    // Stryker restore StringLiteral,CallExpression\n    throw new MissedCallError('Business not found', 404);\n  }\n\n  const { data: missedCall, error: callError } = await supabase\n    .from(TABLE.missedCalls)\n    .insert({\n      [COL.businessId]: business.id,\n      [COL.callerPhone]: event.callerPhone,\n      [COL.ringDuration]: event.ringDurationSeconds ?? 0,\n      [COL.callSid]: event.callId,\n    })\n    .select()\n    .single();\n\n  if (callError) {\n    if (callError.code === PG_UNIQUE) {\n      const { data: existing } = await supabase\n        .from(TABLE.missedCalls)\n        .select(COL.id)\n        .eq(COL.callSid, event.callId)\n        .single();\n      const { data: existingLead } = existing\n        ? await supabase\n            .from(TABLE.leads)\n            .select(COL.id)\n            .eq(COL.missedCallId, existing.id)\n            .single()\n        : { data: null };\n      if (existing && existingLead) {\n        return { missedCallId: existing.id, leadId: existingLead.id };\n      }\n    }\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error('Failed to record missed call:', callError.message);\n    // Stryker restore StringLiteral,CallExpression\n    throw new MissedCallError('Failed to record call', 500);\n  }\n\n  const callerE164 = deps.normalizeToE164(event.callerPhone);\n\n  let suppressed = false;\n  try {\n    suppressed = await deps.isPhoneSuppressed(business.id, callerE164);\n  } catch (err) {\n    if (err instanceof deps.SuppressionLookupError) {\n      // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n      console.error('Suppression check failed closed on missed call');\n      // Stryker restore StringLiteral,CallExpression\n      suppressed = true;\n    } else {\n      throw err;\n    }\n  }\n\n  const { data: lead, error: leadError } = await supabase\n    .from(TABLE.leads)\n    .insert({\n      [COL.businessId]: business.id,\n      [COL.missedCallId]: missedCall.id,\n      [COL.callerPhone]: callerE164,\n      [COL.status]: suppressed ? LEAD_STATUS.spam : LEAD_STATUS.pending,\n      [COL.optedOut]: suppressed,\n      [COL.optedOutAt]: suppressed ? deps.clock().toISOString() : null,\n    })\n    .select()\n    .single();\n\n  if (leadError) {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error('Failed to create lead:', leadError.message);\n    // Stryker restore StringLiteral,CallExpression\n    throw new MissedCallError('Failed to create lead', 500);\n  }\n\n  if (suppressed) {\n    // Stryker disable StringLiteral,CallExpression,BlockStatement: log-only (no control flow)\n    console.log(\n      `Skipping recovery SMS; phone suppressed: ${deps.redactPhone(callerE164)}`\n    );\n    // Stryker restore StringLiteral,CallExpression,BlockStatement\n    return { missedCallId: missedCall.id, leadId: lead.id };\n  }\n\n  // Stryker disable BlockStatement: empty catch is intentional — recovery failure must not block enroll attempt\n  try {\n    await deps.sendRecoverySMS(lead.id, business, callerE164);\n  } catch (err) {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error(\n      'SMS send failed:',\n      err instanceof Error ? err.message : 'unknown'\n    );\n    // Stryker restore StringLiteral,CallExpression\n  }\n  // Stryker restore BlockStatement\n\n  // Stryker disable BlockStatement: empty catch is intentional — enroll failure must not fail webhook\n  try {\n    await deps.enrollLeadInCampaign(lead.id);\n  } catch (err) {\n    // Stryker disable StringLiteral,CallExpression: log-only (no control flow)\n    console.error(\n      'Enrollment failed:',\n      err instanceof Error ? err.message : 'unknown'\n    );\n    // Stryker restore StringLiteral,CallExpression\n  }\n  // Stryker restore BlockStatement\n\n  return { missedCallId: missedCall.id, leadId: lead.id };\n}\n\nexport class MissedCallError extends Error {\n  constructor(\n    message: string,\n    readonly status: number\n  ) {\n    super(message);\n    this.name = 'MissedCallError';\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":90,"low":60,"break":null},"testFiles":{"src/services/send/invariants.property.test.ts":{"tests":[{"id":"0","name":"QC r6 invariants (real send path) > invariant: never two relay texts for the same recovery sid","location":{"start":{"column":3,"line":323}}},{"id":"1","name":"QC r6 invariants (real send path) > invariant: quiet hours never send; deferred row is persisted with next_retry_at","location":{"start":{"column":3,"line":357}}},{"id":"2","name":"QC r6 invariants (real send path) > P0: deferred recovery is actually sent when quiet window opens","location":{"start":{"column":3,"line":397}}},{"id":"3","name":"QC r6 invariants (real send path) > invariant: any STOP keyword (contains) is opt_out or ambiguous — never not_opt_out","location":{"start":{"column":3,"line":435}}},{"id":"4","name":"QC r6 invariants (real send path) > invariant: unknown/failed statuses never confirm a resend path","location":{"start":{"column":3,"line":459}}},{"id":"5      sent_at: new Date(store.nowMs).toISOString(),\n              reconcile_attempts: row.reconcile_attempts ?? 0,\n              key_supported_at_send: row.key_supported_at_send ?? false,\n              next_retry_at: row.next_retry_at ?? null,\n            };\n            store.sms.push(full);\n            return chain({ data: full, error: null });\n          },\n          update: (patch: Partial<"+"SmsRow>) => {\n            const filters: Array<"+"(r: SmsRow) => boolean> = [];\n            const api: Record<"+"string, any> = {\n              eq: (col: string, val: string) => {\n                filters.push((r) => (r as any)[col] === val);\n                return api;\n              },\n              then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) => {\n                const matched = store.sms.filter((r) => filters.every((f) => f(r)));\n                for (const r of matched) Object.assign(r, patch);\n                return Promise.resolve({ data: matched, error: null }).then(\n                  resolve,\n                  reject\n                );\n              },\n            };\n            api.select = () => api;\n            api.maybeSingle = async () => {\n              const matched = store.sms.filter((r) => filters.every((f) => f(r)));\n              for (const r of matched) Object.assign(r, patch);\n              return { data: matched[0] ?? null, error: null };\n            };\n            return api;\n          },\n          select: (_cols?: string) => {\n            const filters: Array<"+"(r: SmsRow) => boolean> = [];\n            const api: Record<"+"string, any> = {\n              eq: (col: string, val: string) => {\n                filters.push((r) => (r as any)[col] === val);\n                return api;\n              },\n              in: (col: string, vals: string[]) => {\n                filters.push((r) => vals.includes((r as any)[col]));\n                return api;\n              },\n              or: () => api,\n              lte: (col: string, val: string) => {\n                filters.push((r) => {\n                  const v = (r as any)[col];\n                  return v == null || String(v) <"+"= val;\n                });\n                return api;\n              },\n              order: () => api,\n              limit: () => api,\n              maybeSingle: async () => {\n                const matched = store.sms.filter((r) => filters.every((f) => f(r)));\n                return { data: matched[0] ?? null, error: null };\n              },\n              then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) => {\n                const matched = store.sms.filter((r) => filters.every((f) => f(r)));\n                return Promise.resolve({ data: matched, error: null }).then(\n                  resolve,\n                  reject\n                );\n              },\n            };\n            return api;\n          },\n          upsert: (row: Partial<"+"SmsRow>) => {\n            const existing = store.sms.find(\n              (s) => s.message_sid === row.message_sid\n            );\n            if (existing) {\n              Object.assign(existing, row);\n              return chain({ data: existing, error: null });\n            }\n            const full: SmsRow = {\n              id: `sms-${store.sms.length + 1}`,\n              lead_id: String(row.lead_id),\n              direction: String(row.direction ?? 'outbound'),\n              body: String(row.body ?? ''),\n              message_sid: String(row.message_sid),\n              status: String(row.status ?? 'deferred'),\n              sent_at: new Date(store.nowMs).toISOString(),\n              reconcile_attempts: 0,\n              key_supported_at_send: false,\n              next_retry_at: row.next_retry_at ?? null,\n            };\n            store.sms.push(full);\n            return chain({ data: full, error: null });\n          },\n        };\n      }\n      return chain({ data: null, error: null });\n    },\n  }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'invariant-relay',\n    sendMessage: async (input: {\n      to: string;\n      body: string;\n      idempotencyKey?: string;\n    }) => {\n      store.relaySends.push(input);\n      return {\n        id: `relay-${store.relaySends.length}`,\n        status: 'queued',\n        keyEchoed: Boolean(input.idempotencyKey),\n      };\n    },\n    lookupByIdempotencyKey: async (key: string) => {\n      const hit = store.relaySends.find((s) => s.idempotencyKey === key);\n      if (!hit) return { outcome: 'never_sent', found: false };\n      return {\n        outcome: 'sent',\n        found: true,\n        id: 'lookup',\n        status: 'queued',\n      };\n    },\n    checkLookupSupport: async () => ({\n      supported: true,\n      capabilities: { idempotency: true, version: '1.7.6' },\n    }),\n  }),\n}));\n\nvi.mock('@/lib/messaging/brwn-relay', () => ({\n  ensureRelayKeySupportProbed: vi.fn(async () => {\n    const { markRelayKeySupportConfirmed } = await import('@/services/sms-sid');\n    markRelayKeySupportConfirmed();\n    return true;\n  }),\n  warnIfRelayLookupUnsupported: vi.fn(async () => ({\n    supported: true,\n    capabilities: { idempotency: true },\n  })),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: async (_biz: string, phone: string) =>\n    store.suppressions.has(phone),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/quiet-hours', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/quiet-hours')>(\n    '@/services/quiet-hours'\n  );\n  return {\n    ...actual,\n    // Controllable via store.forceQuiet — when false, force OPEN so wall-clock\n    // quiet hours cannot flake the \"window opened → send\" invariant.\n    deferUntilQuietHoursOpen: (now: Date, opts: unknown) => {\n      if ((store as { forceQuiet?: boolean }).forceQuiet) {\n        return {\n          allowed: false,\n          nextSendAt: new Date(store.nowMs + 8 * 3600_000),\n          zones: ['America/New_York'],\n          endHour: 21,\n        };\n      }\n      if ((store as { forceQuiet?: boolean }).forceQuiet === false) {\n        return {\n          allowed: true,\n          zones: ['America/New_York'],\n          endHour: 21,\n        };\n      }\n      return actual.deferUntilQuietHoursOpen(now, opts as never);\n    },\n  };\n});\n\nimport {\n  sendMessage,\n  reconcileOne,\n  parkDelayMs,\n  isFailedStatus,\n  isConfirmedStatus,\n  resetRelayKeySupportConfirmed,\n  markRelayKeySupportConfirmed,\n} from './index';\nimport { PARK_BASE_MS, PARK_MAX_MS } from './machine';\nimport { classifyOptOut } from '@/services/opt-out';\nimport { persistDeferredRecovery, sendRecoverySMS } from '@/services/sms';\n\ndescribe('QC r6 invariants (real send path)', () => {\n  beforeEach(() => {\n    resetStore();\n    delete (store as { forceQuiet?: boolean }).forceQuiet;\n    resetRelayKeySupportConfirmed();\n    markRelayKeySupportConfirmed();\n    process.env.SENDS_ENABLED = 'true';\n    store.leads.push({\n      id: 'L1',\n      business_id: 'B1',\n      opted_out: false,\n      timezone: 'America/New_York',\n      sms_outbound_sid: null,\n      caller_phone: '+12125550100',\n    });\n  });\n\n  afterEach(() => {\n    delete process.env.SENDS_ENABLED;\n  });\n\n  it('invariant: never two relay texts for the same recovery sid', async () => {\n    await fc.assert(\n      fc.asyncProperty(fc.integer({ min: 1, max: 5 }), async (n) => {\n        resetStore();\n        markRelayKeySupportConfirmed();\n        store.leads.push({\n          id: 'L1',\n          business_id: 'B1',\n          opted_out: false,\n          timezone: 'America/New_York',\n          sms_outbound_sid: null,\n          caller_phone: '+12125550100',\n        });\n        const sid = recoveryMessageSid('L1');\n        for (let i = 0; i <"+" n; i++) {\n          await sendMessage({\n            kind: 'recovery',\n            leadId: 'L1',\n            businessId: 'B1',\n            to: '+12125550100',\n            body: 'hi',\n            idempotencyKey: sid,\n            skipQuietHours: true,\n          });\n        }\n        const relayForSid = store.relaySends.filter(\n          (s) => s.idempotencyKey === sid\n        );\n        expect(relayForSid.length).toBeLessThanOrEqual(1);\n      }),\n      { numRuns: 20 }\n    );\n  });\n\n  it('invariant: quiet hours never send; deferred row is persisted with next_retry_at', async () => {\n    (store as { forceQuiet?: boolean }).forceQuiet = true;\n    const outcome = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'recovery body',\n      idempotencyKey: recoveryMessageSid('L1'),\n      // skipQuietHours intentionally false\n    });\n    expect(outcome.kind).toBe('blocked');\n    if (outcome.kind === 'blocked') {\n      expect(outcome.reason).toBe('quiet_hours_deferred');\n      expect(outcome.nextSendAt).toBeTruthy();\n    }\n    expect(store.relaySends).toHaveLength(0);\n\n    // sendRecoverySMS must persist — not drop\n    const biz = {\n      id: 'B1',\n      name: 'Acme',\n      phone: '+12125550999',\n      vertical: 'plumbing',\n      timezone: 'America/New_York',\n      business_hours_start: '08:00',\n      business_hours_end: '17:00',\n      after_hours_enabled: true,\n      emergency_phone: null,\n      settings: {},\n      created_at: '',\n      updated_at: '',\n    };\n    await sendRecoverySMS('L1', biz as never, '+12125550100');\n    const deferred = store.sms.filter((s) => s.status === 'deferred');\n    expect(deferred.length).toBeGreaterThanOrEqual(1);\n    expect(deferred[0].next_retry_at).toBeTruthy();\n    expect(store.relaySends).toHaveLength(0);\n  });\n\n  it('P0: deferred recovery is actually sent when quiet window opens', async () => {\n    const biz = {\n      id: 'B1',\n      name: 'Acme',\n      phone: '+12125550999',\n      vertical: 'plumbing',\n      timezone: 'America/New_York',\n      business_hours_start: '08:00',\n      business_hours_end: '17:00',\n      after_hours_enabled: true,\n      emergency_phone: null,\n      settings: {},\n      created_at: '',\n      updated_at: '',\n    };\n    (store as { forceQuiet?: boolean }).forceQuiet = true;\n    await sendRecoverySMS('L1', biz as never, '+12125550100');\n    expect(store.relaySends).toHaveLength(0);\n    const deferred = store.sms.find((s) => s.status === 'deferred');\n    expect(deferred).toBeTruthy();\n    // Window opens: due now\n    deferred!.next_retry_at = new Date(store.nowMs - 60_000).toISOString();\n    (store as { forceQuiet?: boolean }).forceQuiet = false;\n\n    const sid = recoveryMessageSid('L1');\n    const outcome = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: deferred!.body || 'recovery body',\n      idempotencyKey: sid,\n    });\n    expect(outcome.kind).toBe('sent');\n    expect(store.relaySends.length).toBe(1);\n    expect(store.relaySends[0].idempotencyKey).toBe(sid);\n  });\n\n  it('invariant: any STOP keyword (contains) is opt_out or ambiguous — never not_opt_out', () => {\n    const probes = [\n      'stop texting',\n      'stop pls',\n      'dont text me',\n      'Unsubscribe me please',\n      'STOP\\nSent from my iPhone',\n      'Stop.  Thanks',\n      'Stop all texts',\n      'Stop sending',\n      'take me off your list',\n      'do not contact me',\n      'STOP STOP STOP',\n      'S T O P please',\n    ];\n    for (const p of probes) {\n      const v = classifyOptOut(p);\n      expect(\n        v.kind === 'opt_out' || v.kind === 'ambiguous',\n        `${p} → ${v.kind}`\n      ).toBe(true);\n    }\n  });\n\n  it('invariant: unknown/failed statuses never confirm a resend path', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(\n          'unknown',\n          'pending',\n          'maintenance',\n          'Sent',\n          'DELIVERED',\n          'undelivered',\n          'rejected',\n          'error',\n          'FAILED',\n          'queued'\n        ),\n        (status) => {\n          const failed = isFailedStatus(status);\n          const confirmed = isConfirmedStatus(status);\n          // Mutual exclusion except empty\n          if (failed) expect(confirmed).toBe(false);\n          // Case-insensitive confirmed\n          if (status.toLowerCase() === 'delivered' || status.toLowerCase() === 'queued') {\n            expect(confirmed).toBe(true);\n          }\n          if (\n            ['undelivered', 'rejected', 'error', 'failed'].includes(\n              status.toLowerCase()\n            )\n          ) {\n            expect(failed).toBe(true);\n          }\n          // Odd non-terminal on lookup must not be \"confirmed\" for advance\n          if (['unknown', 'pending', 'maintenance'].includes(status.toLowerCase())) {\n            expect(confirmed).toBe(false);\n            expect(failed).toBe(false);\n          }\n        }\n      ),\n      { numRuns: 40 }\n    );\n  });\n\n  it('invariant: backoff delay persists and grows toward ~2.5h cap path', () => {\n    // 5min * (1+2+4+8+16) = 155 min ≈ 2.58h before 5th park → needs_review\n    let total = 0;\n    for (let a = 0; a <"+" MAX_ATTEMPTS_FOR_BACKOFF; a++) {\n      const d = parkDelayMs(a);\n      expect(d).toBeGreaterThanOrEqual(PARK_BASE_MS);\n      expect(d).toBeLessThanOrEqual(PARK_MAX_MS);\n      total += d;\n    }\n    expect(total).toBeGreaterThanOrEqual(2.5 * 60 * 60 * 1000 - 60_000);\n  });\n\n  it('invariant: reconcile parks write next_retry_at so backoff survives restarts', async () => {\n    store.sms.push({\n      id: 'sms-1',\n      lead_id: 'L1',\n      direction: 'outbound',\n      body: 'x',\n      message_sid: 'mlf:campaign:e1:c1:2',\n      status: 'unknown',\n      sent_at: new Date(store.nowMs).toISOString(),\n      reconcile_attempts: 1,\n      key_supported_at_send: true,\n      next_retry_at: null,\n    });\n    // Put a relay send so default lookup would be \"sent\"; we still want\n    // non-terminal status path. Use transition via machine for park persist:\n    const { transitionSend, parkNextAt } = await import('./machine');\n    const decision = transitionSend({\n      kind: 'lookup',\n      signal: { type: 'unknown' },\n      keySupportedAtSend: true,\n      attempts: 1,\n    });\n    expect(decision.action).toBe('park_ambiguous');\n    if (decision.action === 'park_ambiguous') {\n      const nextRetryAt = parkNextAt(decision.nextAttempts).toISOString();\n      store.sms[0].reconcile_attempts = decision.nextAttempts;\n      store.sms[0].next_retry_at = nextRetryAt;\n      expect(store.sms[0].next_retry_at).toBeTruthy();\n      expect(store.sms[0].reconcile_attempts).toBe(2);\n    }\n    // Also exercise reconcileOne with a throwing lookup → unknown\n    const result = await reconcileOne({\n      ...store.sms[0],\n      message_sid: 'mlf:missing-key-forces-catch',\n    });\n    // never_sent (no relay hit) or ambiguous both write attempts/backoff\n    expect(['ambiguous', 'never_sent', 'needs_review']).toContain(result.kind);\n  });\n});\n\nconst MAX_ATTEMPTS_FOR_BACKOFF = 5;\n\n// Ensure persistDeferredRecovery is importable (implemented in sms.ts)\nvoid persistDeferredRecovery;\n"},"src/services/inbound.di.test.ts":{"tests":[{"id":"7","name":"processInboundSmsWithDeps > throws when business is missing","location":{"start":{"column":3,"line":187}}},{"id":"8","name":"processInboundSmsWithDeps > records STOP without lead and suppresses E.164","location":{"start":{"column":3,"line":198}}},{"id":"9","name":"processInboundSmsWithDeps > STOP with lead pauses campaign and inserts inbound sms","location":{"start":{"column":3,"line":221}}},{"id":"10","name":"processInboundSmsWithDeps > STOP from bad phone skips suppress but still records","location":{"start":{"column":3,"line":241}}},{"id":"11","name":"processInboundSmsWithDeps > isOptOutMessage path without classifyOptOut","location":{"start":{"column":3,"line":257}}},{"id":"12","name":"processInboundSmsWithDeps > ambiguous opt-out flags lead and does NOT pause campaign","location":{"start":{"column":3,"line":269}}},{"id":"13","name":"processInboundSmsWithDeps > ambiguous opt-out without matching lead","location":{"start":{"column":3,"line":295}}},{"id":"14","name":"processInboundSmsWithDeps > returns no_lead_found for invalid sender on normal path","location":{"start":{"column":3,"line":310}}},{"id":"15","name":"processInboundSmsWithDeps > returns no_lead_found when no matching lead","location":{"start":{"column":3,"line":325}}},{"id":"16","name":"processInboundSmsWithDeps > returns no_lead_found when lead fails age check","location":{"start":{"column":3,"line":336}}},{"id":"17","name":"processInboundSmsWithDeps > finds open qualified lead when pending missing","location":{"start":{"column":3,"line":356}}},{"id":"18","name":"processInboundSmsWithDeps > uses legacy caller_phone when stored un-normalized","location":{"start":{"column":3,"line":380}}},{"id":"19","name":"processInboundSmsWithDeps > escalates emergency and high urgency","location":{"start":{"column":3,"line":407}}},{"id":"20","name":"processInboundSmsWithDeps > continues when enrollment throws","location":{"start":{"column":3,"line":449}}},{"id":"21","name":"processInboundSmsWithDeps > continues when markLeadOptedOut throws on STOP","location":{"start":{"column":3,"line":473}}},{"id":"22","name":"processInboundSmsWithDeps > escalates emergency urgency","location":{"start":{"column":3,"line":493}}},{"id":"23","name":"processInboundSmsWithDeps > still processes when lead update fails","location":{"start":{"column":3,"line":516}}},{"id":"24","name":"processInboundSmsWithDeps > STOP falls back to raw caller_phone lookup","location":{"start":{"column":3,"line":550}}},{"id":"25","name":"processInboundSmsWithDeps > generated message sid uses brwn-in prefix","location":{"start":{"column":3,"line":573}}},{"id":"26","name":"processInboundSmsWithDeps > skips legacy phone query when sender already E.164","location":{"start":{"column":3,"line":591}}},{"id":"27","name":"processInboundSmsWithDeps > uses cutoff based on LEAD_LOOKUP_MAX_AGE_DAYS","location":{"start":{"column":3,"line":625}}},{"id":"28","name":"processInboundSmsWithDeps > throws only when business row is missing (not on benign error flag)","location":{"start":{"column":3,"line":661}}},{"id":"29","name":"processInboundSmsWithDeps > truncates inbound body to 1600 chars in sms insert","location":{"start":{"column":3,"line":673}}},{"id":"30","name":"processInboundSmsWithDeps > writes expected lead/sms fields on normal process path","location":{"start":{"column":3,"line":688}}},{"id":"31","name":"processInboundSmsWithDeps > queries qualified/escalated when pending lead missing","location":{"start":{"column":3,"line":728}}},{"id":"32","name":"processInboundSmsWithDeps > does not escalate normal urgency","location":{"start":{"column":3,"line":754}}},{"id":"33","name":"processInboundSmsWithDeps > uses trimmed sender for STOP lookup when not E.164","location":{"start":{"column":3,"line":768}}},{"id":"34","name":"processInboundSmsWithDeps > stores ambiguous reason on lead flag","location":{"start":{"column":3,"line":790}}},{"id":"35","name":"resolveBusinessPhone > prefers payload then env","location":{"start":{"column":3,"line":812}}},{"id":"36","name":"InboundError > carries status","location":{"start":{"column":3,"line":822}}}],"source":"/**\n * DI tests for processInboundSmsWithDeps — every branch without module mocks.\n */\nimport { describe, expect, it, vi } from 'vitest';\nimport {\n  InboundError,\n  processInboundSmsWithDeps,\n  resolveBusinessPhone,\n  type InboundSmsEvent,\n} from './inbound';\nimport type { InboundDeps } from './inbound-deps';\nimport { LEAD_LOOKUP_MAX_AGE_DAYS } from './campaign-logic';\nimport type { ClassificationResult } from '@/types';\nimport type { SupabaseClient } from './inbound-deps';\n\nconst FIXED = new Date('2026-10-28T12:00:00.000Z');\nconst BIZ = {\n  id: 'biz-1',\n  phone: '+15559999999',\n  name: 'Acme',\n  vertical: 'plumbing',\n};\n\ntype QueryResult = { data: unknown; error: unknown };\n\nfunction chain(result: QueryResult) {\n  const obj: Record<"+"string, unknown> = {};\n  const self = () => obj;\n  for (const m of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'in',\n    'gte',\n    'order',\n    'limit',\n  ]) {\n    obj[m] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n    Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\nfunction createDb(handlers: {\n  businesses?: QueryResult;\n  leads?: (ctx: { pass: number }) => QueryResult;\n  sms?: QueryResult;\n}) {\n  let leadPass = 0;\n  const inserts: unknown[] = [];\n  const updates: unknown[] = [];\n  const eqLog: Array<"+"{ table: string; col: string; val: unknown }> = [];\n  const inLog: Array<"+"{ table: string; col: string; vals: unknown }> = [];\n  const gteLog: Array<"+"{ table: string; col: string; val: unknown }> = [];\n  const fromLog: string[] = [];\n\n  const from = vi.fn((table: string) => {\n    fromLog.push(table);\n    if (table === 'businesses') {\n      return chain(handlers.businesses ?? { data: BIZ, error: null });\n    }\n    if (table === 'sms_messages') {\n      const c = chain(handlers.sms ?? { data: null, error: null });\n      c.insert = vi.fn((payload: unknown) => {\n        inserts.push(payload);\n        return c;\n      });\n      return c;\n    }\n    if (table === 'leads') {\n      leadPass += 1;\n      const pass = leadPass;\n      const res =\n        handlers.leads?.({ pass }) ?? { data: null, error: null };\n      const c = chain(res);\n      c.eq = vi.fn((col: string, val: unknown) => {\n        eqLog.push({ table, col, val });\n        return c;\n      });\n      c.in = vi.fn((col: string, vals: unknown) => {\n        inLog.push({ table, col, vals });\n        return c;\n      });\n      c.gte = vi.fn((col: string, val: unknown) => {\n        gteLog.push({ table, col, val });\n        return c;\n      });\n      c.update = vi.fn((payload: unknown) => {\n        updates.push(payload);\n        return c;\n      });\n      return c;\n    }\n    return chain({ data: null, error: null });\n  });\n\n  return {\n    from,\n    inserts,\n    updates,\n    eqLog,\n    inLog,\n    gteLog,\n    fromLog,\n    resetPass: () => {\n      leadPass = 0;\n    },\n  };\n}\n\nfunction baseEvent(over: Partial<"+"InboundSmsEvent> = {}): InboundSmsEvent {\n  return {\n    from: '+15551234567',\n    businessPhone: '+15559999999',\n    body: 'Need service tomorrow',\n    messageId: 'msg-fixed',\n    ...over,\n  };\n}\n\nfunction buildDeps(over: Partial<"+"InboundDeps> & { dbImpl?: ReturnType<"+"typeof createDb> }): {\n  deps: InboundDeps;\n  db: ReturnType<"+"typeof createDb>;\n  spies: {\n    classifyOptOut: ReturnType<"+"typeof vi.fn>;\n    isOptOutMessage: ReturnType<"+"typeof vi.fn>;\n    classifyUrgency: InboundDeps['classifyUrgency'];\n    escalateLead: ReturnType<"+"typeof vi.fn>;\n    handleClassifiedReplyEnrollment: ReturnType<"+"typeof vi.fn>;\n    pauseCampaignForLead: ReturnType<"+"typeof vi.fn>;\n    markLeadOptedOut: ReturnType<"+"typeof vi.fn>;\n    suppressPhoneForBusiness: ReturnType<"+"typeof vi.fn>;\n    tryNormalizeToE164: ReturnType<"+"typeof vi.fn>;\n    isLeadWithinLookupAge: ReturnType<"+"typeof vi.fn>;\n    redactPhone: InboundDeps['redactPhone'];\n  };\n} {\n  const db = over.dbImpl ?? createDb({});\n  const spies = {\n    classifyOptOut: vi.fn(() => ({ kind: 'not_opt_out' as const })),\n    isOptOutMessage: vi.fn(() => false),\n    classifyUrgency: vi.fn(async () => ({\n      urgency: 'normal' as const,\n      confidence: 0.5,\n      keywords: [],\n      issue: 'general',\n    })) as InboundDeps['classifyUrgency'],\n    escalateLead: vi.fn(async () => undefined),\n    handleClassifiedReplyEnrollment: vi.fn(async () => ({\n      action: 'noop',\n      campaignName: undefined,\n    })),\n    pauseCampaignForLead: vi.fn(async () => undefined),\n    markLeadOptedOut: vi.fn(async () => undefined),\n    suppressPhoneForBusiness: vi.fn(async () => undefined),\n    tryNormalizeToE164: vi.fn((p: string) =>\n      p.startsWith('+') ? p : null\n    ),\n    isLeadWithinLookupAge: vi.fn(() => true),\n    redactPhone: vi.fn((p: string | null | undefined) =>\n      `***${String(p).slice(-4)}`\n    ) as InboundDeps['redactPhone'],\n  };\n\n  const randomSuffix = vi.fn(() => 'abc12345');\n\n  const deps: InboundDeps = {\n    db: () => ({ from: db.from }) as unknown as SupabaseClient,\n    clock: () => FIXED,\n    randomSuffix,\n    ...spies,\n    ...over,\n  };\n  if (!over.randomSuffix) {\n    deps.randomSuffix = randomSuffix;\n  }\n\n  return { deps, db, spies };\n}\n\ndescribe('processInboundSmsWithDeps', () => {\n  it('throws when business is missing', async () => {\n    const db = createDb({\n      businesses: { data: null, error: { message: 'missing' } },\n    });\n    const { deps } = buildDeps({ dbImpl: db });\n\n    await expect(\n      processInboundSmsWithDeps(deps, baseEvent())\n    ).rejects.toMatchObject({ status: 404, name: 'InboundError' });\n  });\n\n  it('records STOP without lead and suppresses E.164', async () => {\n    const db = createDb({\n      leads: () => ({ data: null, error: null }),\n    });\n    const { deps, spies } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({ kind: 'opt_out' as const })),\n    });\n\n    const result = await processInboundSmsWithDeps(\n      deps,\n      baseEvent({ body: 'STOP' })\n    );\n\n    expect(result).toEqual({ status: 'opt_out_recorded' });\n    expect(spies.suppressPhoneForBusiness).toHaveBeenCalledWith(\n      'biz-1',\n      '+15551234567',\n      'opt_out'\n    );\n    expect(spies.pauseCampaignForLead).not.toHaveBeenCalled();\n  });\n\n  it('STOP with lead pauses campaign and inserts inbound sms', async () => {\n    const db = createDb({\n      leads: () => ({ data: { id: 'lead-stop' }, error: null }),\n    });\n    const { deps, spies } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({ kind: 'opt_out' as const })),\n    });\n\n    const result = await processInboundSmsWithDeps(\n      deps,\n      baseEvent({ body: 'STOP' })\n    );\n\n    expect(result).toEqual({ status: 'opt_out_recorded', leadId: 'lead-stop' });\n    expect(spies.markLeadOptedOut).toHaveBeenCalledWith('lead-stop');\n    expect(spies.pauseCampaignForLead).toHaveBeenCalledWith('lead-stop');\n    expect(db.inserts.length).toBe(1);\n  });\n\n  it('STOP from bad phone skips suppress but still records', async () => {\n    const db = createDb({ leads: () => ({ data: null, error: null }) });\n    const { deps, spies } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({ kind: 'opt_out' as const })),\n      tryNormalizeToE164: vi.fn(() => null),\n    });\n\n    await processInboundSmsWithDeps(\n      deps,\n      baseEvent({ from: 'not-a-phone', body: 'STOP' })\n    );\n\n    expect(spies.suppressPhoneForBusiness).not.toHaveBeenCalled();\n  });\n\n  it('isOptOutMessage path without classifyOptOut', async () => {\n    const db = createDb({ leads: () => ({ data: null, error: null }) });\n    const { deps, spies } = buildDeps({\n      dbImpl: db,\n      isOptOutMessage: vi.fn(() => true),\n    });\n\n    await processInboundSmsWithDeps(deps, baseEvent({ body: 'UNSUBSCRIBE' }));\n\n    expect(spies.suppressPhoneForBusiness).toHaveBeenCalled();\n  });\n\n  it('ambiguous opt-out flags lead and does NOT pause campaign', async () => {\n    const db = createDb({\n      leads: () => ({ data: { id: 'lead-amb' }, error: null }),\n    });\n    const { deps, spies } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({\n {\n    const lead = {\n      id: 'lead-n',\n      created_at: FIXED.toISOString(),\n      status: 'pending',\n    };\n    const db = createDb({ leads: () => ({ data: lead, error: null }) });\n    const { deps, spies } = buildDeps({ dbImpl: db });\n\n    await processInboundSmsWithDeps(deps, baseEvent());\n\n    expect(spies.escalateLead).not.toHaveBeenCalled();\n  });\n\n  it('uses trimmed sender for STOP lookup when not E.164', async () => {\n    const db = createDb({\n      leads: () => ({ data: { id: 'trim-lead' }, error: null }),\n    });\n    const { deps } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({ kind: 'opt_out' as const })),\n      tryNormalizeToE164: vi.fn(() => null),\n    });\n\n    await processInboundSmsWithDeps(\n      deps,\n      baseEvent({ from: '  5551234567  ', body: 'STOP' })\n    );\n\n    expect(db.eqLog).toContainEqual({\n      table: 'leads',\n      col: 'caller_phone',\n      val: '5551234567',\n    });\n  });\n\n  it('stores ambiguous reason on lead flag', async () => {\n    const db = createDb({\n      leads: () => ({ data: { id: 'amb' }, error: null }),\n    });\n    const { deps } = buildDeps({\n      dbImpl: db,\n      classifyOptOut: vi.fn(() => ({\n        kind: 'ambiguous' as const,\n        reason: 'stop_in_sentence',\n      })),\n    });\n\n    await processInboundSmsWithDeps(deps, baseEvent({ body: 'maybe stop' }));\n\n    expect(db.updates[0]).toMatchObject({\n      needs_human_review_reason: 'stop_in_sentence',\n      needs_human_review_at: FIXED.toISOString(),\n    });\n  });\n});\n\ndescribe('resolveBusinessPhone', () => {\n  it('prefers payload then env', () => {\n    expect(resolveBusinessPhone('+15550001111')).toBe('+15550001111');\n    expect(resolveBusinessPhone('  ')).toBe(null);\n    process.env.BRWN_DEFAULT_BUSINESS_PHONE = '+15550009999';\n    expect(resolveBusinessPhone(undefined)).toBe('+15550009999');\n    delete process.env.BRWN_DEFAULT_BUSINESS_PHONE;\n  });\n});\n\ndescribe('InboundError', () => {\n  it('carries status', () => {\n    const e = new InboundError('x', 404);\n    expect(e.status).toBe(404);\n    expect(e.name).toBe('InboundError');\n  });\n});\n"},"src/services/send/send.di.test.ts":{"tests":[{"id":"37","name":"sendMessageWithDeps > blocks when sends disabled","location":{"start":{"column":3,"line":207}}},{"id":"38","name":"sendMessageWithDeps > blocks invalid phone","location":{"start":{"column":3,"line":220}}},{"id":"39","name":"sendMessageWithDeps > suppressed / lookup_failed_closed / opted_out","location":{"start":{"column":3,"line":233}}},{"id":"40","name":"sendMessageWithDeps > recovery gate pending / resolved_sent / skip","location":{"start":{"column":3,"line":285}}},{"id":"41","name":"sendMessageWithDeps > quiet hours deferred / unresolved","location":{"start":{"column":3,"line":351}}},{"id":"42","name":"sendMessageWithDeps > duplicate sid: confirm / needs_review / claim_deferred / in_flight","location":{"start":{"column":3,"line":396}}},{"id":"43","name":"sendMessageWithDeps > relay ok / conflict / maintenance / failed / throw","location":{"start":{"column":3,"line":449}}},{"id":"44","name":"sendMessageWithDeps > manual/escalation skips customer gates and still sends","location":{"start":{"column":3,"line":523}}},{"id":"45","name":"sendMessageWithDeps > select uses opted_out, timezone, sms_outbound_sid","location":{"start":{"column":3,"line":546}}},{"id":"46","name":"reconcileOneWithDeps > resolved / never_sent / needs_review / park / disabled / no lookup","location":{"start":{"column":3,"line":594}}},{"id":"47","name":"resolveRecoveryOutcomeWithDeps > absent when no sid","location":{"start":{"column":3,"line":668}}},{"id":"48","name":"reconcileAmbiguousSmsWithDeps > counts unknown/sending and alerts","location":{"start":{"column":3,"line":681}}},{"id":"49","name":"reconcileAmbiguousSmsWithDeps > tallies never_sent / needs_review / ambiguous independently (+ recovery clear)","location":{"start":{"column":3,"line":725}}},{"id":"50","name":"reconcileAmbiguousSmsWithDeps > alert when unknown+sending reaches threshold (exactly >= 5)","location":{"start":{"column":3,"line":794}}},{"id":"51","name":"send I/O column/kind constants (survivor killers) > invalid phone reason uses SEND_REASON constant","location":{"start":{"column":3,"line":828}}},{"id":"52","name":"send I/O column/kind constants (survivor killers) > recovery path eq uses COL.id / COL.messageSid","location":{"start":{"column":3,"line":842}}},{"id":"53","name":"send I/O column/kind constants (survivor killers) > campaign confirm updates sms + skips lead outbound sid","location":{"start":{"column":3,"line":883}}},{"id":"54","name":"send I/O column/kind constants (survivor killers) > reconcileAmbiguousSms pulls RECONCILE_PULL_STATUSES via COL.status","location":{"start":{"column":3,"line":925}}},{"id":"55","name":"send I/O column/kind constants (survivor killers) > duplicate_in_flight reason constant + needs_review path","location":{"start":{"column":3,"line":950}}},{"id":"56","name":"send/index gate + dispatch survivor killers > manual never runs customer-facing gates (kind guard)","location":{"start":{"column":3,"line":982}}},{"id":"57","name":"send/index gate + dispatch survivor killers > recovery runs gates: suppressed=false stays false (not forced true)","location":{"start":{"column":3,"line":1001}}},{"id":"58","name":"send/index gate + dispatch survivor killers > campaign step 1 recovery gate vs step 2 / skipRecoveryGate","location":{"start":{"column":3,"line":1019}}},{"id":"59","name":"send/index gate + dispatch survivor killers > skipQuietHours true skips quietHours call","location":{"start":{"column":3,"line":1079}}},{"id":"60","name":"send/index gate + dispatch survivor killers > leadTimezone preference over lead row timezone","location":{"start":{"column":3,"line":1104}}},{"id":"61","name":"send/index gate + dispatch survivor killers > caps probe only when not already confirmed","location":{"start":{"column":3,"line":1134}}},{"id":"62","name":"send/index gate + dispatch survivor killers > recovery sent writes sms_outbound_sid; auto defaults true","location":{"start":{"column":3,"line":1192}}},{"id":"63","name":"send/index gate + dispatch survivor killers > auto:false is forwarded to adapter","location":{"start":{"column":3,"line":1231}}},{"id":"64","name":"send/index gate + dispatch survivor killers > invalid phone detail is non-empty","location":{"start":{"column":3,"line":1259}}},{"id":"65","name":"send/index gate + dispatch survivor killers > insertError non-unique throws with message","location":{"start":{"column":3,"line":1273}}},{"id":"66","name":"send/index gate + dispatch survivor killers > campaign needs_review updates sms only (not lead outbound)","location":{"start":{"column":3,"line":1290}}},{"id":"67","name":"send/index gate + dispatch survivor killers > resolveRecovery follows lead.sms_outbound_sid when recovery sid absent","location":{"start":{"column":3,"line":1330}}},{"id":"68","name":"send/index gate + dispatch survivor killers > manual kind skips sms_messages insert (kind guard)","location":{"start":{"column":3,"line":1347}}},{"id":"69","name":"send/index payload + hook survivor killers (r12) > duplicate confirm_existing returns keySupportedAtSend false","location":{"start":{"column":3,"line":1385}}},{"id":"70","name":"send/index payload + hook survivor killers (r12) > claim_deferred CAS: eq status=deferred then dispatch","location":{"start":{"column":3,"line":1408}}},{"id":"71","name":"send/index payload + hook survivor killers (r12) > claim_deferred CAS lost → duplicate_in_flight, no relay","location":{"start":{"column":3,"line":1457}}},{"id":"72","name":"send/index payload + hook survivor killers (r12) > suppression non-SuppressionLookupError rethrows","location":{"start":{"column":3,"line":1507}}},{"id":"73","name":"send/index payload + hook survivor killers (r12) > manual sent does not update sms_messages","location":{"start":{"column":3,"line":1528}}},{"id":"74","name":"send/index payload + hook survivor killers (r12) > recovery confirm writes lead outbound sid; campaign does not","location":{"start":{"column":3,"line":1557}}},{"id":"75","name":"send/index payload + hook survivor killers (r12) > relay throw parks sms with attempts + next_retry_at","location":{"start":{"column":3,"line":1608}}},{"id":"76","name":"send/index payload + hook survivor killers (r12) > unexpected_decision from transitionSend → needs_review","location":{"start":{"column":3,"line":1644}}},{"id":"77","name":"send/index payload + hook survivor killers (r12) > reconcileOne never_sent / needs_review / park payloads","location":{"start":{"column":3,"line":1690}}},{"id":"78","name":"send/index payload + hook survivor killers (r12) > lookup without outcome uses classifyRelayLookupResponse","location":{"start":{"column":3,"line":1783}}},{"id":"79","name":"send/index payload + hook survivor killers (r12) > reconcile unexpected_decision from transitionSend","location":{"start":{"column":3,"line":1810}}},{"id":"80","name":"send/index payload + hook survivor killers (r12) > warnLookupUnsupported called iff checkLookupSupport present","location":{"start":{"column":3,"line":1846}}},{"id":"81","name":"send/index payload + hook survivor killers (r12) > stuck cutoff uses now − STUCK_SENDING_MS and ascending order","location":{"start":{"column":3,"line":1883}}},{"id":"82","name":"send/index payload + hook survivor killers (r12) > null smsList rows does not throw; never_sent clears recovery only","location":{"start":{"column":3,"line":1916}}},{"id":"83","name":"send/index payload + hook survivor killers (r12) > resolveRecovery absent when lead has no sms_outbound_sid key","location":{"start":{"column":3,"line":2007}}}],"source":"/**\n * DI tests against sendMessageWithDeps / reconcileOneWithDeps — every gate and\n * relay branch, with recorded DB ops so StringLiteral select mutants die.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\nimport {\n  sendMessageWithDeps,\n  reconcileOneWithDeps,\n  reconcileAmbiguousSmsWithDeps,\n  resolveRecoveryOutcomeWithDeps,\n  type SendDeps,\n} from './index';\nimport { SuppressionLookupError } from '@/services/suppressions';\nimport { markRelayKeySupportConfirmed, resetRelayKeySupportConfirmed } from '@/services/sms-sid';\nimport {\n  COL,\n  KIND_CAMPAIGN,\n  KIND_RECOVERY,\n  RECONCILE_PULL_STATUSES,\n  SEND_REASON,\n  SMS_STATUS,\n  TABLE,\n} from '@/services/db-strings';\n\ntype Row = Record<"+"string, unknown>;\n\nfunction makeDb(state: {\n  leads?: Row | null;\n  smsBySid?: Map<"+"string, Row>;\n  insertError?: { code: string; message: string } | null;\n  smsList?: Row[];\n}) {\n  const calls: Array<"+"{ table: string; op: string; args: unknown[] }> = [];\n  const smsBySid = state.smsBySid ?? new Map();\n\n  function table(name: string) {\n    const ctx: {\n      filters: Record<"+"string, unknown>;\n      op: string;\n      payload?: unknown;\n      selectCols?: string;\n    } = { filters: {}, op: 'select' };\n\n    const api: Record<"+"string, unknown> = {};\n    const chain = () => api;\n\n    const asList = (): Record<"+"string, unknown> => {\n      const list: Record<"+"string, unknown> = { ...api };\n      list.then = (\n        resolve: (v: unknown) => unknown,\n        reject?: (e: unknown) => unknown\n      ) => {\n        if (name === 'sms_messages' && state.smsList) {\n          return Promise.resolve({\n            data: state.smsList,\n            error: null,\n          }).then(resolve, reject);\n        }\n        return Promise.resolve({ data: null, error: null }).then(\n          resolve,\n          reject\n        );\n      };\n      for (const m of [\n        'eq',\n        'lte',\n        'lt',\n        'is',\n        'or',\n        'in',\n        'order',\n        'limit',\n        'select',\n        'update',\n      ]) {\n        list[m] = api[m];\n      }\n      return list;\n    };\n\n    for (const m of [\n      'eq',\n      'lte',\n      'lt',\n      'is',\n      'or',\n      'in',\n      'order',\n      'limit',\n    ]) {\n      api[m] = (...args: unknown[]) => {\n        calls.push({ table: name, op: m, args });\n        if (m === 'eq' && args[0] === COL.messageSid) {\n          ctx.filters.message_sid = args[1];\n        }\n        if (m === 'eq' && args[0] === COL.id) {\n          ctx.filters.id = args[1];\n        }\n        if (m === 'eq' && args[0] === COL.status) {\n          ctx.filters.status = args[1];\n        }\n        if (m === 'in') ctx.filters.in = args;\n        return asList();\n      };\n    }\n\n    api.select = (cols?: string) => {\n      ctx.selectCols = cols;\n      calls.push({ table: name, op: 'select', args: [cols] });\n      ctx.op = 'select';\n      return asList();\n    };\n\n    api.insert = (payload: unknown) => {\n      calls.push({ table: name, op: 'insert', args: [payload] });\n      return {\n        then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n          Promise.resolve({\n            data: null,\n            error: state.insertError ?? null,\n          }).then(resolve, reject),\n      };\n    };\n\n    api.update = (payload: unknown) => {\n      calls.push({ table: name, op: 'update', args: [payload] });\n      ctx.payload = payload;\n      return api;\n    };\n\n    api.maybeSingle = async () => {\n      calls.push({ table: name, op: 'maybeSingle', args: [] });\n      if (name === 'leads') {\n        return { data: state.leads ?? null, error: null };\n      }\n      if (name === 'sms_messages') {\n        const sid = ctx.filters.message_sid as string | undefined;\n        const row = sid ? smsBySid.get(sid) ?? null : null;\n        // Compare-and-swap: status filter must match current row status.\n        if (\n          row &&\n          ctx.filters.status !== undefined &&\n          String(row.status) !== String(ctx.filters.status)\n        ) {\n          return { data: null, error: null };\n        }\n        return { data: row, error: null };\n      }\n      return { data: null, error: null };\n    };\n\n    api.single = api.maybeSingle;\n    return api;\n  }\n\n  return {\n    from: (name: string) => table(name),\n    calls,\n  };\n}\n\nfunction baseDeps(overrides: Partial<"+"SendDeps> & { dbImpl?: ReturnType<"+"typeof makeDb> }): SendDeps {\n  const dbImpl = overrides.dbImpl ?? makeDb({});\n  return {\n    db: () => dbImpl as never,\n    adapter: () =>\n      ({\n        name: 'mock',\n        sendMessage: vi.fn(async () => ({\n          id: 'mid',\n          status: 'queued',\n          keyEchoed: true,\n        })),\n        lookupByIdempotencyKey: vi.fn(async () => ({\n          outcome: 'sent' as const,\n          status: 'delivered',\n          found: true,\n        })),\n        checkLookupSupport: vi.fn(async () => ({\n          supported: true,\n          capabilities: { idempotency: true, version: '1.7.6' },\n        })),\n      }) as never,\n    clock: () => new Date('2026-06-15T15:00:00.000Z'),\n    sendsEnabled: () => true,\n    isPhoneSuppressed: async () => false,\n    SuppressionLookupError,\n    quietHours: () => ({\n      allowed: true,\n      zones: ['America/New_York'],\n      endHour: 21,\n    }),\n    capsConfirmed: () => true,\n    ensureCaps: async () => true,\n    warnLookupUnsupported: async () => ({ supported: true }),\n    ...overrides,\n  };\n}\n\ndescribe('sendMessageWithDeps', () => {\n  beforeEach(() => {\n    resetRelayKeySupportConfirmed();\n    markRelayKeySupportConfirmed();\n  });\n\n  it('blocks when sends disabled', async () => {\n    const deps = baseDeps({ sendsEnabled: () => false });\n    expect(\n      await sendMessageWithDeps(deps, {\n        kind: 'recovery',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      })\n    ).toEqual({ kind: 'blocked', reason: 'sends_disabled' });\n  });\n\n  it('blocks invalid phone', async () => {\n    const deps = baseDeps({});\n    const o = await sendMessageWithDeps(deps, {\n      kind: 'recovery',\n      leadId: 'L',\n      businessId: 'B',\n      to: 'not-a-phone',\n      body: 'hi',\n    });\n    expect(o.kind).toBe('blocked');\n    if (o.kind === 'blocked') expect(o.reason).toBe('invalid_phone');\n  });\n\n  it('suppressed / lookup_failed_closed / opted_out', async () => {\n    const db = makeDb({ leads: { opted_out: false } });\n    let deps = baseDeps({\n      dbImpl: db,\n      isPhoneSuppressed: async () => true,\n    });\n    expect(\n      (\n        await sendMessageWithDeps(deps, {\n          kind: 'recovery',\n          leadId: 'L',\n          businessId: 'B',\n          to: '+12135550100',\n          body: 'hi',\n        })\n      ).kind\n    ).toBe('blocked');\n\n    deps = baseDeps({\n      dbImpl: makeDb({ leads: { opted_out: false } }),\n      isPhoneSuppressed: async () => {\n        throw new SuppressionLookupError('x');\n      },\n    });\n    const closed = await sendMessageWithDeps(deps, {\n      kind: 'recovery',\n      leadId: 'L',\n      businessId: 'B',\n      to: '+12135550100',\n      body: 'hi',\n    });\n    expect(closed).toMatchObject({\n      kind: 'blocked',\n      reason: 'suppressed',\n      detail: 'lookup_failed_closed',\n    });\n\n    deps = baseDeps({\n      dbImpl: makeDb({ leads: { opted_out: true } }),\n    });\n    expect(\n      await sendMessageWithDeps(deps, {\n        kind: 'campaign',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        stepNumber: 2,\n      })\n    ).toEqual({ kind: 'blocked', reason: 'opted_out' });\n  });\n\n  it('recovery gate pending / resolved_sent / skip', async () => {\n    const sid = 'mlf:recovery:L';\n    const dbPending = makeDb({\n      leads: { opted_out: false },\n      smsBySid: new Map([[sid, { status: 'sending' }]]),\n    });\n    expect(\n      await sendMessageWithDeps(baseDeps({ dbImpl: dbPending }), {\n        kind: 'campaign',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        stepNumber: 1,\n      })\n    ).toEqual({ kind: 'blocked', reason: 'recovery_pending' });\n\n    const dbSent = makeDb({\n      leads: { opted_out: false },\n      smsBySid: new Map([[sid, { status: 'delivered' }]]),\n    });\n    expect(\n      await sendMessageWithDeps(baseDeps({ dbImpl: dbSent }), {\n        kind: 'campaign',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        stepNumber: 1,\n      })\n    ).toMatchObject({\n      kind: 'skipped',\n      reason: 'recovery_already_sent_skip_step_1',\n    });\n\n    // skipRecoveryGate bypasses\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: dbPending,\n        adapter: () =>\n          ({\n            name: 'm',\n            sendMessage: send,\n            checkLookupSupport: async () => ({ supported: true }),\n          }) as never,\n      }),\n      {\n        kind: 'campaign',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        stepNumber: 1,\n        skipRecoveryGate: true,\n        enrollmentId: 'E',\n        campaignId: 'C',\n      }\n    );\n    expect(o.kind).toBe('sent');\n  });\n\n  it('quiet hours deferred / unresolved', async () => {\n    const next = new Date('2026-06-16T12:00:00.000Z');\n    let deps = baseDeps({\n      dbImpl: makeDb({ leads: { opted_out: false } }),\n      quietHours: () => ({\n        allowed: false,\n        nextSendAt: next,\n        zones: ['America/New_York'],\n        endHour: 21,\n      }),\n    });\n    expect(\n      await sendMessageWithDeps(deps, {\n        kind: 'recovery',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      })\n    ).toEqual({\n      kind: 'blocked',\n      reason: 'quiet_hours_deferred',\n      nextSendAt: next.toISOString(),\n    });\n\n    deps = baseDeps({\n      dbImpl: makeDb({ leads: { opted_out: false } }),\n      quietHours: () => ({\n        allowed: false,\n        unresolved: true,\n        reason: 'unmapped',\n        zones: [],\n      }),\n    });\n    expect(\n      await sendMessageWithDeps(deps, {\n        kind: 'recovery',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      })\n    ).toMatchObject({ kind: 'blocked', reason: 'quiet_hours_unresolved' });\n  });\n\n  it('duplicate sid: confirm / needs_review / claim_deferred / in_flight', async () => {\n    const cases: Array<"+"[string, string]> = [\n      ['delivered', 'sent'],\n      ['failed', 'needs_review'],\n      ['sending', 'blocked'],\n    ];\n    for (const [status, kind] of cases) {\n      const sid = 'mlf:recovery:Ldup';\n      const db = makeDb({\n        leads: { opted_out: false },\n        insertError: { code: '23505', message: 'dup' },\n        smsBySid: new Map([[sid, { status }]]),\n      });\n      const o = await sendMessageWithDeps(baseDeps({ dbImpl: db }), {\n        kind: 'recovery',\n        leadId: 'Ldup',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        idempotencyKey: sid,\n      });\n      expect(o.kind, status).toBe(kind);\n    }\n\n    const sid = 'mlf:recovery:Ldef';\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    const db = makeDb({\n      leads: { opted_out: false },\n      insertError: { code: '23505', message: 'dup' },\n      smsBySid: new Map([[sid, { status: 'deferred' }]]),\n    });\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () => ({ name: 'm', sendMessage: send }) as never,\n      }),\n      {\n        kind: 'recovery',\n        leadId: 'Ldef',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        idempotencyKey: sid,\n      }\n    );\n    expect(o.kind).toBe('sent');\n    expect(send).toHaveBeenCalled();\n  });\n\n  it('relay ok / conflict / maintenance / failed / throw', async () => {\n    const mk = async (\n      result: unknown | Error,\n      kind: 'recovery' | 'campaign' = 'recovery'\n    ) => {\n      const db = makeDb({ leads: { opted_out: false } });\n      const send =\n        result instanceof Error\n          ? vi.fn(async () => {\n              throw result;\n            })\n          : vi.fn(async () => result);\n      return {\n        outcome: await sendMessageWithDeps(\n          baseDeps({\n            dbImpl: db,\n            adapter: () => ({ name: 'm', sendMessage: send }) as never,\n          }),\n          {\n            kind,\n            leadId: 'L',\n            businessId: 'B',\n            to: '+12135550100',\n            body: 'hi',\n            skipQuietHours: true,\n            skipRecoveryGate: true,\n            enrollmentId: 'E',\n            campaignId: 'C',\n            stepNumber: 2,\n          }\n        ),\n        db,\n      };\n    };\n    expect((await mk({ id: 'm', status: 'queued', keyEchoed: true })).outcome.kind).toBe(\n      'sent'\n    );\n    expect((await mk({ id: 'm', conflict: true })).outcome.kind).toBe('needs_review');\n    expect(\n      (await mk({ id: 'm', ambiguous: true, status: 'maintenance' })).outcome.kind\n    ).toBe('ambiguous');\n    expect((await mk({ id: 'm', ambiguous: true })).outcome.kind).toBe('ambiguous');\n    expect((await mk({ id: 'm', status: 'failed' })).outcome.kind).toBe('needs_review');\n    expect((await mk(new Error('boom'))).outcome.kind).toBe('ambiguous');\n\n    // Campaign kind must also update sms row on needs_review / ambiguous / sent\n    // but must NOT write leads.sms_outbound_sid (recovery-only).\n    for (const result of [\n      { id: 'm', status: 'queued', keyEchoed: true },\n      { id: 'm', conflict: true },\n      { id: 'm', ambiguous: true },\n    ] as const) {\n      const { outcome, db } = await mk(result, 'campaign');\n      expect(['sent', 'needs_review', 'ambiguous']).toContain(outcome.kind);\n      expect(\n        db.calls.some(\n          (c) =>\n            c.table === TABLE.smsMessages &&\n            c.op === 'update' &&\n            c.args[0] &&\n            typeof c.args[0] === 'object'\n        )\n      ).toBe(true);\n      expect(\n        db.calls.some(\n          (c) =>\n            c.table === TABLE.leads &&\n            c.op === 'update' &&\n            (c.args[0] as { sms_outbound_sid?: string })?.sms_outbound_sid\n        )\n      ).toBe(false);\n    }\n  });\n\n  it('manual/escalation skips customer gates and still sends', async () => {\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: makeDb({}),\n        adapter: () => ({ name: 'm', sendMessage: send }) as never,\n        isPhoneSuppressed: async () => true,\n      }),\n      {\n        kind: 'manual',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      }\n    );\n    expect(o.kind).toBe('sent');\n  });\n\n  it('select uses opted_out, timezone, sms_outbound_sid', async () => {\n    const db = makeDb({ leads: { opted_out: false, timezone: 'America/Chicago' } });\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () => ({ name: 'm', sendMessage: send }) as never,\n      }),\n      {\n        kind: 'recovery',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      }\n    );\n    const sel = db.calls.find(\n      (c) => c.table === 'leads' && c.op === 'select'\n    );\n    expect(sel?.args[0]).toBe('opted_out, timezone, sms_outbound_sid');\n    const insert = db.ca RY,\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        skipQuietHours: true,\n      })\n    ).rejects.toThrow(/relation missing/);\n  });\n\n  it('campaign needs_review updates sms only (not lead outbound)', async () => {\n    const db = makeDb({ leads: { opted_out: false } });\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () =>\n          ({\n            name: 'm',\n            sendMessage: async () => {\n              throw new Error('relay boom');\n            },\n            checkLookupSupport: async () => ({ supported: true }),\n          }) as never,\n        // Force caps so transition can park/review from error signal\n        capsConfirmed: () => true,\n      }),\n      {\n        kind: KIND_CAMPAIGN,\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        skipQuietHours: true,\n        skipRecoveryGate: true,\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 2,\n      }\n    );\n    expect(['needs_review', 'ambiguous']).toContain(o.kind);\n    expect(\n      db.calls.some(\n        (c) =>\n          c.table === TABLE.leads &&\n          c.op === 'update' &&\n          (c.args[0] as { sms_outbound_sid?: string })?.sms_outbound_sid\n      )\n    ).toBe(false);\n  });\n\n  it('resolveRecovery follows lead.sms_outbound_sid when recovery sid absent', async () => {\n    const smsBySid = new Map([\n      ['alt-sid', { status: 'delivered' }],\n    ]);\n    const db = makeDb({\n      leads: { sms_outbound_sid: 'alt-sid' },\n      smsBySid,\n    });\n    // recoveryMessageSid(L) won't be in map → falls through to lead sid\n    const outcome = await resolveRecoveryOutcomeWithDeps(\n      baseDeps({ dbImpl: db }),\n      db as never,\n      'L'\n    );\n    expect(outcome).toBe('resolved_sent');\n  });\n\n  it('manual kind skips sms_messages insert (kind guard)', async () => {\n    const db = makeDb({});\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () =>\n          ({\n            name: 'm',\n            sendMessage: send,\n            checkLookupSupport: async () => ({ supported: true }),\n          }) as never,\n      }),\n      {\n        kind: 'manual' as never,\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      }\n    );\n    expect(\n      db.calls.some((c) => c.table === TABLE.smsMessages && c.op === 'insert')\n    ).toBe(false);\n    expect(send).toHaveBeenCalled();\n  });\n});\n\ndescribe('send/index payload + hook survivor killers (r12)', () => {\n  beforeEach(() => {\n    resetRelayKeySupportConfirmed();\n    markRelayKeySupportConfirmed();\n  });\n\n  it('duplicate confirm_existing returns keySupportedAtSend false', async () => {\n    const sid = 'mlf:recovery:Ldup2';\n    const db = makeDb({\n      leads: { opted_out: false },\n      insertError: { code: '23505', message: 'dup' },\n      smsBySid: new Map([[sid, { status: 'delivered' }]]),\n    });\n    const o = await sendMessageWithDeps(baseDeps({ dbImpl: db }), {\n      kind: KIND_RECOVERY,\n      leadId: 'Ldup2',\n      businessId: 'B',\n      to: '+12135550100',\n      body: 'hi',\n      idempotencyKey: sid,\n      skipQuietHours: true,\n    });\n    expect(o).toMatchObject({\n      kind: 'sent',\n      keySupportedAtSend: false,\n      providerStatus: 'delivered',\n    });\n  });\n\n  it('claim_deferred CAS: eq status=deferred then dispatch', async () => {\n    const sid = 'mlf:recovery:Ldef2';\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    const db = makeDb({\n      leads: { opted_out: false },\n      insertError: { code: '23505', message: 'dup' },\n      smsBySid: new Map([[sid, { status: 'deferred' }]]),\n    });\n    await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () => ({ name: 'm', sendMessage: send }) as never,\n      }),\n      {\n        kind: KIND_RECOVERY,\n        leadId: 'Ldef2',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'body-x',\n        idempotencyKey: sid,\n        skipQuietHours: true,\n      }\n    );\n    const upd = db.calls.find(\n      (c) =>\n        c.table === TABLE.smsMessages &&\n        c.op === 'update' &&\n        (c.args[0] as { body?: string })?.body === 'body-x'\n    );\n    expect(upd?.args[0]).toMatchObject({\n      status: SMS_STATUS.sending,\n      body: 'body-x',\n      next_retry_at: null,\n    });\n    expect(\n      db.calls.some(\n        (c) =>\n          c.op === 'eq' &&\n          c.args[0] === COL.status &&\n          c.args[1] === SMS_STATUS.deferred\n      )\n    ).toBe(true);\n    expect(send).toHaveBeenCalled();\n  });\n\n  it('claim_deferred CAS lost → duplicate_in_flight, no relay', async () => {\n    const sid = 'mlf:recovery:LdefLost';\n    const send = vi.fn(async () => ({\n      id: 'm',\n      status: 'queued',\n      keyEchoed: true,\n    }));\n    // First status lookup sees deferred; after update filter, map is already sending\n    // (simulates a racing cron that claimed first).\n    const smsBySid = new Map<"+"string, Row>([[sid, { status: 'deferred' }]]);\n    const db = makeDb({\n      leads: { opted_out: false },\n      insertError: { code: '23505', message: 'dup' },\n      smsBySid,\n    });\n    // Flip to sending before the CAS select runs: intercept update to mutate map.\n    const origFrom = db.from;\n    db.from = (name: string) => {\n      const api = origFrom(name) as Record<"+"string, unknown>;\n      const origUpdate = api.update as (p: unknown) => unknown;\n      api.update = (payload: unknown) => {\n        const chain = origUpdate(payload) as Record<"+"string, unknown>;\n        smsBySid.set(sid, { status: 'sending' });\n        return chain;\n      };\n      return api;\n    };\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () => ({ name: 'm', sendMessage: send }) as never,\n      }),\n      {\n        kind: KIND_RECOVERY,\n        leadId: 'LdefLost',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'body-x',\n        idempotencyKey: sid,\n        skipQuietHours: true,\n      }\n    );\n    expect(o).toMatchObject({\n      kind: 'blocked',\n      reason: SEND_REASON.duplicateInFlight,\n      detail: 'deferred_claim_lost',\n    });\n    expect(send).not.toHaveBeenCalled();\n  });\n\n  it('suppression non-SuppressionLookupError rethrows', async () => {\n    await expect(\n      sendMessageWithDeps(\n        baseDeps({\n          dbImpl: makeDb({ leads: { opted_out: false } }),\n          isPhoneSuppressed: async () => {\n            throw new Error('network');\n          },\n        }),\n        {\n          kind: KIND_RECOVERY,\n          leadId: 'L',\n          businessId: 'B',\n          to: '+12135550100',\n          body: 'hi',\n          skipQuietHours: true,\n        }\n      )\n    ).rejects.toThrow('network');\n  });\n\n  it('manual sent does not update sms_messages', async () => {\n    const db = makeDb({});\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () =>\n          ({\n            name: 'm',\n            sendMessage: async () => ({\n              id: 'm',\n              status: 'queued',\n              keyEchoed: true,\n            }),\n          }) as never,\n      }),\n      {\n        kind: 'manual',\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n      }\n    );\n    expect(o.kind).toBe('sent');\n    expect(\n      db.calls.some((c) => c.table === TABLE.smsMessages && c.op === 'update')\n    ).toBe(false);\n  });\n\n  it('recovery confirm writes lead outbound sid; campaign does not', async () => {\n    const mk = async (kind: 'recovery' | 'campaign') => {\n      const db = makeDb({ leads: { opted_out: false } });\n      await sendMessageWithDeps(\n        baseDeps({\n          dbImpl: db,\n          adapter: () =>\n            ({\n              name: 'm',\n              sendMessage: async () => ({\n                id: 'm',\n                status: 'queued',\n                keyEchoed: true,\n              }),\n            }) as never,\n        }),\n        {\n          kind,\n          leadId: 'L',\n          businessId: 'B',\n          to: '+12135550100',\n          body: 'hi',\n          skipQuietHours: true,\n          skipRecoveryGate: true,\n          enrollmentId: 'E',\n          campaignId: 'C',\n          stepNumber: 2,\n        }\n      );\n      return db;\n    };\n    const rec = await mk('recovery');\n    expect(\n      rec.calls.some(\n        (c) =>\n          c.table === TABLE.leads &&\n          c.op === 'update' &&\n          (c.args[0] as { sms_outbound_sid?: string }).sms_outbound_sid\n      )\n    ).toBe(true);\n    const camp = await mk('campaign');\n    expect(\n      camp.calls.some(\n        (c) =>\n          c.table === TABLE.leads &&\n          c.op === 'update' &&\n          (c.args[0] as { sms_outbound_sid?: string }).sms_outbound_sid\n      )\n    ).toBe(false);\n  });\n\n  it('relay throw parks sms with attempts + next_retry_at', async () => {\n    const db = makeDb({ leads: { opted_out: false } });\n    const o = await sendMessageWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () =>\n          ({\n            name: 'm',\n            sendMessage: async () => {\n              throw new Error('boom');\n            },\n          }) as never,\n      }),\n      {\n        kind: KIND_RECOVERY,\n        leadId: 'L',\n        businessId: 'B',\n        to: '+12135550100',\n        body: 'hi',\n        skipQuietHours: true,\n      }\n    );\n    expect(o.kind).toBe('ambiguous');\n    const park = db.calls.find(\n      (c) =>\n        c.table === TABLE.smsMessages &&\n        c.op === 'update' &&\n        (c.args[0] as { status?: string }).status === SMS_STATUS.unknown\n    );\n    expect(park?.args[0]).toMatchObject({\n      status: SMS_STATUS.unknown,\n      reconcile_attempts: expect.any(Number),\n      next_retry_at: expect.any(String),\n    });\n  });\n\n  it('unexpected_decision from transitionSend → needs_review', async () => {\n    const machine = await import('./machine');\n    const spy = vi\n      .spyOn(machine, 'transitionSend')\n      .mockReturnValue({ action: 'totally_unknown' } as never);\n    try {\n      const db = makeDb({ leads: { opted_out: false } });\n      const o = await sendMessageWithDeps(\n        baseDeps({\n          dbImpl: db,\n          adapter: () =>\n            ({\n              name: 'm',\n              sendMessage: async () => ({\n                id: 'm',\n                status: 'queued',\n                keyEchoed: true,\n              }),\n            }) as never,\n        }),\n        {\n          kind: KIND_RECOVERY,\n          leadId: 'L',\n          businessId: 'B',\n          to: '+12135550100',\n          body: 'hi',\n          skipQuietHours: true,\n        }\n      );\n      expect(o).toMatchObject({\n        kind: 'needs_review',\n        reason: 'unexpected_decision',\n      });\n      expect(\n        db.calls.some(\n          (c) =>\n            c.table === TABLE.smsMessages &&\n            c.op === 'update' &&\n            (c.args[0] as { status?: string }).status === SMS_STATUS.unknown\n        )\n      ).toBe(false);\n    } finally {\n      spy.mockRestore();\n    }\n  });\n\n  it('reconcileOne never_sent / needs_review / park payloads', async () => {\n    const row = {\n      id: '1',\n      lead_id: 'L',\n      message_sid: 'mlf:recovery:L',\n      status: 'unknown',\n      reconcile_attempts: null as number | null,\n      key_supported_at_send: true,\n    };\n\n    const dbNs = makeDb({});\n    const ns = await reconcileOneWithDeps(\n      baseDeps({\n        dbImpl: dbNs,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'never_sent',\n              found: false,\n            }),\n          }) as never,\n      }),\n      row\n    );\n    expect(ns).toMatchObject({ kind: 'never_sent', requeued: true });\n    expect(\n      dbNs.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { status?: string }).status ===\n            SMS_STATUS.abandonedRetry &&\n          String((c.args[0] as { message_sid?: string }).message_sid).includes(\n            ':abandoned:'\n          )\n      )\n    ).toBe(true);\n\n    const dbNr = makeDb({});\n    const nr = await reconcileOneWithDeps(\n      baseDeps({\n        dbImpl: dbNr,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'failed',\n              status: 'failed',\n              found: true,\n            }),\n          }) as never,\n      }),\n      { ...row, reconcile_attempts: 0 }\n    );\n    expect(nr.kind).toBe('needs_review');\n    expect(\n      dbNr.calls.some(\n        (c) =>\n          c.op === 'update' &&\n          (c.args[0] as { status?: string; next_retry_at?: unknown })\n            .status === SMS_STATUS.needsReview &&\n          (c.args[0] as { next_retry_at?: unknown }).next_retry_at === null\n      )\n    ).toBe(true);\n\n    const dbPark = makeDb({});\n    const park = await reconcileOneWithDeps(\n      baseDeps({\n        dbImpl: dbPark,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'unknown',\n              found: true,\n            }),\n          }) as never,\n      }),\n      { ...row, reconcile_attempts: null }\n    );\n    expect(park.kind).toBe('ambiguous');\n    expect(\n      dbPark.calls.some(\n        (c) =>\n
