   for (const s of [\n      'deferred',\n      'sending',\n      'unknown',\n      'pending',\n      'needs_review',\n      'failed',\n      'undelivered',\n      'rejected',\n      'error',\n      'totally_unknown_vocab',\n      'weird',\n    ]) {\n      expect(classifyRecoveryStatus(s), s).toBe('pending');\n    }\n  });\n\n  it('property: parkDelayMs never below base for finite non-negative', () => {\n    fc.assert(\n      fc.property(fc.double({ min: 0, max: 30, noNaN: true }), (n) => {\n        const d = parkDelayMs(n);\n        expect(d).toBeGreaterThanOrEqual(PARK_BASE_MS);\n        expect(d).toBeLessThanOrEqual(PARK_MAX_MS);\n      }),\n      { numRuns: 40 }\n    );\n  });\n});\n"},"src/services/qc-r7-equivalent-killers.test.ts":{"tests":[{"id":"141","name":"EQUIVALENT #8 resolveRecoveryOutcome default wrapper > delegates to WithDeps and returns classified status","location":{"start":{"column":3,"line":13}}},{"id":"142","name":"EQUIVALENT #10 defaultCampaignDeps sleep > sleep resolves after the requested delay","location":{"start":{"column":3,"line":39}}}],"source":"/**\n * QC r7 EQUIVALENT.md corrections: tests that kill former \"equivalent\"\n * disables (#8 resolveRecovery wrapper, #10 default sleep).\n */\nimport { afterEach, describe, expect, it, vi } from 'vitest';\nimport { resolveRecoveryOutcome } from '@/services/send';\nimport { defaultCampaignDeps } from '@/services/campaign-deps';\nimport { SMS_STATUS, TABLE } from '@/services/db-strings';\nimport { recoveryMessageSid } from '@/services/sms-sid';\n\ndescribe('EQUIVALENT #8 resolveRecoveryOutcome default wrapper', () => {\n  it('delegates to WithDeps and returns classified status', async () => {\n    const sid = recoveryMessageSid('Lwrap');\n    const supabase = {\n      from: (table: string) => {\n        expect(table).toBe(TABLE.smsMessages);\n        const api: Record<"+"string, unknown> = {};\n        api.select = () => api;\n        api.eq = () => api;\n        api.maybeSingle = async () => ({\n          data: { status: SMS_STATUS.delivered },\n          error: null,\n        });\n        return api;\n      },\n    };\n    const status = await resolveRecoveryOutcome(supabase as never, 'Lwrap');\n    expect(status).toBe('resolved_sent');\n    void sid;\n  });\n});\n\ndescribe('EQUIVALENT #10 defaultCampaignDeps sleep', () => {\n  afterEach(() => {\n    vi.useRealTimers();\n  });\n\n  it('sleep resolves after the requested delay', async () => {\n    vi.useFakeTimers();\n    const deps = defaultCampaignDeps();\n    let done = false;\n    const p = deps.sleep(250).then(() => {\n      done = true;\n    });\n    expect(done).toBe(false);\n    await vi.advanceTimersByTimeAsync(249);\n    expect(done).toBe(false);\n    await vi.advanceTimersByTimeAsync(1);\n    await p;\n    expect(done).toBe(true);\n  });\n});\n"},"src/services/send/policy.test.ts":{"tests":[{"id":"143","name":"isSendsEnabled > defaults true when unset; empty string also enables","location":{"start":{"column":3,"line":9}}},{"id":"144","name":"isSendsEnabled > accepts true-ish values","location":{"start":{"column":3,"line":15}}},{"id":"145","name":"isSendsEnabled > accepts false-ish values","location":{"start":{"column":3,"line":21}}},{"id":"146","name":"isSendsEnabled > fail-closes on unknown values","location":{"start":{"column":3,"line":27}}},{"id":"147","name":"isSendsEnabled > default env path uses process.env","location":{"start":{"column":3,"line":32}}}],"source":"import { afterEach, describe, expect, it } from 'vitest';\nimport { isSendsEnabled } from './policy';\n\ndescribe('isSendsEnabled', () => {\n  afterEach(() => {\n    delete process.env.SENDS_ENABLED;\n  });\n\n  it('defaults true when unset; empty string also enables', () => {\n    expect(isSendsEnabled({})).toBe(true);\n    expect(isSendsEnabled({ SENDS_ENABLED: undefined })).toBe(true);\n    expect(isSendsEnabled({ SENDS_ENABLED: '' })).toBe(true);\n  });\n\n  it('accepts true-ish values', () => {\n    for (const v of ['true', 'TRUE', '1', 'yes', 'on', ' On ']) {\n      expect(isSendsEnabled({ SENDS_ENABLED: v }), v).toBe(true);\n    }\n  });\n\n  it('accepts false-ish values', () => {\n    for (const v of ['false', 'FALSE', '0', 'no', 'off', ' Off ']) {\n      expect(isSendsEnabled({ SENDS_ENABLED: v }), v).toBe(false);\n    }\n  });\n\n  it('fail-closes on unknown values', () => {\n    expect(isSendsEnabled({ SENDS_ENABLED: 'maybe' })).toBe(false);\n    expect(isSendsEnabled({ SENDS_ENABLED: 'enabled' })).toBe(false);\n  });\n\n  it('default env path uses process.env', () => {\n    process.env.SENDS_ENABLED = 'false';\n    expect(isSendsEnabled()).toBe(false);\n    process.env.SENDS_ENABLED = 'true';\n    expect(isSendsEnabled()).toBe(true);\n  });\n});\n\n"},"src/services/qc-r7-mut-behaviour.test.ts":{"tests":[{"id":"148","name":"mut.py #19 compact whole-message forms > S T O P / STOP STOP compact to opt_out","location":{"start":{"column":3,"line":59}}},{"id":"149","name":"mut.py #50 staging SSL env parsing > respects STAGING_PG_SSL disable and rejectUnauthorized flag","location":{"start":{"column":3,"line":67}}},{"id":"150","name":"mut.py #31 key_supported_at_send preserves false > payload keeps false (not forced true)","location":{"start":{"column":3,"line":84}}},{"id":"151","name":"mut.py #32 reconcile uses stored key_supported_at_send > Boolean(row.key_supported_at_send) preserves false (not forced true)","location":{"start":{"column":3,"line":109}}},{"id":"152","name":"mut.py #32 reconcile uses stored key_supported_at_send > reconcile with key_supported false still runs lookup","location":{"start":{"column":3,"line":122}}},{"id":"153","name":"mut.py #16 campaign leadTimezone from plan > planCampaignSendPre exposes lead timezone (not null)","location":{"start":{"column":3,"line":181}}},{"id":"154","name":"mut.py #49 switch select uses ENROLLMENT_CLAIM_SELECT > records select(ENROLLMENT_CLAIM_SELECT) on switch update path","location":{"start":{"column":3,"line":207}}},{"id":"155","name":"mut.py #22/#24/#25/#26 migration 003 behavioural (PGlite) > #26 STOP PLEASE backfills; mid-sentence END does not","location":{"start":{"column":3,"line":357}}},{"id":"156","name":"mut.py #22/#24/#25/#26 migration 003 behavioural (PGlite) > #25 NFKC fullwidth STOP backfills","location":{"start":{"column":3,"line":372}}},{"id":"157","name":"mut.py #22/#24/#25/#26 migration 003 behavioural (PGlite) > #22 ON CONFLICT keeps a single suppression row","location":{"start":{"column":3,"line":382}}},{"id":"158","name":"mut.py #22/#24/#25/#26 migration 003 behavioural (PGlite) > #24 NULLS LAST keeps enrolled_at over null","location":{"start":{"column":3,"line":393}}}],"source":"/**\n * QC r7: behavioural killers for mut.py IDs that previously relied on\n * source-text greps (#16, #19, #22, #24, #25, #26, #31, #32, #49, #50).\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\nimport { readFileSync } from 'fs';\nimport { join } from 'path';\nimport { PGlite } from '@electric-sql/pglite';\nimport { classifyOptOut } from '@/services/opt-out';\nimport { smsConfirmSentPayload } from '@/services/send/send-io-plans';\nimport { reconcileOneWithDeps } from '@/services/send';\nimport { SuppressionLookupError } from '@/services/suppressions';\nimport {\n  markRelayKeySupportConfirmed,\n  resetRelayKeySupportConfirmed,\n} from '@/services/sms-sid';\nimport { ENROLLMENT_CLAIM_SELECT } from '@/lib/postgrest-select';\nimport { resolveStagingSsl } from '@/lib/staging-ssl';\nimport { switchEnrollmentCampaignWithDeps } from '@/services/campaign-runtime';\nimport { defaultCampaignDeps } from '@/services/campaign-deps';\n\nconst mockFrom = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nfunction chain(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const m of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[m] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('mut.py #19 compact whole-message forms', () => {\n  it('S T O P / STOP STOP compact to opt_out', () => {\n    expect(classifyOptOut('S T O P').kind).toBe('opt_out');\n    expect(classifyOptOut('STOP STOP').kind).toBe('opt_out');\n    expect(classifyOptOut('  S   T   O   P  ').kind).toBe('opt_out');\n  });\n});\n\ndescribe('mut.py #50 staging SSL env parsing', () => {\n  it('respects STAGING_PG_SSL disable and rejectUnauthorized flag', () => {\n    expect(resolveStagingSsl({ STAGING_PG_SSL: '0' })).toBe(false);\n    expect(resolveStagingSsl({ STAGING_PG_SSL: 'false' })).toBe(false);\n    expect(resolveStagingSsl({})).toEqual({ rejectUnauthorized: false });\n    expect(\n      resolveStagingSsl({ STAGING_PG_SSL_REJECT_UNAUTHORIZED: '1' })\n    ).toEqual({ rejectUnauthorized: true });\n    expect(\n      resolveStagingSsl({\n        STAGING_PG_SSL: '1',\n        STAGING_PG_SSL_REJECT_UNAUTHORIZED: '1',\n      })\n    ).toEqual({ rejectUnauthorized: true });\n  });\n});\n\ndescribe('mut.py #31 key_supported_at_send preserves false', () => {\n  it('payload keeps false (not forced true)', () => {\n    expect(\n      smsConfirmSentPayload({\n        providerStatus: 'queued',\n        keySupportedAtSend: false,\n      })\n    ).toEqual({\n      status: 'queued',\n      key_supported_at_send: false,\n    });\n    expect(\n      smsConfirmSentPayload({\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      }).key_supported_at_send\n    ).toBe(true);\n  });\n});\n\ndescribe('mut.py #32 reconcile uses stored key_supported_at_send', () => {\n  beforeEach(() => {\n    resetRelayKeySupportConfirmed();\n    markRelayKeySupportConfirmed();\n  });\n\n  it('Boolean(row.key_supported_at_send) preserves false (not forced true)', () => {\n    // Mirrors send/index.ts reconcile wiring — mut.py #32 forces `true`.\n    const rowFalse = { key_supported_at_send: false };\n    const rowTrue = { key_supported_at_send: true };\n    const rowMissing = { key_supported_at_send: null };\n    expect(Boolean(rowFalse.key_supported_at_send)).toBe(false);\n    expect(Boolean(rowTrue.key_supported_at_send)).toBe(true);\n    expect(Boolean(rowMissing.key_supported_at_send)).toBe(false);\n    // Forcing true would break the false case:\n    const forced = true;\n    expect(Boolean(rowFalse.key_supported_at_send)).not.toBe(forced);\n  });\n\n  it('reconcile with key_supported false still runs lookup', async () => {\n    const lookup = vi.fn(async () => ({\n      outcome: 'sent' as const,\n      status: 'delivered',\n      found: true,\n    }));\n    const api: Record<"+"string, any> = {};\n    const self = () => api;\n    for (const m of [\n      'eq',\n      'lte',\n      'lt',\n      'is',\n      'or',\n      'in',\n      'order',\n      'limit',\n      'select',\n      'update',\n    ]) {\n      api[m] = vi.fn(self);\n    }\n    api.maybeSingle = vi.fn(async () => ({ data: null, error: null }));\n    await reconcileOneWithDeps(\n      {\n        db: () => ({ from: () => api }) as never,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: lookup,\n            checkLookupSupport: async () => ({ supported: true }),\n          }) as never,\n        clock: () => new Date('2026-06-15T15:00:00.000Z'),\n        sendsEnabled: () => true,\n        isPhoneSuppressed: async () => false,\n        SuppressionLookupError,\n        quietHours: () => ({\n          allowed: true,\n          zones: ['America/New_York'],\n          endHour: 21,\n        }),\n        capsConfirmed: () => true,\n        ensureCaps: async () => true,\n        warnLookupUnsupported: async () => ({ supported: true }),\n      },\n      {\n        id: '1',\n        lead_id: 'L',\n        message_sid: 'mlf:campaign:E:C:step:1',\n        status: 'unknown',\n        reconcile_attempts: 0,\n        key_supported_at_send: false,\n      }\n    );\n    expect(lookup).toHaveBeenCalled();\n  });\n});\n\ndescribe('mut.py #16 campaign leadTimezone from plan', () => {\n  it('planCampaignSendPre exposes lead timezone (not null)', async () => {\n    const { planCampaignSendPre } = await import(\n      '@/services/campaign-send-plan'\n    );\n    const pre = planCampaignSendPre({\n      enrollmentFound: true,\n      claimToken: 'tok',\n      optedOut: false,\n      suppressed: false,\n      suppressionLookupFailed: false,\n      steps: [\n        { step_number: 1, delay_minutes: 0, template_key: 's1' },\n        { step_number: 2, delay_minutes: 30, template_key: 's2' },\n      ],\n      currentStep: 2,\n      leadTimezone: 'America/Denver',\n    });\n    expect(pre.type).toBe('send');\n    if (pre.type === 'send') {\n      expect(pre.leadTimezone).toBe('America/Denver');\n      expect(pre.leadTimezone).not.toBeNull();\n    }\n  });\n});\n\ndescribe('mut.py #49 switch select uses ENROLLMENT_CLAIM_SELECT', () => {\n  it('records select(ENROLLMENT_CLAIM_SELECT) on switch update path', async () => {\n    const selectArgs: string[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        const b = chain({\n          data: {\n            id: 'e',\n            lead_id: 'L',\n            campaign_id: 'old',\n            status: 'active',\n            claimed_at: '2000-01-01T00:00:00.000Z',\n            claim_token: 'stale',\n          },\n          error: null,\n        });\n        b.update = vi.fn(() => {\n          const u = chain({\n            data: {\n              id: 'e',\n              campaign_id: 'new',\n              current_step: 1,\n              claim_token: null,\n              claimed_at: null,\n            },\n            error: null,\n          });\n          u.select = vi.fn((cols: string) => {\n            selectArgs.push(cols);\n            return u;\n          });\n          u.maybeSingle = vi.fn(async () => ({\n            data: { id: 'e', campaign_id: 'new', current_step: 1 },\n            error: null,\n          }));\n          return u;\n        });\n        return b;\n      }\n      if (table === 'leads') {\n        return chain({\n          data: {\n            id: 'L',\n            sms_outbound_sid: 'mlf:recovery:L',\n            opted_out: false,\n          },\n          error: null,\n        });\n      }\n      if (table === 'campaigns') {\n        return chain({\n          data: {\n            id: 'new',\n            name: 'Emergency',\n            urgency_filter: 'emergency',\n            campaign_steps: [\n              { step_number: 1, delay_minutes: 0, template_key: 'e1' },\n              { step_number: 2, delay_minutes: 30, template_key: 'e2' },\n            ],\n          },\n          error: null,\n        });\n      }\n      return chain({ data: null, error: null });\n    });\n\n    const r = await switchEnrollmentCampaignWithDeps(\n      {\n        ...defaultCampaignDeps(),\n        db: () => ({ from: mockFrom }) as never,\n        clock: () => new Date('2026-06-15T18:00:00.000Z'),\n      } as never,\n      'L',\n      'new'\n    );\n    expect(r.enrolled).toBe(true);\n    expect(selectArgs).toContain(ENROLLMENT_CLAIM_SELECT);\n    expect(selectArgs.some((s) => s === 'id')).toBe(false);\n    expect(ENROLLMENT_CLAIM_SELECT).toContain('claim_token');\n  });\n});\n\ndescribe('mut.py #22/#24/#25/#26 migration 003 behavioural (PGlite)', () => {\n  function stripUnsupported(sql: string): string {\n    return sql\n      .replace(/CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";/g, '')\n      .replace(/CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";/g, '');\n  }\n\n  async function bootWithMessages(\n    messages: Array<"+"{ body: string; sid: string }>\n  ) {\n    const db = new PGlite();\n    await db.exec(`\n      CREATE OR REPLACE FUNCTION uuid_generate_v4() RETURNS uuid\n        AS $$ SELECT gen_random_uuid() $$ LANGUAGE sql;\n    `);\n    await db.exec(\n      stripUnsupported(\n        readFileSync(join(process.cwd(), 'supabase/schema.sql'), 'utf8')\n      )\n    );\n    await db.exec(\n      stripUnsupported(\n        readFileSync(\n          join(process.cwd(), 'supabase/migrations/001_campaigns.sql'),\n          'utf8'\n        )\n      )\n    );\n    await db.exec(\n      stripUnsupported(\n        readFileSync(\n          join(process.cwd(), 'supabase/migrations/002_secure_rls.sql'),\n          'utf8'\n        )\n      )\n    );\n    await db.exec(`\n      ALTER TABLE sms_messages DROP CONSTRAINT IF EXISTS sms_messages_message_sid_key;\n      ALTER TABLE campaign_enrollments DROP CONSTRAINT IF EXISTS campaign_enrollments_lead_id_campaign_id_key;\n      INSERT INTO businesses (id, name, phone) VALUES\n        ('11111111-1111-4111-8111-111111111111', 'Acme', '+15551234567');\n      INSERT INTO missed_calls (id, business_id, caller_phone, call_sid) VALUES\n        ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', '11111111-1111-4111-8111-111111111111', '+15559876543', 'c1');\n      INSERT INTO leads (id, business_id, missed_call_id, caller_phone) VALUES\n        ('44444444-4444-4444-8444-444444444444', '11111111-1111-4111-8111-111111111111',\n         'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', '5559876543');\n    `);\n    for (const m of messages) {\n      await db.exec(\n        `INSERT INTO sms_messages (lead_id, direction, body, message_sid, sent_at)\n         VALUES ('44444444-4444-4444-8444-444444444444', 'inbound', $$${m.body}$$, '${m.sid}', NOW())`\n      );\n    }\n    await db.exec(`\n      INSERT INTO campaign_enrollments (lead_id, campaign_id, current_step, status, enrolled_at, created_at)\n      SELECT '44444444-4444-4444-8444-444444444444', id, 1, 'active', NULL, '2026-01-02'\n      FROM campaigns WHERE name = 'Standard Follow-up' LIMIT 1;\n      INSERT INTO campaign_enrollments (lead_id, campaign_id, current_step, status, enrolled_at, created_at)\n      SELECT '44444444-4444-4444-8444-444444444444', id, 2, 'active', '2026-01-01', '2026-01-01'\n      FROM campaigns WHERE name = 'Standard Follow-up' LIMIT 1;\n    `);\n    const forward = readFileSync(\n      join(process.cwd(), 'supabase/migrations/003_campaign_idempotency.sql'),\n      'utf8'\n    );\n    await db.exec(forward);\n    return db;\n  }\n\n  it('#26 STOP PLEASE backfills; mid-sentence END does not', async () => {\n    const db = await bootWithMessages([\n      { body: 'STOP PLEASE', sid: 'sp1' },\n      { body: 'Can you come by end of day?', sid: 'mid1' },\n    ]);\n    const suppress = await db.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM sms_suppressions WHERE reason = 'opt_out_backfill'`\n    );\n    expect(suppress.rows[0].n).toBe(1);\n    const lead = await db.query<"+"{ opted_out: boolean }>(\n      `SELECT opted_out FROM leads WHERE id = '44444444-4444-4444-8444-444444444444'`\n    );\n    expect(lead.rows[0].opted_out).toBe(true);\n  }, 90_000);\n\n  it('#25 NFKC fullwidth STOP backfills', async () => {\n    const db = await bootWithMessages([\n      { body: '\\uFF33\\uFF34\\uFF2F\\uFF30', sid: 'fw1' },\n    ]);\n    const suppress = await db.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM sms_suppressions WHERE reason = 'opt_out_backfill'`\n    );\n    expect(suppress.rows[0].n).toBe(1);\n  }, 90_000);\n\n  it('#22 ON CONFLICT keeps a single suppression row', async () => {\n    const db = await bootWithMessages([\n      { body: 'STOP', sid: 'a' },\n      { body: 'STOP', sid: 'b' },\n    ]);\n    const suppress = await db.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM sms_suppressions`\n    );\n    expect(suppress.rows[0].n).toBe(1);\n  }, 90_000);\n\n  it('#24 NULLS LAST keeps enrolled_at over null', async () => {\n    const db = await bootWithMessages([{ body: 'hello', sid: 'h1' }]);\n    const enroll = await db.query<"+"{ n: number; step: number }>(\n      `SELECT COUNT(*)::int AS n, MAX(current_step)::int AS step\n       FROM campaign_enrollments\n       WHERE lead_id = '44444444-4444-4444-8444-444444444444'`\n    );\n    expect(enroll.rows[0].n).toBe(1);\n    expect(enroll.rows[0].step).toBe(2);\n  }, 90_000);\n});\n"},"src/services/db-integration.test.ts":{"tests":[{"id":"159","name":"PGlite: schema + 001 + 002 + 003 > 003 adds columns, STOP-backfills variants, dedupes enrollments (no business merge)","location":{"start":{"column":3,"line":71}}},{"id":"160","name":"PGlite: schema + 001 + 002 + 003 > abort-only collision script lists collisions and never deletes businesses","location":{"start":{"column":3,"line":112}}}],"source":"/**\n * PGlite: real schema.sql → 001 → 002 → 003 (QC r5 C).\n * Collision abort script is separate and never merges businesses.\n */\nimport { readFileSync } from 'fs';\nimport { join } from 'path';\nimport { beforeAll, describe, expect, it } from 'vitest';\nimport { PGlite } from '@electric-sql/pglite';\n\nfunction load(pathFromRoot: string): string {\n  return readFileSync(join(process.cwd(), pathFromRoot), 'utf8');\n}\n\nfunction stripUnsupported(sql: string): string {\n  return sql\n    .replace(/CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";/g, '')\n    .replace(/CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";/g, '');\n}\n\ndescribe('PGlite: schema + 001 + 002 + 003', () => {\n  let db: PGlite;\n\n  beforeAll(async () => {\n    db = new PGlite();\n    await db.exec(`\n      CREATE OR REPLACE FUNCTION uuid_generate_v4() RETURNS uuid\n        AS $$ SELECT gen_random_uuid() $$ LANGUAGE sql;\n    `);\n\n    await db.exec(stripUnsupported(load('supabase/schema.sql')));\n    await db.exec(stripUnsupported(load('supabase/migrations/001_campaigns.sql')));\n    await db.exec(stripUnsupported(load('supabase/migrations/002_secure_rls.sql')));\n\n    // Drop uniqueness so we can seed pre-migration messy duplicates.\n    await db.exec(`\n      ALTER TABLE sms_messages DROP CONSTRAINT IF EXISTS sms_messages_message_sid_key;\n      ALTER TABLE campaign_enrollments DROP CONSTRAINT IF EXISTS campaign_enrollments_lead_id_campaign_id_key;\n    `);\n\n    // Fixtures: STOP variants the app normalizer catches; no colliding business phones\n    await db.exec(`\n      INSERT INTO businesses (id, name, phone) VALUES\n        ('11111111-1111-4111-8111-111111111111', 'Acme', '+15551234567');\n      INSERT INTO missed_calls (id, business_id, caller_phone, call_sid) VALUES\n        ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', '11111111-1111-4111-8111-111111111111', '+15559876543', 'c1');\n      INSERT INTO leads (id, business_id, missed_call_id, caller_phone) VALUES\n        ('44444444-4444-4444-8444-444444444444', '11111111-1111-4111-8111-111111111111',\n         'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', '5559876543');\n      INSERT INTO sms_messages (lead_id, direction, body, message_sid, sent_at) VALUES\n        ('44444444-4444-4444-8444-444444444444', 'inbound', 'Stop.', 's1', '2026-01-02'),\n        ('44444444-4444-4444-8444-444444444444', 'inbound', 'stop!', 's2', NOW()),\n        ('44444444-4444-4444-8444-444444444444', 'inbound', E' unsubscribe\\\\n', 's3', NOW()),\n        ('44444444-4444-4444-8444-444444444444', 'inbound', 'please stop texting me', 's4', NOW()),\n        ('44444444-4444-4444-8444-444444444444', 'inbound', '\\uFF33\\uFF34\\uFF2F\\uFF30', 's5', NOW()),\n        ('44444444-4444-4444-8444-444444444444', 'outbound', 'hi', 'dup-sid', '2026-01-01'),\n        ('44444444-4444-4444-8444-444444444444', 'inbound', 'STOP', 'dup-sid', '2026-01-02');\n      INSERT INTO campaign_enrollments (lead_id, campaign_id, current_step, status, enrolled_at, created_at)\n      SELECT\n        '44444444-4444-4444-8444-444444444444',\n        id, 1, 'paused', NULL, NULL\n      FROM campaigns WHERE name = 'Standard Follow-up' LIMIT 1;\n      INSERT INTO campaign_enrollments (lead_id, campaign_id, current_step, status, enrolled_at, created_at)\n      SELECT\n        '44444444-4444-4444-8444-444444444444',\n        id, 2, 'active', '2026-01-01', '2026-01-01'\n      FROM campaigns WHERE name = 'Standard Follow-up' LIMIT 1;\n    `);\n  }, 120_000);\n\n  it('003 adds columns, STOP-backfills variants, dedupes enrollments (no business merge)', async () => {\n    const forward = load('supabase/migrations/003_campaign_idempotency.sql');\n    await db.exec(forward);\n\n    const cols = await db.query<"+"{ column_name: string }>(\n      `SELECT column_name FROM information_schema.columns\n       WHERE table_name = 'sms_messages'\n         AND column_name IN ('reconcile_attempts','key_supported_at_send')`\n    );\n    expect(cols.rows.map((r) => r.column_name).sort()).toEqual([\n      'key_supported_at_send',\n      'reconcile_attempts',\n    ]);\n\n    const suppress = await db.query<"+"{ phone: string; reason: string }>(\n      `SELECT phone, reason FROM sms_suppressions`\n    );\n    expect(suppress.rows.some((r) => r.reason === 'opt_out_backfill')).toBe(true);\n    expect(suppress.rows.every((r) => r.phone.startsWith('+1'))).toBe(true);\n\n    const enroll = await db.query<"+"{ n: number; status: string }>(\n      `SELECT COUNT(*)::int AS n, MAX(status::text) AS status FROM campaign_enrollments\n       WHERE lead_id = '44444444-4444-4444-8444-444444444444'`\n    );\n    expect(enroll.rows[0].n).toBe(1);\n    expect(enroll.rows[0].status).toBe('active');\n\n    const sidCount = await db.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM sms_messages WHERE message_sid = 'dup-sid'`\n    );\n    expect(sidCount.rows[0].n).toBe(1);\n\n    // Businesses were NOT merge-deleted\n    const biz = await db.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM businesses`\n    );\n    expect(biz.rows[0].n).toBe(1);\n\n    expect(forward).not.toMatch(/DELETE FROM businesses/i);\n  }, 60_000);\n\n  it('abort-only collision script lists collisions and never deletes businesses', async () => {\n    const abortSql = load('supabase/scripts/phone_collision_abort.sql');\n    expect(abortSql).toMatch(/ABORT/i);\n    expect(abortSql).not.toMatch(/DELETE FROM businesses/i);\n    expect(abortSql).not.toMatch(/UPDATE leads SET business_id/i);\n\n    // Seed a colliding pair in a fresh DB\n    const db2 = new PGlite();\n    await db2.exec(`\n      CREATE OR REPLACE FUNCTION uuid_generate_v4() RETURNS uuid\n        AS $$ SELECT gen_random_uuid() $$ LANGUAGE sql;\n      CREATE TABLE businesses (\n        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n        phone TEXT NOT NULL,\n        name TEXT NOT NULL DEFAULT 'x'\n      );\n      CREATE TABLE sms_suppressions (\n        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n        business_id UUID NOT NULL,\n        phone TEXT NOT NULL\n      );\n      INSERT INTO businesses (id, phone) VALUES\n        ('11111111-1111-4111-8111-111111111111', '5551234567'),\n        ('11111111-1111-4111-8111-111111111112', '+15551234567');\n    `);\n\n    let threw = false;\n    try {\n      await db2.exec(abortSql);\n    } catch (e) {\n      threw = true;\n      expect(String(e)).toMatch(/collision/i);\n    }\n    expect(threw).toBe(true);\n\n    const still = await db2.query<"+"{ n: number }>(\n      `SELECT COUNT(*)::int AS n FROM businesses`\n    );\n    expect(still.rows[0].n).toBe(2);\n  }, 60_000);\n});\n"},"src/services/quiet-hours.survivors.test.ts":{"tests":[{"id":"161","name":"nextLocalHour survivors > does not short-circuit when local second is non-zero at target hour","location":{"start":{"column":3,"line":17}}},{"id":"162","name":"nextLocalHour survivors > does not short-circuit when local minute is non-zero (same hour)","location":{"start":{"column":3,"line":30}}},{"id":"163","name":"nextLocalHour survivors > uses +1 ms ceil so 07:59:59.999 lands on 08:00:00 not another :59","location":{"start":{"column":3,"line":42}}},{"id":"164","name":"nextLocalHour survivors > falls back to +24h when target local hour never appears at :00","location":{"start":{"column":3,"line":51}}},{"id":"165","name":"nextLocalHour survivors > search loop finds next-day 8:00 (not +24h fallback) from midday","location":{"start":{"column":3,"line":58}}},{"id":"166","name":"deferUntilQuietHoursOpen survivors > returns allowed when a single mapped zone is open (not unresolved)","location":{"start":{"column":3,"line":67}}},{"id":"167","name":"deferUntilQuietHoursOpen survivors > returns allowed when every dual-zone candidate is open","location":{"start":{"column":3,"line":75}}},{"id":"168","name":"deferUntilQuietHoursOpen survivors > 850 FL 20:00 end — ok uses every zone, not some, at aligned latest","location":{"start":{"column":3,"line":85}}},{"id":"169","name":"deferUntilQuietHoursOpen survivors > 850 defer uses latest open (Math.max) and requires every zone at nextSendAt","location":{"start":{"column":3,"line":110}}}],"source":"/**\n * Behaviour tests targeting Stryker survivors in quiet-hours.ts (r7 gate).\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  QUIET_START_HOUR,\n  deferUntilQuietHoursOpen,\n  isWithinQuietHoursWindow,\n  localParts,\n  nextLocalHour,\n} from './quiet-hours';\n\ndescribe('nextLocalHour survivors', () => {\n  const tz = 'America/New_York';\n\n  it('does not short-circuit when local second is non-zero at target hour', () => {\n    // 08:00:01 EDT — minute/hour match short-circuit must not fire on second alone\n    const from = new Date('2026-07-01T12:00:01.000Z');\n    const parts = localParts(from, tz);\n    expect(parts.hour).toBe(8);\n    expect(parts.minute).toBe(0);\n    expect(parts.second).toBe(1);\n    const next = nextLocalHour(from, tz, QUIET_START_HOUR);\n    expect(next.getTime()).toBeGreaterThan(from.getTime());\n    expect(localParts(next, tz).hour).toBe(8);\n    expect(localParts(next, tz).minute).toBe(0);\n  });\n\n  it('does not short-circuit when local minute is non-zero (same hour)', () => {\n    const from = new Date('2026-07-01T12:30:00.000Z'); // 08:30 EDT\n    expect(localParts(from, tz).hour).toBe(8);\n    expect(localParts(from, tz).minute).toBe(30);\n    const next = nextLocalHour(from, tz, QUIET_START_HOUR);\n    expect(next.getTime()).not.toBe(from.getTime());\n    const p = localParts(next, tz);\n    expect(p.hour).toBe(8);\n    expect(p.minute).toBe(0);\n    expect(p.day).toBe(2);\n  });\n\n  it('uses +1 ms ceil so 07:59:59.999 lands on 08:00:00 not another :59', () => {\n    const from = new Date('2026-07-01T11:59:59.999Z');\n    expect(localParts(from, tz).hour).toBe(7);\n    expect(localParts(from, tz).minute).toBe(59);\n    expect(nextLocalHour(from, tz, QUIET_START_HOUR).toISOString()).toBe(\n      '2026-07-01T12:00:00.000Z'\n    );\n  });\n\n  it('falls back to +24h when target local hour never appears at :00', () => {\n    const from = new Date('2026-07-01T12:00:00.000Z');\n    const impossibleHour = 25;\n    const next = nextLocalHour(from, tz, impossibleHour);\n    expect(next.getTime()).toBe(from.getTime() + 24 * 60 * 60 * 1000);\n  });\n\n  it('search loop finds next-day 8:00 (not +24h fallback) from midday', () => {\n    const noon = new Date('2026-07-01T16:00:00.000Z');\n    const next = nextLocalHour(noon, tz, QUIET_START_HOUR);\n    expect(next.toISOString()).toBe('2026-07-02T12:00:00.000Z');\n    expect(next.getTime()).toBeLessThan(noon.getTime() + 24 * 60 * 60 * 1000);\n  });\n});\n\ndescribe('deferUntilQuietHoursOpen survivors', () => {\n  it('returns allowed when a single mapped zone is open (not unresolved)', () => {\n    const noon = new Date('2026-07-01T16:00:00.000Z'); // 12:00 EDT\n    expect(deferUntilQuietHoursOpen(noon, { callerPhoneE164: '+12125550100' })).toEqual({\n      allowed: true,\n      zones: ['America/New_York'],\n    });\n  });\n\n  it('returns allowed when every dual-zone candidate is open', () => {\n    const bothOpen = new Date('2026-07-01T14:00:00.000Z'); // 10:00 ET / 09:00 CT\n    expect(\n      deferUntilQuietHoursOpen(bothOpen, { callerPhoneE164: '+18505550100' })\n    ).toEqual({\n      allowed: true,\n      zones: ['America/New_York', 'America/Chicago'],\n    });\n  });\n\n  it('850 FL 20:00 end — ok uses every zone, not some, at aligned latest', () => {\n    // 00:00 UTC = 20:00 ET (closed at end 20) but 19:00 CT (still open) → latest would be 12:00 UTC with only ET open\n    const now = new Date('2026-07-01T00:00:00.000Z');\n    const d = deferUntilQuietHoursOpen(now, { callerPhoneE164: '+18505550100' });\n    expect(d.allowed).toBe(false);\n    if (d.allowed || ('unresolved' in d && d.unresolved)) {\n      throw new Error('expected deferred send time');\n    }\n    expect(d.endHour).toBe(20);\n    expect(d.nextSendAt.toISOString()).toBe('2026-07-01T13:00:00.000Z');\n    expect(\n      isWithinQuietHoursWindow(d.nextSendAt, 'America/Chicago', d.endHour)\n    ).toBe(true);\n    expect(\n      isWithinQuietHoursWindow(d.nextSendAt, 'America/New_York', d.endHour)\n    ).toBe(true);\n    expect(\n      isWithinQuietHoursWindow(\n        new Date('2026-07-01T12:00:00.000Z'),\n        'America/Chicago',\n        d.endHour\n      )\n    ).toBe(false);\n  });\n\n  it('850 defer uses latest open (Math.max) and requires every zone at nextSendAt', () => {\n    const now = new Date('2026-07-01T12:00:00.000Z'); // 08:00 ET / 07:00 CT\n    const d = deferUntilQuietHoursOpen(now, { callerPhoneE164: '+18505550100' });\n    expect(d.allowed).toBe(false);\n    if (d.allowed || ('unresolved' in d && d.unresolved)) {\n      throw new Error('expected deferred send time');\n    }\n    expect(d.nextSendAt.toISOString()).toBe('2026-07-01T13:00:00.000Z');\n    expect(d.nextSendAt.toISOString()).not.toBe('2026-07-01T12:00:00.000Z');\n    expect(\n      isWithinQuietHoursWindow(d.nextSendAt, 'America/New_York', d.endHour)\n    ).toBe(true);\n    expect(\n      isWithinQuietHoursWindow(d.nextSendAt, 'America/Chicago', d.endHour)\n    ).toBe(true);\n    // CT still quiet at the earlier ET-only boundary\n    expect(\n      isWithinQuietHoursWindow(\n        new Date('2026-07-01T12:00:00.000Z'),\n        'America/Chicago',\n        d.endHour\n      )\n    ).toBe(false);\n  });\n\n});\n"},"src/services/quiet-hours.r7.test.ts":{"tests":[{"id":"170","name":"QC r7 quiet-hours: nextLocalHour behaviour > exact-hour short-circuit returns the same instant","location":{"start":{"column":3,"line":19}}},{"id":"171","name":"QC r7 quiet-hours: nextLocalHour behaviour > walks to next 8:00 when already past start hour","location":{"start":{"column":3,"line":31}}},{"id":"172","name":"QC r7 quiet-hours: nextLocalHour behaviour > DST spring-forward still lands on local 8:00","location":{"start":{"column":3,"line":40}}},{"id":"173","name":"QC r7 quiet-hours: nextLocalHour behaviour > DST fall-back still lands on local 8:00 next morning","location":{"start":{"column":3,"line":50}}},{"id":"174","name":"QC r7 quiet-hours: 850 dual-zone uses Math.max (latest) > defers until BOTH ET and CT are open — not the earlier zone alone","location":{"start":{"column":3,"line":61}}},{"id":"175","name":"QC r7 quiet-hours: 850 dual-zone uses Math.max (latest) > 850 zones resolve to ET+CT","location":{"start":{"column":3,"line":81}}},{"id":"176","name":"QC r7 quiet-hours: HI / AK area codes > 808 Hawaii defers to Honolulu local 8:00","location":{"start":{"column":3,"line":89}}},{"id":"177","name":"QC r7 quiet-hours: HI / AK area codes > 907 Alaska defers to Anchorage local 8:00","location":{"start":{"column":3,"line":110}}},{"id":"178","name":"QC r7 quiet-hours: HI / AK area codes > 808 / 907 resolve to single zone each","location":{"start":{"column":3,"line":124}}}],"source":"/**\n * QC r7: behaviour tests for nextLocalHour + multi-zone deferral\n * (replaces undocumented Stryker disable-all blocks).\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  QUIET_START_HOUR,\n  deferUntilQuietHoursOpen,\n  isWithinQuietHoursWindow,\n  localParts,\n  nextLocalHour,\n  resolveLeadTimezones,\n} from './quiet-hours';\n\ndescribe('QC r7 quiet-hours: nextLocalHour behaviour', () => {\n  const tz = 'America/New_York';\n\n  it('exact-hour short-circuit returns the same instant', () => {\n    // 08:00:00 EDT on 2026-07-01\n    const exact = new Date('2026-07-01T12:00:00.000Z');\n    const parts = localParts(exact, tz);\n    expect(parts.hour).toBe(8);\n    expect(parts.minute).toBe(0);\n    expect(parts.second).toBe(0);\n    expect(nextLocalHour(exact, tz, QUIET_START_HOUR).getTime()).toBe(\n      exact.getTime()\n    );\n  });\n\n  it('walks to next 8:00 when already past start hour', () => {\n    const noon = new Date('2026-07-01T16:00:00.000Z'); // 12:00 EDT\n    const next = nextLocalHour(noon, tz, QUIET_START_HOUR);\n    const p = localParts(next, tz);\n    expect(p.hour).toBe(8);\n    expect(p.minute).toBe(0);\n    expect(p.day).toBe(2);\n  });\n\n  it('DST spring-forward still lands on local 8:00', () => {\n    // US 2026-03-08: clocks jump 2am→3am. From 01:30 EST, next 8:00 is same day.\n    const before = new Date('2026-03-08T06:30:00.000Z'); // 01:30 EST\n    const next = nextLocalHour(before, 'America/New_York', QUIET_START_HOUR);\n    const p = localParts(next, 'America/New_York');\n    expect(p.hour).toBe(8);\n    expect(p.minute).toBe(0);\n    expect(p.day).toBe(8);\n  });\n\n  it('DST fall-back still lands on local 8:00 next morning', () => {\n    const evening = new Date('2026-11-02T03:30:00.000Z'); // 22:30 EDT Nov 1\n    const next = nextLocalHour(evening, 'America/New_York', QUIET_START_HOUR);\n    const p = localParts(next, 'America/New_York');\n    expect(p.hour).toBe(8);\n    expect(p.minute).toBe(0);\n    expect(p.day).toBe(2);\n  });\n});\n\ndescribe('QC r7 quiet-hours: 850 dual-zone uses Math.max (latest)', () => {\n  it('defers until BOTH ET and CT are open — not the earlier zone alone', () => {\n    // 12:00 UTC = 08:00 EDT / 07:00 CDT → CT still quiet\n    const now = new Date('2026-07-01T12:00:00.000Z');\n    const d = deferUntilQuietHoursOpen(now, {\n      callerPhoneE164: '+18505550100',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed && !('unresolved' in d && d.unresolved)) {\n      // Must wait for Central 8:00 (= 13:00 UTC), not Eastern 8:00 (= 12:00 UTC).\n      // Math.min would wrongly schedule at ET-open while CT is still quiet.\n      expect(d.nextSendAt.toISOString()).toBe('2026-07-01T13:00:00.000Z');\n      expect(\n        isWithinQuietHoursWindow(d.nextSendAt, 'America/New_York', d.endHour)\n      ).toBe(true);\n      expect(\n        isWithinQuietHoursWindow(d.nextSendAt, 'America/Chicago', d.endHour)\n      ).toBe(true);\n    }\n  });\n\n  it('850 zones resolve to ET+CT', () => {\n    expect(\n      resolveLeadTimezones({ callerPhoneE164: '+18505550100' }).zones\n    ).toEqual(['America/New_York', 'America/Chicago']);\n  });\n});\n\ndescribe('QC r7 quiet-hours: HI / AK area codes', () => {\n  it('808 Hawaii defers to Honolulu local 8:00', () => {\n    // 2026-07-01 10:00 UTC = 00:00 HST — quiet\n    const now = new Date('2026-07-01T10:00:00.000Z');\n    const d = deferUntilQuietHoursOpen(now, {\n      callerPhoneE164: '+18085550100',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed && !('unresolved' in d && d.unresolved)) {\n      const p = localParts(d.nextSendAt, 'Pacific/Honolulu');\n      expect(p.hour).toBe(8);\n      expect(p.minute).toBe(0);\n      expect(\n        isWithinQuietHoursWindow(\n          d.nextSendAt,\n          'Pacific/Honolulu',\n          d.endHour\n        )\n      ).toBe(true);\n    }\n  });\n\n  it('907 Alaska defers to Anchorage local 8:00', () => {\n    // 2026-07-01 10:00 UTC = 02:00 AKDT — quiet\n    const now = new Date('2026-07-01T10:00:00.000Z');\n    const d = deferUntilQuietHoursOpen(now, {\n      callerPhoneE164: '+19075550100',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed && !('unresolved' in d && d.unresolved)) {\n      const p = localParts(d.nextSendAt, 'America/Anchorage');\n      expect(p.hour).toBe(8);\n      expect(p.minute).toBe(0);\n    }\n  });\n\n  it('808 / 907 resolve to single zone each', () => {\n    expect(\n      resolveLeadTimezones({ callerPhoneE164: '+18085550100' }).zones\n    ).toEqual(['Pacific/Honolulu']);\n    expect(\n      resolveLeadTimezones({ callerPhoneE164: '+19075550100' }).zones\n    ).toEqual(['America/Anchorage']);\n  });\n});\n"},"src/services/campaigns.more.di.test.ts":{"tests":[{"id":"179","name":"campaigns more DI coverage > getEnrollmentForLead / leadHasActiveEnrollment","location":{"start":{"column":3,"line":122}}},{"id":"180","name":"campaigns more DI coverage > enrollLeadInCampaign: opted_out / no_campaigns / insert unique","location":{"start":{"column":3,"line":140}}},{"id":"181","name":"campaigns more DI coverage > listClaimableEnrollmentIds returns ids","location":{"start":{"column":3,"line":190}}},{"id":"182","name":"campaigns more DI coverage > claimDueEnrollment returns token on due claim","location":{"start":{"column":3,"line":200}}},{"id":"183","name":"campaigns more DI coverage > handleClassifiedReplyEnrollment pauses on reply","location":{"start":{"column":3,"line":219}}},{"id":"184","name":"campaigns more DI coverage > handleClassifiedReplyEnrollment defer_switch on fresh claim","location":{"start":{"column":3,"line":248}}},{"id":"185","name":"campaigns more DI coverage > reconcileAmbiguousSms post-pass abandoned + confirmed","location":{"start":{"column":3,"line":283}}},{"id":"186","name":"campaigns more DI coverage > processDueCampaigns with no claimable ids","location":{"start":{"column":3,"line":330}}},{"id":"187","name":"campaigns more DI coverage > enrollLeadInCampaign success (Standard, recovery absent)","location":{"start":{"column":3,"line":339}}},{"id":"188","name":"campaigns more DI coverage > enrollLeadInCampaign: no_matching_campaign / insert_failed","location":{"start":{"column":3,"line":404}}},{"id":"189","name":"campaigns more DI coverage > switchEnrollmentCampaign: lead_not_found / campaign_not_found / no_steps","location":{"start":{"column":3,"line":528}}},{"id":"190","name":"campaigns more DI coverage > enrollLeadInCampaign: lead_not_found / no_steps / unique race","location":{"start":{"column":3,"line":616}}},{"id":"191","name":"campaigns more DI coverage > listClaimableEnrollmentIds merges due + stale and respects limit","location":{"start":{"column":3,"line":713}}},{"id":"192","name":"campaigns more DI coverage > switchEnrollmentCampaign success with stale claim","location":{"start":{"column":3,"line":729}}},{"id":"193","name":"campaigns more DI coverage > advanceEnrollment advances then completes","location":{"start":{"column":3,"line":803}}},{"id":"194","name":"campaigns more DI coverage > reconcileAmbiguousSms recovery abandoned resend path","location":{"start":{"column":3,"line":852}}},{"id":"195","name":"campaigns-impl survivor killers (r12) > switchEnrollmentCampaign deferred_or_switch_failed when update misses","location":{"start":{"column":3,"line":899}}},{"id":"196","name":"campaigns-impl survivor killers (r12) > handleClassifiedReplyEnrollment enrolls when no enrollment","location":{"start":{"column":3,"line":948}}},{"id":"197","name":"campaigns-impl survivor killers (r12) > handleClassifiedReplyEnrollment switch maps deferred reason","location":{"start":{"column":3,"line":993}}},{"id":"198","name":"campaigns-impl survivor killers (r12) > pauseCampaignForLead error path returns without throwing","location":{"start":{"column":3,"line":1063}}},{"id":"199","name":"campaigns-impl survivor killers (r12) > claimDueEnrollment falls through to stale reclaim","location":{"start":{"column":3,"line":1075}}},{"id":"200","name":"advanceEnrollment ownership miss > returns false when update errors or empty","location":{"start":{"column":3,"line":1104}}}],"source":"/**\n * Additional DI coverage for campaigns.ts exports (honest Stryker no-cov kill).\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'mock',\n    sendMessage: vi.fn(),\n    checkLookupSupport: vi.fn(async () => ({ supported: true })),\n  }),\n}));\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    sendMessage: vi.fn(),\n    reconcileAmbiguousSms: vi.fn(async () => ({\n      unknownCount: 1,\n      stuckSendingCount: 0,\n      requeued: 0,\n      confirmed: 1,\n      parked: 0,\n      needsReview: 0,\n      alert: false,\n    })),\n    resolveRecoveryOutcome: vi.fn(async () => 'absent'),\n  };\n});\n\nvi.mock('@/services/sms', () => ({\n  processDeferredRecoveries: vi.fn(async () => ({\n    sent: 1,\n    deferred: 0,\n    errors: 0,\n  })),\n  sendRecoverySMS: vi.fn(),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...a: unknown[]) => isPhoneSuppressed(...a),\n  SuppressionLookupError: class extends Error {},\n}));\n\nimport {\n  advanceEnrollment,\n  claimDueEnrollment,\n  enrollLeadInCampaign,\n  getEnrollmentForLead,\n  handleClassifiedReplyEnrollment,\n  leadHasActiveEnrollment,\n  listClaimableEnrollmentIds,\n  processDueCampaigns,\n  reconcileAmbiguousSms,\n  switchEnrollmentCampaign,\n} from './campaigns';\nimport { createServerClient } from '@/lib/supabase';\nimport { COL } from '@/services/db-strings';\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'like',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn((cols?: string) => {\n    const nested = chainable(result);\n    nested._cols = cols;\n    nested.then = (\n      resolve: (v: unknown) => unknown,\n      reject?: (e: unknown) => unknown\n    ) => Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.update = vi.fn(() => {\n    const u = chainable(result);\n    u.select = vi.fn(() => chainable(result));\n    return u;\n  });\n  obj.insert = vi.fn(() => chainable(result));\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('campaigns more DI coverage', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  it('getEnrollmentForLead / leadHasActiveEnrollment', async () => {\n    mockFrom.mockImplementation(() =>\n      chainable({\n        data: { id: 'e', status: 'active', lead_id: 'L' },\n        error: null,\n      })\n    );\n    await expect(getEnrollmentForLead('L')).resolves.toMatchObject({\n      status: 'active',\n    });\n    await expect(leadHasActiveEnrollment('L')).resolves.toBe(true);\n\n    mockFrom.mockImplementation(() =>\n      chainable({ data: null, error: { message: 'x' } })\n    );\n    await expect(getEnrollmentForLead('L')).resolves.toBeNull();\n  });\n\n  it('enrollLeadInCampaign: opted_out / no_campaigns / insert unique', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') {\n        return chainable({\n          data: {\n            id: 'L',\n            opted_out: true,\n            urgency: null,\n            businesses: {},\n          },\n          error: null,\n        });\n      }\n      if (table === 'campaign_enrollments') {\n        return chainable({ data: null, error: null });\n      }\n      return chainable({ data: null, error: null });\n    });\n    await expect(enrollLeadInCampaign('L')).resolves.toEqual({\n      enrolled: false,\n      reason: 'opted_out',\n    });\n\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') {\n        return chainable({\n          data: {\n            id: 'L',\n            opted_out: false,\n            urgency: null,\n            sms_outbound_sid: null,\n            businesses: {},\n          },\n          error: null,\n        });\n      }\n      if (table === 'campaign_enrollments') {\n        return chainable({ data: null, error: null });\n      }\n      if (table === 'campaigns') {\n        return chainable({ data: [], error: null });\n      }\n      return chainable({ data: null, error: null });\n    });\n    await expect(enrollLeadInCampaign('L')).resolves.toEqual({\n      enrolled: false,\n      reason: 'no_campaigns',\n    });\n  });\n\n  it('listClaimableEnrollmentIds returns ids', async () => {\n    mockFrom.mockImplementation(() =>\n      chainable({\n        data: [{ id: 'a' }, { id: 'b' }],\n        error: null,\n      })\n    );\n    await expect(listClaimableEnrollmentIds(10)).resolves.toEqual(['a', 'b']);\n  });\n\n  it('claimDueEnrollment returns token on due claim', async () => {\n    mockFrom.mockImplementation(() => {\n      const b = chainable({ data: [{ id: 'e', claim_token: 't' }], error: null });\n      b.update = vi.fn(() => {\n        const u = chainable({\n          data: [{ id: 'e', claim_token: 'tok' }],\n          error: null,\n        });\n        u.select = vi.fn(() =>\n          chainable({ data: [{ id: 'e', claim_token: 'tok' }], error: null })\n        );\n        return u;\n      });\n      return b;\n    });\n    const tok = await claimDueEnrollment('e');\n    expect(tok).toBeTruthy();\n  });\n\n  it('handleClassifiedReplyEnrollment pauses on reply', async () => {\ nc () => {\n    let updates = 0;\n    mockFrom.mockImplementation(() => {\n      const b = chainable({ data: [], error: null });\n      b.update = vi.fn(() => {\n        updates += 1;\n        // first (due) miss, second (stale) hit\n        const hit = updates >= 2;\n        const u = chainable({\n          data: hit ? [{ id: 'e', claim_token: 'tok' }] : [],\n          error: null,\n        });\n        u.select = vi.fn(() =>\n          chainable({\n            data: hit ? [{ id: 'e', claim_token: 'tok' }] : [],\n            error: null,\n          })\n        );\n        return u;\n      });\n      return b;\n    });\n    const tok = await claimDueEnrollment('e');\n    expect(tok).toBeTruthy();\n    expect(updates).toBe(2);\n  });\n});\n\ndescribe('advanceEnrollment ownership miss', () => {\n  it('returns false when update errors or empty', async () => {\n    const { advanceEnrollment } = await import('./campaigns');\n    const supabase = createServerClient();\n    const steps = [\n      { step_number: 1, delay_minutes: 0, template_key: 'a' },\n      { step_number: 2, delay_minutes: 10, template_key: 'b' },\n    ] as never[];\n\n    mockFrom.mockImplementation(() => {\n      const b = chainable({ data: [], error: { message: 'x' } });\n      b.update = vi.fn(() => {\n        const u = chainable({ data: [], error: { message: 'x' } });\n        u.select = vi.fn(() =>\n          chainable({ data: [], error: { message: 'x' } })\n        );\n        return u;\n      });\n      return b;\n    });\n    await expect(\n      advanceEnrollment(supabase as never, 'e', 'tok', 1, steps)\n    ).resolves.toBe(false);\n\n    // complete path ownership miss\n    await expect(\n      advanceEnrollment(supabase as never, 'e', 'tok', 2, steps)\n    ).resolves.toBe(false);\n  });\n});\n"},"src/services/campaigns.dispatch.test.ts":{"tests":[{"id":"201","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > returns false without claim token","location":{"start":{"column":3,"line":165}}},{"id":"202","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > pauses on opted_out / suppressed","location":{"start":{"column":3,"line":175}}},{"id":"203","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > release_fail on suppression lookup error","location":{"start":{"column":3,"line":189}}},{"id":"204","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome skipped/recovery_already_sent_skip_step_1 → true","location":{"start":{"column":5,"line":239}}},{"id":"205","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/quiet_hours_deferred → true","location":{"start":{"column":5,"line":239}}},{"id":"206","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/quiet_hours_unresolved → false","location":{"start":{"column":5,"line":239}}},{"id":"207","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/recovery_pending → false","location":{"start":{"column":5,"line":239}}},{"id":"208","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/suppressed → true","location":{"start":{"column":5,"line":239}}},{"id":"209","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/opted_out → true","location":{"start":{"column":5,"line":239}}},{"id":"210","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/sends_disabled → false","location":{"start":{"column":5,"line":239}}},{"id":"211","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/duplicate_in_flight → false","location":{"start":{"column":5,"line":239}}},{"id":"212","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome blocked/invalid_phone → false","location":{"start":{"column":5,"line":239}}},{"id":"213","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome sent/ → true","location":{"start":{"column":5,"line":239}}},{"id":"214","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome needs_review/dup → false","location":{"start":{"column":5,"line":239}}},{"id":"215","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome ambiguous/recent_send → false","location":{"start":{"column":5,"line":239}}},{"id":"216","name":"sendCampaignSMS dispatch (DI via mocked sendMessage) > outcome never_sent/ → false","location":{"start":{"column":5,"line":239}}},{"id":"217","name":"pauseCampaignForLead > updates active enrollments to paused","location":{"start":{"column":3,"line":250}}},{"id":"218","name":"sendCampaignSMS survivor DB side-effects > sent → advanceEnrollment updates enrollment (not empty case)","location":{"start":{"column":3,"line":354}}},{"id":"219","name":"sendCampaignSMS survivor DB side-effects > quiet_hours_deferred → releaseClaim with nextSendAt payload","location":{"start":{"column":3,"line":376}}},{"id":"220","name":"sendCampaignSMS survivor DB side-effects > getTemplate receives business name and issue (not empty literals)","location":{"start":{"column":3,"line":394}}}],"source":"/**\n * Cover sendCampaignSMS dispatch branches via mocked sendMessage.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSendMessage = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({ name: 'mock', sendMessage: vi.fn() }),\n}));\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    sendMessage: (...a: unknown[]) => mockSendMessage(...a),\n    reconcileAmbiguousSms: vi.fn(async () => ({\n      unknownCount: 0,\n      stuckSendingCount: 0,\n      requeued: 0,\n      confirmed: 0,\n      parked: 0,\n      needsReview: 0,\n      alert: false,\n    })),\n  };\n});\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...a: unknown[]) => isPhoneSuppressed(...a),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/sms', () => ({\n  processDeferredRecoveries: vi.fn(async () => ({\n    sent: 0,\n    deferred: 0,\n    errors: 0,\n  })),\n  sendRecoverySMS: vi.fn(),\n}));\n\nimport { sendCampaignSMS, pauseCampaignForLead } from './campaigns';\nimport { SuppressionLookupError } from '@/services/suppressions';\nimport type { SendOutcome } from '@/services/send/types';\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn(() => {\n    const nested = chainable(result);\n    nested.then = (\n      resolve: (v: unknown) => unknown,\n      reject?: (e: unknown) => unknown\n    ) => Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.update = vi.fn(() => {\n    const u = chainable(result);\n    u.select = vi.fn(() => chainable(result));\n    return u;\n  });\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\nconst enrollmentRow = {\n  id: 'enr-1',\n  current_step: 1,\n  status: 'active',\n  claim_token: 'tok',\n  leads: {\n    id: 'lead-1',\n    caller_phone: '+12135550100',\n    opted_out: false,\n    issue: 'leak',\n    timezone: 'America/Los_Angeles',\n    businesses: {\n      id: 'b',\n      name: 'Acme',\n      timezone: 'America/Los_Angeles',\n    },\n  },\n  campaigns: { id: 'camp-std', name: 'Standard', urgency_filter: null },\n};\n\nconst steps = [\n  { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n  { step_number: 2, delay_minutes: 60, template_key: 'standard_followup_1' },\n];\n\nfunction mockEnrollmentDb(overrides?: {\n  enrollment?: typeof enrollmentRow | null;\n  steps?: typeof steps;\n}) {\n  const enr = overrides?.enrollment === undefined\n    ? enrollmentRow\n    : overrides.enrollment;\n  const st = overrides?.steps ?? steps;\n  mockFrom.mockImplementation((table: string) => {\n    if (table === 'campaign_enrollments') {\n      const builder = chainable({ data: enr, error: enr ? null : { message: 'x' } });\n      builder.single = vi.fn(async () => ({\n        data: enr,\n        error: enr ? null : { message: 'x' },\n      }));\n      builder.update = vi.fn(() => {\n        const u = chainable({ data: [{ id: 'enr-1' }], error: null });\n        u.select = vi.fn(() =>\n          chainable({ data: [{ id: 'enr-1' }], error: null })\n        );\n        return u;\n      });\n      return builder;\n    }\n    if (table === 'campaign_steps') {\n      return chainable({ data: st, error: null });\n    }\n    if (table === 'leads') {\n      return chainable({ data: null, error: null });\n    }\n    return chainable({ data: null, error: null });\n  });\n}\n\ndescribe('sendCampaignSMS dispatch (DI via mocked sendMessage)', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  it('returns false without claim token', async () => {\n    mockEnrollmentDb({\n      enrollment: {\n        ...enrollmentRow,\n        claim_token: null,\n      } as unknown as typeof enrollmentRow,\n    });\n    await expect(sendCampaignSMS('enr-1')).resolves.toBe(false);\n  });\n\n  it('pauses on opted_out / suppressed', async () => {\n    mockEnrollmentDb({\n      enrollment: {\n        ...enrollmentRow,\n        leads: { ...enrollmentRow.leads, opted_out: true },\n      },\n    });\n    await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(true);\n\n    mockEnrollmentDb();\n    isPhoneSuppressed.mockResolvedValue(true);\n    await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(true);\n  });\n\n  it('release_fail on suppression lookup error', async () => {\n    mockEnrollmentDb();\n    isPhoneSuppressed.mockRejectedValue(new SuppressionLookupError('x'));\n    await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(false);\n  });\n\n  const cases: Array<"+"[SendOutcome, boolean]> = [\n    [\n      { kind: 'skipped', reason: 'recovery_already_sent_skip_step_1' },\n      true,\n    ],\n    [\n      {\n        kind: 'blocked',\n        reason: 'quiet_hours_deferred',\n        nextSendAt: '2026-01-01T00:00:00.000Z',\n      },\n      true,\n    ],\n    [{ kind: 'blocked', reason: 'quiet_hours_unresolved' }, false],\n    [{ kind: 'blocked', reason: 'recovery_pending' }, false],\n    [{ kind: 'blocked', reason: 'suppressed' }, true],\n    [{ kind: 'blocked', reason: 'opted_out' }, true],\n    [{ kind: 'blocked', reason: 'sends_disabled' }, false],\n    [{ kind: 'blocked', reason: 'duplicate_in_flight' }, false],\n    [{ kind: 'blocked', reason: 'invalid_phone' }, false],\n    [\n      {\n        kind: 'sent',\n        sid: 's',\n        messageId: 'm',\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      },\n      true,\n    ],\n    [{ kind: 'needs_review', sid: 's', reason: 'dup' }, false],\n    [\n      {\n        kind: 'ambiguous',\n        sid: 's',\n        reason: 'recent_send',\n        nextRetryAt: '2099-01-01T00:00:00.000Z',\n      },\n      false,\n    ],\n    [{ kind: 'never_sent', sid: 's' }, false],\n  ];\n\n  for (const [outcome, expected] of cases) {\n    it(`outcome ${outcome.kind}/${'reason' in outcome ? outcome.reason : ''} → ${expected}`, async () => {\n      mockEnrollmentDb();\n      mockSendMessage.mockResolvedValue(outcome);\n      await expect(sendCampaignSMS('enr-1', 'tok')).resolves.toBe(expected);\n    });\n  }\n});\n\ndescribe('pauseCampaignForLead', () => {\n  beforeEach(() => mockFrom.mockReset());\n\n  it('updates active enrollments to paused', async () => {\n    const updates: unknown[] = [];\n    mockFrom.mockImplementation(() => {\n      const b = chainable({ data: null, error: null });\n      b.update = vi.fn((row: unknown) => {\n        updates.push(row);\n        return b;\n      });\n      return b;\n    });\n    await pauseCampaignForLead('lead-1');\n    expect(updates[0]).toMatchObject({ status: 'paused' });\n  });\n});\n\n\n\ndescribe(\"sendCampaignSMS survivor DB side-effects\", () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  function collectUpdates() {\n    const updates: Array<"+"{ table: string; payload: unknown }> = [];\n    const orig = mockFrom.getMockImplementation();\n    mockEnrollmentDb();\n    mockFrom.mockImplementation((table: string) => {\n      const b = (orig ? orig(table) : null) as any;\n      // wrap from mockEnrollmentDb\n      return b;\n    });\n    // rebuild with update capture\n    mockFrom.mockImplementation((table: string) => {\n      const base: any = {\n        select: vi.fn(function (this: any) { return this; }),\n        eq: vi.fn(function (this: any) { return this; }),\n        order: vi.fn(function (this: any) { return this; }),\n        update: vi.fn((payload: unknown) => {\n          updates.push({ table, payload });\n          const u: any = {\n            eq: vi.fn(function (this: any) { return this; }),\n            select: vi.fn(() => u),\n            maybeSingle: vi.fn(async () => ({ data: { id: \"e\" }, error: null })),\n            then: (resolve: any, reject?: any) =>\n              Promise.resolve({ data: [{ id: \"e\" }], error: null }).then(resolve, reject),\n          };\n          return u;\n        }),\n        single: vi.fn(async () => ({\n          data:\n            table === \"campaign_enrollments\"\n              ? {\n                  id: \"enr-1\",\n                  claim_token: \"tok\",\n                  current_step: 1,\n                  lead_id: \"L\",\n                  campaign_id: \"C\",\n                  status: \"active\",\n                  leads: {\n                    id: \"L\",\n                    caller_phone: \"+12135550100\",\n                    opted_out: false,\n                    issue: \"leak\",\n                    timezone: \"America/Los_Angeles\",\n                    businesses: {\n                      id: \"B\",\n                      name: \"Acme\",\n                      timezone: \"America/Los_Angeles\",\n                    },\n                  },\n                  campaigns: { id: \"C\", name: \"Standard\" },\n                }\n              : table === \"campaign_steps\"\n                ? null\n                : null,\n          error: null,\n        })),\n        maybeSingle: vi.fn(async () => ({ data: null, error: null })),\n        then: (resolve: any, reject?: any) => {\n          if (table === \"campaign_steps\") {\n            return Promise.resolve({\n              data: [\n                { step_number: 1, delay_minutes: 0, template_key: \"a\" },\n                { step_number: 2, delay_minutes: 10, template_key: \"b\" },\n              ],\n              error: null,\n            }).then(resolve, reject);\n          }\n          return Promise.resolve({ data: null, error: null }).then(resolve, reject);\n        },\n      };\n      // make chainable self-return for select/eq/order\n      for (const m of [\"select\", \"eq\", \"order\", \"is\", \"lte\", \"lt\", \"or\"]) {\n        base[m] = vi.fn(function (this: any) { return this; });\n      }\n      base.select = vi.fn(() => base);\n      return base;\n    });\n    return updates;\n  }\n\n  it(\"sent → advanceEnrollment updates enrollment (not empty case)\", async () => {\n    const updates = collectUpdates();\n    mockSendMessage.mockResolvedValue({\n      kind: \"sent\",\n      sid: \"s\",\n      messageId: \"m\",\n      providerStatus: \"queued\",\n      keySupportedAtSend: true,\n    });\n    await expect(sendCampaignSMS(\"enr-1\", \"tok\")).resolves.toBe(true);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === \"campaign_enrollments\" &&\n          u.payload &&\n          typeof u.payload === \"object\" &&\n          (\"current_step\" in (u.payload as object) ||\n            \"status\" in (u.payload as object))\n      )\n    ).toBe(true);\n  });\n\n  it(\"quiet_hours_deferred → releaseClaim with nextSendAt payload\", async () => {\n    const updates = collectUpdates();\n    mockSendMessage.mockResolvedValue({\n      kind: \"blocked\",\n      reason: \"quiet_hours_deferred\",\n      nextSendAt: \"2026-01-01T00:00:00.000Z\",\n    });\n    await expect(sendCampaignSMS(\"enr-1\", \"tok\")).resolves.toBe(true);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === \"campaign_enrollments\" &&\n          (u.payload as { next_send_at?: string })?.next_send_at ===\n            \"2026-01-01T00:00:00.000Z\"\n      )\n    ).toBe(true);\n  });\n\n  it(\"getTemplate receives business name and issue (not empty literals)\", async () => {\n    collectUpdates();\n    let bodySeen = \"\";\n    mockSendMessage.mockImplementation(async (req: { body: string }) => {\n      bodySeen = req.body;\n      return {\n        kind: \"sent\",\n        sid: \"s\",\n        messageId: \"m\",\n        providerStatus: \"queued\",\n        keySupportedAtSend: true,\n      };\n    });\n    await sendCampaignSMS(\"enr-1\", \"tok\");\n    // template fallback still includes business/issue context somehow, or at least non-empty body\n    expect(bodySeen.length).toBeGreaterThan(0);\n  });\n});\n"},"src/services/quiet-hours.test.ts":{"tests":[{"id":"221","name":"quiet hours timezone resolution > prefers lead timezone, then area code; never business fallback","location":{"start":{"column":3,"line":16}}},{"id":"222","name":"quiet hours timezone resolution > uses 8pm end for FL/OK; 850 is Eastern AND Central","location":{"start":{"column":3,"line":38}}},{"id":"223","name":"quiet hours window edges > allows 8:00 local and blocks 7:59","location":{"start":{"column":3,"line":57}}},{"id":"224","name":"quiet hours window edges > blocks at end hour (exclusive) — 21:00 default, 20:00 FL","location":{"start":{"column":3,"line":71}}},{"id":"225","name":"quiet hours window edges > defers (does not drop) outside window","location":{"start":{"column":3,"line":88}}},{"id":"226","name":"quiet hours window edges > 7:59:59 → exactly 8:00:00 (not 8:00:59)","location":{"start":{"column":3,"line":103}}},{"id":"227","name":"quiet hours window edges > handles DST spring-forward (US 2026-03-08)","location":{"start":{"column":3,"line":109}}},{"id":"228","name":"quiet hours window edges > handles DST fall-back (US 2026-11-01)","location":{"start":{"column":3,"line":118}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  QUIET_END_HOUR_DEFAULT,\n  QUIET_END_HOUR_FL_OK,\n  QUIET_START_HOUR,\n  deferUntilQuietHoursOpen,\n  isWithinQuietHoursWindow,\n  localParts,\n  nextLocalHour,\n  quietEndHourForPhone,\n  resolveLeadTimezone,\n  resolveLeadTimezones,\n} from './quiet-hours';\n\ndescribe('quiet hours timezone resolution', () => {\n  it('prefers lead timezone, then area code; never business fallback', () => {\n    expect(\n      resolveLeadTimezone({\n        leadTimezone: 'America/Denver',\n        callerPhoneE164: '+13055551234',\n        businessTimezone: 'America/Chicago',\n      })\n    ).toBe('America/Denver');\n\n    expect(\n      resolveLeadTimezones({\n        callerPhoneE164: '+13055551234',\n        businessTimezone: 'America/Chicago',\n      }).zones\n    ).toEqual(['America/New_York']);\n\n    // Unmapped / no phone → unresolved (empty). Deprecated helper may default.\n    expect(\n      resolveLeadTimezones({ businessTimezone: 'America/Chicago' }).zones\n    ).toEqual([]);\n  });\n\n  it('uses 8pm end for FL/OK; 850 is Eastern AND Central', () => {\n    expect(quietEndHourForPhone('+13055551234')).toBe(QUIET_END_HOUR_FL_OK);\n    expect(quietEndHourForPhone('+12395551234')).toBe(QUIET_END_HOUR_FL_OK);\n    expect(quietEndHourForPhone('+15725551234')).toBe(QUIET_END_HOUR_FL_OK);\n    expect(resolveLeadTimezones({ callerPhoneE164: '+18505551234' }).zones).toEqual([\n      'America/New_York',\n      'America/Chicago',\n    ]);\n    expect(quietEndHourForPhone('+12125551234')).toBe(QUIET_END_HOUR_DEFAULT);\n    expect(resolveLeadTimezones({ callerPhoneE164: '+18085551234' }).zones).toEqual([\n      'Pacific/Honolulu',\n    ]);\n  });\n});\n\n\ndescribe('quiet hours window edges', () => {\n  const tz = 'America/New_York';\n\n  it('allows 8:00 local and blocks 7:59', () => {\n    const at8 = new Date('2026-03-10T12:00:00.000Z');\n    expect(localParts(at8, tz).hour).toBe(QUIET_START_HOUR);\n    expect(isWithinQuietHoursWindow(at8, tz, QUIET_END_HOUR_DEFAULT)).toBe(\n      true\n    );\n\n    const before8 = new Date('2026-03-10T11:59:00.000Z');\n    expect(localParts(before8, tz).hour).toBe(7);\n    expect(isWithinQuietHoursWindow(before8, tz, QUIET_END_HOUR_DEFAULT)).toBe(\n      false\n    );\n  });\n\n  it('blocks at end hour (exclusive) — 21:00 default, 20:00 FL', () => {\n    const at21 = new Date('2026-07-01T01:00:00.000Z');\n    expect(localParts(at21, tz).hour).toBe(21);\n    expect(isWithinQuietHoursWindow(at21, tz, QUIET_END_HOUR_DEFAULT)).toBe(\n      false\n    );\n\n    const at20 = new Date('2026-07-01T00:00:00.000Z');\n    expect(localParts(at20, tz).hour).toBe(20);\n    expect(isWithinQuietHoursWindow(at20, tz, QUIET_END_HOUR_FL_OK)).toBe(\n      false\n    );\n    expect(isWithinQuietHoursWindow(at20, tz, QUIET_END_HOUR_DEFAULT)).toBe(\n      true\n    );\n  });\n\n  it('defers (does not drop) outside window', () => {\n    const late = new Date('2026-07-01T02:00:00.000Z');\n    const result = deferUntilQuietHoursOpen(late, {\n      callerPhoneE164: '+12125551234',\n      businessTimezone: tz,\n    });\n    expect(result.allowed).toBe(false);\n    if (!result.allowed && !('unresolved' in result && result.unresolved)) {\n      expect(result.nextSendAt.getTime()).toBeGreaterThan(late.getTime());\n      const parts = localParts(result.nextSendAt, tz);\n      expect(parts.hour).toBe(QUIET_START_HOUR);\n      expect(parts.minute).toBe(0);\n    }\n  });\n\n  it('7:59:59 → exactly 8:00:00 (not 8:00:59)', () => {\n    const from = new Date('2026-07-01T11:59:59.000Z'); // 07:59:59 EDT\n    const next = nextLocalHour(from, tz, QUIET_START_HOUR);\n    expect(next.toISOString()).toBe('2026-07-01T12:00:00.000Z');\n  });\n\n  it('handles DST spring-forward (US 2026-03-08)', () => {\n    const before = new Date('2026-03-08T11:30:00.000Z');\n    const next = nextLocalHour(before, tz, QUIET_START_HOUR);\n    const parts = localParts(next, tz);\n    expect(parts.hour).toBe(8);\n    expect(parts.minute).toBe(0);\n    expect(parts.day).toBe(8);\n  });\n\n  it('handles DST fall-back (US 2026-11-01)', () => {\n    const evening = new Date('2026-11-02T03:30:00.000Z');\n    const eveningLocal = localParts(evening, tz);\n    expect(eveningLocal.hour).toBe(22);\n    const next = nextLocalHour(evening, tz, QUIET_START_HOUR);\n    const parts = localParts(next, tz);\n    expect(parts.hour).toBe(8);\n    expect(parts.minute).toBe(0);\n    expect(parts.day).toBeGreaterThan(eveningLocal.day);\n  });\n});\n"},"src/services/campaigns.cron.di.test.ts":{"tests":[{"id":"229","name":"campaigns cron DI > listClaimableEnrollmentIds empty on error","location":{"start":{"column":3,"line":106}}},{"id":"230","name":"campaigns cron DI > processDueCampaigns claims and sends","location":{"start":{"column":3,"line":113}}},{"id":"231","name":"campaigns cron DI > reconcileAmbiguousSms recovery abandoned resend path","location":{"start":{"column":3,"line":178}}},{"id":"232","name":"campaigns cron DI > processDueCampaigns increments skipped when claim returns null","location":{"start":{"column":3,"line":217}}},{"id":"233","name":"campaigns cron DI > processDueCampaigns catch path parks enrollment and counts error","location":{"start":{"column":3,"line":236}}},{"id":"234","name":"campaigns cron DI > claimDueEnrollment returns token on due hit","location":{"start":{"column":3,"line":294}}},{"id":"235","name":"campaigns cron DI > leadHasActiveEnrollment is true only for status active","location":{"start":{"column":3,"line":317}}}],"source":"/**\n * Drive processDueCampaigns + reconcile post-pass branches under mocks.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSendMessage = vi.fn();\nconst mockCheckSupport = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'mock',\n    sendMessage: mockSendMessage,\n    checkLookupSupport: (...a: unknown[]) => mockCheckSupport(...a),\n  }),\n}));\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    sendMessage: (...a: unknown[]) => mockSendMessage(...a),\n    reconcileAmbiguousSms: vi.fn(async () => ({\n      unknownCount: 0,\n      stuckSendingCount: 0,\n      requeued: 0,\n      confirmed: 0,\n      parked: 0,\n      needsReview: 0,\n      alert: false,\n    })),\n    resolveRecoveryOutcome: vi.fn(async () => 'absent'),\n  };\n});\n\nvi.mock('@/services/sms', () => ({\n  processDeferredRecoveries: vi.fn(async () => ({\n    sent: 0,\n    deferred: 0,\n    errors: 0,\n  })),\n  sendRecoverySMS: vi.fn(async () => undefined),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: vi.fn(async () => false),\n  SuppressionLookupError: class extends Error {},\n}));\n\nimport {\n  claimDueEnrollment,\n  leadHasActiveEnrollment,\n  listClaimableEnrollmentIds,\n  processDueCampaigns,\n  reconcileAmbiguousSms,\n} from './campaigns';\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select', 'insert', 'update', 'eq', 'lte', 'lt', 'is', 'or', 'in', 'like',\n    'order', 'limit', 'single', 'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn(() => {\n    const nested = chainable(result);\n    nested.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n      Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.update = vi.fn(() => {\n    const u = chainable(result);\n    u.select = vi.fn(() => chainable(result));\n    return u;\n  });\n  obj.insert = vi.fn(() => chainable(result));\n  obj.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n    Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('campaigns cron DI', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    mockCheckSupport.mockReset();\n    mockCheckSupport.mockResolvedValue({ supported: true });\n    // Speed up delay in processDueCampaigns\n    vi.spyOn(global, 'setTimeout').mockImplementation(((fn: () => void) => {\n      fn();\n      return 0 as unknown as ReturnType<"+"typeof setTimeout>;\n    }) as unknown as typeof setTimeout);\n  });\n\n  it('listClaimableEnrollmentIds empty on error', async () => {\n    mockFrom.mockImplementation(() =>\n      chainable({ data: null, error: { message: 'x' } })\n    );\n    await expect(listClaimableEnrollmentIds(5)).resolves.toEqual([]);\n  });\n\n  it('processDueCampaigns claims and sends', async () => {\n    let claimCalls = 0;\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        claimCalls += 1;\n        // First calls: listClaimable → ids; then claim update; then send fetch\n        if (claimCalls <"+"= 2) {\n          return chainable({ data: [{ id: 'enr-1' }], error: null });\n        }\n        const enrollmentRow = {\n          id: 'enr-1',\n          current_step: 2,\n          status: 'active',\n          claim_token: 'tok',\n          leads: {\n            id: 'L',\n            caller_phone: '+12135550100',\n            opted_out: false,\n            issue: '',\n            businesses: { id: 'B', name: 'Acme', timezone: 'America/New_York' },\n          },\n          campaigns: { id: 'C', name: 'Standard' },\n        };\n        const b = chainable({ data: enrollmentRow, error: null });\n        b.single = vi.fn(async () => ({ data: enrollmentRow, error: null }));\n        b.update = vi.fn(() => {\n          const u = chainable({\n            data: [{ id: 'enr-1', claim_token: 'tok' }],\n            error: null,\n          });\n          u.select = vi.fn(() =>\n            chainable({\n              data: [{ id: 'enr-1', claim_token: 'tok' }],\n              error: null,\n            })\n          );\n          return u;\n        });\n        return b;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({\n          data: [\n            { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n            { step_number: 2, delay_minutes: 60, template_key: 'standard_followup_1' },\n          ],\n          error: null,\n        });\n      }\n      return chainable({ data: [], error: null });\n    });\n\n    mockSendMessage.mockResolvedValue({\n      kind: 'sent',\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    });\n\n    const r = await processDueCampaigns();\n    ex
