aign-runtime DI send path > suppression lookup failure → release_fail (no send)","location":{"start":{"column":3,"line":369}}}],"source":"/**\n * DI tests for campaign-runtime: db/clock/gateway injected; assert exact\n * side-effects for each send dispatch path.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\nimport type { CampaignDeps } from './campaign-deps';\nimport {\n  sendCampaignSMSWithDeps,\n  claimDueEnrollmentWithDeps,\n  pauseCampaignForLeadWithDeps,\n} from './campaign-runtime';\nimport type { SendOutcome } from './send/types';\nimport { SuppressionLookupError } from './suppressions';\n\nconst FIXED = new Date('2026-06-15T12:00:00.000Z');\n\nfunction enrollmentRow() {\n  return {\n    id: 'enr-1',\n    claim_token: 'tok',\n    current_step: 1,\n    lead_id: 'L',\n    campaign_id: 'C',\n    status: 'active',\n    leads: {\n      id: 'L',\n      caller_phone: '+12135550100',\n      opted_out: false,\n      issue: 'flood',\n      timezone: 'America/Los_Angeles',\n      businesses: {\n        id: 'B',\n        name: 'Acme Plumbing',\n        timezone: 'America/Los_Angeles',\n      },\n    },\n    campaigns: { id: 'C', name: 'Standard' },\n  };\n}\n\ndescribe('campaign-runtime DI send path', () => {\n  let updates: Array<"+"{ table: string; payload: unknown }>;\n  let sendMessage: ReturnType<"+"typeof vi.fn>;\n  let deps: CampaignDeps;\n\n  beforeEach(() => {\n    updates = [];\n    sendMessage = vi.fn();\n    const steps = [\n      { step_number: 1, delay_minutes: 0, template_key: 'step1' },\n      { step_number: 2, delay_minutes: 10, template_key: 'step2' },\n    ];\n\n    deps = {\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {\n              select: vi.fn(function (this: any) {\n                return this;\n              }),\n              eq: vi.fn(function (this: any) {\n                return this;\n              }),\n              order: vi.fn(function (this: any) {\n                return this;\n              }),\n              lte: vi.fn(function (this: any) {\n                return this;\n              }),\n              lt: vi.fn(function (this: any) {\n                return this;\n              }),\n              is: vi.fn(function (this: any) {\n                return this;\n              }),\n              or: vi.fn(function (this: any) {\n                return this;\n              }),\n              in: vi.fn(function (this: any) {\n                return this;\n              }),\n              limit: vi.fn(function (this: any) {\n                return this;\n              }),\n              update: vi.fn((payload: unknown) => {\n                updates.push({ table, payload });\n                const u: any = {\n                  eq: vi.fn(function (this: any) {\n                    return this;\n                  }),\n                  select: vi.fn(() => u),\n                  maybeSingle: vi.fn(async () => ({\n                    data: { id: 'e' },\n                    error: null,\n                  })),\n                  then: (resolve: any, reject?: any) =>\n                    Promise.resolve({\n                      data: [{ id: 'e', claim_token: 'tok' }],\n                      error: null,\n                    }).then(resolve, reject),\n                };\n                return u;\n              }),\n              single: vi.fn(async () => ({\n                data: table === 'campaign_enrollments' ? enrollmentRow() : null,\n                error: null,\n              })),\n              maybeSingle: vi.fn(async () => ({ data: null, error: null })),\n              then: (resolve: any, reject?: any) => {\n                if (table === 'campaign_steps') {\n                  return Promise.resolve({ data: steps, error: null }).then(\n                    resolve,\n                    reject\n                  );\n                }\n                return Promise.resolve({ data: null, error: null }).then(\n                  resolve,\n                  reject\n                );\n              },\n            };\n            b.select = vi.fn(() => b);\n            return b;\n          },\n        }) as any,\n      clock: () => FIXED,\n      adapter: () => ({ name: 'mock' }) as any,\n      sendMessage: sendMessage as any,\n      sendRecoverySMS: vi.fn() as any,\n      processDeferredRecoveries: vi.fn(async () => ({\n        sent: 0,\n        deferred: 0,\n        errors: 0,\n      })) as any,\n      isPhoneSuppressed: vi.fn(async () => false),\n      SuppressionLookupError,\n      getTemplate: (_key, vars) =>\n        `Hi from ${vars.business} about ${vars.issue}`,\n      uuid: () => 'uuid-fixed',\n      sleep: vi.fn(async () => undefined),\n    };\n  });\n\n  async function run(outcome: SendOutcome) {\n    sendMessage.mockResolvedValue(outcome);\n    return sendCampaignSMSWithDeps(deps, 'enr-1', 'tok');\n  }\n\n  it('sent → advanceEnrollment update (current_step/status payload)', async () => {\n    await expect(run({\n      kind: 'sent',\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    })).resolves.toBe(true);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === 'campaign_enrollments' &&\n          u.payload &&\n          typeof u.payload === 'object' &&\n          ('current_step' in (u.payload as object) ||\n            'status' in (u.payload as object))\n      )\n    ).toBe(true);\n    expect(sendMessage).toHaveBeenCalledWith(\n      expect.objectContaining({\n        kind: 'campaign',\n        leadId: 'L',\n        businessId: 'B',\n        body: expect.stringContaining('Acme Plumbing'),\n        // mut.py #16 — must pass lead timezone (not null)\n        leadTimezone: 'America/Los_Angeles',\n      })\n    );\n    expect(sendMessage.mock.calls[0][0].body).toContain('flood');\n    expect(sendMessage.mock.calls[0][0].leadTimezone).not.toBeNull();\n  });\n\n  it('quiet_hours_deferred → release with nextSendAt', async () => {\n    await expect(\n      run({\n        kind: 'blocked',\n        reason: 'quiet_hours_deferred',\n        nextSendAt: '2026-01-01T00:00:00.000Z',\n      })\n    ).resolves.toBe(true);\n    expect(\n      updates.some(\n        (u) =>\n          (u.payload as { next_send_at?: string })?.next_send_at ===\n          '2026-01-01T00:00:00.000Z'\n      )\n    ).toBe(true);\n  });\n\n  it('quiet_hours_unresolved → lead review + release', async () => {\n    await expect(\n      run({ kind: 'blocked', reason: 'quiet_hours_unresolved' })\n    ).resolves.toBe(false);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === 'leads' &&\n          (u.payload as { needs_human_review?: boolean })\n            ?.needs_human_review === true\n      )\n    ).toBe(true);\n  });\n\n  it('ambiguous → park release (next_send_at set)', async () => {\n    await expect(\n      run({\n        kind: 'ambiguous',\n        sid: 's',\n        reason: 'unknown',\n        nextRetryAt: '2099-01-01T00:00:00.000Z',\n      })\n    ).resolves.toBe(false);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === 'campaign_enrollments' &&\n          Boolean((u.payload as { next_send_at?: string })?.next_send_at)\n      )\n    ).toBe(true);\n  });\n\n  it('opted_out outcome → pause enrollment', async () => {\n    await expect(run({ kind: 'blocked', reason: 'opted_out' })).resolves.toBe(\n      true\n    );\n    expect(\n      updates.some(\n        (u) => (u.payload as { status?: string })?.status === 'paused'\n      )\n    ).toBe(true);\n  });\n\n  it('needs_review → terminal needs_review status (not advance)', async () => {\n    await expect(\n      run({ kind: 'needs_review', reason: 'duplicate_failed', sid: 's' })\n    ).resolves.toBe(false);\n    expect(\n      updates.some(\n        (u) =>\n          (u.payload as { status?: string })?.status === 'needs_review'\n      )\n    ).toBe(true);\n    expect(\n      updates.every(\n        (u) => !('current_step' in ((u.payload as object) || {}))\n      )\n    ).toBe(true);\n  });\n\n  it('never_sent → park clears claim (not advance)', async () => {\n    await expect(run({ kind: 'never_sent', sid: 's' })).resolves.toBe(false);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === 'campaign_enrollments' &&\n          (u.payload as { claim_token?: unknown })?.claim_token === null\n      )\n    ).toBe(true);\n    expect(\n      updates.every(\n        (u) => !('current_step' in ((u.payload as object) || {}))\n      )\n    ).toBe(true);\n  });\n\n  it('blocked unknown reason → noop_release clears claim (kills empty noop handler)', async () => {\n    await expect(\n      run({ kind: 'blocked', reason: 'totally_unknown' as any })\n    ).resolves.toBe(false);\n    expect(\n      updates.some(\n        (u) =>\n          u.table === 'campaign_enrollments' &&\n          (u.payload as { claim_token?: unknown })?.claim_token === null\n      )\n    ).toBe(true);\n  });\n\n  it('template uses business name + issue; name arg is empty string', async () => {\n    const getTemplate = vi.fn((_key: string, vars: { business: string; name: string; issue: string }) => {\n      expect(vars.name).toBe('');\n      expect(vars.business).toBe('Acme Plumbing');\n      expect(vars.issue).toBe('flood');\n      return `Hi from ${vars.business} about ${vars.issue}`;\n    });\n    deps.getTemplate = getTemplate as any;\n    await run({\n      kind: 'sent',\n      sid: 's',\n      messageId: 'm',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n    });\n    expect(getTemplate).toHaveBeenCalled();\n    const body = sendMessage.mock.calls[0][0].body as string;\n    expect(body).toContain('Acme Plumbing');\n    expect(body).toContain('flood');\n  });\n\n  it('flag_unresolved_tz writes needs_human_review lead payload (not empty object)', async () => {\n    await run({ kind: 'blocked', reason: 'quiet_hours_unresolved' });\n    const leadUpdate = updates.find((u) => u.table === 'leads');\n    expect(leadUpdate?.payload).toMatchObject({\n      needs_human_review: true,\n      needs_human_review_reason: 'quiet_hours_unresolved',\n    });\n  });\n\n  it('clock injected into pause payload nowIso', async () => {\n    await pauseCampaignForLeadWithDeps(deps, 'L');\n    expect(updates[0]?.payload).toMatchObject({\n      status: 'paused',\n      paused_at: FIXED.toISOString(),\n    });\n  });\n\n  it('claimDueEnrollment uses deps.uuid + clock', async () => {\n    // rebuild db so update() returns a full chain including lte/is/select\n    deps.db = () =>\n      ({\n        from: (table: string) => {\n          const b: any = {};\n          const self = () => b;\n          for (const m of [\n            'select',\n            'update',\n            'eq',\n            'lte',\n            'lt',\n            'is',\n            'or',\n            'order',\n            'limit',\n          ]) {\n            b[m] = vi.fn(self);\n          }\n          b.update = vi.fn((payload: unknown) => {\n            updates.push({ table, payload });\n            return b;\n          });\n          b.then = (resolve: any, reject?: any) =>\n            Promise.resolve({\n              data: [{ id: 'enr-1', claim_token: 'uuid-fixed' }],\n              error: null,\n            }).then(resolve, reject);\n          return b;\n        },\n      }) as any;\n    const token = await claimDueEnrollmentWithDeps(deps, 'enr-1');\n    expect(token).toBe('uuid-fixed');\n    expect(\n      updates.some(\n        (u) =>\n          (u.payload as { claim_token?: string })?.claim_token === 'uuid-fixed'\n      )\n    ).toBe(true);\n  });\n\n  it('suppression lookup failure → release_fail (no send)', async () => {\n    deps.isPhoneSuppressed = vi.fn(async () => {\n      throw new SuppressionLookupError('down');\n    });\n    await expect(\n      sendCampaignSMSWithDeps(deps, 'enr-1', 'tok')\n    ).resolves.toBe(false);\n    expect(sendMessage).not.toHaveBeenCalled();\n    expect(\n      updates.some(\n        (u) =>\n          (u.payload as { claim_token?: unknown })?.claim_token === null\n      )\n    ).toBe(true);\n  });\n});\n"},"src/services/opt-out.mutation.test.ts":{"tests":[{"id":"302","name":"opt-out normalize helpers (survivor killers) > replaceNbspWithSpace keeps a real space (not delete)","location":{"start":{"column":3,"line":18}}},{"id":"303","name":"opt-out normalize helpers (survivor killers) > stripEdgeQuotes needs both ^ and $ anchors","location":{"start":{"column":3,"line":23}}},{"id":"304","name":"opt-out normalize killers > strips emoji exactly (not replaced with filler)","location":{"start":{"column":3,"line":32}}},{"id":"305","name":"opt-out normalize killers > nbsp becomes space then collapses","location":{"start":{"column":3,"line":36}}},{"id":"306","name":"opt-out normalize killers > newlines become spaces (need + quantifier, not empty replace)","location":{"start":{"column":3,"line":40}}},{"id":"307","name":"opt-out normalize killers > trims leading/trailing whitespace before match","location":{"start":{"column":3,"line":44}}},{"id":"308","name":"opt-out normalize killers > strips surrounding quotes (multi + smart quotes)","location":{"start":{"column":3,"line":48}}},{"id":"309","name":"opt-out normalize killers > strips trailing punctuation only (not mid-token)","location":{"start":{"column":3,"line":53}}},{"id":"310","name":"opt-out normalize killers > collapses runs of whitespace to a single space (not delete all)","location":{"start":{"column":3,"line":58}}},{"id":"311","name":"opt-out whole-message / whole-word policy > compact whole-message STOPPLEASE is NOT auto opt-out (not in compact set)","location":{"start":{"column":3,"line":64}}},{"id":"312","name":"opt-out whole-message / whole-word policy > compact STOPSTOP / STOPSTOPSTOP are whole-message opt_out","location":{"start":{"column":3,"line":69}}},{"id":"313","name":"opt-out whole-message / whole-word policy > END inside alphanumeric blob is not a whole word","location":{"start":{"column":3,"line":75}}},{"id":"314","name":"opt-out whole-message / whole-word policy > OPT OUT / CANCEL as whole words in longer text → ambiguous","location":{"start":{"column":3,"line":80}}},{"id":"315","name":"opt-out whole-message / whole-word policy > empty normalized is not opt-out","location":{"start":{"column":3,"line":86}}},{"id":"316","name":"opt-out whole-message / whole-word policy > foldConfusables maps Cyrillic te","location":{"start":{"column":3,"line":91}}},{"id":"317","name":"opt-out service-talk / keyword-in-sentence → ambiguous > STOP BY / WONT STOP style messages are ambiguous not opt_out","location":{"start":{"column":3,"line":97}}},{"id":"318","name":"opt-out service-talk / keyword-in-sentence → ambiguous > exact STOP is opt_out","location":{"start":{"column":3,"line":109}}},{"id":"319","name":"opt-out normalize property > normalize is idempotent uppercase ASCII letters","location":{"start":{"column":3,"line":115}}}],"source":"/**\n * Opt-out survivor / normalizer killers under the QC r7 whole-message policy.\n */\nimport { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  classifyOptOut,\n  compactOptOutText,\n  foldConfusables,\n  hasWholeWordStem,\n  normalizeOptOutText,\n  replaceNbspWithSpace,\n  stripEdgeQuotes,\n} from './opt-out';\n\ndescribe('opt-out normalize helpers (survivor killers)', () => {\n  it('replaceNbspWithSpace keeps a real space (not delete)', () => {\n    expect(replaceNbspWithSpace('STOP\\u00a0PLEASE')).toBe('STOP PLEASE');\n    expect(normalizeOptOutText('STOP\\u00a0PLEASE')).toBe('STOP PLEASE');\n  });\n\n  it('stripEdgeQuotes needs both ^ and $ anchors', () => {\n    expect(stripEdgeQuotes('\"STOP\"')).toBe('STOP');\n    expect(stripEdgeQuotes('\"STOP')).toBe('STOP');\n    expect(stripEdgeQuotes('STOP\"')).toBe('STOP');\n    expect(normalizeOptOutText('\"stop\"')).toBe('STOP');\n  });\n});\n\ndescribe('opt-out normalize killers', () => {\n  it('strips emoji exactly (not replaced with filler)', () => {\n    expect(normalizeOptOutText('STOP🛑')).toBe('STOP');\n  });\n\n  it('nbsp becomes space then collapses', () => {\n    expect(normalizeOptOutText('STOP\\u00a0\\u00a0ALL')).toBe('STOP ALL');\n  });\n\n  it('newlines become spaces (need + quantifier, not empty replace)', () => {\n    expect(normalizeOptOutText('STOP\\n\\nALL')).toBe('STOP ALL');\n  });\n\n  it('trims leading/trailing whitespace before match', () => {\n    expect(normalizeOptOutText('  STOP  ')).toBe('STOP');\n  });\n\n  it('strips surrounding quotes (multi + smart quotes)', () => {\n    expect(normalizeOptOutText('“STOP”')).toBe('STOP');\n    expect(normalizeOptOutText(\"‘QUIT’\")).toBe('QUIT');\n  });\n\n  it('strips trailing punctuation only (not mid-token)', () => {\n    expect(normalizeOptOutText('STOP!!!')).toBe('STOP');\n    expect(normalizeOptOutText('STOP.')).toBe('STOP');\n  });\n\n  it('collapses runs of whitespace to a single space (not delete all)', () => {\n    expect(normalizeOptOutText('OPT    OUT')).toBe('OPT OUT');\n  });\n});\n\ndescribe('opt-out whole-message / whole-word policy', () => {\n  it('compact whole-message STOPPLEASE is NOT auto opt-out (not in compact set)', () => {\n    // Compact set is whole-message forms only; STOPPLEASE is not a carrier keyword.\n    expect(classifyOptOut('STOPPLEASE').kind).not.toBe('opt_out');\n  });\n\n  it('compact STOPSTOP / STOPSTOPSTOP are whole-message opt_out', () => {\n    expect(classifyOptOut('STOP STOP').kind).toBe('opt_out');\n    expect(classifyOptOut('STOP STOP STOP').kind).toBe('opt_out');\n    expect(compactOptOutText('STOP STOP STOP')).toBe('STOPSTOPSTOP');\n  });\n\n  it('END inside alphanumeric blob is not a whole word', () => {\n    expect(hasWholeWordStem('XXXENDYYY', 'END')).toBe(false);\n    expect(classifyOptOut('XXXENDYYY').kind).toBe('not_opt_out');\n  });\n\n  it('OPT OUT / CANCEL as whole words in longer text → ambiguous', () => {\n    expect(classifyOptOut('PLEASE OPT OUT NOW').kind).toBe('ambiguous');\n    expect(classifyOptOut('CANCEL MY SERVICE').kind).toBe('ambiguous');\n    expect(classifyOptOut('I WANT TO QUIT').kind).toBe('ambiguous');\n  });\n\n  it('empty normalized is not opt-out', () => {\n    expect(classifyOptOut('').kind).toBe('not_opt_out');\n    expect(classifyOptOut('   ').kind).toBe('not_opt_out');\n  });\n\n  it('foldConfusables maps Cyrillic te', () => {\n    expect(foldConfusables('\\u0422')).toBe('T');\n  });\n});\n\ndescribe('opt-out service-talk / keyword-in-sentence → ambiguous', () => {\n  it('STOP BY / WONT STOP style messages are ambiguous not opt_out', () => {\n    for (const body of [\n      'STOP BY TODAY',\n      'WONT STOP LEAKING',\n      \"WON'T STOP LEAKING\",\n      'IT DOESNT STOP',\n      'STOP THE LEAK',\n    ]) {\n      expect(classifyOptOut(body).kind, body).toBe('ambiguous');\n    }\n  });\n\n  it('exact STOP is opt_out', () => {\n    expect(classifyOptOut('STOP').kind).toBe('opt_out');\n  });\n});\n\ndescribe('opt-out normalize property', () => {\n  it('normalize is idempotent uppercase ASCII letters', () => {\n    fc.assert(\n      fc.property(fc.string({ maxLength: 40 }), (s) => {\n        const once = normalizeOptOutText(s);\n        expect(normalizeOptOutText(once)).toBe(once);\n      }),\n      { numRuns: 40 }\n    );\n  });\n});\n"},"src/services/campaign-decisions.test.ts":{"tests":[{"id":"320","name":"decideEnrollmentGates > lead / opt-out / existing","location":{"start":{"column":3,"line":17}}},{"id":"321","name":"decideEnrollmentPlan > parks when recovery pending and not confirmed","location":{"start":{"column":3,"line":53}}},{"id":"322","name":"decideEnrollmentPlan > skips initial on Standard when recovery confirmed","location":{"start":{"column":3,"line":65}}},{"id":"323","name":"decideEnrollmentPlan > Emergency never treats recovery as initial","location":{"start":{"column":3,"line":76}}},{"id":"324","name":"decideEnrollmentPlan > only_initial_already_sent","location":{"start":{"column":3,"line":91}}},{"id":"325","name":"decideEnrollmentPlan > no_steps","location":{"start":{"column":3,"line":102}}},{"id":"326","name":"mapRecoveryOutcomeToState > maps all outcomes","location":{"start":{"column":3,"line":115}}},{"id":"327","name":"decideSkipRecoveryGate > false only for delay-0 first step","location":{"start":{"column":3,"line":125}}},{"id":"328","name":"decideCampaignSendDispatch > property: success flag matches action class","location":{"start":{"column":3,"line":152}}},{"id":"329","name":"decideCampaignLeadGates > pause / release_fail / continue","location":{"start":{"column":3,"line":191}}},{"id":"330","name":"decideSwitchClaimGate / reconcile / requeue > switch gates","location":{"start":{"column":3,"line":224}}},{"id":"331","name":"decideSwitchClaimGate / reconcile / requeue > reconcile advance eligibility property","location":{"start":{"column":3,"line":236}}},{"id":"332","name":"decideSwitchClaimGate / reconcile / requeue > requeue eligibility","location":{"start":{"column":3,"line":259}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  decideCampaignLeadGates,\n  decideCampaignSendDispatch,\n  decideEnrollmentGates,\n  decideEnrollmentPlan,\n  decideReconcileAdvanceEligibility,\n  decideRequeueEligibility,\n  decideSkipRecoveryGate,\n  decideSwitchClaimGate,\n  mapRecoveryOutcomeToState,\n} from './campaign-decisions';\nimport type { SendOutcome } from '@/services/send/types';\n\ndescribe('decideEnrollmentGates', () => {\n  it('lead / opt-out / existing', () => {\n    expect(\n      decideEnrollmentGates({\n        leadFound: false,\n        optedOut: false,\n      })\n    ).toEqual({ ok: false, reason: 'lead_not_found' });\n    expect(\n      decideEnrollmentGates({\n        leadFound: true,\n        optedOut: true,\n      })\n    ).toEqual({ ok: false, reason: 'opted_out' });\n    expect(\n      decideEnrollmentGates({\n        leadFound: true,\n        optedOut: false,\n        existingStatus: 'active',\n      })\n    ).toEqual({ ok: false, reason: 'already_enrolled:active' });\n    expect(\n      decideEnrollmentGates({\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n      })\n    ).toEqual({ ok: true });\n  });\n});\n\ndescribe('decideEnrollmentPlan', () => {\n  const steps = [\n    { step_number: 1, delay_minutes: 0 },\n    { step_number: 2, delay_minutes: 60 },\n  ];\n\n  it('parks when recovery pending and not confirmed', () => {\n    const parked = '2099-01-01T00:00:00.000Z';\n    const d = decideEnrollmentPlan({\n      steps,\n      recoveryState: 'pending',\n      recoveryConfirmed: false,\n      treatRecoveryAsInitial: true,\n      parkedIso: parked,\n    });\n    expect(d).toMatchObject({ ok: true, nextSendAt: parked, currentStep: 1 });\n  });\n\n  it('skips initial on Standard when recovery confirmed', () => {\n    const d = decideEnrollmentPlan({\n      steps,\n      recoveryState: 'confirmed',\n      recoveryConfirmed: true,\n      treatRecoveryAsInitial: true,\n      now: new Date('2026-01-01T12:00:00.000Z'),\n    });\n    expect(d).toMatchObject({ ok: true, skippedInitial: true, currentStep: 2 });\n  });\n\n  it('Emergency never treats recovery as initial', () => {\n    const d = decideEnrollmentPlan({\n      steps,\n      recoveryState: 'confirmed',\n      recoveryConfirmed: true,\n      treatRecoveryAsInitial: false,\n      now: new Date('2026-01-01T12:00:00.000Z'),\n    });\n    expect(d).toMatchObject({\n      ok: true,\n      skippedInitial: false,\n      currentStep: 1,\n    });\n  });\n\n  it('only_initial_already_sent', () => {\n    expect(\n      decideEnrollmentPlan({\n        steps: [{ step_number: 1, delay_minutes: 0 }],\n        recoveryState: 'confirmed',\n        recoveryConfirmed: true,\n        treatRecoveryAsInitial: true,\n      })\n    ).toEqual({ ok: false, reason: 'only_initial_already_sent' });\n  });\n\n  it('no_steps', () => {\n    expect(\n      decideEnrollmentPlan({\n        steps: [],\n        recoveryState: 'absent',\n        recoveryConfirmed: false,\n        treatRecoveryAsInitial: true,\n      })\n    ).toEqual({ ok: false, reason: 'no_steps' });\n  });\n});\n\ndescribe('mapRecoveryOutcomeToState', () => {\n  it('maps all outcomes', () => {\n    expect(mapRecoveryOutcomeToState('resolved_sent')).toBe('confirmed');\n    expect(mapRecoveryOutcomeToState('resolved_abandoned')).toBe('abandoned');\n    expect(mapRecoveryOutcomeToState('pending')).toBe('pending');\n    expect(mapRecoveryOutcomeToState('absent')).toBe('absent');\n    expect(mapRecoveryOutcomeToState('other')).toBe('absent');\n  });\n});\n\ndescribe('decideSkipRecoveryGate', () => {\n  it('false only for delay-0 first step', () => {\n    expect(\n      decideSkipRecoveryGate({\n        delayMinutes: 0,\n        currentStep: 1,\n        firstStepNumber: 1,\n      })\n    ).toBe(false);\n    expect(\n      decideSkipRecoveryGate({\n        delayMinutes: 30,\n        currentStep: 1,\n        firstStepNumber: 1,\n      })\n    ).toBe(true);\n    expect(\n      decideSkipRecoveryGate({\n        delayMinutes: 0,\n        currentStep: 2,\n        firstStepNumber: 1,\n      })\n    ).toBe(true);\n  });\n});\n\ndescribe('decideCampaignSendDispatch', () => {\n  const park = '2099-01-01T00:00:00.000Z';\n  it('property: success flag matches action class', () => {\n    const outcomes: SendOutcome[] = [\n      { kind: 'skipped', reason: 'recovery_already_sent_skip_step_1' },\n      {\n        kind: 'blocked',\n        reason: 'quiet_hours_deferred',\n        nextSendAt: park,\n      },\n      { kind: 'blocked', reason: 'quiet_hours_unresolved' },\n      { kind: 'blocked', reason: 'recovery_pending' },\n      { kind: 'blocked', reason: 'suppressed' },\n      { kind: 'blocked', reason: 'opted_out' },\n      { kind: 'blocked', reason: 'sends_disabled' },\n      { kind: 'blocked', reason: 'duplicate_in_flight' },\n      { kind: 'blocked', reason: 'invalid_phone' },\n      {\n        kind: 'sent',\n        sid: 's',\n        messageId: 'm',\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      },\n      { kind: 'needs_review', sid: 's', reason: 'x' },\n      { kind: 'ambiguous', sid: 's', reason: 'r', nextRetryAt: park },\n      { kind: 'never_sent', sid: 's' },\n    ];\n    for (const outcome of outcomes) {\n      const d = decideCampaignSendDispatch(outcome, park);\n      if (d.type === 'release') {\n        expect(d.success).toBe(d.ok);\n      } else {\n        const successTypes = new Set(['advance', 'pause_opt_out']);\n        expect(d.success).toBe(successTypes.has(d.type));\n      }\n    }\n  });\n});\n\ndescribe('decideCampaignLeadGates', () => {\n  it('pause / release_fail / continue', () => {\n    expect(\n      decideCampaignLeadGates({\n        optedOut: true,\n        suppressed: false,\n        suppressionLookupFailed: false,\n      })\n    ).toEqual({ action: 'pause', success: true });\n    expect(\n      decideCampaignLeadGates({\n        optedOut: false,\n        suppressed: true,\n        suppressionLookupFailed: false,\n      })\n    ).toEqual({ action: 'pause', success: true });\n    expect(\n      decideCampaignLeadGates({\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: true,\n      })\n    ).toEqual({ action: 'release_fail', success: false });\n    expect(\n      decideCampaignLeadGates({\n        optedOut: false,\n        suppressed: false,\n        suppressionLookupFailed: false,\n      })\n    ).toEqual({ action: 'continue' });\n  });\n});\n\ndescribe('decideSwitchClaimGate / reconcile / requeue', () => {\n  it('switch gates', () => {\n    expect(\n      decideSwitchClaimGate({ hasEnrollment: false, freshClaim: false })\n    ).toEqual({ ok: false, reason: 'no_enrollment' });\n    expect(\n      decideSwitchClaimGate({ hasEnrollment: true, freshClaim: true })\n    ).toEqual({ ok: false, reason: 'deferred_fresh_claim' });\n    expect(\n      decideSwitchClaimGate({ hasEnrollment: true, freshClaim: false })\n    ).toEqual({ ok: true });\n  });\n\n  it('reconcile advance eligibility property', () => {\n    fc.assert(\n      fc.property(\n        fc.record({\n          enrollmentFound: fc.boolean(),\n          campaignMatches: fc.boolean(),\n          stepMatches: fc.boolean(),\n          hasClaimToken: fc.boolean(),\n        }),\n        (input) => {\n          const ok = decideReconcileAdvanceEligibility(input);\n          expect(ok).toBe(\n            input.enrollmentFound &&\n              input.campaignMatches &&\n              input.stepMatches &&\n              !input.hasClaimToken\n          );\n        }\n      ),\n      { numRuns: 40 }\n    );\n  });\n\n  it('requeue eligibility', () => {\n    expect(\n      decideRequeueEligibility({\n        enrollmentFound: true,\n        campaignMatches: true,\n      })\n    ).toBe(true);\n    expect(\n      decideRequeueEligibility({\n        enrollmentFound: true,\n        campaignMatches: false,\n      })\n    ).toBe(false);\n  });\n});\n"},"src/lib/messaging/brwn-relay.test.ts":{"tests":[{"id":"333","name":"resolveBrwnRelayUrl > normalizes trailing slashes","location":{"start":{"column":3,"line":13}}},{"id":"334","name":"BrwnRelayAdapter — relay 1.7.6 contract > GET /api/capabilities → {relay, version, idempotency:true}","location":{"start":{"column":3,"line":37}}},{"id":"335","name":"BrwnRelayAdapter — relay 1.7.6 contract > capabilities without idempotency → unsupported","location":{"start":{"column":3,"line":66}}},{"id":"336","name":"BrwnRelayAdapter — relay 1.7.6 contract > keyed send echoes idempotencyKey; body fields exact","location":{"start":{"column":3,"line":80}}},{"id":"337","name":"BrwnRelayAdapter — relay 1.7.6 contract > 429 { error: recent_send } keyed → ambiguous","location":{"start":{"column":3,"line":107}}},{"id":"338","name":"BrwnRelayAdapter — relay 1.7.6 contract > 409 { error: idempotency_conflict, idempotencyKey } → conflict","location":{"start":{"column":3,"line":126}}},{"id":"339","name":"BrwnRelayAdapter — relay 1.7.6 contract > lookup found:true uses toLast4 shape; 405→unknown","location":{"start":{"column":3,"line":149}}},{"id":"340","name":"BrwnRelayAdapter — relay 1.7.6 contract > warnIfRelayLookupUnsupported logs on missing capabilities","location":{"start":{"column":3,"line":190}}},{"id":"341","name":"BrwnRelayAdapter — relay 1.7.6 contract > keyed send without prior caps probe → no keyEchoed trust alone","location":{"start":{"column":3,"line":209}}}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest';\nimport {\n  BRWN_RELAY_MIN_VERSION_FOR_REQUEUE,\n  BrwnRelayAdapter,\n  resetRelayLookupWarningFlag,\n  resolveBrwnRelayUrl,\n  warnIfRelayLookupUnsupported,\n} from './brwn-relay';\nimport { resetMessagingAdapterCache } from './index';\nimport { resetRelayKeySupportConfirmed } from '@/services/sms-sid';\n\ndescribe('resolveBrwnRelayUrl', () => {\n  it('normalizes trailing slashes', () => {\n    expect(resolveBrwnRelayUrl('https://relay.example.com/')).toBe(\n      'https://relay.example.com'\n    );\n  });\n});\n\ndescribe('BrwnRelayAdapter — relay 1.7.6 contract', () => {\n  afterEach(() => {\n    vi.unstubAllGlobals();\n    vi.restoreAllMocks();\n    delete process.env.BRWN_RELAY_URL;\n    delete process.env.BRWN_RELAY_SENDER_TOKEN;\n    resetMessagingAdapterCache();\n    resetRelayKeySupportConfirmed();\n    resetRelayLookupWarningFlag();\n  });\n\n  function setup() {\n    process.env.BRWN_RELAY_URL = 'https://relay.example.com';\n    process.env.BRWN_RELAY_SENDER_TOKEN = 'sender-secret';\n    return new BrwnRelayAdapter();\n  }\n\n  it('GET /api/capabilities → {relay, version, idempotency:true}', async () => {\n    const adapter = setup();\n    const fetchMock = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      json: async () => ({\n        relay: 'brwn-text',\n        version: '1.7.6',\n        idempotency: true,\n      }),\n    });\n    vi.stubGlobal('fetch', fetchMock);\n    const support = await adapter.checkLookupSupport();\n    expect(support).toEqual({\n      supported: true,\n      capabilities: {\n        relay: 'brwn-text',\n        version: '1.7.6',\n        idempotency: true,\n      },\n    });\n    expect(fetchMock.mock.calls[0][0]).toBe(\n      'https://relay.example.com/api/capabilities'\n    );\n    expect(fetchMock.mock.calls[0][1].headers.Authorization).toBe(\n      'Bearer sender-secret'\n    );\n  });\n\n  it('capabilities without idempotency → unsupported', async () => {\n    const adapter = setup();\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: true,\n        status: 200,\n        json: async () => ({ relay: 'brwn-text', version: '1.7.4' }),\n      })\n    );\n    const support = await adapter.checkLookupSupport();\n    expect(support.supported).toBe(false);\n  });\n\n  it('keyed send echoes idempotencyKey; body fields exact', async () => {\n    const adapter = setup();\n    const fetchMock = vi.fn().mockResolvedValue({\n      ok: true,\n      status: 200,\n      text: async () =>\n        JSON.stringify({\n          id: 'abc',\n          status: 'queued',\n          idempotencyKey: 'mlf:campaign:E1:C1:step:2',\n        }),\n    });\n    vi.stubGlobal('fetch', fetchMock);\n    const result = await adapter.sendMessage({\n      to: '+15551234567',\n      body: 'Hi',\n      idempotencyKey: 'mlf:campaign:E1:C1:step:2',\n    });\n    expect(result.keyEchoed).toBe(true);\n    expect(JSON.parse(fetchMock.mock.calls[0][1].body)).toEqual({\n      to: '+15551234567',\n      body: 'Hi',\n      auto: true,\n      idempotencyKey: 'mlf:campaign:E1:C1:step:2',\n    });\n  });\n\n  it('429 { error: recent_send } keyed → ambiguous', async () => {\n    const adapter = setup();\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: false,\n        status: 429,\n        text: async () => JSON.stringify({ error: 'recent_send' }),\n      })\n    );\n    await expect(\n      adapter.sendMessage({\n        to: '+15551234567',\n        body: 'Hi',\n        idempotencyKey: 'mlf:k',\n      })\n    ).resolves.toMatchObject({ ambiguous: true, status: 'unknown' });\n  });\n\n  it('409 { error: idempotency_conflict, idempotencyKey } → conflict', async () => {\n    const adapter = setup();\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: false,\n        status: 409,\n        text: async () =>\n          JSON.stringify({\n            error: 'idempotency_conflict',\n            idempotencyKey: 'mlf:k',\n          }),\n      })\n    );\n    await expect(\n      adapter.sendMessage({\n        to: '+15551234567',\n        body: 'Hi',\n        idempotencyKey: 'mlf:k',\n      })\n    ).resolves.toMatchObject({ conflict: true, status: 'failed' });\n  });\n\n  it('lookup found:true uses toLast4 shape; 405→unknown', async () => {\n    const adapter = setup();\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: true,\n        status: 200,\n        json: async () => ({\n          found: true,\n          id: 'm9',\n          toLast4: '4567',\n          status: 'queued',\n          error: null,\n          created: '2026-10-28T00:00:00Z',\n          updated: '2026-10-28T00:00:01Z',\n          attempts: 0,\n          auto: true,\n        }),\n      })\n    );\n    await expect(adapter.lookupByIdempotencyKey('mlf:k')).resolves.toEqual({\n      outcome: 'sent',\n      found: true,\n      id: 'm9',\n      status: 'queued',\n    });\n\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: false,\n        status: 405,\n        json: async () => ({ detail: 'Method Not Allowed' }),\n      })\n    );\n    await expect(adapter.lookupByIdempotencyKey('mlf:k')).resolves.toEqual({\n      outcome: 'unknown',\n      found: false,\n    });\n  });\n\n  it('warnIfRelayLookupUnsupported logs on missing capabilities', async () => {\n    const adapter = setup();\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: false,\n        status: 404,\n        json: async () => ({ detail: 'Not Found' }),\n      })\n    );\n    const err = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n    const support = await warnIfRelayLookupUnsupported(adapter);\n    expect(support.supported).toBe(false);\n    expect(String(err.mock.calls[0][0])).toMatch(/NOT CONFIRMED/);\n    expect(String(err.mock.calls[0][0])).toContain(\n      BRWN_RELAY_MIN_VERSION_FOR_REQUEUE\n    );\n  });\n\n  it('keyed send without prior caps probe → no keyEchoed trust alone', async () => {\n    const { isRelayKeySupportConfirmed } = await import('@/services/sms-sid');\n    const adapter = setup();\n    expect(isRelayKeySupportConfirmed()).toBe(false);\n    vi.stubGlobal(\n      'fetch',\n      vi.fn().mockResolvedValue({\n        ok: true,\n        status: 200,\n        text: async () =>\n          JSON.stringify({\n            id: 'abc',\n            status: 'queued',\n            idempotencyKey: 'mlf:k',\n          }),\n      })\n    );\n    const result = await adapter.sendMessage({\n      to: '+15551234567',\n      body: 'Hi',\n      idempotencyKey: 'mlf:k',\n    });\n    // Echo alone is not enough — caps must have been probed first.\n    expect(result.keyEchoed).toBe(true);\n    expect(isRelayKeySupportConfirmed()).toBe(false);\n  });\n});\n"},"src/services/send/reconcile-tally.test.ts":{"tests":[{"id":"342","name":"coalesce helpers > coalesceReconcileAttempts uses 0 for null/undefined (not && 0)","location":{"start":{"column":3,"line":16}}},{"id":"343","name":"coalesce helpers > coalesceLookupOutcome prefers explicit outcome over classify","location":{"start":{"column":3,"line":24}}},{"id":"344","name":"reconcile-tally > notes unknown vs sending status exactly once each","location":{"start":{"column":3,"line":36}}},{"id":"345","name":"reconcile-tally > notes each outcome kind independently (not -= mutants)","location":{"start":{"column":3,"line":45}}},{"id":"346","name":"reconcile-tally > alert when threshold met OR needsReview > 0","location":{"start":{"column":3,"line":62}}},{"id":"347","name":"reconcile-tally > signalFromLookupOutcome covers sent/failed/never_sent/unknown","location":{"start":{"column":3,"line":97}}},{"id":"348","name":"reconcile-tally > abandonedSid embeds original + timestamp (non-empty)","location":{"start":{"column":3,"line":120}}},{"id":"349","name":"reconcile-tally > property: outcome note is additive and kind-specific","location":{"start":{"column":3,"line":127}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport { SMS_STATUS } from '@/services/db-strings';\nimport {\n  abandonedSid,\n  coalesceLookupOutcome,\n  coalesceReconcileAttempts,\n  decideReconcileAlert,\n  emptyReconcileCounts,\n  noteReconcileOutcome,\n  noteReconcileRowStatus,\n  signalFromLookupOutcome,\n} from './reconcile-tally';\n\ndescribe('coalesce helpers', () => {\n  it('coalesceReconcileAttempts uses 0 for null/undefined (not && 0)', () => {\n    expect(coalesceReconcileAttempts(3)).toBe(3);\n    expect(coalesceReconcileAttempts(null)).toBe(0);\n    expect(coalesceReconcileAttempts(undefined)).toBe(0);\n    // attempts && 0 would yield 0 for any truthy attempts\n    expect(coalesceReconcileAttempts(7)).toBe(7);\n  });\n\n  it('coalesceLookupOutcome prefers explicit outcome over classify', () => {\n    expect(\n      coalesceLookupOutcome({ outcome: 'sent', status: 'queued', found: true })\n    ).toBe('sent');\n    // missing outcome → classify body (found:false → never_sent typically)\n    const classified = coalesceLookupOutcome({ found: false });\n    expect(typeof classified).toBe('string');\n    expect(classified.length).toBeGreaterThan(0);\n  });\n});\n\ndescribe('reconcile-tally', () => {\n  it('notes unknown vs sending status exactly once each', () => {\n    let c = emptyReconcileCounts();\n    c = noteReconcileRowStatus(c, SMS_STATUS.unknown);\n    c = noteReconcileRowStatus(c, SMS_STATUS.sending);\n    c = noteReconcileRowStatus(c, SMS_STATUS.queued);\n    expect(c.unknownCount).toBe(1);\n    expect(c.stuckSendingCount).toBe(1);\n  });\n\n  it('notes each outcome kind independently (not -= mutants)', () => {\n    let c = emptyReconcileCounts();\n    c = noteReconcileOutcome(c, 'resolved');\n    c = noteReconcileOutcome(c, 'never_sent');\n    c = noteReconcileOutcome(c, 'needs_review');\n    c = noteReconcileOutcome(c, 'ambiguous');\n    c = noteReconcileOutcome(c, 'blocked');\n    expect(c).toEqual({\n      unknownCount: 0,\n      stuckSendingCount: 0,\n      confirmed: 1,\n      requeued: 1,\n      needsReview: 1,\n      parked: 1,\n    });\n  });\n\n  it('alert when threshold met OR needsReview > 0', () => {\n    expect(\n      decideReconcileAlert(\n        { ...emptyReconcileCounts(), unknownCount: 5 },\n        5\n      )\n    ).toBe(true);\n    expect(\n      decideReconcileAlert(\n        { ...emptyReconcileCounts(), unknownCount: 4 },\n        5\n      )\n    ).toBe(false);\n    expect(\n      decideReconcileAlert(\n        { ...emptyReconcileCounts(), needsReview: 1 },\n        99\n      )\n    ).toBe(true);\n    // >= not > : exactly threshold alerts\n    expect(\n      decideReconcileAlert(\n        { ...emptyReconcileCounts(), stuckSendingCount: 3 },\n        3\n      )\n    ).toBe(true);\n    // sum, not difference\n    expect(\n      decideReconcileAlert(\n        { ...emptyReconcileCounts(), unknownCount: 2, stuckSendingCount: 2 },\n        4\n      )\n    ).toBe(true);\n  });\n\n  it('signalFromLookupOutcome covers sent/failed/never_sent/unknown', () => {\n    expect(signalFromLookupOutcome('sent', { status: 'delivered' })).toEqual({\n      type: 'sent',\n      status: 'delivered',\n    });\n    expect(signalFromLookupOutcome('sent', {})).toEqual({\n      type: 'sent',\n      status: SMS_STATUS.queued,\n    });\n    expect(signalFromLookupOutcome('failed', { status: 500 })).toEqual({\n      type: 'failed',\n      status: '500',\n    });\n    expect(signalFromLookupOutcome('failed', {})).toEqual({\n      type: 'failed',\n      status: 'failed',\n    });\n    expect(signalFromLookupOutcome('never_sent', {})).toEqual({\n      type: 'never_sent',\n    });\n    expect(signalFromLookupOutcome('other', {})).toEqual({ type: 'unknown' });\n  });\n\n  it('abandonedSid embeds original + timestamp (non-empty)', () => {\n    expect(abandonedSid('mlf:recovery:L', 42)).toBe(\n      'mlf:recovery:L:abandoned:42'\n    );\n    expect(abandonedSid('', 1)).toBe(':abandoned:1');\n  });\n\n  it('property: outcome note is additive and kind-specific', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(\n          'resolved',\n          'never_sent',\n          'needs_review',\n          'ambiguous',\n          'other'\n        ),\n        fc.nat({ max: 20 }),\n        (kind, n) => {\n          let c = emptyReconcileCounts();\n          for (let i = 0; i <"+" n; i++) c = noteReconcileOutcome(c, kind);\n          const expected =\n            kind === 'resolved'\n              ? n\n              : kind === 'never_sent'\n                ? n\n                : kind === 'needs_review'\n                  ? n\n                  : kind === 'ambiguous'\n                    ? n\n                    : 0;\n          const field =\n            kind === 'resolved'\n              ? c.confirmed\n              : kind === 'never_sent'\n                ? c.requeued\n                : kind === 'needs_review'\n                  ? c.needsReview\n                  : kind === 'ambiguous'\n                    ? c.parked\n                    : 0;\n          expect(field).toBe(expected);\n        }\n      )\n    );\n  });\n});\n"},"src/services/send/decisions.survivors.test.ts":{"tests":[{"id":"350","name":"decisions survivors > recovery gate only when campaign step 1 without skip","location":{"start":{"column":3,"line":14}}},{"id":"351","name":"decisions survivors > quiet object without nextSendAt/unresolved falls through","location":{"start":{"column":3,"line":56}}},{"id":"352","name":"decisions survivors > resolveIdempotencySid campaign requires all fields","location":{"start":{"column":3,"line":81}}},{"id":"353","name":"decisions survivors > decideDuplicateSid exact reason / detail strings","location":{"start":{"column":3,"line":122}}},{"id":"354","name":"decisions survivors > mapRelaySendResult defaults status to queued","location":{"start":{"column":3,"line":155}}},{"id":"355","name":"decisions survivors > classifyStatusRow delegates","location":{"start":{"column":3,"line":168}}},{"id":"356","name":"decisions survivors > interpretCampaignSendOutcome release ok flag + park fallback","location":{"start":{"column":3,"line":174}}},{"id":"357","name":"decisions survivors > interpretRecoverySendOutcome unexpected / skipped reason","location":{"start":{"column":3,"line":211}}},{"id":"358","name":"decisions survivors > property: duplicate status vocabulary exhausts actions","location":{"start":{"column":3,"line":251}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  decideCustomerFacingGates,\n  decideDuplicateSid,\n  interpretCampaignSendOutcome,\n  interpretRecoverySendOutcome,\n  mapRelaySendResult,\n  resolveIdempotencySid,\n  classifyStatusRow,\n} from './decisions';\n\ndescribe('decisions survivors', () => {\n  it('recovery gate only when campaign step 1 without skip', () => {\n    // stepNumber !== 1 → no recovery gate\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 2,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'pending',\n      })\n    ).toBeNull();\n    // kind recovery → no campaign recovery gate\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        stepNumber: 1,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'pending',\n      })\n    ).toBeNull();\n    // absent recovery → fall through\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 1,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'absent',\n      })\n    ).toBeNull();\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 1,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'resolved_abandoned',\n      })\n    ).toBeNull();\n  });\n\n  it('quiet object without nextSendAt/unresolved falls through', () => {\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: false,\n        optedOut: false,\n        quiet: { allowed: false } as never,\n      })\n    ).toBeNull();\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: false,\n        optedOut: false,\n        quiet: {\n          allowed: false,\n          unresolved: false,\n          nextSendAt: undefined,\n          zones: [],\n          endHour: 21,\n        } as never,\n      })\n    ).toBeNull();\n  });\n\n  it('resolveIdempotencySid campaign requires all fields', () => {\n    expect(\n      resolveIdempotencySid(\n        { kind: 'campaign', leadId: 'L', enrollmentId: 'E' },\n        9\n      )\n    ).toBe('mlf:campaign:L:9');\n    expect(\n      resolveIdempotencySid(\n        { kind: 'campaign', leadId: 'L', campaignId: 'C', stepNumber: 1 },\n        9\n      )\n    ).toBe('mlf:campaign:L:9');\n    expect(\n      resolveIdempotencySid(\n        {\n          kind: 'campaign',\n          leadId: 'L',\n          enrollmentId: 'E',\n          campaignId: 'C',\n          stepNumber: 0 as never,\n        },\n        9\n      )\n    ).toBe('mlf:campaign:L:9'); // step 0 falsy → fallback\n    // Full campaign fields → stable step sid (not mlf:clock fallback)\n    const full = resolveIdempotencySid(\n      {\n        kind: 'campaign',\n        leadId: 'L',\n        enrollmentId: 'E',\n        campaignId: 'C',\n        stepNumber: 2,\n      },\n      9\n    );\n    expect(full).toContain('E');\n    expect(full).toContain('C');\n    expect(full).not.toBe('mlf:campaign:L:9');\n  });\n\n  it('decideDuplicateSid exact reason / detail strings', () => {\n    expect(decideDuplicateSid('NEEDS_REVIEW')).toEqual({\n      action: 'needs_review',\n      reason: 'duplicate_failed',\n    });\n    expect(decideDuplicateSid('needs_review')).toEqual({\n      action: 'needs_review',\n      reason: 'duplicate_failed',\n    });\n    expect(decideDuplicateSid('Abandoned_Retry')).toEqual({\n      action: 'claim_deferred',\n    });\n    expect(decideDuplicateSid('deferred')).toEqual({\n      action: 'claim_deferred',\n    });\n    expect(decideDuplicateSid('abandoned_retry')).toEqual({\n      action: 'claim_deferred',\n    });\n    expect(decideDuplicateSid(null)).toEqual({\n      action: 'block_in_flight',\n      detail: 'missing',\n    });\n    expect(decideDuplicateSid('sending')).toEqual({\n      action: 'block_in_flight',\n      detail: 'sending',\n    });\n    // Filler status must NOT claim_deferred / needs_review\n    expect(decideDuplicateSid('Stryker was here!')).toEqual({\n      action: 'block_in_flight',\n      detail: 'Stryker was here!',\n    });\n  });\n\n  it('mapRelaySendResult defaults status to queued', () => {\n    expect(mapRelaySendResult({ id: 'm' })).toEqual({\n      type: 'ok',\n      messageId: 'm',\n      status: 'queued',\n      keyEchoed: false,\n      duplicate: undefined,\n    });\n    expect(\n      mapRelaySendResult({ id: 'm', duplicate: true, status: 'sent' })\n    ).toMatchObject({ duplicate: true, status: 'sent' });\n  });\n\n  it('classifyStatusRow delegates', () => {\n    expect(classifyStatusRow('delivered')).toBe('resolved_sent');\n    expect(classifyStatusRow(null)).toBe('absent');\n    expect(classifyStatusRow('weird')).toBe('pending');\n  });\n\n  it('interpretCampaignSendOutcome release ok flag + park fallback', () => {\n    const park = 'p';\n    expect(\n      interpretCampaignSendOutcome(\n        { kind: 'ambiguous', sid: 's', reason: 'r' },\n        park\n      )\n    ).toEqual({ type: 'park', nextSendAt: park });\n    expect(\n      interpretCampaignSendOutcome({ kind: 'never_sent', sid: 's' }, park)\n    ).toEqual({ type: 'park' });\n    // skipped with wrong reason must NOT advance (kills && → || / cond→true)\n    expect(\n      interpretCampaignSendOutcome(\n        { kind: 'skipped', reason: 'something_else' },\n        park\n      )\n    ).toEqual({ type: 'park' });\n    // quiet_hours_deferred without nextSendAt must NOT release\n    expect(\n      interpretCampaignSendOutcome(\n        { kind: 'blocked', reason: 'quiet_hours_deferred' },\n        park\n      )\n    ).toEqual({ type: 'noop_false' });\n    expect(\n      interpretCampaignSendOutcome(\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't',\n        },\n        park\n      )\n    ).toEqual({ type: 'release', nextSendAt: 't', ok: true });\n  });\n\n  it('interpretRecoverySendOutcome unexpected / skipped reason', () => {\n    expect(\n      interpretRecoverySendOutcome({ kind: 'never_sent', sid: 's' }, 'f')\n    ).toEqual({ type: 'log_blocked', reason: 'unexpected' });\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'blocked', reason: 'invalid_phone' },\n        'f'\n      )\n    ).toEqual({ type: 'log_blocked', reason: 'invalid_phone' });\n    // skipped body must run (not emptied) and use reason\n    expect(\n      interpretRecoverySendOutcome({ kind: 'skipped', reason: 'gate' }, 'f')\n    ).toEqual({ type: 'log_blocked', reason: 'gate' });\n    // quiet_hours_deferred requires both kind+reason (not cond→true)\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'blocked', reason: 'suppressed' },\n        'f'\n      )\n    ).toEqual({ type: 'log_blocked', reason: 'suppressed' });\n    expect(\n      interpretRecoverySendOutcome(\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't',\n        },\n        'f'\n      )\n    ).toEqual({ type: 'persist_deferred', nextSendAt: 't' });\n    // missing nextSendAt uses fallback\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'blocked', reason: 'quiet_hours_deferred' },\n        'fallback'\n      )\n    ).toEqual({ type: 'persist_deferred', nextSendAt: 'fallback' });\n  });\n\n  it('property: duplicate status vocabulary exhausts actions', () => {\n    fc.assert(\n      fc.property(fc.option(fc.string(), { nil: undefined }), (status) => {\n        const d = decideDuplicateSid(status);\n        expect(['confirm_existing', 'needs_review', 'claim_deferred', 'block_in_flight']).toContain(\n          d.action\n        );\n      }),\n      { numRuns: 50 }\n    );\n  });\n});\n"},"src/services/classification.test.ts":{"tests":[{"id":"359","name":"isOptOutMessage > detects whole-message STOP / UNSUBSCRIBE","location":{"start":{"column":3,"line":10}}},{"id":"360","name":"isOptOutMessage > does not false-positive on service language or ambiguous phrases","location":{"start":{"column":3,"line":16}}},{"id":"361","name":"scoreUrgencyKeywords > classifies flooding as emergency with keyword weights","location":{"start":{"column":3,"line":28}}},{"id":"362","name":"scoreUrgencyKeywords > classifies urgent language as high without extra keywords","location":{"start":{"column":3,"line":38}}},{"id":"363","name":"scoreUrgencyKeywords > classifies quote requests as low","location":{"start":{"column":3,"line":44}}},{"id":"364","name":"extractIssue > returns the first sentence when short","location":{"start":{"column":3,"line":51}}},{"id":"365","name":"extractIssue > truncates long text","location":{"start":{"column":3,"line":55}}},{"id":"366","name":"escapeRegex > escapes special characters so keywords are literal","location":{"start":{"column":3,"line":63}}}],"source":"import { describe, it, expect } from 'vitest';\nimport {\n  isOptOutMessage,\n  scoreUrgencyKeywords,\n  extractIssue,\n  escapeRegex,\n} from './classification';\n\ndescribe('isOptOutMessage', () => {\n  it('detects whole-message STOP / UNSUBSCRIBE', () => {\n    expect(isOptOutMessage('STOP')).toBe(true);\n    expect(isOptOutMessage('UNSUBSCRIBE')).toBe(true);\n    expect(isOptOutMessage('OPT OUT')).toBe(true);\n  });\n\n  it('does not false-positive on service language or ambiguous phrases', () => {\n    expect(isOptOutMessage('My water heater is leaking')).toBe(false);\n    // Service talk → ambiguous (not definite opt-out)\n    expect(isOptOutMessage(\"won't stop leaking HELP\")).toBe(false);\n    expect(isOptOutMessage('stop by today')).toBe(false);\n    // Contains-keyword opt-out (QC r6)\n    expect(isOptOutMessage('Please unsubscribe me')).toBe(true);\n    expect(isOptOutMessage('wrong number')).toBe(false);\n  });\n});\n\ndescribe('scoreUrgencyKeywords', () => {\n  it('classifies flooding as emergency with keyword weights', () => {\n    const result = scoreUrgencyKeywords(\n      'Emergency — there is a flood in my basement, need help right now!',\n      [{ keyword: 'flood', weight: 10 }]\n    );\n    expect(result.urgency).toBe('emergency');\n    expect(result.matchedKeywords).toContain('flood');\n    expect(result.score).toBeGreaterThanOrEqual(15);\n  });\n\n  it('classifies urgent language as high without extra keywords', () => {\n    const result = scoreUrgencyKeywords('This is urgent — need help ASAP');\n    expect(['high', 'emergency']).toContain(result.urgency);\n    expect(result.score).toBeGreaterThanOrEqual(8);\n  });\n\n  it('classifies quote requests as low', () => {\n    const result = scoreUrgencyKeywords('Just wondering about pricing for next week');\n    expect(result.urgency).toBe('low');\n  });\n});\n\ndescribe('extractIssue', () => {\n  it('returns the first sentence when short', () => {\n    expect(extractIssue('Pipe burst. Need help now.')).toBe('Pipe burst');\n  });\n\n  it('truncates long text', () => {\n    const long = 'x'.repeat(150);\n    expect(extractIssue(long).endsWith('...')).toBe(true);\n    expect(extractIssue(long).length).toBe(103);\n  });\n});\n\ndescribe('escapeRegex', () => {\n  it('escapes special characters so keywords are literal', () => {\n    expect(escapeRegex('no ac')).toBe('no ac');\n    expect(escapeRegex('c++')).toBe('c\\\\+\\\\+');\n    expect(new RegExp(`\\\\b${escapeRegex('a.b')}\\\\b`).test('a.b')).toBe(true);\n    expect(new RegExp(`\\\\b${escapeRegex('a.b')}\\\\b`).test('axb')).toBe(false);\n  });\n});\n"},"src/services/campaign-send-effects.test.ts":{"tests":[{"id":"367","name":"applyCampaignSendEffects > invokes exactly one handler per effect op (kills empty case / wrong case)","location":{"start":{"column":3,"line":48}}},{"id":"368","name":"applyCampaignSendEffects > property: every effect calls its matching handler once","location":{"start":{"column":3,"line":67}}},{"id":"369","name":"applyCampaignSendEffects > noop on empty effects (not a stray handler call)","location":{"start":{"column":3,"line":84}}}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  applyCampaignSendEffects,\n  type CampaignSendEffectHandlers,\n} from './campaign-send-effects';\nimport type { CampaignSendEffect } from './campaign-send-plan';\n\nfunction trackingHandlers() {\n  const calls: Array<"+"{ op: string; arg?: unknown }> = [];\n  const handlers: CampaignSendEffectHandlers = {\n    advance: async (stepNumber) => {\n      calls.push({ op: 'advance', arg: stepNumber });\n    },\n    release: async (nextSendAt) => {\n      calls.push({ op: 'release', arg: nextSendAt });\n    },\n    flagUnresolvedTz: async (nextSendAt) => {\n      calls.push({ op: 'flag_unresolved_tz', arg: nextSendAt });\n    },\n    park: async (nextSendAt) => {\n      calls.push({ op: 'park', arg: nextSendAt });\n    },\n    pauseOptOut: async () => {\n      calls.push({ op: 'pause_opt_out' });\n    },\n    needsReviewTerminal: async (reason) => {\n      calls.push({ op: 'needs_review_terminal', arg: reason });\n    },\n    noopRelease: async () => {\n      calls.push({ op: 'noop_release' });\n    },\n  };\n  return { calls, handlers };\n}\n\nconst ALL_OPS: CampaignSendEffect[] = [\n  { op: 'advance', stepNumber: 3 },\n  { op: 'release', nextSendAt: 't1' },\n  { op: 'flag_unresolved_tz', nextSendAt: 't2' },\n  { op: 'park', nextSendAt: 't3' },\n  { op: 'pause_opt_out' },\n  { op: 'needs_review_terminal', reason: 'dup' },\n  { op: 'noop_release' },\n];\n\ndescribe('applyCampaignSendEffects', () => {\n  it('invokes exactly one handler per effect op (kills empty case / wrong case)', async () => {\n    const { calls, handlers } = trackingHandlers();\n    await applyCampaignSendEffects(ALL_OPS, handlers);\n    expect(calls.map((c) => c.op)).toEqual([\n      'advance',\n      'release',\n      'flag_unresolved_tz',\n      'park',\n      'pause_opt_out',\n      'needs_review_terminal',\n      'noop_release',\n    ]);\n    expect(calls[0].arg).toBe(3);\n    expect(calls[1].arg).toBe('t1');\n    expect(calls[2].arg).toBe('t2');\n    expect(calls[3].arg).toBe('t3');\n    expect(calls[5].arg).toBe('dup');\n  });\n\n  it('property: every effect calls its matching handler once', async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        fc.subarray(ALL_OPS, { minLength: 1 }),\n        async (effects) => {\n          const { calls, handlers } = trackingHandlers();\n          await applyCampaignSendEffects(effects, handlers);\n          expect(calls).toHaveLength(effects.length);\n          for (let i = 0; i <"+" effects.length; i++) {\n            expect(calls[i].op).toBe(effects[i].op);\n          }\n        }\n      ),\n      { numRuns: 30 }\n    );\n  });\n\n  it('noop on empty effects (not a stray handler call)', async () => {\n    const { calls, handlers } = trackingHandlers();\n    await applyCampaignSendEffects([], handlers);\n    expect(calls).toEqual([]);\n  });\n});\n"},"src/services/db-strings.test.ts":{"tests":[{"id":"370","name":"db-strings constants (kill StringLiteral mutants) > table names","location":{"start":{"column":3,"line":49}}},{"id":"371","name":"db-strings constants (kill StringLiteral mutants) > column names","location":{"start":{"column":3,"line":59}}},{"id":"372","name":"db-strings constants (kill StringLiteral mutants) > sms / enrollment statuses","location":{"start":{"column":3,"line":92}}},{"id":"373","name":"db-strings constants (kill StringLiteral mutants) > select lists and misc","location":{"start":{"column":3,"line":113}}},{"id":"374","name":"db-strings constants (kill StringLiteral mutants) > property: every TABLE value is non-empty snake_case","location":{"start":{"column":3,"line":175}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  ABANDONED_SID_RE,\n  CAMPAIGN_SELECT_STAR_STEPS,\n  CAMPAIGN_SELECT_URGENCY,\n  CAMPAIGN_SID_LIKE,\n  COL,\n  CONFIRMED_PROVIDER_STATUSES,\n  DIRECTION_OUTBOUND,\n  ENROLLMENT_SELECT_ADVANCE,\n  ENROLLMENT_SELECT_ID,\n  ENROLLMENT_SELECT_REQUEUE,\n  ENROLLMENT_SELECT_SEND,\n  ENROLLMENT_SELECT_STAR,\n  ENROLLMENT_STATUS,\n  KIND_CAMPAIGN,\n  KIND_MANUAL,\n  KIND_RECOVERY,\n  LEAD_SELECT_GATES,\n  LEAD_SELECT_OPTED_OUT,\n  LEAD_SELECT_OUTBOUND,\n  LEAD_SELECT_STAR_BIZ,\n  LOOKUP_KIND,\n  PG_UNIQUE,\n  RECONCILE_PULL_STATUSES,\n  RELAY_SIGNAL,\n  REVIEW_REASON_QUIET_HOURS,\n  SEND_REASON,\n  SMS_SELECT_ABANDONED,\n  SMS_SELECT_CONFIRMED,\n  SMS_SELECT_DEFERRED,\n  SMS_SELECT_ID_STATUS,\n  SMS_SELECT_RECONCILE,\n  SMS_SELECT_STATUS,\n  SMS_STATUS,\n  STEP_SELECT_STAR,\n  TABLE,\n  DIRECTION_INBOUND,\n  ENV_BRWN_DEFAULT_BUSINESS_PHONE,\n  INBOUND_MESSAGE_ID_PREFIX,\n  LEAD_STATUS,\n  LEGACY_LEAD_STATUSES,\n  OPEN_LEAD_STATUSES,\n  reconcileOrFilter,\n} from './db-strings';\n\ndescribe('db-strings constants (kill StringLiteral mutants)', () => {\n  it('table names', () => {\n    expect(TABLE.leads).toBe('leads');\n    expect(TABLE.businesses).toBe('businesses');\n    expect(TABLE.smsMessages).toBe('sms_messages');\n    expect(TABLE.missedCalls).toBe('missed_calls');\n    expect(TABLE.campaigns).toBe('campaigns');\n    expect(TABLE.campaignSteps).toBe('campaign_steps');\n    expect(TABLE.campaignEnrollments).toBe('campaign_enrollments');\n  });\n\n  it('column names', () => {\n    expect(COL.id).toBe('id');\n    expect(COL.leadId).toBe('lead_id');\n    expect(COL.messageSid).toBe('message_sid');\n    expect(COL.status).toBe('status');\n    expect(COL.body).toBe('body');\n    expect(COL.nextRetryAt).toBe('next_retry_at');\n    expect(COL.nextSendAt).toBe('next_send_at');\n    expect(COL.claimToken).toBe('claim_token');\n    expect(COL.claimedAt).toBe('claimed_at');\n    expect(COL.campaignId).toBe('campaign_id');\n    expect(COL.stepNumber).toBe('step_number');\n    expect(COL.autoEnroll).toBe('auto_enroll');\n    expect(COL.sentAt).toBe('sent_at');\n    expect(COL.smsOutboundSid).toBe('sms_outbound_sid');\n    expect(COL.optedOut).toBe('opted_out');\n    expect(COL.phone).toBe('phone');\n    expect(COL.businessId).toBe('business_id');\n    expect(COL.callerPhone).toBe('caller_phone');\n    expect(COL.createdAt).toBe('created_at');\n    expect(COL.direction).toBe('direction');\n    expect(COL.callSid).toBe('call_sid');\n    expect(COL.ringDuration).toBe('ring_duration');\n    expect(COL.missedCallId).toBe('missed_call_id');\n    expect(DIRECTION_INBOUND).toBe('inbound');\n    expect(LEAD_STATUS.pending).toBe('pending');\n    expect(OPEN_LEAD_STATUSES).toEqual(['qualified', 'escalated']);\n    expect(LEGACY_LEAD_STATUSES).toEqual(['pending', 'qualified', 'escalated']);\n    expect(SMS_STATUS.received).toBe('received');\n    expect(INBOUND_MESSAGE_ID_PREFIX).toBe('brwn-in-');\n    expect(ENV_BRWN_DEFAULT_BUSINESS_PHONE).toBe('BRWN_DEFAULT_BUSINESS_PHONE');\n  });\n\n  it('sms / enrollment statuses', () => {\n    expect(SMS_STATUS.sending).toBe('sending');\n    expect(SMS_STATUS.deferred).toBe('deferred');\n    expect(SMS_STATUS.unknown).toBe('unknown');\n    expect(SMS_STATUS.needsReview).toBe('needs_review');\n    expect(SMS_STATUS.abandonedRetry).toBe('abandoned_retry');\n    expect(SMS_STATUS.abandonedDone).toBe('abandoned_done');\n    expect(SMS_STATUS.queued).toBe('queued');\n    expect(SMS_STATUS.dispatched).toBe('dispatched');\n    expect(SMS_STATUS.sent).toBe('sent');\n    expect(SMS_STATUS.delivered).toBe('delivered');\n    expect(SMS_STATUS.active).toBe('active');\n    expect(SMS_STATUS.paused).toBe('paused');\n    expect(SMS_STATUS.completed).toBe('completed');\n    expect(SMS_STATUS.received).toBe('received');\n    expect(ENROLLMENT_STATUS.active).toBe('active');\n    expect(ENROLLMENT_STATUS.paused).toBe('paused');\n    expect(ENROLLMENT_STATUS.completed).toBe('completed');\n    expect(ENROLLMENT_STATUS.needsReview).toBe('needs_review');\n  });\n\n  it('select lists and misc', () => {\n    expect(DIRECTION_OUTBOUND).toBe('outbound');\n    expect(LEAD_SELECT_GATES).toBe('opted_out, timezone, sms_outbound_sid');\n    expect(SMS_SELECT_STATUS).toBe('status');\n    expect(SMS_SELECT_ID_STATUS).toBe('id, status');\n    expect(SMS_SELECT_DEFERRED).toBe(\n      'id, lead_id, message_sid, body, next_retry_at, reconcile_attempts'\n    );\n    expect(SMS_SELECT_RECONCILE).toBe(\n      'id, lead_id, message_sid, status, sent_at, reconcile_attempts, key_supported_at_send, next_retry_at'\n    );\n    expect(SMS_SELECT_ABANDONED).toBe('id, lead_id, message_sid, status');\n    expect(SMS_SELECT_CONFIRMED).toBe('message_sid, status');\n    expect(LEAD_SELECT_STAR_BIZ).toBe('*, businesses(*)');\n    expect(LEAD_SELECT_OPTED_OUT).toBe('opted_out');\n    expect(LEAD_SELECT_OUTBOUND).toBe('sms_outbound_sid');\n    expect(ENROLLMENT_SELECT_STAR).toBe('*');\n    expect(ENROLLMENT_SELECT_ID).toBe('id');\n    expect(CAMPAIGN_SELECT_STAR_STEPS).toBe('*, campaign_steps(*)');\n    expect(CAMPAIGN_SELECT_URGENCY).toBe('id, name, urgency_filter');\n    expect(STEP_SELECT_STAR).toBe('*');\n    expect(ENROLLMENT_SELECT_SEND).toBe(\n      '*, leads!inner(*, businesses(*)), campaigns!inner(*)'\n    );\n    expect(ENROLLMENT_SELECT_ADVANCE).toBe(\n      'id, campaign_id, current_step, status, claim_token'\n    );\n    expect(ENROLLMENT_SELECT_REQUEUE).toBe('id, campaign_id, status');\n    expect(PG_UNIQUE).toBe('23505');\n    expect(KIND_RECOVERY).toBe('recovery');\n    expect(KIND_CAMPAIGN).toBe('campaign');\n    expect(KIND_MANUAL).toBe('manual');\n    expect(LOOKUP_KIND).toBe('lookup');\n    expect(RELAY_SIGNAL.error).toBe('error');\n    expect(RELAY_SIGNAL.unknown).toBe('unknown');\n    expect(RELAY_SIGNAL.ok).toBe('ok');\n    expect(SEND_REASON.invalidPhone).toBe('invalid_phone');\n    expect(SEND_REASON.duplicateInFlight).toBe('duplicate_in_flight');\n    expect(SEND_REASON.lookupUnsupported).toBe('lookup_unsupported');\n    expect(SEND_REASON.sendsDisabled).toBe('sends_disabled');\n    expect(REVIEW_REASON_QUIET_HOURS).toBe('quiet_hours_unresolved');\n    expect(CAMPAIGN_SID_LIKE).toBe('mlf:campaign:%');\n    expect(CONFIRMED_PROVIDER_STATUSES).toEqual([\n      'queued',\n      'dispatched',\n      'sent',\n      'delivered',\n    ]);\n    expect(RECONCILE_PULL_STATUSES).toEqual(['unknown', 'sending']);\n    expect('sid:abandoned:123'.replace(ABANDONED_SID_RE, '')).toBe('sid');\n    expect(reconcileOrFilter('NOW', 'CUT')).toContain('next_retry_at.lte.NOW');\n    expect(reconcileOrFilter('NOW', 'CUT')).toContain('sent_at.lt.CUT');\n    expect(reconcileOrFilter('NOW', 'CUT')).toContain('status.eq.unknown');\n    // First fragment must keep next_retry_at.is.null (kills emptying that literal)\n    expect(reconcileOrFilter('NOW', 'CUT')).toContain('next_retry_at.is.null');\n    expect(reconcileOrFilter('NOW', 'CUT')).toBe(\n      'and(status.eq.unknown,next_retry_at.is.null),' +\n        'and(status.eq.unknown,next_retry_at.lte.NOW),' +\n        'and(status.eq.sending,sent_at.lt.CUT)'\n    );\n  });\n\n  it('property: every TABLE value is non-empty snake_case', () => {\n    fc.assert(\n      fc.property(fc.constantFrom(...Object.values(TABLE)), (name) => {\n        expect(name.length).toBeGreaterThan(0);\n        expect(name).toMatch(/^[a-z_]+$/);\n      }),\n      { numRuns: 20 }\n    );\n  });\n});\n"},"src/services/campaign-enroll-plan.test.ts":{"tests":[{"id":"375","name":"planEnroll > rejects opted_out / already_enrolled / lead_not_found via gates","location":{"start":{"column":3,"line":25}}},{"id":"376","name":"planEnroll > rejects no_campaigns for error OR null OR empty (not AND)","location":{"start":{"column":3,"line":69}}},{"id":"377","name":"planEnroll > rejects no_matching / no_steps / only_initial_already_sent","location":{"start":{"column":3,"line":113}}},{"id":"378","name":"planEnroll > recoveryConfirmed via state OR sid; Standard treats recovery as initial","location":{"start":{"column":3,"line":172}}},{"id":"379","name":"planEnroll > Emergency never treats recovery as initial (urgency_filter non-null)","location":{"start":{"column":3,"line":227}}},{"id":"380","name":"planEnroll > statusActive coalesce: custom wins, else active","location":{"start":{"column":3,"line":248}}},{"id":"381","name":"planEnroll > inserts Standard for urgency null","location":{"start":{"column":3,"line":283}}},{"id":"382","name":"planSwitch > rejects fresh claim / missing lead / missing campaign / no steps","location":{"start":{"column":3,"line":306}}},{"id":"383","name":"planSwitch > updates with treatRecoveryAsInitial false (stay step 1)","location":{"start":{"column":3,"line":387}}},{"id":"384","name":"planSwitch > statusActive custom vs default active","location":{"start":{"column":3,"line":410}}},{"id":"385","name":"planSwitch > property: successful switch always reports switched + enrolled","location":{"start":{"column":3,"line":428}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport { planEnroll, planSwitch } from './campaign-enroll-plan';\n\nconst steps = [\n  { step_number: 1, delay_minutes: 0, template_key: 'a' },\n  { step_number: 2, delay_minutes: 60, template_key: 'b' },\n];\n\nconst standard = {\n  id: 'C',\n  name: 'Standard',\n  urgency_filter: null as string | null,\n  campaign_steps: steps,\n};\n\nconst emergency = {\n  id: 'E',\n  name: 'Emergency',\n  urgency_filter: 'emergency' as string | null,\n  campaign_steps: steps,\n};\n\ndescribe('planEnroll', () => {\n  it('rejects opted_out / already_enrolled / lead_not_found via gates', () => {\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: true,\n        existingStatus: null,\n        campaigns: [standard],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'opted_out' });\n\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: false,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [standard],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'lead_not_found' });\n\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: 'active',\n        campaigns: [standard],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'already_enrolled:active' });\n  });\n\n  it('rejects no_campaigns for error OR null OR empty (not AND)', () => {\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [standard],\n        campaignError: true, // error alone must reject even with campaigns present\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'no_campaigns' });\n\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: null,\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'no_campaigns' });\n\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'no_campaigns' });\n  });\n\n  it('rejects no_matching / no_steps / only_initial_already_sent', () => {\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [\n          {\n            id: 'H',\n            name: 'High',\n            urgency_filter: 'high',\n            campaign_steps: steps,\n          },\n        ],\n        campaignError: false,\n        urgency: 'emergency',\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'no_matching_campaign' });\n\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [{ ...standard, campaign_steps: [] }],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'absent',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'no_steps' });\n\n    // Single delay-0 step + recovery confirmed → only_initial_already_sent\n    expect(\n      planEnroll({\n        leadId: 'L',\n        leadFound: true,\n        optedOut: false,\n        existingStatus: null,\n        campaigns: [\n          {\n            ...standard,\n            campaign_steps: [\n              { step_number: 1, delay_minutes: 0, template_key: 'a' },\n            ],\n          },\n        ],\n        campaignError: false,\n        urgency: null,\n        recoveryState: 'confirmed',\n        smsOutboundSid: null,\n      })\n    ).toEqual({ type: 'reject', reason: 'only_initial_already_sent' });\n  });\n\n  it('recoveryConfirmed via state OR sid; Standard treats recovery as initial', () => {\n    // confirmed without sid\n    const a = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'confirmed',\n      smsOutboundSid: null,\n    });\n    expect(a.type).toBe('insert');\n    if (a.type === 'insert') {\n      expect(a.result.skippedInitial).toBe(true);\n      expect(a.result.currentStep).toBe(2);\n    }\n\n    // sid without confirmed state\n    const b = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'absent',\n      smsOutboundSid: 'mlf:recovery:L',\n    });\n    expect(b.type).toBe('insert');\n    if (b.type === 'insert') {\n      expect(b.result.skippedInitial).toBe(true);\n    }\n\n    // neither → start at step 1\n    const c = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'absent',\n      smsOutboundSid: null,\n    });\n    expect(c.type).toBe('insert');\n    if (c.type === 'insert') {\n      expect(c.result.skippedInitial).toBe(false);\n      expect(c.result.currentStep).toBe(1);\n    }\n  });\n\n  it('Emergency never treats recovery as initial (urgency_filter non-null)', () => {\n    const p = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [emergency, standard],\n      campaignError: false,\n      urgency: 'emergency',\n      recoveryState: 'confirmed',\n      smsOutboundSid: 'mlf:recovery:L',\n    });\n    expect(p.type).toBe('insert');\n    if (p.type === 'insert') {\n      expect(p.result.campaignName).toBe('Emergency');\n      // Must stay on step 1 even with recovery confirmed\n      expect(p.result.currentStep).toBe(1);\n      expect(p.result.skippedInitial).toBe(false);\n    }\n  });\n\n  it('statusActive coalesce: custom wins, else active', () => {\n    const custom = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'absent',\n      smsOutboundSid: null,\n      statusActive: 'queued_active',\n    });\n    expect(custom.type).toBe('insert');\n    if (custom.type === 'insert') {\n      expect(custom.payload.status).toBe('queued_active');\n    }\n\n    const def = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'absent',\n      smsOutboundSid: null,\n    });\n    expect(def.type).toBe('insert');\n    if (def.type === 'insert') {\n      expect(def.payload.status).toBe('active');\n    }\n  });\n\n  it('inserts Standard for urgency null', () => {\n    const p = planEnroll({\n      leadId: 'L',\n      leadFound: true,\n      optedOut: false,\n      existingStatus: null,\n      campaigns: [standard],\n      campaignError: false,\n      urgency: null,\n      recoveryState: 'absent',\n      smsOutboundSid: null,\n    });\n    expect(p.type).toBe('insert');\n    if (p.type === 'insert') {\n      expect(p.result.campaignName).toBe('Standard');\n      expect(p.payload.lead_id).toBe('L');\n      expect(p.payload.campaign_id).toBe('C');\n      expect(p.result.enrolled).toBe(true);\n    }\n  });\n});\n\ndescribe('planSwitch', () => {\n  it('rejects fresh claim / missing lead / missing campaign / no steps', () => {\n    expect(\n      planSwitch({\n        hasEnrollment: true,\n        freshClaim: true,\n        leadFound: true,\n        campaignFound: true,\n        campaign: emergency,\n        targetCampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'deferred_fresh_claim' });\n\n    expect(\n      planSwitch({\n        hasEnrollment: false,\n        freshClaim: false,\n        leadFound: true,\n        campaignFound: true,\n        campaign: emergency,\n        targetCampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'no_enrollment' });\n\n    expect(\n      planSwitch({\n        hasEnrollment: true,\n        freshClaim: false,\n        leadFound: false,\n        campaignFound: true,\n        campaign: null,\n        targetCampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'lead_not_found' });\n\n    expect(\n      planSwitch({\n        hasEnrollment: true,\n        freshClaim: false,\n        leadFound: true,\n        campaignFound: false,\n        campaign: null,\n        targetCampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'campaign_not_found' });\n\n    // campaignFound true but campaign null still rejects\n    expect(\n      planSwitch({\n        hasEnrollment: true,\n        freshClaim: false,\n        leadFound: true,\n        campaignFound: true,\n        campaign: null,\n        targetC
