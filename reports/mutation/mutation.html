ampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'campaign_not_found' });\n\n    expect(\n      planSwitch({\n        hasEnrollment: true,\n        freshClaim: false,\n        leadFound: true,\n        campaignFound: true,\n        campaign: { ...emergency, campaign_steps: [] },\n        targetCampaignId: 'E',\n        smsOutboundSid: null,\n        nowIso: 'n',\n      })\n    ).toEqual({ type: 'reject', reason: 'no_steps' });\n  });\n\n  it('updates with treatRecoveryAsInitial false (stay step 1)', () => {\n    const p = planSwitch({\n      hasEnrollment: true,\n      freshClaim: false,\n      leadFound: true,\n      campaignFound: true,\n      campaign: emergency,\n      targetCampaignId: 'E',\n      smsOutboundSid: 'mlf:recovery:L',\n      nowIso: 'n',\n    });\n    expect(p.type).toBe('update');\n    if (p.type === 'update') {\n      expect(p.result.switched).toBe(true);\n      expect(p.result.currentStep).toBe(1);\n      expect(p.result.skippedInitial).toBe(false);\n      expect(p.payload.campaign_id).toBe('E');\n      expect(p.payload.status).toBe('active');\n      expect(p.payload.updated_at).toBe('n');\n      expect(p.result.campaignName).toBe('Emergency');\n    }\n  });\n\n  it('statusActive custom vs default active', () => {\n    const p = planSwitch({\n      hasEnrollment: true,\n      freshClaim: false,\n      leadFound: true,\n      campaignFound: true,\n      campaign: emergency,\n      targetCampaignId: 'E',\n      smsOutboundSid: null,\n      nowIso: 'now',\n      statusActive: 'reactivated',\n    });\n    expect(p.type).toBe('update');\n    if (p.type === 'update') {\n      expect(p.payload.status).toBe('reactivated');\n    }\n  });\n\n  it('property: successful switch always reports switched + enrolled', () => {\n    fc.assert(\n      fc.property(fc.boolean(), (hasSid) => {\n        const p = planSwitch({\n          hasEnrollment: true,\n          freshClaim: false,\n          leadFound: true,\n          campaignFound: true,\n          campaign: emergency,\n          targetCampaignId: 'E',\n          smsOutboundSid: hasSid ? 'sid' : null,\n          nowIso: 't',\n        });\n        expect(p.type).toBe('update');\n        if (p.type === 'update') {\n          expect(p.result.switched).toBe(true);\n          expect(p.result.enrolled).toBe(true);\n          expect(p.result.currentStep).toBe(1);\n        }\n      }),\n      { numRuns: 20 }\n    );\n  });\n});\n"},"src/lib/gemini-url.test.ts":{"tests":[{"id":"386","name":"ONE_GATEWAY_URL fail-closed > unset outside production throws (no live call)","location":{"start":{"column":3,"line":9}}},{"id":"387","name":"ONE_GATEWAY_URL fail-closed > unset in production requires explicit URL (no implicit live default)","location":{"start":{"column":3,"line":15}}},{"id":"388","name":"ONE_GATEWAY_URL fail-closed > production accepts the documented default when set explicitly","location":{"start":{"column":3,"line":21}}},{"id":"389","name":"ONE_GATEWAY_URL fail-closed > explicit URL wins","location":{"start":{"column":3,"line":27}}}],"source":"import { afterEach, describe, expect, it } from 'vitest';\nimport { PRODUCTION_DEFAULT_GATEWAY_URL, resolveGatewayUrl } from './gemini';\n\ndescribe('ONE_GATEWAY_URL fail-closed', () => {\n  afterEach(() => {\n    delete process.env.ONE_GATEWAY_URL;\n  });\n\n  it('unset outside production throws (no live call)', () => {\n    expect(() =>\n      resolveGatewayUrl(undefined, { isProduction: false })\n    ).toThrow(/fail closed/i);\n  });\n\n  it('unset in production requires explicit URL (no implicit live default)', () => {\n    expect(() =>\n      resolveGatewayUrl(undefined, { isProduction: true })\n    ).toThrow(/explicitly/i);\n  });\n\n  it('production accepts the documented default when set explicitly', () => {\n    expect(\n      resolveGatewayUrl(PRODUCTION_DEFAULT_GATEWAY_URL, { isProduction: true })\n    ).toBe(PRODUCTION_DEFAULT_GATEWAY_URL);\n  });\n\n  it('explicit URL wins', () => {\n    expect(\n      resolveGatewayUrl('https://gw.example.com/v1', { isProduction: false })\n    ).toBe('https://gw.example.com/v1');\n  });\n});\n"},"src/services/send/decisions.test.ts":{"tests":[{"id":"390","name":"isCustomerSmsKind / shouldResolveRecoveryGate > customer kinds are recovery|campaign only","location":{"start":{"column":3,"line":16}}},{"id":"391","name":"isCustomerSmsKind / shouldResolveRecoveryGate > recovery gate only for campaign step 1 without skip","location":{"start":{"column":3,"line":23}}},{"id":"392","name":"decideCustomerFacingGates > null for escalation/manual","location":{"start":{"column":3,"line":56}}},{"id":"393","name":"decideCustomerFacingGates > skipQuietHours ignores quiet block","location":{"start":{"column":3,"line":73}}},{"id":"394","name":"decideCustomerFacingGates > property: suppressed beats opted_out beats recovery gate","location":{"start":{"column":3,"line":90}}},{"id":"395","name":"decideCustomerFacingGates > suppressed / opted_out","location":{"start":{"column":3,"line":108}}},{"id":"396","name":"decideCustomerFacingGates > recovery gate on campaign step 1","location":{"start":{"column":3,"line":125}}},{"id":"397","name":"decideCustomerFacingGates > quiet hours deferred / unresolved","location":{"start":{"column":3,"line":156}}},{"id":"398","name":"decideDuplicateSid > property: confirmed → confirm; failed/needs_review → review; deferred → claim","location":{"start":{"column":3,"line":192}}},{"id":"399","name":"mapRelaySendResult > maps conflict / maintenance / failed / ok","location":{"start":{"column":3,"line":234}}},{"id":"400","name":"resolveIdempotencySid > prefers explicit key; recovery; campaign; fallback","location":{"start":{"column":3,"line":248}}},{"id":"401","name":"interpretCampaignSendOutcome > covers every outcome kind","location":{"start":{"column":3,"line":278}}},{"id":"402","name":"interpretRecoverySendOutcome > defers / logs / sent","location":{"start":{"column":3,"line":344}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  decideCustomerFacingGates,\n  decideDuplicateSid,\n  interpretCampaignSendOutcome,\n  interpretRecoverySendOutcome,\n  isCustomerSmsKind,\n  mapRelaySendResult,\n  resolveIdempotencySid,\n  shouldResolveRecoveryGate,\n} from './decisions';\nimport type { SendOutcome } from './types';\n\ndescribe('isCustomerSmsKind / shouldResolveRecoveryGate', () => {\n  it('customer kinds are recovery|campaign only', () => {\n    expect(isCustomerSmsKind('recovery')).toBe(true);\n    expect(isCustomerSmsKind('campaign')).toBe(true);\n    expect(isCustomerSmsKind('manual')).toBe(false);\n    expect(isCustomerSmsKind('escalation')).toBe(false);\n  });\n\n  it('recovery gate only for campaign step 1 without skip', () => {\n    expect(\n      shouldResolveRecoveryGate({\n        kind: 'campaign',\n        stepNumber: 1,\n        skipRecoveryGate: false,\n      })\n    ).toBe(true);\n    expect(\n      shouldResolveRecoveryGate({\n        kind: 'campaign',\n        stepNumber: 1,\n        skipRecoveryGate: true,\n      })\n    ).toBe(false);\n    expect(\n      shouldResolveRecoveryGate({ kind: 'campaign', stepNumber: 2 })\n    ).toBe(false);\n    expect(\n      shouldResolveRecoveryGate({ kind: 'recovery', stepNumber: 1 })\n    ).toBe(false);\n    // OR mutant: campaign && step1 || !skip → true when skip is false even for recovery\n    expect(\n      shouldResolveRecoveryGate({\n        kind: 'recovery',\n        stepNumber: 99,\n        skipRecoveryGate: false,\n      })\n    ).toBe(false);\n  });\n});\n\ndescribe('decideCustomerFacingGates', () => {\n  it('null for escalation/manual', () => {\n    expect(\n      decideCustomerFacingGates({\n        kind: 'escalation',\n        suppressed: true,\n        optedOut: true,\n      })\n    ).toBeNull();\n    expect(\n      decideCustomerFacingGates({\n        kind: 'manual',\n        suppressed: true,\n        optedOut: true,\n      })\n    ).toBeNull();\n  });\n\n  it('skipQuietHours ignores quiet block', () => {\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: false,\n        optedOut: false,\n        skipQuietHours: true,\n        quiet: {\n          allowed: false,\n          unresolved: true,\n          reason: 'x',\n          zones: [],\n        },\n      })\n    ).toBeNull();\n  });\n\n  it('property: suppressed beats opted_out beats recovery gate', () => {\n    fc.assert(\n      fc.property(fc.boolean(), fc.boolean(), (suppressed, optedOut) => {\n        const d = decideCustomerFacingGates({\n          kind: 'campaign',\n          stepNumber: 1,\n          suppressed,\n          optedOut,\n          recovery: 'pending',\n        });\n        if (suppressed) expect(d).toEqual({ kind: 'blocked', reason: 'suppressed' });\n        else if (optedOut) expect(d).toEqual({ kind: 'blocked', reason: 'opted_out' });\n        else expect(d).toEqual({ kind: 'blocked', reason: 'recovery_pending' });\n      }),\n      { numRuns: 20 }\n    );\n  });\n\n  it('suppressed / opted_out', () => {\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: true,\n        optedOut: false,\n      })\n    ).toEqual({ kind: 'blocked', reason: 'suppressed' });\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        suppressed: false,\n        optedOut: true,\n      })\n    ).toEqual({ kind: 'blocked', reason: 'opted_out' });\n  });\n\n  it('recovery gate on campaign step 1', () => {\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 1,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'pending',\n      })\n    ).toEqual({ kind: 'blocked', reason: 'recovery_pending' });\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 1,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'resolved_sent',\n      })\n    ).toMatchObject({ kind: 'skipped' });\n    expect(\n      decideCustomerFacingGates({\n        kind: 'campaign',\n        stepNumber: 1,\n        skipRecoveryGate: true,\n        suppressed: false,\n        optedOut: false,\n        recovery: 'pending',\n      })\n    ).toBeNull();\n  });\n\n  it('quiet hours deferred / unresolved', () => {\n    const next = new Date('2026-10-29T12:00:00.000Z');\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: false,\n        optedOut: false,\n        quiet: {\n          allowed: false,\n          nextSendAt: next,\n          zones: ['America/New_York'],\n          endHour: 21,\n        },\n      })\n    ).toEqual({\n      kind: 'blocked',\n      reason: 'quiet_hours_deferred',\n      nextSendAt: next.toISOString(),\n    });\n    expect(\n      decideCustomerFacingGates({\n        kind: 'recovery',\n        suppressed: false,\n        optedOut: false,\n        quiet: {\n          allowed: false,\n          unresolved: true,\n          reason: 'unmapped',\n          zones: [],\n        },\n      })\n    ).toMatchObject({ kind: 'blocked', reason: 'quiet_hours_unresolved' });\n  });\n});\n\ndescribe('decideDuplicateSid', () => {\n  it('property: confirmed → confirm; failed/needs_review → review; deferred → claim', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(\n          'queued',\n          'sent',\n          'delivered',\n          'FAILED',\n          'undelivered',\n          'needs_review',\n          'deferred',\n          'abandoned_retry',\n          'sending',\n          null\n        ),\n        (status) => {\n          const d = decideDuplicateSid(status);\n          if (status && ['queued', 'sent', 'delivered'].includes(String(status).toLowerCase())) {\n            expect(d.action).toBe('confirm_existing');\n          } else if (\n            status &&\n            ['failed', 'undelivered', 'needs_review'].includes(\n              String(status).toLowerCase()\n            )\n          ) {\n            expect(d.action).toBe('needs_review');\n          } else if (\n            status &&\n            ['deferred', 'abandoned_retry'].includes(String(status).toLowerCase())\n          ) {\n            expect(d.action).toBe('claim_deferred');\n          } else {\n            expect(d.action).toBe('block_in_flight');\n          }\n        }\n      ),\n      { numRuns: 40 }\n    );\n  });\n});\n\ndescribe('mapRelaySendResult', () => {\n  it('maps conflict / maintenance / failed / ok', () => {\n    expect(mapRelaySendResult({ id: '1', conflict: true }).type).toBe('conflict');\n    expect(\n      mapRelaySendResult({ id: '1', ambiguous: true, status: 'maintenance' }).type\n    ).toBe('maintenance');\n    expect(mapRelaySendResult({ id: '1', ambiguous: true }).type).toBe('rate_limit');\n    expect(mapRelaySendResult({ id: '1', status: 'failed' }).type).toBe('failed');\n    expect(\n      mapRelaySendResult({ id: 'm', status: 'queued', keyEchoed: true })\n    ).toMatchObject({ type: 'ok', keyEchoed: true });\n  });\n});\n\ndescribe('resolveIdempotencySid', () => {\n  it('prefers explicit key; recovery; campaign; fallback', () => {\n    expect(\n      resolveIdempotencySid(\n        { idempotencyKey: 'x', kind: 'recovery', leadId: 'L' },\n        1\n      )\n    ).toBe('x');\n    expect(\n      resolveIdempotencySid({ kind: 'recovery', leadId: 'L1' }, 1)\n    ).toBe('mlf:recovery:L1');\n    expect(\n      resolveIdempotencySid(\n        {\n          kind: 'campaign',\n          leadId: 'L',\n          enrollmentId: 'E',\n          campaignId: 'C',\n          stepNumber: 2,\n        },\n        1\n      )\n    ).toBe('mlf:campaign:E:C:step:2');\n    expect(\n      resolveIdempotencySid({ kind: 'manual', leadId: 'L' }, 42)\n    ).toBe('mlf:manual:L:42');\n  });\n});\n\ndescribe('interpretCampaignSendOutcome', () => {\n  const park = '2099-01-01T00:00:00.000Z';\n  it('covers every outcome kind', () => {\n    const cases: Array<"+"[SendOutcome, string]> = [\n      [\n        { kind: 'skipped', reason: 'recovery_already_sent_skip_step_1' },\n        'advance',\n      ],\n      [\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: '2026-01-01T00:00:00.000Z',\n        },\n        'release',\n      ],\n      [{ kind: 'blocked', reason: 'quiet_hours_unresolved' }, 'flag_unresolved_tz'],\n      [{ kind: 'blocked', reason: 'recovery_pending' }, 'park'],\n      [{ kind: 'blocked', reason: 'suppressed' }, 'pause_opt_out'],\n      [{ kind: 'blocked', reason: 'opted_out' }, 'pause_opt_out'],\n      [{ kind: 'blocked', reason: 'sends_disabled' }, 'release'],\n      [{ kind: 'blocked', reason: 'duplicate_in_flight' }, 'park'],\n      [{ kind: 'blocked', reason: 'invalid_phone' }, 'noop_false'],\n      [\n        {\n          kind: 'sent',\n          sid: 's',\n          messageId: 'm',\n          providerStatus: 'queued',\n          keySupportedAtSend: true,\n        },\n        'advance',\n      ],\n      [{ kind: 'needs_review', sid: 's', reason: 'x' }, 'needs_review_terminal'],\n      [\n        { kind: 'ambiguous', sid: 's', reason: 'recent_send', nextRetryAt: park },\n        'park',\n      ],\n      [{ kind: 'never_sent', sid: 's' }, 'park'],\n    ];\n    for (const [outcome, type] of cases) {\n      expect(interpretCampaignSendOutcome(outcome, park).type).toBe(type);\n    }\n    // sends_disabled releases claim but counts as failure for cron\n    expect(\n      interpretCampaignSendOutcome(\n        { kind: 'blocked', reason: 'sends_disabled' },\n        park\n      )\n    ).toEqual({ type: 'release', nextSendAt: park, ok: false });\n    expect(\n      interpretCampaignSendOutcome(\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: '2026-01-01T00:00:00.000Z',\n        },\n        park\n      )\n    ).toEqual({\n      type: 'release',\n      nextSendAt: '2026-01-01T00:00:00.000Z',\n      ok: true,\n    });\n  });\n});\n\ndescribe('interpretRecoverySendOutcome', () => {\n  it('defers / logs / sent', () => {\n    expect(\n      interpretRecoverySendOutcome(\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't',\n        },\n        'fallback'\n      )\n    ).toEqual({ type: 'persist_deferred', nextSendAt: 't' });\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'blocked', reason: 'quiet_hours_deferred' },\n        'fallback'\n      )\n    ).toEqual({ type: 'persist_deferred', nextSendAt: 'fallback' });\n    expect(\n      interpretRecoverySendOutcome({ kind: 'skipped', reason: 'x' }, 'f').type\n    ).toBe('log_blocked');\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'needs_review', sid: 's', reason: 'r' },\n        'f'\n      )\n    ).toEqual({ type: 'log_needs_review', sid: 's' });\n    expect(\n      interpretRecoverySendOutcome(\n        { kind: 'ambiguous', sid: 's', reason: 'r' },\n        'f'\n      ).type\n    ).toBe('log_ambiguous');\n    expect(\n      interpretRecoverySendOutcome(\n        {\n          kind: 'sent',\n          sid: 's',\n          messageId: 'm',\n          providerStatus: 'queued',\n          keySupportedAtSend: true,\n        },\n        'f'\n      )\n    ).toEqual({ type: 'log_sent', sid: 's' });\n  });\n});\n"},"src/services/send/deferred-row.test.ts":{"tests":[{"id":"403","name":"interpretDeferredRowOutcome > re-defers quiet hours (uses nextSendAt or fallback)","location":{"start":{"column":3,"line":9}}},{"id":"404","name":"interpretDeferredRowOutcome > counts sent","location":{"start":{"column":3,"line":28}}},{"id":"405","name":"interpretDeferredRowOutcome > abandons blocked/skipped non-quiet","location":{"start":{"column":3,"line":43}}},{"id":"406","name":"interpretDeferredRowOutcome > parks ambiguous / needs_review","location":{"start":{"column":3,"line":55}}},{"id":"407","name":"interpretDeferredRowOutcome > property: every SendOutcome kind maps to a known action","location":{"start":{"column":3,"line":70}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport { interpretDeferredRowOutcome } from './decisions';\nimport type { SendOutcome } from './types';\n\nconst fallback = '2026-01-01T08:00:00.000Z';\n\ndescribe('interpretDeferredRowOutcome', () => {\n  it('re-defers quiet hours (uses nextSendAt or fallback)', () => {\n    expect(\n      interpretDeferredRowOutcome(\n        {\n          kind: 'blocked',\n          reason: 'quiet_hours_deferred',\n          nextSendAt: 't1',\n        },\n        fallback\n      )\n    ).toEqual({ type: 're_defer', nextSendAt: 't1' });\n    expect(\n      interpretDeferredRowOutcome(\n        { kind: 'blocked', reason: 'quiet_hours_deferred' },\n        fallback\n      )\n    ).toEqual({ type: 're_defer', nextSendAt: fallback });\n  });\n\n  it('counts sent', () => {\n    expect(\n      interpretDeferredRowOutcome(\n        {\n          kind: 'sent',\n          sid: 's',\n          messageId: 'm',\n          providerStatus: 'queued',\n          keySupportedAtSend: true,\n        },\n        fallback\n      )\n    ).toEqual({ type: 'count_sent' });\n  });\n\n  it('abandons blocked/skipped non-quiet', () => {\n    expect(\n      interpretDeferredRowOutcome(\n        { kind: 'blocked', reason: 'suppressed' },\n        fallback\n      )\n    ).toEqual({ type: 'abandon' });\n    expect(\n      interpretDeferredRowOutcome({ kind: 'skipped', reason: 'x' }, fallback)\n    ).toEqual({ type: 'abandon' });\n  });\n\n  it('parks ambiguous / needs_review', () => {\n    expect(\n      interpretDeferredRowOutcome(\n        { kind: 'ambiguous', sid: 's', reason: 'r' },\n        fallback\n      )\n    ).toEqual({ type: 'count_parked' });\n    expect(\n      interpretDeferredRowOutcome(\n        { kind: 'needs_review', sid: 's', reason: 'r' },\n        fallback\n      )\n    ).toEqual({ type: 'count_parked' });\n  });\n\n  it('property: every SendOutcome kind maps to a known action', () => {\n    const outcomes: SendOutcome[] = [\n      { kind: 'blocked', reason: 'quiet_hours_deferred', nextSendAt: 't' },\n      { kind: 'blocked', reason: 'suppressed' },\n      { kind: 'skipped', reason: 'x' },\n      {\n        kind: 'sent',\n        sid: 's',\n        messageId: 'm',\n        providerStatus: 'queued',\n        keySupportedAtSend: true,\n      },\n      { kind: 'ambiguous', sid: 's', reason: 'r' },\n      { kind: 'needs_review', sid: 's', reason: 'r' },\n      { kind: 'never_sent', sid: 's' },\n    ];\n    fc.assert(\n      fc.property(fc.constantFrom(...outcomes), (o) => {\n        const a = interpretDeferredRowOutcome(o, fallback);\n        expect([\n          're_defer',\n          'count_sent',\n          'abandon',\n          'count_parked',\n          'ignore',\n        ]).toContain(a.type);\n      }),\n      { numRuns: 40 }\n    );\n  });\n});\n"},"src/services/quiet-hours.edges.test.ts":{"tests":[{"id":"408","name":"quiet-hours edge killers > areaCodeFromE164 handles 10-digit, 11-digit, and junk","location":{"start":{"column":3,"line":11}}},{"id":"409","name":"quiet-hours edge killers > isValidTimeZone rejects garbage","location":{"start":{"column":3,"line":18}}},{"id":"410","name":"quiet-hours edge killers > FL end hour vs default","location":{"start":{"column":3,"line":23}}},{"id":"411","name":"quiet-hours edge killers > 850 requires both zones open — 8am ET but 7am CT is deferred","location":{"start":{"column":3,"line":29}}},{"id":"412","name":"quiet-hours edge killers > invalid lead timezone ignored; falls through to area code","location":{"start":{"column":3,"line":38}}},{"id":"413","name":"quiet-hours edge killers > flags: lead TZ known; 850 ambiguous; unmapped unknown","location":{"start":{"column":3,"line":48}}},{"id":"414","name":"quiet-hours edge killers > quietEndHour uses FL set membership (305 vs 212)","location":{"start":{"column":3,"line":60}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  areaCodeFromE164,\n  deferUntilQuietHoursOpen,\n  isValidTimeZone,\n  quietEndHourForPhone,\n  resolveLeadTimezones,\n} from './quiet-hours';\n\ndescribe('quiet-hours edge killers', () => {\n  it('areaCodeFromE164 handles 10-digit, 11-digit, and junk', () => {\n    expect(areaCodeFromE164('+12125550100')).toBe('212');\n    expect(areaCodeFromE164('2125550100')).toBe('212');\n    expect(areaCodeFromE164('+442071838750')).toBeNull();\n    expect(areaCodeFromE164('123')).toBeNull();\n  });\n\n  it('isValidTimeZone rejects garbage', () => {\n    expect(isValidTimeZone('America/New_York')).toBe(true);\n    expect(isValidTimeZone('Not/AZone')).toBe(false);\n  });\n\n  it('FL end hour vs default', () => {\n    expect(quietEndHourForPhone('+13055550100')).toBe(20);\n    expect(quietEndHourForPhone('+12125550100')).toBe(21);\n    expect(quietEndHourForPhone(null)).toBe(21);\n  });\n\n  it('850 requires both zones open — 8am ET but 7am CT is deferred', () => {\n    // 2026-07-01 12:00 UTC = 08:00 EDT, 07:00 CDT → CT still quiet\n    const now = new Date('2026-07-01T12:00:00.000Z');\n    const d = deferUntilQuietHoursOpen(now, {\n      callerPhoneE164: '+18505550100',\n    });\n    expect(d.allowed).toBe(false);\n  });\n\n  it('invalid lead timezone ignored; falls through to area code', () => {\n    const r = resolveLeadTimezones({\n      callerPhoneE164: '+12125550100',\n      leadTimezone: 'Not/AZone',\n    });\n    expect(r.zones).toEqual(['America/New_York']);\n    expect(r.ambiguous).toBe(false);\n    expect(r.known).toBe(true);\n  });\n\n  it('flags: lead TZ known; 850 ambiguous; unmapped unknown', () => {\n    expect(\n      resolveLeadTimezones({ leadTimezone: 'America/Denver' })\n    ).toMatchObject({ ambiguous: false, known: true, zones: ['America/Denver'] });\n    expect(\n      resolveLeadTimezones({ callerPhoneE164: '+18505550100' })\n    ).toMatchObject({ ambiguous: true, known: true });\n    expect(\n      resolveLeadTimezones({ callerPhoneE164: '+19995550100' })\n    ).toMatchObject({ zones: [], known: false, ambiguous: false });\n  });\n\n  it('quietEndHour uses FL set membership (305 vs 212)', () => {\n    expect(quietEndHourForPhone('+13055550100')).toBe(20);\n    expect(quietEndHourForPhone('+12125550100')).toBe(21);\n    expect(quietEndHourForPhone(undefined)).toBe(21);\n  });\n});\n\n"},"src/services/quiet-hours.mutation.test.ts":{"tests":[{"id":"415","name":"quiet-hours mutation killers > isValidTimeZone caches false (second call still false)","location":{"start":{"column":3,"line":12}}},{"id":"416","name":"quiet-hours mutation killers > areaCodeFromE164 requires leading 1 for 11-digit NANP","location":{"start":{"column":3,"line":21}}},{"id":"417","name":"quiet-hours mutation killers > leadTimezone trim is required","location":{"start":{"column":3,"line":29}}},{"id":"418","name":"quiet-hours mutation killers > single-zone mapped area is known non-ambiguous","location":{"start":{"column":3,"line":45}}},{"id":"419","name":"quiet-hours mutation killers > localParts throws exact message on invalid TZ","location":{"start":{"column":3,"line":55}}},{"id":"420","name":"quiet-hours mutation killers > deprecated resolveLeadTimezone defaults to America/New_York when unresolved","location":{"start":{"column":3,"line":62}}},{"id":"421","name":"quiet-hours mutation killers > unresolved defer decision has exact reason no_valid_timezone","location":{"start":{"column":3,"line":71}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  areaCodeFromE164,\n  deferUntilQuietHoursOpen,\n  isValidTimeZone,\n  localParts,\n  resolveLeadTimezone,\n  resolveLeadTimezones,\n} from './quiet-hours';\n\ndescribe('quiet-hours mutation killers', () => {\n  it('isValidTimeZone caches false (second call still false)', () => {\n    const bad = 'Definitely/Not_A_Real_Zone_XYZ';\n    expect(isValidTimeZone(bad)).toBe(false);\n    // BooleanLiteral true on cache-set would make the second call return true\n    expect(isValidTimeZone(bad)).toBe(false);\n    expect(isValidTimeZone('America/New_York')).toBe(true);\n    expect(isValidTimeZone('America/New_York')).toBe(true);\n  });\n\n  it('areaCodeFromE164 requires leading 1 for 11-digit NANP', () => {\n    expect(areaCodeFromE164('+12125550100')).toBe('212');\n    expect(areaCodeFromE164('2125550100')).toBe('212');\n    // 11 digits NOT starting with 1 → null (startsWith('') mutant would slice)\n    expect(areaCodeFromE164('99955501001')).toBeNull();\n    expect(areaCodeFromE164('01155501001')).toBeNull();\n  });\n\n  it('leadTimezone trim is required', () => {\n    const padded = resolveLeadTimezones({\n      leadTimezone: '  America/Denver  ',\n      callerPhoneE164: '+12125550100',\n    });\n    expect(padded).toEqual({\n      zones: ['America/Denver'],\n      ambiguous: false,\n      known: true,\n      endHour: 21,\n    });\n    // Without trim, padded IANA fails validation and falls through to area code\n    const untrimmedWouldFail = isValidTimeZone('  America/Denver  ');\n    expect(untrimmedWouldFail).toBe(false);\n  });\n\n  it('single-zone mapped area is known non-ambiguous', () => {\n    const r = resolveLeadTimezones({ callerPhoneE164: '+12125550100' });\n    expect(r).toEqual({\n      zones: ['America/New_York'],\n      ambiguous: false,\n      known: true,\n      endHour: 21,\n    });\n  });\n\n  it('localParts throws exact message on invalid TZ', () => {\n    expect(() => localParts(new Date(), 'Not/AZone')).toThrow(\n      'Invalid time zone: Not/AZone'\n    );\n    expect(() => localParts(new Date(), 'America/New_York')).not.toThrow();\n  });\n\n  it('deprecated resolveLeadTimezone defaults to America/New_York when unresolved', () => {\n    expect(\n      resolveLeadTimezone({ businessTimezone: 'America/Chicago' })\n    ).toBe('America/New_York');\n    expect(\n      resolveLeadTimezone({ callerPhoneE164: '+19995550100' })\n    ).toBe('America/New_York');\n  });\n\n  it('unresolved defer decision has exact reason no_valid_timezone', () => {\n    const d = deferUntilQuietHoursOpen(new Date('2026-07-01T16:00:00.000Z'), {\n      callerPhoneE164: '+19995550100',\n    });\n    expect(d).toEqual({\n      allowed: false,\n      unresolved: true,\n      reason: 'no_valid_timezone',\n      zones: [],\n    });\n  });\n});\n"},"src/services/opt-out.test.ts":{"tests":[{"id":"422","name":"opt-out whole-message NFKC + confusable > matches exact STOP-family tokens","location":{"start":{"column":3,"line":10}}},{"id":"423","name":"opt-out whole-message NFKC + confusable > strips zero-width and folds full-width","location":{"start":{"column":3,"line":37}}},{"id":"424","name":"opt-out whole-message NFKC + confusable > does not auto-suppress service language (ambiguous or not_opt_out)","location":{"start":{"column":3,"line":44}}},{"id":"425","name":"opt-out whole-message NFKC + confusable > keyword-in-sentence routes to human review","location":{"start":{"column":3,"line":52}}},{"id":"426","name":"opt-out whole-message NFKC + confusable > exposes FCC STOP footer","location":{"start":{"column":3,"line":63}}},{"id":"427","name":"opt-out whole-message NFKC + confusable > QC r5 F: Cyrillic стор, spaced STOP, STOP STOP","location":{"start":{"column":3,"line":67}}},{"id":"428","name":"opt-out whole-message NFKC + confusable > QC r7: longer messages with keywords are ambiguous, not opt_out","location":{"start":{"column":3,"line":74}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  OPT_OUT_FOOTER,\n  classifyOptOut,\n  isDefiniteOptOut,\n  normalizeOptOutText,\n} from './opt-out';\n\ndescribe('opt-out whole-message NFKC + confusable', () => {\n  it('matches exact STOP-family tokens', () => {\n    for (const t of [\n      'STOP',\n      'stop',\n      'Stop!',\n      'STOP?',\n      '\"STOP\"',\n      'STOPALL',\n      'UNSUBSCRIBE',\n      'QUIT',\n      'END',\n      'CANCEL',\n      'OPT OUT',\n      'OPTOUT',\n      'REVOKE',\n      \"don't text me again\",\n      'Please stop',\n      'unsubscribe me',\n      'cancel please',\n      'stop it',\n      'leave me alone',\n      'Stop 🛑',\n    ]) {\n      expect(isDefiniteOptOut(t), t).toBe(true);\n    }\n  });\n\n  it('strips zero-width and folds full-width', () => {\n    expect(isDefiniteOptOut('S\\u200BTOP')).toBe(true);\n    const fullWidth = '\\uFF33\\uFF34\\uFF2F\\uFF30';\n    expect(normalizeOptOutText(fullWidth)).toBe('STOP');\n    expect(isDefiniteOptOut(fullWidth)).toBe(true);\n  });\n\n  it('does not auto-suppress service language (ambiguous or not_opt_out)', () => {\n    expect(isDefiniteOptOut(\"won't stop leaking HELP\")).toBe(false);\n    expect(isDefiniteOptOut('stop by today')).toBe(false);\n    expect(isDefiniteOptOut('My water heater is leaking')).toBe(false);\n    expect(classifyOptOut(\"won't stop leaking HELP\").kind).toBe('ambiguous');\n    expect(classifyOptOut('stop by today').kind).toBe('ambiguous');\n  });\n\n  it('keyword-in-sentence routes to human review', () => {\n    expect(classifyOptOut('cancel my appointment')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n    expect(classifyOptOut('end of day is fine')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n  });\n\n  it('exposes FCC STOP footer', () => {\n    expect(OPT_OUT_FOOTER).toBe('Reply STOP to opt out.');\n  });\n\n  it('QC r5 F: Cyrillic стор, spaced STOP, STOP STOP', () => {\n    expect(isDefiniteOptOut('ѕтор')).toBe(true);\n    expect(isDefiniteOptOut('S T O P')).toBe(true);\n    expect(isDefiniteOptOut('STOP STOP')).toBe(true);\n    expect(isDefiniteOptOut('please stop texting me')).toBe(true);\n  });\n\n  it('QC r7: longer messages with keywords are ambiguous, not opt_out', () => {\n    for (const t of [\n      'STOP\\nSent from my iPhone',\n      'Stop.  Thanks',\n      'I want to unsubscribe from these',\n      'please cancel the appointment',\n    ]) {\n      expect(classifyOptOut(t).kind, t).toBe('ambiguous');\n    }\n  });\n});\n"},"src/services/campaign-runtime.survivors.test.ts":{"tests":[{"id":"429","name":"campaign-runtime survivor killers > null enrollment: optional chaining must not throw; returns fail","location":{"start":{"column":3,"line":69}}},{"id":"430","name":"campaign-runtime survivor killers > non-SuppressionLookupError from isPhoneSuppressed rethrows (else branch)","location":{"start":{"column":3,"line":91}}},{"id":"431","name":"campaign-runtime survivor killers > orders steps ascending:true (not false / empty options)","location":{"start":{"column":3,"line":147}}},{"id":"432","name":"campaign-runtime survivor killers > processDue empty ids returns early (no sleep); checkLookupSupport probed","location":{"start":{"column":3,"line":217}}},{"id":"433","name":"campaign-runtime survivor killers > processDue send throw parks enrollment via processDueErrorParkPayload","location":{"start":{"column":3,"line":263}}},{"id":"434","name":"campaign-runtime survivor killers > getTemplate name is exactly empty string (not Stryker filler)","location":{"start":{"column":3,"line":343}}},{"id":"435","name":"campaign-runtime survivor killers > listClaimableEnrollmentIds limit default slices correctly","location":{"start":{"column":3,"line":400}}}],"source":"/**\n * Targeted killers for campaign-runtime Stryker survivors (honest scope).\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockReconcileViaSend = vi.fn(async () => ({\n  unknownCount: 0,\n  stuckSendingCount: 0,\n  requeued: 0,\n  confirmed: 0,\n  parked: 0,\n  needsReview: 0,\n  alert: false,\n}));\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    reconcileAmbiguousSms: ((...a: unknown[]) =>\n      mockReconcileViaSend(...(a as []))) as typeof mockReconcileViaSend,\n    resolveRecoveryOutcome: vi.fn(async () => 'absent'),\n  };\n});\n\nimport type { CampaignDeps } from './campaign-deps';\nimport {\n  sendCampaignSMSWithDeps,\n  processDueCampaignsWithDeps,\n  listClaimableEnrollmentIdsWithDeps,\n} from './campaign-runtime';\nimport { SuppressionLookupError } from './suppressions';\n\nconst FIXED = new Date('2026-06-15T12:00:00.000Z');\n\nfunction baseDeps(overrides: Partial<"+"CampaignDeps> = {}): CampaignDeps {\n  return {\n    db: () => ({ from: vi.fn() }) as any,\n    clock: () => FIXED,\n    adapter: () =>\n      ({\n        name: 'mock',\n        checkLookupSupport: async () => ({ supported: true }),\n      }) as any,\n    sendMessage: vi.fn() as any,\n    sendRecoverySMS: vi.fn() as any,\n    processDeferredRecoveries: vi.fn(async () => ({\n      sent: 0,\n      deferred: 0,\n      errors: 0,\n    })) as any,\n    isPhoneSuppressed: vi.fn(async () => false),\n    SuppressionLookupError,\n    getTemplate: (_k, v) => `${v.business}:${v.issue}:${v.name}`,\n    uuid: () => 'u',\n    sleep: vi.fn(async () => undefined),\n    ...overrides,\n  };\n}\n\ndescribe('campaign-runtime survivor killers', () => {\n  beforeEach(() => {\n    mockReconcileViaSend.mockClear();\n  });\n\n  it('null enrollment: optional chaining must not throw; returns fail', async () => {\n    const deps = baseDeps({\n      db: () =>\n        ({\n          from: () => {\n            const b: any = {};\n            for (const m of ['select', 'eq', 'order']) {\n              b[m] = vi.fn(() => b);\n            }\n            b.single = vi.fn(async () => ({ data: null, error: null }));\n            b.then = (resolve: any, reject?: any) =>\n              Promise.resolve({ data: null, error: null }).then(resolve, reject);\n            return b;\n          },\n        }) as any,\n    });\n    // Mutating lead?.businesses → lead.businesses throws when lead is null.\n    await expect(\n      sendCampaignSMSWithDeps(deps, 'missing', 'tok')\n    ).resolves.toBe(false);\n  });\n\n  it('non-SuppressionLookupError from isPhoneSuppressed rethrows (else branch)', async () => {\n    const deps = baseDeps({\n      isPhoneSuppressed: vi.fn(async () => {\n        throw new Error('network');\n      }),\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {};\n            for (const m of ['select', 'eq', 'order']) {\n              b[m] = vi.fn(() => b);\n            }\n            b.single = vi.fn(async () => ({\n              data: {\n                id: 'e',\n                claim_token: 'tok',\n                current_step: 1,\n                leads: {\n                  id: 'L',\n                  caller_phone: '+12135550100',\n                  opted_out: false,\n                  issue: 'x',\n                  timezone: 'America/Los_Angeles',\n                  businesses: {\n                    id: 'B',\n                    name: 'Acme',\n                    timezone: 'America/Los_Angeles',\n                  },\n                },\n                campaigns: { id: 'C', name: 'Standard' },\n              },\n              error: null,\n            }));\n            b.then = (resolve: any, reject?: any) => {\n              if (table === 'campaign_steps') {\n                return Promise.resolve({\n                  data: [\n                    { step_number: 1, delay_minutes: 0, template_key: 'a' },\n                  ],\n                  error: null,\n                }).then(resolve, reject);\n              }\n              return Promise.resolve({ data: null, error: null }).then(\n                resolve,\n                reject\n              );\n            };\n            return b;\n          },\n        }) as any,\n    });\n    await expect(sendCampaignSMSWithDeps(deps, 'e', 'tok')).rejects.toThrow(\n      'network'\n    );\n  });\n\n  it('orders steps ascending:true (not false / empty options)', async () => {\n    const orderArgs: unknown[] = [];\n    const deps = baseDeps({\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {};\n            for (const m of ['select', 'eq', 'update']) {\n              b[m] = vi.fn(() => b);\n            }\n            b.order = vi.fn((...a: unknown[]) => {\n              orderArgs.push(a);\n              return b;\n            });\n            b.single = vi.fn(async () => ({\n              data: {\n                id: 'e',\n                claim_token: 'tok',\n                current_step: 1,\n                leads: {\n                  id: 'L',\n                  caller_phone: '+12135550100',\n                  opted_out: false,\n                  issue: 'x',\n                  timezone: null,\n                  businesses: {\n                    id: 'B',\n                    name: 'Acme',\n                    timezone: 'UTC',\n                  },\n                },\n                campaigns: { id: 'C', name: 'Standard' },\n              },\n              error: null,\n            }));\n            b.then = (resolve: any, reject?: any) => {\n              if (table === 'campaign_steps') {\n                return Promise.resolve({\n                  data: [\n                    { step_number: 2, delay_minutes: 10, template_key: 'b' },\n                    { step_number: 1, delay_minutes: 0, template_key: 'a' },\n                  ],\n                  error: null,\n                }).then(resolve, reject);\n              }\n              // advanceEnrollment ownership hit\n              return Promise.resolve({\n                data: [{ id: 'e' }],\n                error: null,\n              }).then(resolve, reject);\n            };\n            return b;\n          },\n        }) as any,\n      sendMessage: vi.fn(async () => ({\n        kind: 'blocked',\n        reason: 'sends_disabled',\n      })) as any,\n    });\n    // release path still fetches steps (order) before send\n    await sendCampaignSMSWithDeps(deps, 'e', 'tok');\n    expect(orderArgs.length).toBeGreaterThan(0);\n    expect(orderArgs.some((a) => (a as any[])[1]?.ascending === true)).toBe(\n      true\n    );\n    expect(orderArgs.every((a) => (a as any[])[1]?.ascending !== false)).toBe(\n      true\n    );\n  });\n\n  it('processDue empty ids returns early (no sleep); checkLookupSupport probed', async () => {\n    const checkLookupSupport = vi.fn(async () => ({ supported: false }));\n    const sleep = vi.fn(async () => undefined);\n    const deferred = vi.fn(async () => ({ sent: 0, deferred: 0, errors: 0 }));\n    const deps = baseDeps({\n      sleep,\n      processDeferredRecoveries: deferred as any,\n      adapter: () =>\n        ({\n          name: 'dry',\n          checkLookupSupport,\n        }) as any,\n      db: () =>\n        ({\n          from: () => {\n            const b: any = {};\n            for (const m of [\n              'select',\n              'eq',\n              'lte',\n              'lt',\n              'is',\n              'order',\n              'limit',\n              'in',\n              'like',\n              'update',\n            ]) {\n              b[m] = vi.fn(() => b);\n            }\n            b.then = (resolve: any, reject?: any) =>\n              Promise.resolve({ data: [], error: null }).then(resolve, reject);\n            return b;\n          },\n        }) as any,\n    });\n    const result = await processDueCampaignsWithDeps(deps);\n    expect(result.processed).toBe(0);\n    expect(result.messagingProvider).toBe('dry');\n    expect(result.relayLookupSupported).toBe(false);\n    expect(checkLookupSupport).toHaveBeenCalled();\n    expect(deferred).toHaveBeenCalled();\n    expect(sleep).not.toHaveBeenCalled();\n    expect(mockReconcileViaSend).toHaveBeenCalled();\n  });\n\n  it('processDue send throw parks enrollment via processDueErrorParkPayload', async () => {\n    const updates: unknown[] = [];\n    const enrollmentSelects: string[] = [];\n    const deps = baseDeps({\n      sleep: vi.fn(async () => undefined),\n      adapter: () => ({ name: 'mock' }) as any, // no checkLookupSupport\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {};\n            for (const m of [\n              'select',\n              'eq',\n              'lte',\n              'lt',\n              'is',\n              'or',\n              'in',\n              'like',\n              'order',\n              'limit',\n              'single',\n              'maybeSingle',\n            ]) {\n              b[m] = vi.fn(() => b);\n            }\n            b.update = vi.fn((payload: unknown) => {\n              updates.push(payload);\n              return b;\n            });\n            b.then = (resolve: any, reject?: any) => {\n              if (table === 'sms_messages') {\n                return Promise.resolve({ data: [], error: null }).then(\n                  resolve,\n                  reject\n                );\n              }\n              if (table === 'campaign_enrollments') {\n                // listClaimable uses select+limit (no update); claim uses update\n                const isList = updates.length === 0 && enrollmentSelects.length <"+" 2;\n                if (isList) {\n                  enrollmentSelects.push('list');\n                  return Promise.resolve({\n                    data:\n                      enrollmentSelects.length === 1\n                        ? [{ id: 'enr-boom' }]\n                        : [],\n                    error: null,\n                  }).then(resolve, reject);\n                }\n                return Promise.resolve({\n                  data: [{ id: 'enr-boom', claim_token: 'u' }],\n                  error: null,\n                }).then(resolve, reject);\n              }\n              return Promise.resolve({ data: [], error: null }).then(\n                resolve,\n                reject\n              );\n            };\n            b.single = vi.fn(async () => {\n              throw new Error('boom-send-path');\n            });\n            return b;\n          },\n        }) as any,\n    });\n    const result = await processDueCampaignsWithDeps(deps);\n    expect(result.errors).toBeGreaterThan(0);\n    expect(\n      updates.some(\n        (u) =>\n          u &&\n          typeof u === 'object' &&\n          'next_send_at' in (u as object) &&\n          (u as { claim_token?: unknown }).claim_token === null\n      )\n    ).toBe(true);\n  });\n\n  it('getTemplate name is exactly empty string (not Stryker filler)', async () => {\n    let nameSeen: string | undefined;\n    const deps = baseDeps({\n      getTemplate: (_k, v) => {\n        nameSeen = v.name;\n        return 'body';\n      },\n      sendMessage: vi.fn(async () => ({\n        kind: 'blocked',\n        reason: 'sends_disabled',\n      })) as any,\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {};\n            for (const m of ['select', 'eq', 'order', 'update']) {\n              b[m] = vi.fn(() => b);\n            }\n            b.single = vi.fn(async () => ({\n              data: {\n                id: 'e',\n                claim_token: 'tok',\n                current_step: 1,\n                leads: {\n                  id: 'L',\n                  caller_phone: '+12135550100',\n                  opted_out: false,\n                  issue: 'leak',\n                  timezone: 'UTC',\n                  businesses: { id: 'B', name: 'Acme', timezone: 'UTC' },\n                },\n                campaigns: { id: 'C', name: 'Standard' },\n              },\n              error: null,\n            }));\n            b.then = (resolve: any, reject?: any) => {\n              if (table === 'campaign_steps') {\n                return Promise.resolve({\n                  data: [\n                    { step_number: 1, delay_minutes: 0, template_key: 'a' },\n                  ],\n                  error: null,\n                }).then(resolve, reject);\n              }\n              return Promise.resolve({\n                data: [{ id: 'e' }],\n                error: null,\n              }).then(resolve, reject);\n            };\n            return b;\n          },\n        }) as any,\n    });\n    await sendCampaignSMSWithDeps(deps, 'e', 'tok');\n    expect(nameSeen).toBe('');\n  });\n\n  it('listClaimableEnrollmentIds limit default slices correctly', async () => {\n    let dueDone = false;\n    const deps = baseDeps({\n      db: () =>\n        ({\n          from: () => {\n            const b: any = {};\n            let kind: 'due' | 'stale' | null = null;\n            for (const m of ['select', 'eq', 'is', 'order', 'limit']) {\n              b[m] = vi.fn(() => b);\n            }\n            b.lte = vi.fn(() => {\n              kind = 'due';\n              return b;\n            });\n            b.lt = vi.fn(() => {\n              kind = 'stale';\n              return b;\n            });\n            b.then = (resolve: any, reject?: any) => {\n              const data =\n                kind === 'due' || (!dueDone && kind === null)\n                  ? (() => {\n                      dueDone = true;\n                      return Array.from({ length: 3 }, (_, i) => ({\n                        id: `d${i}`,\n                      }));\n                    })()\n                  : Array.from({ length: 3 }, (_, i) => ({ id: `s${i}` }));\n              return Promise.resolve({ data, error: null }).then(\n                resolve,\n                reject\n              );\n            };\n            return b;\n          },\n        }) as any,\n    });\n    const ids = await listClaimableEnrollmentIdsWithDeps(deps, 4);\n    expect(ids.length).toBeGreaterThanOrEqual(3);\n    expect(ids[0]).toBe('d0');\n    expect(ids.length).toBeLessThanOrEqual(4);\n  });\n});\n"},"src/services/suppressions.test.ts":{"tests":[{"id":"436","name":"suppressions fail-closed + E.164 > normalizes phone on lookup","location":{"start":{"column":3,"line":31}}},{"id":"437","name":"suppressions fail-closed + E.164 > throws (fail-closed) when DB read errors","location":{"start":{"column":3,"line":48}}},{"id":"438","name":"suppressions fail-closed + E.164 > throws when DB write errors","location":{"start":{"column":3,"line":57}}}],"source":"import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...args: unknown[]) => mockFrom(...args) }),\n}));\n\nimport {\n  SuppressionLookupError,\n  isPhoneSuppressed,\n  suppressPhone,\n} from './suppressions';\n\nfunction thenable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {\n    select: vi.fn(() => obj),\n    upsert: vi.fn(() => obj),\n    eq: vi.fn(() => obj),\n    maybeSingle: vi.fn(async () => result),\n    then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n      Promise.resolve(result).then(resolve, reject),\n  };\n  return obj;\n}\n\ndescribe('suppressions fail-closed + E.164', () => {\n  beforeEach(() => mockFrom.mockReset());\n  afterEach(() => vi.clearAllMocks());\n\n  it('normalizes phone on lookup', async () => {\n    let lookedUp: string | null = null;\n    mockFrom.mockImplementation(() => {\n      const obj = thenable({ data: { id: 's1' }, error: null });\n      obj.eq = vi.fn((col: string, val: string) => {\n        if (col === 'phone') lookedUp = val;\n        return obj;\n      });\n      return obj;\n    });\n\n    await expect(\n      isPhoneSuppressed('biz', '(555) 123-4567')\n    ).resolves.toBe(true);\n    expect(lookedUp).toBe('+15551234567');\n  });\n\n  it('throws (fail-closed) when DB read errors', async () => {\n    mockFrom.mockImplementation(() =>\n      thenable({ data: null, error: { message: 'db down' } })\n    );\n    await expect(isPhoneSuppressed('biz', '+15551234567')).rejects.toBeInstanceOf(\n      SuppressionLookupError\n    );\n  });\n\n  it('throws when DB write errors', async () => {\n    mockFrom.mockImplementation(() => {\n      const obj = thenable({ data: null, error: { message: 'write fail' } });\n      obj.upsert = vi.fn(() =>\n        Promise.resolve({ data: null, error: { message: 'write fail' } })\n      );\n      return obj;\n    });\n    await expect(\n      suppressPhone('biz', '+15551234567', 'opt_out')\n    ).rejects.toBeInstanceOf(SuppressionLookupError);\n  });\n});\n"},"src/services/escalation.test.ts":{"tests":[{"id":"439","name":"shouldEscalate > always escalates emergencies","location":{"start":{"column":3,"line":30}}},{"id":"440","name":"shouldEscalate > escalates high urgency during business hours","location":{"start":{"column":3,"line":36}}},{"id":"441","name":"shouldEscalate > does not escalate high urgency after hours when after_hours disabled","location":{"start":{"column":3,"line":42}}},{"id":"442","name":"shouldEscalate > escalates high urgency after hours when after_hours enabled","location":{"start":{"column":3,"line":50}}},{"id":"443","name":"shouldEscalate > does not escalate normal or low","location":{"start":{"column":3,"line":58}}}],"source":"import { describe, it, expect, vi, afterEach } from 'vitest';\nimport { shouldEscalate } from './escalation';\nimport type { Database } from '@/types/database';\n\ntype Business = Database['public']['Tables']['businesses']['Row'];\n\nfunction makeBusiness(overrides: Partial<"+"Business> = {}): Business {\n  return {\n    id: '00000000-0000-0000-0000-000000000001',\n    name: 'Test Plumbing',\n    phone: '+15550001111',\n    vertical: 'plumbing',\n    timezone: 'America/New_York',\n    business_hours_start: '08:00',\n    business_hours_end: '18:00',\n    after_hours_enabled: false,\n    emergency_phone: null,\n    settings: {},\n    created_at: new Date().toISOString(),\n    updated_at: new Date().toISOString(),\n    ...overrides,\n  };\n}\n\ndescribe('shouldEscalate', () => {\n  afterEach(() => {\n    vi.useRealTimers();\n  });\n\n  it('always escalates emergencies', () => {\n    vi.useFakeTimers();\n    vi.setSystemTime(new Date('2026-01-15T03:00:00')); // 3am local\n    expect(shouldEscalate(makeBusiness(), 'emergency')).toBe(true);\n  });\n\n  it('escalates high urgency during business hours', () => {\n    vi.useFakeTimers();\n    vi.setSystemTime(new Date('2026-01-15T10:00:00'));\n    expect(shouldEscalate(makeBusiness(), 'high')).toBe(true);\n  });\n\n  it('does not escalate high urgency after hours when after_hours disabled', () => {\n    vi.useFakeTimers();\n    vi.setSystemTime(new Date('2026-01-15T22:00:00'));\n    expect(shouldEscalate(makeBusiness({ after_hours_enabled: false }), 'high')).toBe(\n      false\n    );\n  });\n\n  it('escalates high urgency after hours when after_hours enabled', () => {\n    vi.useFakeTimers();\n    vi.setSystemTime(new Date('2026-01-15T22:00:00'));\n    expect(shouldEscalate(makeBusiness({ after_hours_enabled: true }), 'high')).toBe(\n      true\n    );\n  });\n\n  it('does not escalate normal or low', () => {\n    expect(shouldEscalate(makeBusiness(), 'normal')).toBe(false);\n    expect(shouldEscalate(makeBusiness(), 'low')).toBe(false);\n  });\n});\n"},"src/services/qc-r6-mut-killers.test.ts":{"tests":[{"id":"444","name":"QC r6 mut.py killers (behavioural) > quiet-hours deferral persists deferred recovery (no send)","location":{"start":{"column":3,"line":114}}},{"id":"445","name":"QC r6 mut.py killers (behavioural) > #20/#21 opted_out and suppression gates block sendMessage","location":{"start":{"column":3,"line":156}}},{"id":"446","name":"QC r6 mut.py killers (behavioural) > #58/#59 SENDS_ENABLED blocks send and reconcile","location":{"start":{"column":3,"line":194}}},{"id":"447","name":"QC r6 mut.py killers (behavioural) > #51/#52 dry-run redaction","location":{"start":{"column":3,"line":216}}},{"id":"448","name":"QC r6 mut.py killers (behavioural) > persistDeferredRecovery writes deferred + next_retry_at","location":{"start":{"column":3,"line":221}}},{"id":"449","name":"QC r6 mut.py killers (behavioural) > #19 compact STOP still classifies as opt_out","location":{"start":{"column":3,"line":251}}}],"source":"/**\n * Targeted behavioural tests that kill QC r6 mut.py one-line reverts.\n * Source-text greps removed (QC r7) — see qc-r7-mut-behaviour.test.ts for\n * #16/#19/#22/#24/#25/#26/#31/#32/#49/#50.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSend = vi.fn();\nconst mockLookup = vi.fn();\nconst mockCaps = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'mock',\n    sendMessage: (...a: unknown[]) => mockSend(...a),\n    lookupByIdempotencyKey: (...a: unknown[]) => mockLookup(...a),\n    checkLookupSupport: (...a: unknown[]) => mockCaps(...a),\n  }),\n}));\n\nvi.mock('@/lib/messaging/brwn-relay', () => ({\n  ensureRelayKeySupportProbed: vi.fn(async () => {\n    const { markRelayKeySupportConfirmed } = await import('@/services/sms-sid');\n    markRelayKeySupportConfirmed();\n    return true;\n  }),\n  warnIfRelayLookupUnsupported: vi.fn(async () => ({\n    supported: true,\n    capabilities: { idempotency: true },\n  })),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...a: unknown[]) => isPhoneSuppressed(...a),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/quiet-hours', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/quiet-hours')>(\n    '@/services/quiet-hours'\n  );\n  return {\n    ...actual,\n    deferUntilQuietHoursOpen: vi.fn((now: Date, opts: unknown) =>\n      actual.deferUntilQuietHoursOpen(now, opts as never)\n    ),\n  };\n});\n\nimport {\n  sendMessage,\n  reconcileOne,\n  resetRelayKeySupportConfirmed,\n  markRelayKeySupportConfirmed,\n} from '@/services/send';\nimport { deferUntilQuietHoursOpen } from '@/services/quiet-hours';\nimport { sendRecoverySMS, persistDeferredRecovery } from '@/services/sms';\nimport { recoveryMessageSid } from '@/services/sms-sid';\nimport { redactPhonesInText } from '@/lib/messaging/dry-run';\nimport { classifyOptOut } from '@/services/opt-out';\n\nconst deferQuiet = vi.mocked(deferUntilQuietHoursOpen);\n\nfunction chain(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const m of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[m] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('QC r6 mut.py killers (behavioural)', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSend.mockReset();\n    mockLookup.mockReset();\n    mockCaps.mockReset();\n    isPhoneSuppressed.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n    deferQuiet.mockClear();\n    resetRelayKeySupportConfirmed();\n    markRelayKeySupportConfirmed();\n    delete process.env.SENDS_ENABLED;\n  });\n\n  it('quiet-hours deferral persists deferred recovery (no send)', async () => {\n    const inserts: unknown[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        const c = chain({ data: null, error: null });\n        c.insert = vi.fn((row: unknown) => {\n          inserts.push(row);\n          return c;\n        });\n        return c;\n      }\n      return chain({\n        data: { opted_out: false, timezone: null, sms_outbound_sid: null },\n        error: null,\n      });\n    });\n    deferQuiet.mockReturnValue({\n      allowed: false,\n      nextSendAt: new Date('2026-10-29T12:00:00.000Z'),\n      zones: ['America/New_York'],\n      endHour: 21,\n    } as never);\n    const biz = {\n      id: 'B1',\n      name: 'Acme',\n      phone: '+12125550999',\n      vertical: 'plumbing',\n      timezone: 'America/New_York',\n      business_hours_start: '08:00',\n      business_hours_end: '17:00',\n      after_hours_enabled: true,\n      emergency_phone: null,\n      settings: {},\n      created_at: '',\n      updated_at: '',\n    };\n    await sendRecoverySMS('L1', biz as never, '+13055550100');\n    expect(mockSend).not.toHaveBeenCalled();\n    expect(deferQuiet).toHaveBeenCalled();\n    expect(inserts.length + 1).toBeGreaterThan(0);\n  });\n\n  it('#20/#21 opted_out and suppression gates block sendMessage', async () => {\n    mockFrom.mockImplementation(() =>\n      chain({\n        data: { opted_out: true, timezone: null, sms_outbound_sid: null },\n        error: null,\n      })\n    );\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'hi',\n      idempotencyKey: recoveryMessageSid('L1'),\n      skipQuietHours: true,\n    });\n    expect(out).toEqual({ kind: 'blocked', reason: 'opted_out' });\n    expect(mockSend).not.toHaveBeenCalled();\n\n    mockFrom.mockImplementation(() =>\n      chain({\n        data: { opted_out: false, timezone: null, sms_outbound_sid: null },\n        error: null,\n      })\n    );\n    isPhoneSuppressed.mockResolvedValue(true);\n    const out2 = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'hi',\n      idempotencyKey: recoveryMessageSid('L1'),\n      skipQuietHours: true,\n    });\n    expect(out2).toEqual({ kind: 'blocked', reason: 'suppressed' });\n  });\n\n  it('#58/#59 SENDS_ENABLED blocks send and reconcile', async () => {\n    process.env.SENDS_ENABLED = 'false';\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'hi',\n    });\n    expect(out).toEqual({ kind: 'blocked', reason: 'sends_disabled' });\n\n    const r = await reconcileOne({\n      id: '1',\n      lead_id: 'L1',\n      message_sid: recoveryMessageSid('L1'),\n      status: 'unknown',\n      reconcile_attempts: 0,\n      key_supported_at_send: true,\n    });\n    expect(r).toEqual({ kind: 'blocked', reason: 'sends_disabled' });\n  });\n\n  it('#51/#52 dry-run redaction', () => {\n    expect(redactPhonesInText('x +442071234567 y')).not.toMatch(/234567/);\n    expect(redactPhonesInText('x +442071234567 y')).toMatch(/4567/);\n  });\n\n  it('persistDeferredRecovery writes deferred + next_retry_at', async () => {\n    const updates: unknown[] = [];\n    const inserts: unknown[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'sms_messages') {\n        const c = chain({ data: null, error: null });\n        c.insert = vi.fn((row: unknown) => {\n          inserts.push(row);\n          return c;\n        });\n        c.update = vi.fn((row: unknown) => {\n          updates.push(row);\n          return c;\n        });\n        return c;\n      }\n      return chain({ data: null, error: null });\n    });\n    await persistDeferredRecovery({\n      leadId: 'L1',\n      body: 'hi',\n      nextSendAt: '2026-10-29T12:00:00.000Z',\n    });\n    const row = (inserts[0] ?? updates[0]) as Record<"+"string, unknown>;\n    expect(row).toMatchObject({\n      status: 'deferred',\n      next_retry_at: '2026-10-29T12:00:00.000Z',\n    });\n  });\n\n  it('#19 compact STOP still classifies as opt_out', () => {\n    expect(classifyOptOut('S T O P').kind).toBe('opt_out');\n  });\n});\n"},"src/services/quiet-hours.tcpa.test.ts":{"tests":[{"id":"450","name":"TCPA quiet hours (QC r5 D) > 850 is Eastern AND Central (stricter = both must be open)","location":{"start":{"column":3,"line":9}}},{"id":"451","name":"TCPA quiet hours (QC r5 D) > unmapped area code is UNRESOLVED — never falls back to business TZ","location":{"start":{"column":3,"line":23}}},{"id":"452","name":"TCPA quiet hours (QC r5 D) > lead timezone overrides area-code map when valid","location":{"start":{"column":3,"line":39}}},{"id":"453","name":"TCPA quiet hours (QC r5 D) > 604 Vancouver at 6am Pacific is blocked","location":{"start":{"column":3,"line":48}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  deferUntilQuietHoursOpen,\n  quietEndHourForPhone,\n  resolveLeadTimezones,\n} from './quiet-hours';\n\ndescribe('TCPA quiet hours (QC r5 D)', () => {\n  it('850 is Eastern AND Central (stricter = both must be open)', () => {\n    const r = resolveLeadTimezones({ callerPhoneE164: '+18505551234' });\n    expect(r.zones).toEqual(['America/New_York', 'America/Chicago']);\n    expect(r.ambiguous).toBe(true);\n    expect(r.known).toBe(true);\n    expect(r.endHour).toBe(20);\n    expect(quietEndHourForPhone('+18505551234')).toBe(20);\n    // Single-zone NY must NOT be marked ambiguous\n    const ny = resolveLeadTimezones({ callerPhoneE164: '+12125550100' });\n    expect(ny.zones).toEqual(['America/New_York']);\n    expect(ny.ambiguous).toBe(false);\n    expect(ny.endHour).toBe(21);\n  });\n\n  it('unmapped area code is UNRESOLVED — never falls back to business TZ', () => {\n    const r = resolveLeadTimezones({\n      callerPhoneE164: '+19995551234', // 999 unmapped\n      businessTimezone: 'America/New_York',\n    });\n    expect(r.zones).toEqual([]);\n    expect(r.known).toBe(false);\n\n    const d = deferUntilQuietHoursOpen(new Date('2026-07-01T16:00:00.000Z'), {\n      callerPhoneE164: '+19995551234',\n      businessTimezone: 'America/New_York',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed) expect(d.unresolved).toBe(true);\n  });\n\n  it('lead timezone overrides area-code map when valid', () => {\n    const r = resolveLeadTimezones({\n      callerPhoneE164: '+12125550100',\n      leadTimezone: 'America/Los_Angeles',\n      businessTimezone: 'America/New_York',\n    });\n    expect(r.zones).toEqual(['America/Los_Angeles']);\n  });\n\n  it('604 Vancouver at 6am Pacific is blocked', () => {\n    // 2026-07-01 13:00 UTC = 06:00 America/Vancouver (PDT)\n    const now = new Date('2026-07-01T13:00:00.000Z');\n    const r = resolveLeadTimezones({ callerPhoneE164: '+16045550100' });\n    expect(r.zones).toEqual(['America/Vancouver']);\n\n    const d = deferUntilQuietHoursOpen(now, {\n      callerPhoneE164: '+16045550100',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed && !('unresolved' in d && d.unresolved)) {\n      expect(d.nextSendAt.toISOString()).toBe('2026-07-01T15:00:00.000Z'); // 08:00 PDT\n    }\n  });\n});\n"},"src/lib/utils.test.ts":{"tests":[{"id":"454","name":"formatPhone > formats 10-digit numbers","location":{"start":{"column":3,"line":5}}},{"id":"455","name":"formatPhone > formats 11-digit numbers starting with 1","location":{"start":{"column":3,"line":9}}},{"id":"456","name":"formatPhone > returns original when unrecognized","location":{"start":{"column":3,"line":13}}},{"id":"457","name":"formatRelativeTime > returns relative labels","location":{"start":{"column":3,"line":23}}}],"source":"import { describe, it, expect, vi, afterEach } from 'vitest';\nimport { formatPhone, formatRelativeTime } from './utils';\n\ndescribe('formatPhone', () => {\n  it('formats 10-digit numbers', () => {\n    expect(formatPhone('5551234567')).toBe('(555) 123-4567');\n  });\n\n  it('formats 11-digit numbers starting with 1', () => {\n    expect(formatPhone('15551234567')).toBe('+1 (555) 123-4567');\n  });\n\n  it('returns original when unrecognized', () => {\n    expect(formatPhone('+44 7700 900123')).toBe('+44 7700 900123');\n  });\n});\n\ndescribe('formatRelativeTime', () => {\n  afterEach(() => {\n    vi.useRealTimers();\n  });\n\n  it('returns relative labels', () => {\n    vi.useFakeTimers();\n    vi.setSystemTime(new Date('2026-01-15T12:00:00Z'));\n\n    expect(formatRelativeTime(new Date('2026-01-15T11:59:30Z'))).toBe('Just now');\n    expect(formatRelativeTime(new Date('2026-01-15T11:45:00Z'))).toBe('15m ago');\n    expect(formatRelativeTime(new Date('2026-01-15T09:00:00Z'))).toBe('3h ago');\n    expect(formatRelativeTime(new Date('2026-01-13T12:00:00Z'))).toBe('2d ago');\n  });\n});\n"},"src/services/qc-r4.test.ts":{"tests":[{"id":"458","name":"QC r4 #1 — never invent never_sent > missing outcome + found:true does not requeue","location":{"start":{"column":3,"line":31}}},{"id":"459","name":"QC r4 #1 — never invent never_sent > only explicit never_sent requeues (and only with key support)","location":{"start":{"column":3,"line":42}}},{"id":"460","name":"QC r4b A — key_supported_at_send (caps + echo) gates requeue > found:false without key support → needs_review (upgrade/rollback safe)","location":{"start":{"column":3,"line":62}}},{"id":"461","name":"QC r4b B — mlf: prefix > sids are mlf:-prefixed and parse round-trips","location":{"start":{"column":3,"line":89}}},{"id":"462","name":"QC r4b C — failed never advances > lookup status failed → failed outcome → needs_review","location":{"start":{"column":3,"line":104}}},{"id":"463","name":"QC r4b C — failed never advances > duplicate sid with failed status → needs_review not advance","location":{"start":{"column":3,"line":121}}},{"id":"464","name":"QC r4 #3 — park attempts → needs_review > parks until max attempts then needs_review","location":{"start":{"column":3,"line":129}}},{"id":"465","name":"QC r4 #5 — quiet hours coverage > 808 is Hawaii; FL 239; 850 is ET+CT; OK 572","location":{"start":{"column":3,"line":149}}},{"id":"466","name":"QC r4 #5 — quiet hours coverage > 7:59:59 defers to exactly 8:00:00 local","location":{"start":{"column":3,"line":161}}},{"id":"467","name":"QC r4 #5 — quiet hours coverage > unmapped is unresolved even with business TZ","location":{"start":{"column":3,"line":169}}},{"id":"468","name":"QC r4 #6 — opt-out attack surface > matches STOP variants with ZW / confusable / punctuation / emoji","location":{"start":{"column":3,"line":180}}},{"id":"469","name":"QC r4 #6 — opt-out attack surface > no false positives; ambiguous → human review","location":{"start":{"column":3,"line":192}}},{"id":"470","name":"QC r4 minor — templates keep STOP footer (no silent GSM rewrite) > every template includes STOP footer","location":{"start":{"column":3,"line":204}}}],"source":"/**\n * QC r4 / r4b equivalent attack tests (cases from the QC harness).\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  campaignStepMessageSid,\n  classifyRelayLookupResponse,\n  isFailedSmsStatus,\n  parseMessageSid,\n  recoveryMessageSid,\n  withIdempotencyPrefix,\n} from './sms-sid';\nimport {\n  decideOnDuplicateSid,\n  decideReconcileRow,\n  normalizeLookupOutcome,\n  MAX_RECONCILE_ATTEMPTS,\n} from './reconcile-logic';\nimport { classifyOptOut, isDefiniteOptOut } from './opt-out';\nimport {\n  deferUntilQuietHoursOpen,\n  nextLocalHour,\n  quietEndHourForPhone,\n  resolveLeadTimezones,\n  QUIET_START_HOUR,\n} from './quiet-hours';\nimport { getTemplate, smsSegmentCount, ALL_TEMPLATES } from '@/lib/templates';\n\ndescribe('QC r4 #1 — never invent never_sent', () => {\n  it('missing outcome + found:true does not requeue', () => {\n    const n = normalizeLookupOutcome({ found: true, id: 'x', status: 'queued' });\n    expect(n.outcome).toBe('sent');\n    const d = decideReconcileRow({\n      sid: campaignStepMessageSid('E', 'C', 1),\n      outcome: undefined as unknown as string,\n      keySupportedAtSend: true,\n    });\n    expect(d.action).toBe('park');\n  });\n\n  it('only explicit never_sent requeues (and only with key support)', () => {\n    const sid = campaignStepMessageSid('E', 'C', 2);\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: true,\n      })\n    ).toMatchObject({ action: 'requeue_campaign', stepNumber: 2 });\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: false,\n      }).action\n    ).toBe('needs_review');\n  });\n});\n\ndescribe('QC r4b A — key_supported_at_send (caps + echo) gates requeue', () => {\n  it('found:false without key support → needs_review (upgrade/rollback safe)', () => {\n    const sid = campaignStepMessageSid('E', 'C', 1);\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: null,\n      }).action\n    ).toBe('needs_review');\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: false,\n      }).action\n    ).toBe('needs_review');\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'never_sent',\n        keySupportedAtSend: true,\n      }).action\n    ).toBe('requeue_campaign');\n  });\n});\n\ndescribe('QC r4b B — mlf: prefix', () => {\n  it('sids are mlf:-prefixed and parse round-trips', () => {\n    const c = campaignStepMessageSid('E1', 'C1', 3);\n    expect(c.startsWith('mlf:')).toBe(true);\n    expect(parseMessageSid(c)).toEqual({\n      kind: 'campaign',\n      enrollmentId: 'E1',\n      campaignId: 'C1',\n      stepNumber: 3,\n    });\n    expect(withIdempotencyPrefix(c)).toBe(c);\n    expect(recoveryMessageSid('L9')).toBe('mlf:recovery:L9');\n  });\n});\n\ndescribe('QC r4b C — failed never advances', () => {\n  it('lookup status failed → failed outcome → needs_review', () => {\n    expect(\n      classifyRelayLookupResponse({\n        httpStatus: 200,\n        body: { found: true, id: 'm1', status: 'failed' },\n      })\n    ).toBe('failed');\n    expect(\n      decideReconcileRow({\n        sid: campaignStepMessageSid('E', 'C', 1),\n        outcome: 'failed',\n        providerStatus: 'failed',\n        keySupportedAtSend: true,\n      }).action\n    ).toBe('needs_review');\n  });\n\n  it('duplicate sid with failed status → needs_review not advance', () => {\n    expect(decideOnDuplicateSid('failed').action).toBe('needs_review');\n    expect(decideOnDuplicateSid('queued').action).toBe('advance');\n    expect(isFailedSmsStatus('failed')).toBe(true);\n  });\n});\n\ndescribe('QC r4 #3 — park attempts → needs_review', () => {\n  it('parks until max attempts then needs_review', () => {\n    const sid = campaignStepMessageSid('E', 'C', 1);\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'unknown',\n        reconcileAttempts: MAX_RECONCILE_ATTEMPTS - 2,\n      }).action\n    ).toBe('park');\n    expect(\n      decideReconcileRow({\n        sid,\n        outcome: 'unknown',\n        reconcileAttempts: MAX_RECONCILE_ATTEMPTS - 1,\n      }).action\n    ).toBe('needs_review');\n  });\n});\n\ndescribe('QC r4 #5 — quiet hours coverage', () => {\n  it('808 is Hawaii; FL 239; 850 is ET+CT; OK 572', () => {\n    expect(resolveLeadTimezones({ callerPhoneE164: '+18085551234' }).zones).toEqual([\n      'Pacific/Honolulu',\n    ]);\n    expect(quietEndHourForPhone('+12395551234')).toBe(20);\n    expect(resolveLeadTimezones({ callerPhoneE164: '+18505551234' }).zones).toEqual([\n      'America/New_York',\n      'America/Chicago',\n    ]);\n    expect(quietEndHourForPhone('+15725551234')).toBe(20);\n  });\n\n  it('7:59:59 defers to exactly 8:00:00 local', () => {\n    const tz = 'America/New_York';\n    // 2026-07-01 11:59:59 UTC = 07:59:59 EDT\n    const from = new Date('2026-07-01T11:59:59.000Z');\n    const next = nextLocalHour(from, tz, QUIET_START_HOUR);\n    expect(next.toISOString()).toBe('2026-07-01T12:00:00.000Z');\n  });\n\n  it('unmapped is unresolved even with business TZ', () => {\n    const d = deferUntilQuietHoursOpen(new Date(), {\n      callerPhoneE164: '+19995551234',\n      businessTimezone: 'America/New_York',\n    });\n    expect(d.allowed).toBe(false);\n    if (!d.allowed) expect(d.unresolved).toBe(true);\n  });\n});\n\ndescribe('QC r4 #6 — opt-out attack surface', () => {\n  it('matches STOP variants with ZW / confusable / punctuation / emoji', () => {\n    expect(isDefiniteOptOut('S\\u200BTOP')).toBe(true);\n    expect(isDefiniteOptOut('STOP?')).toBe(true);\n    expect(isDefiniteOptOut('\"STOP\"')).toBe(true);\n    expect(isDefiniteOptOut('Stop 🛑')).toBe(true);\n    // Cyrillic Т (T) + Latin SOP-ish — use Cyrillic lookalikes for S,T,O,P where mapped\n    expect(isDefiniteOptOut('unsubscribe me')).toBe(true);\n    expect(isDefiniteOptOut('cancel please')).toBe(true);\n    expect(isDefiniteOptOut('stop it')).toBe(true);\n    expect(isDefiniteOptOut('leave me alone')).toBe(true);\n  });\n\n  it('no false positives; ambiguous → human review', () => {\n    expect(isDefiniteOptOut(\"won't stop leaking HELP\")).toBe(false);\n    expect(isDefiniteOptOut('stop by today')).toBe(false);\n    // No carrier keyword → not_opt_out (r7: only whole-word keywords flag)\n    expect(classifyOptOut('wrong number').kind).toBe('not_opt_out');\n    expect(classifyOptOut('please cancel my appointment').kind).toBe(\n      'ambiguous'\n    );\n  });\n});\n\ndescribe('QC r4 minor — templates keep STOP footer (no silent GSM rewrite)', () => {\n  it('every template includes STOP footer', () => {\n    for (const key of Object.keys(ALL_TEMPLATES)) {\n      const body = getTemplate(key, {\n        business: 'Acme',\n        name: '',\n        issue: '',\n      });\n      expect(body).toContain('Reply STOP to opt out.');\n      expect(smsSegmentCount(body), key).toBeGreaterThanOrEqual(1);\n    }\n  });\n});\n"},"src/services/opt-out.survivors.test.ts":{"tests":[{"id":"471","name":"normalizeOptOutText trailing-punctuation anchor (L75) > keeps mid-message punctuation (only strips trailing ?!.,…)","location":{"start":{"column":3,"line":26}}},{"id":"472","name":"normalizeOptOutText trailing-punctuation anchor (L75) > comma-separated STOP PLEASE stays ambiguous, not whole-message opt_out","location":{"start":{"column":3,"line":31}}},{"id":"473","name":"hasWholeWordStem space vs hyphen branch (L87–88) > matches hyphenated OPT-OUT via escaped pattern","location":{"start":{"column":3,"line":41}}},{"id":"474","name":"hasWholeWordStem space vs hyphen branch (L87–88) > matches spaced OPT OUT via multiword stem branch","location":{"start":{"column":3,"line":49}}},{"id":"475","name":"hasWholeWordStem space vs hyphen branch (L87–88) > matches single-token stems without escape path","location":{"start":{"column":3,"line":57}}},{"id":"476","name":"hasWholeWordStem space vs hyphen branch (L87–88) > covers hyphen-only word stem in OPT_OUT_WORD_STEMS","location":{"start":{"column":3,"line":62}}},{"id":"477","name":"empty normalized early return (L102, L170) > emoji-only body normalizes empty → not_opt_out / no backfill","location":{"start":{"column":3,"line":69}}},{"id":"478","name":"empty normalized early return (L102, L170) > whitespace-only → not_opt_out and wouldBackfillSuppress false","location":{"start":{"column":3,"line":75}}},{"id":"479","name":"classifyOptOut whole-message OR branches (L112) > matches on normalized alone","location":{"start":{"column":3,"line":82}}},{"id":"480","name":"classifyOptOut whole-message OR branches (L112) > matches on compact alone (spaced letters)","location":{"start":{"column":3,"line":87}}},{"id":"481","name":"classifyOptOut whole-message OR branches (L112) > matches on collapsed alone (spaced letters + trailing words)","location":{"start":{"column":3,"line":93}}},{"id":"482","name":"classifyOptOut whole-message OR branches (L112) > matches when collapsed compact hits STOPSTOP (collapsed text not in exact set)","location":{"start":{"column":3,"line":101}}},{"id":"483","name":"ambiguous stem OR on normalized vs collapsed (L123, L131) > STOP stem matches only after collapseSpacedLetterTokens","location":{"start":{"column":3,"line":112}}},{"id":"484","name":"ambiguous stem OR on normalized vs collapsed (L123, L131) > multiword STOP ALL stem matches on collapsed text","location":{"start":{"column":3,"line":125}}},{"id":"485","name":"collapseSpacedLetterTokens regex (L143–144) > collapses runs with multiple spaces between letters","location":{"start":{"column":3,"line":141}}},{"id":"486","name":"collapseSpacedLetterTokens regex (L143–144) > feeds classifyOptOut when normalize already collapsed outer whitespace","location":{"start":{"column":3,"line":146}}},{"id":"487","name":"opt-out-data sqlQuotedList and backfill lists > sqlQuotedList doubles apostrophes for SQL literals","location":{"start":{"column":3,"line":153}}},{"id":"488","name":"opt-out-data sqlQuotedList and backfill lists > backfill list helpers mirror const arrays (length + contents)","location":{"start":{"column":3,"line":168}}},{"id":"489","name":"opt-out-data sqlQuotedList and backfill lists > sqlQuotedList joins multiple tokens with comma-space","location":{"start":{"column":3,"line":179}}}],"source":"/**\n * Behavioural tests targeting Stryker survivors on opt-out.ts / opt-out-data.ts (QC r7).\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  classifyOptOut,\n  collapseSpacedLetterTokens,\n  compactOptOutText,\n  hasWholeWordStem,\n  isDefiniteOptOut,\n  normalizeOptOutText,\n  wouldBackfillSuppress,\n} from './opt-out';\nimport {\n  OPT_OUT_MULTIWORD_STEMS,\n  OPT_OUT_WHOLE_MESSAGE,\n  OPT_OUT_WHOLE_MESSAGE_COMPACT,\n  OPT_OUT_WORD_STEMS,\n  optOutBackfillCompactList,\n  optOutBackfillExactList,\n  sqlQuotedList,\n} from './opt-out-data';\n\ndescribe('normalizeOptOutText trailing-punctuation anchor (L75)', () => {\n  it('keeps mid-message punctuation (only strips trailing ?!.,…)', () => {\n    expect(normalizeOptOutText('STOP, PLEASE')).toBe('STOP, PLEASE');\n    expect(normalizeOptOutText('HELLO,WORLD')).toBe('HELLO,WORLD');\n  });\n\n  it('comma-separated STOP PLEASE stays ambiguous, not whole-message opt_out', () => {\n    expect(classifyOptOut('STOP, PLEASE')).toEqual({\n      kind: 'ambiguous',\n      reason: 'keyword_in_sentence',\n    });\n    expect(is
