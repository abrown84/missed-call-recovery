         c.op === 'update' &&\n          (c.args[0] as { reconcile_attempts?: number }).reconcile_attempts ===\n            1 &&\n          typeof (c.args[0] as { next_retry_at?: string }).next_retry_at ===\n            'string'\n      )\n    ).toBe(true);\n  });\n\n  it('lookup without outcome uses classifyRelayLookupResponse', async () => {\n    const db = makeDb({});\n    const o = await reconcileOneWithDeps(\n      baseDeps({\n        dbImpl: db,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              found: true,\n              status: 'delivered',\n            }),\n          }) as never,\n      }),\n      {\n        id: '1',\n        lead_id: 'L',\n        message_sid: 'mlf:campaign:E:C:step:1',\n        status: 'unknown',\n        reconcile_attempts: 0,\n        key_supported_at_send: true,\n      }\n    );\n    // classify of found+delivered → sent → resolved\n    expect(o.kind).toBe('resolved');\n  });\n\n  it('reconcile unexpected_decision from transitionSend', async () => {\n    const machine = await import('./machine');\n    const spy = vi\n      .spyOn(machine, 'transitionSend')\n      .mockReturnValue({ action: 'totally_unknown' } as never);\n    try {\n      const o = await reconcileOneWithDeps(\n        baseDeps({\n          adapter: () =>\n            ({\n              name: 'm',\n              lookupByIdempotencyKey: async () => ({\n                outcome: 'sent',\n                status: 'delivered',\n                found: true,\n              }),\n            }) as never,\n        }),\n        {\n          id: '1',\n          lead_id: 'L',\n          message_sid: 'mlf:campaign:E:C:step:1',\n          status: 'unknown',\n          reconcile_attempts: 0,\n          key_supported_at_send: true,\n        }\n      );\n      expect(o).toMatchObject({\n        kind: 'needs_review',\n        reason: 'unexpected_decision',\n      });\n    } finally {\n      spy.mockRestore();\n    }\n  });\n\n  it('warnLookupUnsupported called iff checkLookupSupport present', async () => {\n    const warn = vi.fn(async () => ({ supported: true }));\n    await reconcileAmbiguousSmsWithDeps(\n      baseDeps({\n        dbImpl: makeDb({ smsList: [] }),\n        warnLookupUnsupported: warn,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'sent',\n              found: true,\n            }),\n            checkLookupSupport: async () => ({ supported: true }),\n          }) as never,\n      })\n    );\n    expect(warn).toHaveBeenCalledTimes(1);\n\n    warn.mockClear();\n    await reconcileAmbiguousSmsWithDeps(\n      baseDeps({\n        dbImpl: makeDb({ smsList: [] }),\n        warnLookupUnsupported: warn,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'sent',\n              found: true,\n            }),\n          }) as never,\n      })\n    );\n    expect(warn).not.toHaveBeenCalled();\n  });\n\n  it('stuck cutoff uses now − STUCK_SENDING_MS and ascending order', async () => {\n    const db = makeDb({ smsList: [] });\n    const clock = new Date('2026-06-15T15:00:00.000Z');\n    await reconcileAmbiguousSmsWithDeps(\n      baseDeps({\n        dbImpl: db,\n        clock: () => clock,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'sent',\n              found: true,\n            }),\n          }) as never,\n      })\n    );\n    const { STUCK_SENDING_MS } = await import('@/services/campaign-logic');\n    const orCall = db.calls.find((c) => c.op === 'or');\n    expect(orCall).toBeTruthy();\n    const filter = String(orCall?.args[0] ?? '');\n    const expectedCutoff = new Date(\n      clock.getTime() - STUCK_SENDING_MS\n    ).toISOString();\n    expect(filter).toContain(expectedCutoff);\n    expect(filter).not.toContain(\n      new Date(clock.getTime() + STUCK_SENDING_MS).toISOString()\n    );\n    const order = db.calls.find((c) => c.op === 'order');\n    expect(order?.args[0]).toBe(COL.sentAt);\n    expect(order?.args[1]).toMatchObject({ ascending: true });\n  });\n\n  it('null smsList rows does not throw; never_sent clears recovery only', async () => {\n    const dbNull = makeDb({});\n    // force then() to return null data\n    const orig = dbNull.from;\n    dbNull.from = ((name: string) => {\n      const t = orig(name);\n      if (name === TABLE.smsMessages) {\n        const api = t as Record<"+"string, unknown>;\n        const chain: Record<"+"string, unknown> = {};\n        for (const m of [\n          'select',\n          'in',\n          'or',\n          'order',\n          'limit',\n          'eq',\n          'update',\n        ]) {\n          chain[m] = (...args: unknown[]) => {\n            dbNull.calls.push({ table: name, op: m, args });\n            return chain;\n          };\n        }\n        chain.then = (\n          resolve: (v: unknown) => unknown,\n          reject?: (e: unknown) => unknown\n        ) =>\n          Promise.resolve({ data: null, error: null }).then(resolve, reject);\n        return chain;\n      }\n      return t;\n    }) as typeof dbNull.from;\n\n    const r = await reconcileAmbiguousSmsWithDeps(\n      baseDeps({\n        dbImpl: dbNull,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => ({\n              outcome: 'sent',\n              found: true,\n            }),\n          }) as never,\n      })\n    );\n    expect(r.confirmed).toBe(0);\n\n    const dbRec = makeDb({\n      smsList: [\n        {\n          id: '1',\n          lead_id: 'L1',\n          message_sid: 'mlf:recovery:L1',\n          status: 'unknown',\n          reconcile_attempts: 0,\n          key_supported_at_send: true,\n        },\n        {\n          id: '2',\n          lead_id: 'L2',\n          message_sid: 'mlf:campaign:E:C:step:1',\n          status: 'unknown',\n          reconcile_attempts: 0,\n          key_supported_at_send: true,\n        },\n      ],\n    });\n    let i = 0;\n    await reconcileAmbiguousSmsWithDeps(\n      baseDeps({\n        dbImpl: dbRec,\n        adapter: () =>\n          ({\n            name: 'm',\n            lookupByIdempotencyKey: async () => {\n              i += 1;\n              return { outcome: 'never_sent', found: false };\n            },\n          }) as never,\n      })\n    );\n    const leadClears = dbRec.calls.filter(\n      (c) =>\n        c.table === TABLE.leads &&\n        c.op === 'update' &&\n        (c.args[0] as { sms_outbound_sid?: unknown }).sms_outbound_sid === null\n    );\n    expect(leadClears).toHaveLength(1);\n  });\n\n  it('resolveRecovery absent when lead has no sms_outbound_sid key', async () => {\n    const db = makeDb({ leads: {} });\n    expect(\n      await resolveRecoveryOutcomeWithDeps(\n        baseDeps({ dbImpl: db }),\n        db as never,\n        'L'\n      )\n    ).toBe('absent');\n  });\n});\n"},"src/services/campaigns.enrollment.test.ts":{"tests":[{"id":"84","name":"enrollLeadInCampaign after urgency is set > enrolls Standard skipping initial when recovery already sent","location":{"start":{"column":3,"line":108}}},{"id":"85","name":"claim ownership on post-send advance > advanceEnrollment fails when claim_token mismatches (pause mid-send)","location":{"start":{"column":3,"line":162}}},{"id":"86","name":"switchEnrollmentCampaign refuses fresh claim > returns deferred_fresh_claim when claimed_at is fresh","location":{"start":{"column":3,"line":192}}},{"id":"87","name":"sendCampaignSMS campaign-scoped sid after switch > uses campaign id in sid so Emergency step 2 is not a Standard dupe","location":{"start":{"column":3,"line":226}}},{"id":"88","name":"claimDueEnrollment > returns null when another worker holds the claim","location":{"start":{"column":3,"line":301}}}],"source":"import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSendMessage = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...args: unknown[]) => mockFrom(...args) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'dry-run',\n    sendMessage: (...args: unknown[]) => mockSendMessage(...args),\n    lookupByIdempotencyKey: vi.fn().mockResolvedValue({\n      outcome: 'never_sent',\n      found: false,\n    }),\n    checkLookupSupport: vi.fn().mockResolvedValue({\n      supported: true,\n      capabilities: { relay: 'dry-run', version: 'test', idempotency: true },\n    }),\n  }),\n}));\n\nvi.mock('@/lib/messaging/brwn-relay', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/lib/messaging/brwn-relay')>(\n    '@/lib/messaging/brwn-relay'\n  );\n  return {\n    ...actual,\n    ensureRelayKeySupportProbed: vi.fn().mockResolvedValue(true),\n    warnIfRelayLookupUnsupported: vi.fn().mockResolvedValue({\n      supported: true,\n      capabilities: { relay: 'dry-run', version: 'test', idempotency: true },\n    }),\n  };\n});\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...args: unknown[]) => isPhoneSuppressed(...args),\n  SuppressionLookupError: class SuppressionLookupError extends Error {},\n}));\n\nvi.mock('@/services/quiet-hours', () => ({\n  deferUntilQuietHoursOpen: () => ({\n    allowed: true,\n    zones: ['America/New_York'],\n  }),\n}));\n\nimport {\n  advanceEnrollment,\n  claimDueEnrollment,\n  enrollLeadInCampaign,\n  sendCampaignSMS,\n  switchEnrollmentCampaign,\n} from './campaigns';\nimport { campaignStepMessageSid } from './campaign-logic';\n\ntype Row = Record<"+"string, unknown>;\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select',\n    'insert',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'order',\n    'limit',\n    'single',\n    'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn(() => {\n    const nested = chainable(result);\n    nested.then = (\n      resolve: (v: unknown) => unknown,\n      reject?: (e: unknown) => unknown\n    ) => Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.then = (\n    resolve: (v: unknown) => unknown,\n    reject?: (e: unknown) => unknown\n  ) => Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('enrollLeadInCampaign after urgency is set', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n  afterEach(() => vi.clearAllMocks());\n\n  it('enrolls Standard skipping initial when recovery already sent', async () => {\n    const lead = {\n      id: 'lead-1',\n      urgency: 'normal',\n      opted_out: false,\n      sms_outbound_sid: 'recovery:lead-1',\n      businesses: { id: 'biz-1', name: 'Acme' },\n    };\n    const campaigns = [\n      {\n        id: 'camp-em',\n        name: 'Emergency Follow-up',\n        urgency_filter: 'emergency',\n        campaign_steps: [\n          { step_number: 1, delay_minutes: 0, template_key: 'emergency_initial' },\n          { step_number: 2, delay_minutes: 60, template_key: 'emergency_followup_1' },\n        ],\n      },\n      {\n        id: 'camp-std',\n        name: 'Standard Follow-up',\n        urgency_filter: null,\n        campaign_steps: [\n          { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n          { step_number: 2, delay_minutes: 240, template_key: 'standard_followup_1' },\n        ],\n      },\n    ];\n    const inserted: Row[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') return chainable({ data: lead, error: null });\n      if (table === 'campaign_enrollments') {\n        const builder = chainable({ data: null, error: null });\n        builder.maybeSingle = vi.fn(async () => ({ data: null, error: null }));\n        builder.insert = vi.fn((row: Row) => {\n          inserted.push(row);\n          return chainable({ data: row, error: null });\n        });\n        return builder;\n      }\n      if (table === 'campaigns') return chainable({ data: campaigns, error: null });\n      return chainable({ data: null, error: null });\n    });\n\n    const result = await enrollLeadInCampaign('lead-1');\n    expect(result.enrolled).toBe(true);\n    if (!result.enrolled) return;\n    expect(result.campaignName).toBe('Standard Follow-up');\n    expect(result.currentStep).toBe(2);\n    expect(inserted[0]?.campaign_id).toBe('camp-std');\n  });\n});\n\ndescribe('claim ownership on post-send advance', () => {\n  it('advanceEnrollment fails when claim_token mismatches (pause mid-send)', async () => {\n    const supabase = {\n      from: () => {\n        const builder = chainable({ data: [], error: null });\n        builder.update = vi.fn(() => {\n          const u = chainable({ data: [], error: null });\n          u.select = vi.fn(() => chainable({ data: [], error: null }));\n          return u;\n        });\n        return builder;\n      },\n    } as any;\n\n    const ok = await advanceEnrollment(\n      supabase,\n      'enr-1',\n      'stale-token',\n      2,\n      [\n        { id: 's1', campaign_id: 'c', step_number: 2, delay_minutes: 0, template_key: 'a', created_at: '' },\n        { id: 's2', campaign_id: 'c', step_number: 3, delay_minutes: 60, template_key: 'b', created_at: '' },\n      ]\n    );\n    expect(ok).toBe(false);\n  });\n});\n\ndescribe('switchEnrollmentCampaign refuses fresh claim', () => {\n  beforeEach(() => mockFrom.mockReset());\n\n  it('returns deferred_fresh_claim when claimed_at is fresh', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        return chainable({\n          data: {\n            id: 'enr-1',\n            lead_id: 'lead-1',\n            campaign_id: 'camp-std',\n            status: 'active',\n            claimed_at: new Date().toISOString(),\n            claim_token: 'tok',\n          },\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n\n    const result = await switchEnrollmentCampaign('lead-1', 'camp-em');\n    expect(result).toEqual({\n      enrolled: false,\n      reason: 'deferred_fresh_claim',\n    });\n  });\n});\n\ndescribe('sendCampaignSMS campaign-scoped sid after switch', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    isPhoneSuppressed.mockResolvedValue(false);\n    mockSendMessage.mockResolvedValue({ id: 'msg-1', status: 'queued' });\n  });\n\n  it('uses campaign id in sid so Emergency step 2 is not a Standard dupe', async () => {\n    const enrollmentId = 'enr-1';\n    const campEm = 'camp-em';\n    const enrollmentRow = {\n      id: enrollmentId,\n      current_step: 2,\n      status: 'active',\n      claim_token: 'tok-1',\n      leads: {\n        id: 'lead-1',\n        caller_phone: '+15551234567',\n        sms_outbound_sid: 'recovery',\n        opted_out: false,\n        issue: 'flood',\n        businesses: {\n          id: 'b',\n          name: 'Acme',\n          phone: '+1',\n          timezone: 'America/New_York',\n        },\n      },\n      campaigns: { id: campEm, name: 'Emergency Follow-up' },\n    };\n    const steps = [\n      { step_number: 1, delay_minutes: 0, template_key: 'emergency_initial' },\n      { step_number: 2, delay_minutes: 60, template_key: 'emergency_followup_1' },\n      { step_number: 3, delay_minutes: 240, template_key: 'emergency_followup_2' },\n    ];\n    const inserted: Row[] = [];\n\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'campaign_enrollments') {\n        const builder = chainable({ data: enrollmentRow, error: null });\n        builder.single = vi.fn(async () => ({\n          data: enrollmentRow,\n          error: null,\n        }));\n        builder.update = vi.fn(() => {\n          const u = chainable({ data: [{ id: enrollmentId }], error: null });\n          u.select = vi.fn(() =>\n            chainable({ data: [{ id: enrollmentId }], error: null })\n          );\n          return u;\n        });\n        return builder;\n      }\n      if (table === 'campaign_steps') {\n        return chainable({ data: steps, error: null });\n      }\n      if (table === 'sms_messages') {\n        const builder = chainable({ data: null, error: null });\n        builder.insert = vi.fn((row: Row) => {\n          inserted.push(row);\n          return chainable({ data: row, error: null });\n        });\n        builder.update = vi.fn(() => chainable({ data: null, error: null }));\n        return builder;\n      }\n      return chainable({ data: null, error: null });\n    });\n\n    const ok = await sendCampaignSMS(enrollmentId, 'tok-1');\n    expect(ok).toBe(true);\n    expect(inserted[0]?.message_sid).toBe(\n      campaignStepMessageSid(enrollmentId, campEm, 2)\n    );\n    expect(inserted[0]?.message_sid).not.toBe(\n      campaignStepMessageSid(enrollmentId, 'camp-std', 2)\n    );\n  });\n});\n\ndescribe('claimDueEnrollment', () => {\n  beforeEach(() => mockFrom.mockReset());\n\n  it('returns null when another worker holds the claim', async () => {\n    mockFrom.mockImplementation(() => {\n      const builder = chainable({ data: [], error: null });\n      builder.update = vi.fn(() => {\n        const u = chainable({ data: [], error: null });\n        u.select = vi.fn(() => chainable({ data: [], error: null }));\n        return u;\n      });\n      return builder;\n    });\n    await expect(claimDueEnrollment('enr-x')).resolves.toBeNull();\n  });\n});\n"},"src/services/send/machine.property.test.ts":{"tests":[{"id":"89","name":"send machine properties > every send_result yields a defined action","location":{"start":{"column":3,"line":44}}},{"id":"90","name":"send machine properties > maintenance and rate_limit never become needs_review on send","location":{"start":{"column":3,"line":61}}},{"id":"91","name":"send machine properties > never_sent without key support always needs_review","location":{"start":{"column":3,"line":82}}},{"id":"92","name":"send machine properties > never_sent with key support always requeues","location":{"start":{"column":3,"line":97}}},{"id":"93","name":"send machine properties > unknown parks until max attempts then needs_review","location":{"start":{"column":3,"line":112}}},{"id":"94","name":"send machine properties > failed lookup never requeues","location":{"start":{"column":3,"line":131}}},{"id":"95","name":"send machine properties > park delay is exponential and capped","location":{"start":{"column":3,"line":147}}},{"id":"96","name":"send machine properties > classifyRecoveryStatus is total","location":{"start":{"column":3,"line":159}}},{"id":"97","name":"send machine properties > ok+caps+echo sets keySupportedAtSend true; missing either → false","location":{"start":{"column":3,"line":189}}}],"source":"/**\n * Property-based tests for the send/reconcile state machine.\n */\nimport { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  MAX_RECONCILE_ATTEMPTS,\n  parkDelayMs,\n  PARK_BASE_MS,\n  PARK_MAX_MS,\n  transitionSend,\n  classifyRecoveryStatus,\n  type RelayLookupSignal,\n  type RelaySendSignal,\n} from './machine';\n\nconst sendSignalArb: fc.Arbitrary<"+"RelaySendSignal> = fc.oneof(\n  fc.record({\n    type: fc.constant('ok' as const),\n    messageId: fc.string({ minLength: 1 }),\n    status: fc.constantFrom('queued', 'sent', 'delivered', 'failed'),\n    keyEchoed: fc.boolean(),\n    duplicate: fc.option(fc.boolean(), { nil: undefined }),\n  }),\n  fc.constant({ type: 'conflict' as const }),\n  fc.constant({ type: 'rate_limit' as const }),\n  fc.constant({ type: 'maintenance' as const }),\n  fc.constant({ type: 'failed' as const, status: 'failed' }),\n  fc.constant({ type: 'error' as const })\n);\n\nconst lookupSignalArb: fc.Arbitrary<"+"RelayLookupSignal> = fc.oneof(\n  fc.record({\n    type: fc.constant('sent' as const),\n    status: fc.constantFrom('queued', 'sent', 'delivered', 'failed'),\n  }),\n  fc.constant({ type: 'never_sent' as const }),\n  fc.constant({ type: 'failed' as const, status: 'failed' }),\n  fc.constant({ type: 'unknown' as const })\n);\n\ndescribe('send machine properties', () => {\n  it('every send_result yields a defined action', () => {\n    fc.assert(\n      fc.property(sendSignalArb, fc.boolean(), (signal, caps) => {\n        const d = transitionSend({\n          kind: 'send_result',\n          signal,\n          capsBeforeSend: caps,\n        });\n        expect(d.action).toBeTypeOf('string');\n        expect(['confirm_sent', 'park_ambiguous', 'needs_review']).toContain(\n          d.action\n        );\n      }),\n      { numRuns: 200 }\n    );\n  });\n\n  it('maintenance and rate_limit never become needs_review on send', () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom<"+"RelaySendSignal>(\n          { type: 'maintenance' },\n          { type: 'rate_limit' }\n        ),\n        fc.boolean(),\n        (signal, caps) => {\n          const d = transitionSend({\n            kind: 'send_result',\n            signal,\n            capsBeforeSend: caps,\n          });\n          expect(d.action).toBe('park_ambiguous');\n        }\n      ),\n      { numRuns: 50 }\n    );\n  });\n\n  it('never_sent without key support always needs_review', () => {\n    fc.assert(\n      fc.property(fc.nat({ max: 10 }), (attempts) => {\n        const d = transitionSend({\n          kind: 'lookup',\n          signal: { type: 'never_sent' },\n          keySupportedAtSend: false,\n          attempts,\n        });\n        expect(d.action).toBe('needs_review');\n      }),\n      { numRuns: 50 }\n    );\n  });\n\n  it('never_sent with key support always requeues', () => {\n    fc.assert(\n      fc.property(fc.nat({ max: 10 }), (attempts) => {\n        const d = transitionSend({\n          kind: 'lookup',\n          signal: { type: 'never_sent' },\n          keySupportedAtSend: true,\n          attempts,\n        });\n        expect(d.action).toBe('requeue_never_sent');\n      }),\n      { numRuns: 50 }\n    );\n  });\n\n  it('unknown parks until max attempts then needs_review', () => {\n    fc.assert(\n      fc.property(fc.nat({ max: MAX_RECONCILE_ATTEMPTS + 3 }), (attempts) => {\n        const d = transitionSend({\n          kind: 'lookup',\n          signal: { type: 'unknown' },\n          keySupportedAtSend: true,\n          attempts,\n        });\n        if (attempts + 1 >= MAX_RECONCILE_ATTEMPTS) {\n          expect(d.action).toBe('needs_review');\n        } else {\n          expect(d.action).toBe('park_ambiguous');\n        }\n      }),\n      { numRuns: 40 }\n    );\n  });\n\n  it('failed lookup never requeues', () => {\n    fc.assert(\n      fc.property(lookupSignalArb, fc.boolean(), fc.nat({ max: 5 }), (signal, key, attempts) => {\n        fc.pre(signal.type === 'failed' || (signal.type === 'sent' && signal.status === 'failed'));\n        const d = transitionSend({\n          kind: 'lookup',\n          signal,\n          keySupportedAtSend: key,\n          attempts,\n        });\n        expect(d.action).toBe('needs_review');\n      }),\n      { numRuns: 100 }\n    );\n  });\n\n  it('park delay is exponential and capped', () => {\n    fc.assert(\n      fc.property(fc.nat({ max: 20 }), (n) => {\n        const d = parkDelayMs(n);\n        expect(d).toBeGreaterThanOrEqual(PARK_BASE_MS);\n        expect(d).toBeLessThanOrEqual(PARK_MAX_MS);\n        expect(d).toBe(Math.min(PARK_BASE_MS * 2 ** n, PARK_MAX_MS));\n      }),\n      { numRuns: 30 }\n    );\n  });\n\n  it('classifyRecoveryStatus is total', () => {\n    fc.assert(\n      fc.property(\n        fc.option(\n          fc.constantFrom(\n            'queued',\n            'sent',\n            'sending',\n            'unknown',\n            'needs_review',\n            'failed',\n            'abandoned_retry',\n            'weird'\n          ),\n          { nil: null }\n        ),\n        (status) => {\n          const r = classifyRecoveryStatus(status);\n          expect([\n            'resolved_sent',\n            'resolved_abandoned',\n            'pending',\n            'absent',\n          ]).toContain(r);\n        }\n      ),\n      { numRuns: 50 }\n    );\n  });\n\n  it('ok+caps+echo sets keySupportedAtSend true; missing either → false', () => {\n    fc.assert(\n      fc.property(fc.boolean(), fc.boolean(), (caps, echo) => {\n        const d = transitionSend({\n          kind: 'send_result',\n          signal: {\n            type: 'ok',\n            messageId: 'm',\n            status: 'queued',\n            keyEchoed: echo,\n          },\n          capsBeforeSend: caps,\n        });\n        if (d.action === 'confirm_sent') {\n          expect(d.keySupportedAtSend).toBe(caps && echo);\n        }\n      }),\n      { numRuns: 40 }\n    );\n  });\n});\n"},"src/services/missed-call.di.test.ts":{"tests":[{"id":"98","name":"processMissedCallWithDeps > throws when business missing","location":{"start":{"column":3,"line":114}}},{"id":"99","name":"processMissedCallWithDeps > reclaims duplicate call_sid 23505","location":{"start":{"column":3,"line":123}}},{"id":"100","name":"processMissedCallWithDeps > throws when duplicate call cannot be reclaimed","location":{"start":{"column":3,"line":160}}},{"id":"101","name":"processMissedCallWithDeps > throws on non-duplicate missed call insert failure","location":{"start":{"column":3,"line":174}}},{"id":"102","name":"processMissedCallWithDeps > fail-closed when suppression lookup errors","location":{"start":{"column":3,"line":187}}},{"id":"103","name":"processMissedCallWithDeps > rethrows unexpected suppression errors","location":{"start":{"column":3,"line":204}}},{"id":"104","name":"processMissedCallWithDeps > skips recovery when suppressed","location":{"start":{"column":3,"line":215}}},{"id":"105","name":"processMissedCallWithDeps > sends recovery and enrolls Standard path","location":{"start":{"column":3,"line":228}}},{"id":"106","name":"processMissedCallWithDeps > returns ids when recovery send fails","location":{"start":{"column":3,"line":249}}},{"id":"107","name":"processMissedCallWithDeps > returns ids when enrollment fails","location":{"start":{"column":3,"line":262}}},{"id":"108","name":"processMissedCallWithDeps > throws when lead insert fails","location":{"start":{"column":3,"line":275}}},{"id":"109","name":"processMissedCallWithDeps > duplicate 23505 without existing lead throws 500","location":{"start":{"column":3,"line":286}}},{"id":"110","name":"processMissedCallWithDeps > records missed call payload and business phone lookup","location":{"start":{"column":3,"line":319}}},{"id":"111","name":"processMissedCallWithDeps > defaults ring duration to zero","location":{"start":{"column":3,"line":366}}},{"id":"112","name":"MissedCallError > carries status","location":{"start":{"column":3,"line":400}}}],"source":"/**\n * DI tests for processMissedCallWithDeps — every branch without module mocks.\n */\nimport { describe, expect, it, vi } from 'vitest';\nimport {\n  MissedCallError,\n  processMissedCallWithDeps,\n  type MissedCallEvent,\n} from './missed-call';\nimport type { MissedCallDeps } from './missed-call-deps';\nimport type { SupabaseClient } from './missed-call-deps';\nimport type { EnrollmentResult } from './campaign-runtime';\n\nconst FIXED = new Date('2026-10-28T12:00:00.000Z');\nconst BIZ = {\n  id: 'biz-1',\n  phone: '+15559999999',\n  name: 'Acme',\n  vertical: 'plumbing',\n  settings: {},\n};\n\ntype QueryResult = { data: unknown; error: unknown };\n\nfunction chain(result: QueryResult) {\n  const obj: Record<"+"string, unknown> = {};\n  const self = () => obj;\n  for (const m of ['select', 'insert', 'eq']) {\n    obj[m] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n    Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\nclass FakeSuppressionLookupError extends Error {}\n\nfunction baseEvent(over: Partial<"+"MissedCallEvent> = {}): MissedCallEvent {\n  return {\n    callerPhone: '+15551234567',\n    businessPhone: '+15559999999',\n    callId: 'call-1',\n    ...over,\n  };\n}\n\nfunction buildDeps(config: {\n  business?: QueryResult;\n  missedCallInsert?: QueryResult;\n  missedCallLookup?: QueryResult;\n  leadLookup?: QueryResult;\n  leadInsert?: QueryResult;\n  suppressed?: boolean;\n  suppressThrows?: Error;\n  sendRecoveryThrows?: boolean;\n  enrollThrows?: boolean;\n}) {\n  const sendRecoverySMS = vi.fn(async () => undefined);\n  const enrollLeadInCampaign = vi.fn(\n    async (): Promise<"+"EnrollmentResult> => ({ enrolled: true, campaignId: 'c', campaignName: 'Standard Follow-up', currentStep: 2, nextSendAt: FIXED.toISOString(), skippedInitial: true })\n  );\n  const isPhoneSuppressed = vi.fn(async () => config.suppressed ?? false);\n\n  if (config.suppressThrows) {\n    isPhoneSuppressed.mockRejectedValue(config.suppressThrows);\n  }\n  if (config.sendRecoveryThrows) {\n    sendRecoverySMS.mockRejectedValue(new Error('sms fail'));\n  }\n  if (config.enrollThrows) {\n    enrollLeadInCampaign.mockRejectedValue(new Error('enroll fail'));\n  }\n\n  const from = vi.fn((table: string) => {\n    if (table === 'businesses') {\n      return chain(config.business ?? { data: BIZ, error: null });\n    }\n    if (table === 'missed_calls') {\n      if (config.missedCallInsert) {\n        const c = chain(config.missedCallInsert);\n        c.insert = vi.fn(() => c);\n        return c;\n      }\n      return chain(config.missedCallLookup ?? { data: null, error: null });\n    }\n    if (table === 'leads') {\n      if (config.leadInsert) {\n        const c = chain(config.leadInsert);\n        c.insert = vi.fn(() => c);\n        return c;\n      }\n      return chain(config.leadLookup ?? { data: null, error: null });\n    }\n    return chain({ data: null, error: null });\n  });\n\n  const deps: MissedCallDeps = {\n    db: () => ({ from }) as unknown as never,\n    clock: () => FIXED,\n    normalizeToE164: vi.fn((p: string) => p) as MissedCallDeps['normalizeToE164'],\n    isPhoneSuppressed,\n    SuppressionLookupError: FakeSuppressionLookupError,\n    sendRecoverySMS,\n    enrollLeadInCampaign: enrollLeadInCampaign as MissedCallDeps['enrollLeadInCampaign'],\n    redactPhone: vi.fn((p: string) => `***${String(p).slice(-4)}`) as any,\n  };\n\n  return { deps, sendRecoverySMS, enrollLeadInCampaign, isPhoneSuppressed };\n}\n\ndescribe('processMissedCallWithDeps', () => {\n  it('throws when business missing', async () => {\n    const { deps } = buildDeps({\n      business: { data: null, error: { message: 'no' } },\n    });\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toMatchObject(\n      { status: 404, name: 'MissedCallError' }\n    );\n  });\n\n  it('reclaims duplicate call_sid 23505', async () => {\n    let mcPass = 0;\n    const from = vi.fn((table: string) => {\n      if (table === 'businesses') {\n        return chain({ data: BIZ, error: null });\n      }\n      if (table === 'missed_calls') {\n        mcPass += 1;\n        if (mcPass === 1) {\n          const c = chain({\n            data: null,\n            error: { code: '23505', message: 'dup' },\n          });\n          c.insert = vi.fn(() => c);\n          return c;\n        }\n        return chain({ data: { id: 'mc-existing' }, error: null });\n      }\n      if (table === 'leads') {\n        return chain({ data: { id: 'lead-existing' }, error: null });\n      }\n      return chain({ data: null, error: null });\n    });\n\n    const deps: MissedCallDeps = {\n      ...buildDeps({}).deps,\n      db: () => ({ from }) as unknown as SupabaseClient,\n    };\n\n    const result = await processMissedCallWithDeps(deps, baseEvent());\n\n    expect(result).toEqual({\n      missedCallId: 'mc-existing',\n      leadId: 'lead-existing',\n    });\n  });\n\n  it('throws when duplicate call cannot be reclaimed', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: {\n        data: null,\n        error: { code: '23505', message: 'dup' },\n      },\n      missedCallLookup: { data: null, error: null },\n    });\n\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toMatchObject(\n      { status: 500 }\n    );\n  });\n\n  it('throws on non-duplicate missed call insert failure', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: {\n        data: null,\n        error: { code: 'XX', message: 'fail' },\n      },\n    });\n\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toThrow(\n      MissedCallError\n    );\n  });\n\n  it('fail-closed when suppression lookup errors', async () => {\n    const { deps, sendRecoverySMS, enrollLeadInCampaign } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-1' }, error: null },\n      leadInsert: {\n        data: { id: 'lead-sup', status: 'spam' },\n        error: null,\n      },\n      suppressThrows: new FakeSuppressionLookupError('db down'),\n    });\n\n    const result = await processMissedCallWithDeps(deps, baseEvent());\n\n    expect(result).toEqual({ missedCallId: 'mc-1', leadId: 'lead-sup' });\n    expect(sendRecoverySMS).not.toHaveBeenCalled();\n    expect(enrollLeadInCampaign).not.toHaveBeenCalled();\n  });\n\n  it('rethrows unexpected suppression errors', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-1' }, error: null },\n      suppressThrows: new Error('unexpected'),\n    });\n\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toThrow(\n      'unexpected'\n    );\n  });\n\n  it('skips recovery when suppressed', async () => {\n    const { deps, sendRecoverySMS, enrollLeadInCampaign } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-2' }, error: null },\n      leadInsert: { data: { id: 'lead-2' }, error: null },\n      suppressed: true,\n    });\n\n    await processMissedCallWithDeps(deps, baseEvent());\n\n    expect(sendRecoverySMS).not.toHaveBeenCalled();\n    expect(enrollLeadInCampaign).not.toHaveBeenCalled();\n  });\n\n  it('sends recovery and enrolls Standard path', async () => {\n    const { deps, sendRecoverySMS, enrollLeadInCampaign } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-3' }, error: null },\n      leadInsert: { data: { id: 'lead-3' }, error: null },\n      suppressed: false,\n    });\n\n    const result = await processMissedCallWithDeps(\n      deps,\n      baseEvent({ ringDurationSeconds: 12 })\n    );\n\n    expect(result).toEqual({ missedCallId: 'mc-3', leadId: 'lead-3' });\n    expect(sendRecoverySMS).toHaveBeenCalledWith(\n      'lead-3',\n      BIZ,\n      '+15551234567'\n    );\n    expect(enrollLeadInCampaign).toHaveBeenCalledWith('lead-3');\n  });\n\n  it('returns ids when recovery send fails', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-4' }, error: null },\n      leadInsert: { data: { id: 'lead-4' }, error: null },\n      sendRecoveryThrows: true,\n    });\n\n    expect(await processMissedCallWithDeps(deps, baseEvent())).toEqual({\n      missedCallId: 'mc-4',\n      leadId: 'lead-4',\n    });\n  });\n\n  it('returns ids when enrollment fails', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-5' }, error: null },\n      leadInsert: { data: { id: 'lead-5' }, error: null },\n      enrollThrows: true,\n    });\n\n    expect(await processMissedCallWithDeps(deps, baseEvent())).toEqual({\n      missedCallId: 'mc-5',\n      leadId: 'lead-5',\n    });\n  });\n\n  it('throws when lead insert fails', async () => {\n    const { deps } = buildDeps({\n      missedCallInsert: { data: { id: 'mc-6' }, error: null },\n      leadInsert: { data: null, error: { message: 'lead fail' } },\n    });\n\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toMatchObject(\n      { status: 500, message: 'Failed to create lead' }\n    );\n  });\n\n  it('duplicate 23505 without existing lead throws 500', async () => {\n    let mcPass = 0;\n    const from = vi.fn((table: string) => {\n      if (table === 'businesses') {\n        return chain({ data: BIZ, error: null });\n      }\n      if (table === 'missed_calls') {\n        mcPass += 1;\n        if (mcPass === 1) {\n          const c = chain({\n            data: null,\n            error: { code: '23505', message: 'dup' },\n          });\n          c.insert = vi.fn(() => c);\n          return c;\n        }\n        return chain({ data: { id: 'mc-dup' }, error: null });\n      }\n      if (table === 'leads') {\n        return chain({ data: null, error: { message: 'no lead' } });\n      }\n      return chain({ data: null, error: null });\n    });\n    const deps: MissedCallDeps = {\n      ...buildDeps({}).deps,\n      db: () => ({ from }) as unknown as SupabaseClient,\n    };\n\n    await expect(processMissedCallWithDeps(deps, baseEvent())).rejects.toMatchObject(\n      { status: 500, message: 'Failed to record call' }\n    );\n  });\n\n  it('records missed call payload and business phone lookup', async () => {\n    const inserts: unknown[] = [];\n    const eqLog: Array<"+"{ table: string; col: string; val: unknown }> = [];\n    const from = vi.fn((table: string) => {\n      if (table === 'businesses') {\n        const c = chain({ data: BIZ, error: null });\n        c.eq = vi.fn((col: string, val: unknown) => {\n          eqLog.push({ table, col, val });\n          return c;\n        });\n        return c;\n      }\n      if (table === 'missed_calls') {\n        const c = chain({ data: { id: 'mc-p' }, error: null });\n        c.insert = vi.fn((payload: unknown) => {\n          inserts.push(payload);\n          return c;\n        });\n        return c;\n      }\n      if (table === 'leads') {\n        const c = chain({ data: { id: 'lead-p' }, error: null });\n        c.insert = vi.fn(() => c);\n        return c;\n      }\n      return chain({ data: null, error: null });\n    });\n    const base = buildDeps({});\n    const deps: MissedCallDeps = {\n      ...base.deps,\n      db: () => ({ from }) as unknown as SupabaseClient,\n    };\n\n    await processMissedCallWithDeps(deps, baseEvent({ callId: 'device-9' }));\n\n    expect(eqLog).toContainEqual({\n      table: 'businesses',\n      col: 'phone',\n      val: '+15559999999',\n    });\n    expect(inserts[0]).toMatchObject({\n      business_id: 'biz-1',\n      call_sid: 'device-9',\n      caller_phone: '+15551234567',\n    });\n  });\n\n  it('defaults ring duration to zero', async () => {\n    const inserts: unknown[] = [];\n    const from = vi.fn((table: string) => {\n      if (table === 'businesses') {\n        return chain({ data: BIZ, error: null });\n      }\n      if (table === 'missed_calls') {\n        const c = chain({ data: { id: 'mc-r' }, error: null });\n        c.insert = vi.fn((payload: unknown) => {\n          inserts.push(payload);\n          return c;\n        });\n        return c;\n      }\n      if (table === 'leads') {\n        const c = chain({ data: { id: 'lead-r' }, error: null });\n        c.insert = vi.fn(() => c);\n        return c;\n      }\n      return chain({ data: null, error: null });\n    });\n    const base = buildDeps({});\n    const deps: MissedCallDeps = {\n      ...base.deps,\n      db: () => ({ from }) as unknown as SupabaseClient,\n    };\n\n    await processMissedCallWithDeps(deps, baseEvent({ ringDurationSeconds: undefined }));\n\n    expect(inserts[0]).toMatchObject({ ring_duration: 0 });\n  });\n});\n\ndescribe('MissedCallError', () => {\n  it('carries status', () => {\n    const e = new MissedCallError('x', 500);\n    expect(e.status).toBe(500);\n    expect(e.name).toBe('MissedCallError');\n  });\n});\n"},"src/services/missed-call.enrollment.test.ts":{"tests":[{"id":"113","name":"processMissedCall (QC r6 enroll + recovery) > sends recovery SMS and enrolls exactly once (non-responder path)","location":{"start":{"column":3,"line":53}}},{"id":"114","name":"processMissedCall (QC r6 enroll + recovery) > skips recovery SMS when phone is suppressed (prior STOP)","location":{"start":{"column":3,"line":99}}}],"source":"import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst sendRecoverySMS = vi.fn();\nconst enrollLeadInCampaign = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...args: unknown[]) => mockFrom(...args) }),\n}));\n\nvi.mock('@/services/sms', () => ({\n  sendRecoverySMS: (...args: unknown[]) => sendRecoverySMS(...args),\n}));\n\nvi.mock('@/services/campaigns', () => ({\n  enrollLeadInCampaign: (...args: unknown[]) => enrollLeadInCampaign(...args),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...args: unknown[]) => isPhoneSuppressed(...args),\n  SuppressionLookupError: class SuppressionLookupError extends Error {},\n}));\n\nimport { processMissedCall } from './missed-call';\n\nfunction thenable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {\n    select: vi.fn(() => obj),\n    insert: vi.fn(() => obj),\n    eq: vi.fn(() => obj),\n    single: vi.fn(async () => result),\n    maybeSingle: vi.fn(async () => result),\n    then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n      Promise.resolve(result).then(resolve, reject),\n  };\n  return obj;\n}\n\ndescribe('processMissedCall (QC r6 enroll + recovery)', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    sendRecoverySMS.mockReset();\n    enrollLeadInCampaign.mockReset();\n    isPhoneSuppressed.mockReset();\n    sendRecoverySMS.mockResolvedValue(undefined);\n    enrollLeadInCampaign.mockResolvedValue({ enrolled: true });\n    isPhoneSuppressed.mockResolvedValue(false);\n  });\n\n  afterEach(() => vi.clearAllMocks());\n\n  it('sends recovery SMS and enrolls exactly once (non-responder path)', async () => {\n    const business = {\n      id: 'biz-1',\n      phone: '+15559999999',\n      name: 'Acme',\n      vertical: 'plumbing',\n      settings: {},\n    };\n    const missedCall = { id: 'mc-1', call_sid: 'call-1' };\n    const lead = {\n      id: 'lead-1',\n      business_id: 'biz-1',\n      missed_call_id: 'mc-1',\n      caller_phone: '+15551234567',\n      status: 'pending',\n      urgency: null,\n    };\n\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'businesses') return thenable({ data: business, error: null });\n      if (table === 'missed_calls') {\n        const obj = thenable({ data: missedCall, error: null });\n        obj.insert = vi.fn(() => obj);\n        return obj;\n      }\n      if (table === 'leads') {\n        const obj = thenable({ data: lead, error: null });\n        obj.insert = vi.fn(() => obj);\n        return obj;\n      }\n      return thenable({ data: null, error: null });\n    });\n\n    const result = await processMissedCall({\n      callerPhone: '+15551234567',\n      businessPhone: '+15559999999',\n      callId: 'call-1',\n      ringDurationSeconds: 10,\n    });\n\n    expect(result).toEqual({ missedCallId: 'mc-1', leadId: 'lead-1' });\n    expect(sendRecoverySMS).toHaveBeenCalledOnce();\n    expect(enrollLeadInCampaign).toHaveBeenCalledOnce();\n    expect(enrollLeadInCampaign).toHaveBeenCalledWith('lead-1');\n  });\n\n  it('skips recovery SMS when phone is suppressed (prior STOP)', async () => {\n    isPhoneSuppressed.mockResolvedValue(true);\n    const business = {\n      id: 'biz-1',\n      phone: '+15559999999',\n      name: 'Acme',\n      vertical: 'plumbing',\n      settings: {},\n    };\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'businesses') return thenable({ data: business, error: null });\n      if (table === 'missed_calls') {\n        const obj = thenable({ data: { id: 'mc-2' }, error: null });\n        obj.insert = vi.fn(() => obj);\n        return obj;\n      }\n      if (table === 'leads') {\n        const obj = thenable({\n          data: { id: 'lead-2', opted_out: true },\n          error: null,\n        });\n        obj.insert = vi.fn(() => obj);\n        return obj;\n      }\n      return thenable({ data: null, error: null });\n    });\n\n    await processMissedCall({\n      callerPhone: '+15551234567',\n      businessPhone: '+15559999999',\n      callId: 'call-2',\n    });\n\n    expect(sendRecoverySMS).not.toHaveBeenCalled();\n    expect(enrollLeadInCampaign).not.toHaveBeenCalled();\n  });\n});\n"},"src/services/campaign-runtime.enroll.di.test.ts":{"tests":[{"id":"115","name":"campaign-runtime enroll/claim DI > enrolls Standard when urgency null; filters autoEnroll true","location":{"start":{"column":3,"line":124}}},{"id":"116","name":"campaign-runtime enroll/claim DI > claimDueEnrollment prefers due path when dueCount > 0 (not stale)","location":{"start":{"column":3,"line":144}}},{"id":"117","name":"campaign-runtime enroll/claim DI > claimDueEnrollment falls through to stale when due empty","location":{"start":{"column":3,"line":182}}},{"id":"118","name":"campaign-runtime enroll/claim DI > listClaimableEnrollmentIds unions due+stale and respects limit","location":{"start":{"column":3,"line":218}}},{"id":"119","name":"campaign-runtime enroll/claim DI > reply enroll path returns enroll action for null enrollment","location":{"start":{"column":3,"line":253}}}],"source":"/**\n * DI tests for enroll / switch / reply / claim paths in campaign-runtime.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\nimport type { CampaignDeps } from './campaign-deps';\nimport {\n  enrollLeadInCampaignWithDeps,\n  claimDueEnrollmentWithDeps,\n  listClaimableEnrollmentIdsWithDeps,\n  handleClassifiedReplyEnrollmentWithDeps,\n} from './campaign-runtime';\nimport { SuppressionLookupError } from './suppressions';\n\nconst FIXED = new Date('2026-06-15T12:00:00.000Z');\n\ntype Call = { table: string; method: string; args: unknown[] };\n\ndescribe('campaign-runtime enroll/claim DI', () => {\n  let calls: Call[];\n  let inserts: unknown[];\n  let deps: CampaignDeps;\n  let leadRow: any;\n  let campaignRows: any[];\n\n  beforeEach(() => {\n    calls = [];\n    inserts = [];\n    leadRow = {\n      id: 'L',\n      opted_out: false,\n      urgency: null,\n      sms_outbound_sid: null,\n      caller_phone: '+12135550100',\n      businesses: { id: 'B', name: 'Acme', timezone: 'America/Los_Angeles' },\n    };\n    campaignRows = [\n      {\n        id: 'C-std',\n        name: 'Standard',\n        status: 'active',\n        auto_enroll: true,\n        urgency_level: null,\n        campaign_steps: [\n          { step_number: 1, delay_minutes: 0, template_key: 'a' },\n          { step_number: 2, delay_minutes: 60, template_key: 'b' },\n        ],\n      },\n    ];\n\n    deps = {\n      db: () =>\n        ({\n          from: (table: string) => {\n            const b: any = {};\n            const track =\n              (method: string) =>\n              (...args: unknown[]) => {\n                calls.push({ table, method, args });\n                return b;\n              };\n            for (const m of [\n              'select',\n              'eq',\n              'lte',\n              'lt',\n              'is',\n              'or',\n              'in',\n              'order',\n              'limit',\n              'update',\n            ]) {\n              b[m] = track(m);\n            }\n            b.insert = vi.fn((row: unknown) => {\n              inserts.push(row);\n              calls.push({ table, method: 'insert', args: [row] });\n              return b;\n            });\n            b.single = vi.fn(async () => {\n              if (table === 'leads') return { data: leadRow, error: null };\n              return { data: null, error: null };\n            });\n            b.maybeSingle = vi.fn(async () => {\n              if (table === 'campaign_enrollments')\n                return { data: null, error: null };\n              return { data: null, error: null };\n            });\n            b.then = (resolve: any, reject?: any) => {\n              if (table === 'campaigns') {\n                return Promise.resolve({\n                  data: campaignRows,\n                  error: null,\n                }).then(resolve, reject);\n              }\n              if (table === 'campaign_enrollments') {\n                return Promise.resolve({\n                  data: [{ id: 'e', claim_token: 'uuid-fixed' }],\n                  error: null,\n                }).then(resolve, reject);\n              }\n              return Promise.resolve({ data: null, error: null }).then(\n                resolve,\n                reject\n              );\n            };\n            return b;\n          },\n        }) as any,\n      clock: () => FIXED,\n      adapter: () => ({ name: 'mock' }) as any,\n      sendMessage: vi.fn() as any,\n      sendRecoverySMS: vi.fn() as any,\n      processDeferredRecoveries: vi.fn() as any,\n      isPhoneSuppressed: vi.fn(async () => false),\n      SuppressionLookupError,\n      getTemplate: () => 'x',\n      uuid: () => 'uuid-fixed',\n      sleep: vi.fn(async () => undefined),\n    };\n  });\n\n  it('enrolls Standard when urgency null; filters autoEnroll true', async () => {\n    // resolveRecoveryOutcome is imported from send — may hit real module;\n    // enroll still reaches planEnroll with recovery absent on empty recovery.\n    const result = await enrollLeadInCampaignWithDeps(deps, 'L');\n    // May reject if recovery lookup fails without mocks — assert filter at least\n    expect(\n      calls.some(\n        (c) =>\n          c.table === 'campaigns' &&\n          c.method === 'eq' &&\n          c.args[0] === 'auto_enroll' &&\n          c.args[1] === true\n      )\n    ).toBe(true);\n    if (result.enrolled) {\n      expect(result.campaignName).toBe('Standard');\n      expect(inserts.length).toBeGreaterThan(0);\n    }\n  });\n\n  it('claimDueEnrollment prefers due path when dueCount > 0 (not stale)', async () => {\n    let updateN = 0;\n    deps.db = () =>\n      ({\n        from: () => {\n          const b: any = {};\n          const self = () => b;\n          for (const m of ['eq', 'lte', 'lt', 'is', 'select', 'update']) {\n            b[m] = vi.fn(self);\n          }\n          b.update = vi.fn((payload: unknown) => {\n            updateN += 1;\n            inserts.push(payload);\n            return b;\n          });\n          b.then = (resolve: any, reject?: any) => {\n            // First update (due) returns a row; stale should not run\n            if (updateN === 1) {\n              return Promise.resolve({\n                data: [{ id: 'enr-1' }],\n                error: null,\n              }).then(resolve, reject);\n            }\n            return Promise.resolve({ data: [], error: null }).then(\n              resolve,\n              reject\n            );\n          };\n          return b;\n        },\n      }) as any;\n\n    const token = await claimDueEnrollmentWithDeps(deps, 'enr-1');\n    expect(token).toBe('uuid-fixed');\n    expect(updateN).toBe(1); // stale path skipped when due hits\n    expect(inserts[0]).toMatchObject({ claim_token: 'uuid-fixed' });\n  });\n\n  it('claimDueEnrollment falls through to stale when due empty', async () => {\n    let updateN = 0;\n    deps.db = () =>\n      ({\n        from: () => {\n          const b: any = {};\n          const self = () => b;\n          for (const m of ['eq', 'lte', 'lt', 'is', 'select', 'update']) {\n            b[m] = vi.fn(self);\n          }\n          b.update = vi.fn((payload: unknown) => {\n            updateN += 1;\n            inserts.push({ n: updateN, payload });\n            return b;\n          });\n          b.then = (resolve: any, reject?: any) => {\n            if (updateN === 1) {\n              return Promise.resolve({ data: [], error: null }).then(\n                resolve,\n                reject\n              );\n            }\n            return Promise.resolve({\n              data: [{ id: 'enr-1' }],\n              error: null,\n            }).then(resolve, reject);\n          };\n          return b;\n        },\n      }) as any;\n\n    const token = await claimDueEnrollmentWithDeps(deps, 'enr-1');\n    expect(token).toBe('uuid-fixed');\n    expect(updateN).toBe(2);\n  });\n\n  it('listClaimableEnrollmentIds unions due+stale and respects limit', async () => {\n    let selectN = 0;\n    deps.db = () =>\n      ({\n        from: () => {\n          const b: any = {};\n          const self = () => b;\n          for (const m of [\n            'select',\n            'eq',\n            'lte',\n            'lt',\n            'is',\n            'order',\n            'limit',\n          ]) {\n            b[m] = vi.fn(self);\n          }\n          b.then = (resolve: any, reject?: any) => {\n            selectN += 1;\n            const data =\n              selectN === 1\n                ? [{ id: 'a' }, { id: 'b' }]\n                : [{ id: 'b' }, { id: 'c' }];\n            return Promise.resolve({ data, error: null }).then(resolve, reject);\n          };\n          return b;\n        },\n      }) as any;\n\n    const ids = await listClaimableEnrollmentIdsWithDeps(deps, 2);\n    expect(ids).toEqual(['a', 'b']);\n    expect(ids).not.toContain('c');\n  });\n\n  it('reply enroll path returns enroll action for null enrollment', async () => {\n    // handleClassifiedReply with no enrollment → plan may enroll\n    const action = await handleClassifiedReplyEnrollmentWithDeps(\n      deps,\n      'L',\n      null\n    );\n    expect(typeof action.action).toBe('string');\n  });\n});\n"},"src/services/inbound.enrollment.test.ts":{"tests":[{"id":"120","name":"processInboundSms QC r2 > records STOP even when no recent lead (after 7 days)","location":{"start":{"column":3,"line":78}}},{"id":"121","name":"processInboundSms QC r2 > switches to Emergency on urgent reply","location":{"start":{"column":3,"line":113}}}],"source":"import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst handleClassifiedReplyEnrollment = vi.fn();\nconst pauseCampaignForLead = vi.fn();\nconst escalateLead = vi.fn();\nconst classifyUrgency = vi.fn();\nconst markLeadOptedOut = vi.fn();\nconst suppressPhoneForBusiness = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...args: unknown[]) => mockFrom(...args) }),\n}));\n\nvi.mock('@/services/campaigns', () => ({\n  handleClassifiedReplyEnrollment: (...args: unknown[]) =>\n    handleClassifiedReplyEnrollment(...args),\n  pauseCampaignForLead: (...args: unknown[]) => pauseCampaignForLead(...args),\n}));\n\nvi.mock('@/services/escalation', () => ({\n  escalateLead: (...args: unknown[]) => escalateLead(...args),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  markLeadOptedOut: (...args: unknown[]) => markLeadOptedOut(...args),\n  suppressPhoneForBusiness: (...args: unknown[]) =>\n    suppressPhoneForBusiness(...args),\n}));\n\nvi.mock('@/services/classification', async () => {\n  const actual = await vi.importActual<"+"typeof import('./classification')>(\n    './classification'\n  );\n  return {\n    ...actual,\n    classifyUrgency: (...args: unknown[]) => classifyUrgency(...args),\n  };\n});\n\nimport { processInboundSms } from './inbound';\n\nfunction thenable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {\n    select: vi.fn(() => obj),\n    insert: vi.fn(() => obj),\n    update: vi.fn(() => obj),\n    eq: vi.fn(() => obj),\n    in: vi.fn(() => obj),\n    gte: vi.fn(() => obj),\n    order: vi.fn(() => obj),\n    limit: vi.fn(() => obj),\n    single: vi.fn(async () => result),\n    maybeSingle: vi.fn(async () => result),\n    then: (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n      Promise.resolve(result).then(resolve, reject),\n  };\n  return obj;\n}\n\ndescribe('processInboundSms QC r2', () => {\n  beforeEach(() => {\n    mockFrom.mockReset();\n    handleClassifiedReplyEnrollment.mockReset();\n    pauseCampaignForLead.mockReset();\n    escalateLead.mockReset();\n    classifyUrgency.mockReset();\n    markLeadOptedOut.mockReset();\n    suppressPhoneForBusiness.mockReset();\n    pauseCampaignForLead.mockResolvedValue(undefined);\n    escalateLead.mockResolvedValue(undefined);\n    markLeadOptedOut.mockResolvedValue(undefined);\n    suppressPhoneForBusiness.mockResolvedValue(undefined);\n  });\n\n  afterEach(() => vi.clearAllMocks());\n\n  it('records STOP even when no recent lead (after 7 days)', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'businesses') {\n        return thenable({\n          data: {\n            id: 'biz-1',\n            phone: '+15559999999',\n            name: 'Acme',\n            vertical: 'general',\n          },\n          error: null,\n        });\n      }\n      // No lead for this phone (age cutoff / none)\n      if (table === 'leads') return thenable({ data: null, error: null });\n      if (table === 'sms_messages') return thenable({ data: null, error: null });\n      return thenable({ data: null, error: null });\n    });\n\n    const result = await processInboundSms({\n      from: '+15551234567',\n      businessPhone: '+15559999999',\n      body: 'STOP',\n      messageId: 'msg-stop-old',\n    });\n\n    expect(result).toEqual({ status: 'opt_out_recorded' });\n    expect(suppressPhoneForBusiness).toHaveBeenCalledWith(\n      'biz-1',\n      '+15551234567',\n      'opt_out'\n    );\n    expect(handleClassifiedReplyEnrollment).not.toHaveBeenCalled();\n  });\n\n  it('switches to Emergency on urgent reply', async () => {\n    const lead = {\n      id: 'lead-em',\n      business_id: 'biz-1',\n      caller_phone: '+15551234567',\n      status: 'pending',\n      urgency: null,\n      created_at: new Date().toISOString(),\n    };\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'businesses') {\n        return thenable({\n          data: {\n            id: 'biz-1',\n            phone: '+15559999999',\n            name: 'Acme',\n            vertical: 'plumbing',\n          },\n          error: null,\n        });\n      }\n      if (table === 'leads') {\n        const obj = thenable({ data: lead, error: null });\n        obj.update = vi.fn(() => thenable({ data: lead, error: null }));\n        return obj;\n      }\n      if (table === 'sms_messages') return thenable({ data: null, error: null });\n      return thenable({ data: null, error: null });\n    });\n    classifyUrgency.mockResolvedValue({\n      urgency: 'emergency',\n      confidence: 0.9,\n      keywords: [],\n      issue: 'flood',\n    });\n    handleClassifiedReplyEnrollment.mockResolvedValue({\n      action: 'switch',\n      campaignName: 'Emergency Follow-up',\n    });\n\n    const result = await processInboundSms({\n      from: '+15551234567',\n      businessPhone: '+15559999999',\n      body: 'Emergency flood!',\n      messageId: 'msg-1',\n    });\n\n    expect(result).toMatchObject({\n      status: 'processed',\n      enrollmentAction: 'switch',\n      enrolledCampaign: 'Emergency Follow-up',\n    });\n  });\n});\n"},"src/services/send/send.integration.test.ts":{"tests":[{"id":"122","name":"sendMessage module (real entry) > SENDS_ENABLED=false blocks every path","location":{"start":{"column":3,"line":115}}},{"id":"123","name":"sendMessage module (real entry) > normalizes to E.164 before calling the relay","location":{"start":{"column":3,"line":129}}},{"id":"124","name":"sendMessage module (real entry) > 503 maintenance parks as ambiguous, never needs_review","location":{"start":{"column":3,"line":160}}},{"id":"125","name":"sendMessage module (real entry) > invalid phone blocks without relay call","location":{"start":{"column":3,"line":181}}},{"id":"126","name":"sendMessage module (real entry) > recovery respects quiet hours by default (staging Florida 21:10 case)","location":{"start":{"column":3,"line":195}}}],"source":"/**\n * Integration-style tests against the real send module + campaign entry points\n * (mocked supabase / relay — not helpers-only).\n */\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\nconst mockSendMessage = vi.fn();\nconst mockLookup = vi.fn();\nconst mockCheckCaps = vi.fn();\nconst isPhoneSuppressed = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/lib/messaging', () => ({\n  getMessagingAdapter: () => ({\n    name: 'mock-relay',\n    sendMessage: (...a: unknown[]) => mockSendMessage(...a),\n    lookupByIdempotencyKey: (...a: unknown[]) => mockLookup(...a),\n    checkLookupSupport: (...a: unknown[]) => mockCheckCaps(...a),\n  }),\n}));\n\nvi.mock('@/lib/messaging/brwn-relay', () => ({\n  ensureRelayKeySupportProbed: vi.fn(async () => {\n    const { markRelayKeySupportConfirmed } = await import('@/services/sms-sid');\n    markRelayKeySupportConfirmed();\n    return true;\n  }),\n  warnIfRelayLookupUnsupported: vi.fn(async () => ({\n    supported: true,\n    capabilities: { idempotency: true, version: '1.7.6' },\n  })),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: (...a: unknown[]) => isPhoneSuppressed(...a),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/quiet-hours', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/quiet-hours')>(\n    '@/services/quiet-hours'\n  );\n  return {\n    ...actual,\n    deferUntilQuietHoursOpen: vi.fn((now: Date, opts: unknown) =>\n      actual.deferUntilQuietHoursOpen(now, opts as never)\n    ),\n  };\n});\n\nimport { sendMessage, isSendsEnabled, resetRelayKeySupportConfirmed } from './index';\nimport { deferUntilQuietHoursOpen } from '@/services/quiet-hours';\nimport { recoveryMessageSid } from '@/services/sms-sid';\n\nconst deferQuiet = vi.mocked(deferUntilQuietHoursOpen);\n\nfunction chainable(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const method of [\n    'select', 'insert', 'update', 'eq', 'lte', 'lt', 'is', 'or', 'in',\n    'order', 'limit', 'single', 'maybeSingle',\n  ]) {\n    obj[method] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.select = vi.fn(() => {\n    const nested = chainable(result);\n    nested.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n      Promise.resolve(result).then(resolve, reject);\n    return nested;\n  });\n  obj.insert = vi.fn(() => chainable({ data: null, error: null }));\n  obj.update = vi.fn(() => chainable({ data: null, error: null }));\n  obj.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n    Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('sendMessage module (real entry)', () => {\n  const prevSends = process.env.SENDS_ENABLED;\n\n  beforeEach(() => {\n    mockFrom.mockReset();\n    mockSendMessage.mockReset();\n    mockLookup.mockReset();\n    mockCheckCaps.mockReset();\n    deferQuiet.mockReset();\n    // Default: allow (quiet hours open) so other tests don't trip TCPA.\n    deferQuiet.mockReturnValue({\n      allowed: true,\n      zones: ['America/New_York'],\n      endHour: 21,\n    } as never);\n    isPhoneSuppressed.mockResolvedValue(false);\n    resetRelayKeySupportConfirmed();\n    process.env.SENDS_ENABLED = 'true';\n    mockCheckCaps.mockResolvedValue({\n      supported: true,\n      capabilities: { idempotency: true, version: '1.7.6' },\n    });\n  });\n\n  afterEach(() => {\n    if (prevSends === undefined) delete process.env.SENDS_ENABLED;\n    else process.env.SENDS_ENABLED = prevSends;\n  });\n\n  it('SENDS_ENABLED=false blocks every path', async () => {\n    process.env.SENDS_ENABLED = 'false';\n    expect(isSendsEnabled()).toBe(false);\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'hi',\n    });\n    expect(out).toEqual({ kind: 'blocked', reason: 'sends_disabled' });\n    expect(mockSendMessage).not.toHaveBeenCalled();\n  });\n\n  it('normalizes to E.164 before calling the relay', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') {\n        return chainable({\n          data: { opted_out: false, timezone: null, sms_outbound_sid: null },\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n    mockSendMessage.mockResolvedValue({\n      id: 'm1',\n      status: 'queued',\n      keyEchoed: true,\n    });\n\n    await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '2125550101', // raw national\n      body: 'hi',\n      idempotencyKey: recoveryMessageSid('L1'),\n      skipQuietHours: true,\n    });\n\n    expect(mockSendMessage).toHaveBeenCalledWith(\n      expect.objectContaining({ to: '+12125550101' })\n    );\n  });\n\n  it('503 maintenance parks as ambiguous, never needs_review', async () => {\n    mockFrom.mockImplementation(() => chainable({ data: { opted_out: false }, error: null }));\n    mockSendMessage.mockResolvedValue({\n      id: 'maint',\n      status: 'maintenance',\n      ambiguous: true,\n    });\n\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+12125550100',\n      body: 'hi',\n      idempotencyKey: recoveryMessageSid('L1'),\n      skipQuietHours: true,\n    });\n    expect(out.kind).toBe('ambiguous');\n    if (out.kind === 'ambiguous') expect(out.reason).toBe('maintenance');\n  });\n\n  it('invalid phone blocks without relay call', async () => {\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '123',\n      body: 'hi',\n      skipQuietHours: true,\n    });\n    expect(out.kind).toBe('blocked');\n    if (out.kind === 'blocked') expect(out.reason).toBe('invalid_phone');\n    expect(mockSendMessage).not.toHaveBeenCalled();\n  });\n\n  it('recovery respects quiet hours by default (staging Florida 21:10 case)', async () => {\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') {\n        return chainable({\n          data: { opted_out: false, timezone: 'America/New_York', sms_outbound_sid: null },\n          error: null,\n        });\n      }\n      return chainable({ data: null, error: null });\n    });\n    deferQuiet.mockReturnValue({\n      allowed: false,\n      nextSendAt: new Date('2026-10-29T12:00:00.000Z'),\n      zones: ['America/New_York'],\n      endHour: 21,\n    } as never);\n\n    const out = await sendMessage({\n      kind: 'recovery',\n      leadId: 'L1',\n      businessId: 'B1',\n      to: '+13055550100', // FL 305\n      body: 'hi',\n      idempotencyKey: recoveryMessageSid('L1'),\n      // skipQuietHours intentionally omitted — recovery must gate.\n    });\n\n    expect(out).toMatchObject({\n      kind: 'blocked',\n      reason: 'quiet_hours_deferred',\n    });\n    expect(mockSendMessage).not.toHaveBeenCalled();\n    expect(deferQuiet).toHaveBeenCalled();\n  });\n});\n"},"src/services/send/machine.extra.test.ts":{"tests":[{"id":"127","name":"send machine kill-mutants > duplicate+failed → needs_review with reason duplicate_failed","location":{"start":{"column":3,"line":17}}},{"id":"128","name":"send machine kill-mutants > failed status without duplicate → relay_failed","location":{"start":{"column":3,"line":36}}},{"id":"129","name":"send machine kill-mutants > every send_result reason/phase string is exact","location":{"start":{"column":3,"line":55}}},{"id":"130","name":"send machine kill-mutants > ok confirm_sent uses phase sent and defaults empty status to queued","location":{"start":{"column":3,"line":116}}},{"id":"131","name":"send machine kill-mutants > parkDelayMs: NaN/neg/0/frac/Infinity → base; positives exponential; capped","location":{"start":{"column":3,"line":135}}},{"id":"132","name":"send machine kill-mutants > parkNextAt moves forward by parkDelayMs","location":{"start":{"column":3,"line":149}}},{"id":"133","name":"send machine kill-mutants > lookup unknown increments attempts; max → needs_review max_attempts","location":{"start":{"column":3,"line":155}}},{"id":"134","name":"send machine kill-mutants > lookup sent nonterminal parks with lookup_nonterminal; max → max_attempts","location":{"start":{"column":3,"line":183}}},{"id":"135","name":"send machine kill-mutants > lookup sent resolves confirmed; empty status → queued; failed → relay_status_failed","location":{"start":{"column":3,"line":223}}},{"id":"136","name":"send machine kill-mutants > never_sent reasons and phases are exact","location":{"start":{"column":3,"line":275}}},{"id":"137","name":"send machine kill-mutants > isAmbiguousStatus covers sending/unknown/deferred/pending only","location":{"start":{"column":3,"line":301}}},{"id":"138","name":"send machine kill-mutants > isConfirmedStatus / isFailedStatus vocabularies","location":{"start":{"column":3,"line":315}}},{"id":"139","name":"send machine kill-mutants > classifyRecoveryStatus: every status incl unknown vocab → pending","location":{"start":{"column":3,"line":328}}},{"id":"140","name":"send machine kill-mutants > property: parkDelayMs never below base for finite non-negative","location":{"start":{"column":3,"line":354}}}],"source":"import { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport {\n  MAX_RECONCILE_ATTEMPTS,\n  parkDelayMs,\n  PARK_BASE_MS,\n  PARK_MAX_MS,\n  parkNextAt,\n  transitionSend,\n  isConfirmedStatus,\n  isAmbiguousStatus,\n  isFailedStatus,\n  classifyRecoveryStatus,\n} from './machine';\n\ndescribe('send machine kill-mutants', () => {\n  it('duplicate+failed → needs_review with reason duplicate_failed', () => {\n    const d = transitionSend({\n      kind: 'send_result',\n      signal: {\n        type: 'ok',\n        messageId: 'm',\n        status: 'failed',\n        keyEchoed: true,\n        duplicate: true,\n      },\n      capsBeforeSend: true,\n    });\n    expect(d).toEqual({\n      action: 'needs_review',\n      reason: 'duplicate_failed',\n      phase: 'needs_review',\n    });\n  });\n\n  it('failed status without duplicate → relay_failed', () => {\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: {\n          type: 'ok',\n          messageId: 'm',\n          status: 'failed',\n          keyEchoed: false,\n        },\n        capsBeforeSend: false,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'relay_failed',\n      phase: 'needs_review',\n    });\n  });\n\n  it('every send_result reason/phase string is exact', () => {\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: { type: 'conflict' },\n        capsBeforeSend: true,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'idempotency_conflict',\n      phase: 'needs_review',\n    });\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: { type: 'failed' },\n        capsBeforeSend: true,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'relay_failed',\n      phase: 'needs_review',\n    });\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: { type: 'maintenance' },\n        capsBeforeSend: true,\n      })\n    ).toEqual({\n      action: 'park_ambiguous',\n      reason: 'maintenance',\n      phase: 'ambiguous',\n      nextAttempts: 0,\n    });\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: { type: 'rate_limit' },\n        capsBeforeSend: true,\n      })\n    ).toEqual({\n      action: 'park_ambiguous',\n      reason: 'recent_send',\n      phase: 'ambiguous',\n      nextAttempts: 0,\n    });\n    expect(\n      transitionSend({\n        kind: 'send_result',\n        signal: { type: 'error' },\n        capsBeforeSend: true,\n      })\n    ).toEqual({\n      action: 'park_ambiguous',\n      reason: 'send_error',\n      phase: 'ambiguous',\n      nextAttempts: 0,\n    });\n  });\n\n  it('ok confirm_sent uses phase sent and defaults empty status to queued', () => {\n    const d = transitionSend({\n      kind: 'send_result',\n      signal: {\n        type: 'ok',\n        messageId: 'm',\n        status: '',\n        keyEchoed: true,\n      },\n      capsBeforeSend: true,\n    });\n    expect(d).toEqual({\n      action: 'confirm_sent',\n      providerStatus: 'queued',\n      keySupportedAtSend: true,\n      phase: 'sent',\n    });\n  });\n\n  it('parkDelayMs: NaN/neg/0/frac/Infinity → base; positives exponential; capped', () => {\n    expect(parkDelayMs(Number.NaN)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(Number.POSITIVE_INFINITY)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(Number.NEGATIVE_INFINITY)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(-1)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(-0.5)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(0)).toBe(PARK_BASE_MS);\n    expect(parkDelayMs(0.9)).toBe(PARK_BASE_MS); // floor → 0\n    expect(parkDelayMs(1)).toBe(PARK_BASE_MS * 2);\n    expect(parkDelayMs(1.9)).toBe(PARK_BASE_MS * 2); // floor → 1\n    expect(parkDelayMs(2)).toBe(PARK_BASE_MS * 4);\n    expect(parkDelayMs(100)).toBe(PARK_MAX_MS);\n  });\n\n  it('parkNextAt moves forward by parkDelayMs', () => {\n    const now = new Date('2026-01-01T00:00:00.000Z');\n    expect(parkNextAt(0, now).getTime()).toBe(now.getTime() + PARK_BASE_MS);\n    expect(parkNextAt(1, now).getTime()).toBe(now.getTime() + PARK_BASE_MS * 2);\n  });\n\n  it('lookup unknown increments attempts; max → needs_review max_attempts', () => {\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'unknown' },\n        keySupportedAtSend: true,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'park_ambiguous',\n      reason: 'lookup_unknown',\n      phase: 'ambiguous',\n      nextAttempts: 1,\n    });\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'unknown' },\n        keySupportedAtSend: true,\n        attempts: MAX_RECONCILE_ATTEMPTS - 1,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'max_attempts',\n      phase: 'needs_review',\n    });\n  });\n\n  it('lookup sent nonterminal parks with lookup_nonterminal; max → max_attempts', () => {\n    for (const status of ['sending', 'pending', 'deferred', 'unknown', 'weird']) {\n      expect(\n        transitionSend({\n          kind: 'lookup',\n          signal: { type: 'sent', status },\n          keySupportedAtSend: true,\n          attempts: 0,\n        }),\n        status\n      ).toEqual({\n        action: 'park_ambiguous',\n        reason: 'lookup_nonterminal',\n        phase: 'ambiguous',\n        nextAttempts: 1,\n      });\n    }\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'sent', status: 'sending' },\n        keySupportedAtSend: true,\n        attempts: MAX_RECONCILE_ATTEMPTS - 1,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'max_attempts',\n      phase: 'needs_review',\n    });\n    // ConditionalExpression false on !isConfirmedStatus must still park\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'sent', status: 'pending' },\n        keySupportedAtSend: false,\n        attempts: 2,\n      }).action\n    ).toBe('park_ambiguous');\n  });\n\n  it('lookup sent resolves confirmed; empty status → queued; failed → relay_status_failed', () => {\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'sent', status: 'delivered' },\n        keySupportedAtSend: false,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'resolved',\n      providerStatus: 'delivered',\n      phase: 'resolved',\n    });\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'sent', status: '' },\n        keySupportedAtSend: true,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'park_ambiguous',\n      reason: 'lookup_nonterminal',\n      phase: 'ambiguous',\n      nextAttempts: 1,\n    });\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'sent', status: 'failed' },\n        keySupportedAtSend: true,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'relay_status_failed',\n      phase: 'needs_review',\n    });\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'failed', status: 'undelivered' },\n        keySupportedAtSend: true,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'relay_status_failed',\n      phase: 'needs_review',\n    });\n  });\n\n  it('never_sent reasons and phases are exact', () => {\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'never_sent' },\n        keySupportedAtSend: false,\n        attempts: 0,\n      })\n    ).toEqual({\n      action: 'needs_review',\n      reason: 'never_sent_without_key_support',\n      phase: 'needs_review',\n    });\n    expect(\n      transitionSend({\n        kind: 'lookup',\n        signal: { type: 'never_sent' },\n        keySupportedAtSend: true,\n        attempts: 3,\n      })\n    ).toEqual({\n      action: 'requeue_never_sent',\n      phase: 'never_sent',\n    });\n  });\n\n  it('isAmbiguousStatus covers sending/unknown/deferred/pending only', () => {\n    expect(isAmbiguousStatus('sending')).toBe(true);\n    expect(isAmbiguousStatus('SENDING')).toBe(true);\n    expect(isAmbiguousStatus('unknown')).toBe(true);\n    expect(isAmbiguousStatus('deferred')).toBe(true);\n    expect(isAmbiguousStatus('pending')).toBe(true);\n    expect(isAmbiguousStatus('queued')).toBe(false);\n    expect(isAmbiguousStatus('sent')).toBe(false);\n    expect(isAmbiguousStatus('failed')).toBe(false);\n    expect(isAmbiguousStatus(null)).toBe(false);\n    expect(isAmbiguousStatus(undefined)).toBe(false);\n    expect(isAmbiguousStatus('')).toBe(false);\n  });\n\n  it('isConfirmedStatus / isFailedStatus vocabularies', () => {\n    for (const s of ['queued', 'dispatched', 'sent', 'delivered', 'QUEUED']) {\n      expect(isConfirmedStatus(s), s).toBe(true);\n    }\n    for (const s of ['failed', 'undelivered', 'rejected', 'error', 'FAILED']) {\n      expect(isFailedStatus(s), s).toBe(true);\n    }\n    expect(isConfirmedStatus(null)).toBe(false);\n    expect(isFailedStatus(undefined)).toBe(false);\n    expect(isConfirmedStatus('sending')).toBe(false);\n    expect(isFailedStatus('queued')).toBe(false);\n  });\n\n  it('classifyRecoveryStatus: every status incl unknown vocab → pending', () => {\n    expect(classifyRecoveryStatus(null)).toBe('absent');\n    expect(classifyRecoveryStatus(undefined)).toBe('absent');\n    expect(classifyRecoveryStatus('')).toBe('absent');\n    for (const s of ['queued', 'dispatched', 'sent', 'delivered']) {\n      expect(classifyRecoveryStatus(s), s).toBe('resolved_sent');\n    }\n    expect(classifyRecoveryStatus('abandoned_retry')).toBe('resolved_abandoned');\n    expect(classifyRecoveryStatus('abandoned_done')).toBe('resolved_abandoned');\n
