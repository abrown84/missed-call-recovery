tence',\n    });\n    expect(isDefiniteOptOut('never stop trying')).toBe(false);\n    expect(isDefiniteOptOut('cant stop the leak')).toBe(false);\n    expect(classifyOptOut('CAN YOU STOP TEXTING PLEASE').kind).toBe(\n      'ambiguous'\n    );\n  });\n\n  it('plain service chatter falls through to not_opt_out object', () => {\n    expect(classifyOptOut('My water heater is leaking')).toEqual({\n      kind: 'not_opt_out',\n    });\n    expect(classifyOptOut('hello')).toEqual({ kind: 'not_opt_out' });\n    expect(classifyOptOut('book me for next Tuesday')).toEqual({\n      kind: 'not_opt_out',\n    });\n  });\n\n  it('foldConfusables maps Cyrillic te and dze', () => {\n    expect(foldConfusables('ѕтор')).toBe('stop');\n    expect(normalizeOptOutText('ѕтор')).toBe('STOP');\n  });\n\n  it('compact removes spaces', () => {\n    expect(compactOptOutText('S T O P')).toBe('STOP');\n    expect(compactOptOutText('STOP STOP')).toBe('STOPSTOP');\n  });\n\n  it('backfill tokens include STOP and STOPSTOP', () => {\n    const t = optOutBackfillTokens();\n    expect(t).toContain('STOP');\n    expect(t).toContain('STOPSTOP');\n    expect(t).toContain('PLEASE STOP TEXTING ME');\n  });\n});\n"},"src/lib/postgrest-select.test.ts":{"tests":[{"id":"610","name":"PostgREST select vs filter (staging evidence c) > select id alone FAILS when filter references claim_token/claimed_at","location":{"start":{"column":3,"line":12}}},{"id":"611","name":"PostgREST select vs filter (staging evidence c) > ENROLLMENT_CLAIM_SELECT covers claim-gated switch filters","location":{"start":{"column":3,"line":24}}},{"id":"612","name":"PostgREST select vs filter (staging evidence c) > select * covers everything","location":{"start":{"column":3,"line":39}}},{"id":"613","name":"PostgREST select vs filter (staging evidence c) > stale-claim reclaim filters claimed_at — select id alone FAILS","location":{"start":{"column":3,"line":47}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  ENROLLMENT_CLAIM_SELECT,\n  selectCoversFilterColumns,\n} from './postgrest-select';\n\n/**\n * Mimics PostgREST Prefer: return=representation — filters are re-applied\n * against the selected columns. Missing a filter column → Postgres 42703.\n */\ndescribe('PostgREST select vs filter (staging evidence c)', () => {\n  it('select id alone FAILS when filter references claim_token/claimed_at', () => {\n    const check = selectCoversFilterColumns('id', [\n      { column: 'lead_id' },\n      { column: 'status' },\n      { or: 'claim_token.is.null,claimed_at.lt.2026-01-01T00:00:00.000Z' },\n    ]);\n    expect(check.ok).toBe(false);\n    expect(check.missing).toEqual(\n      expect.arrayContaining(['claim_token', 'claimed_at'])\n    );\n  });\n\n  it('ENROLLMENT_CLAIM_SELECT covers claim-gated switch filters', () => {\n    const check = selectCoversFilterColumns(ENROLLMENT_CLAIM_SELECT, [\n      { column: 'lead_id' },\n      { column: 'status' },\n      { or: 'claim_token.is.null,claimed_at.lt.2026-01-01T00:00:00.000Z' },\n    ]);\n    // lead_id/status not in select — still 42703 risk if filtered in RETURNING\n    // path; claim columns specifically must be present (the staging failure).\n    expect(check.missing.filter((c) => c === 'claim_token' || c === 'claimed_at')).toEqual(\n      []\n    );\n    expect(ENROLLMENT_CLAIM_SELECT).toContain('claim_token');\n    expect(ENROLLMENT_CLAIM_SELECT).toContain('claimed_at');\n  });\n\n  it('select * covers everything', () => {\n    expect(\n      selectCoversFilterColumns('*', [\n        { or: 'claim_token.is.null,claimed_at.lt.x' },\n      ]).ok\n    ).toBe(true);\n  });\n\n  it('stale-claim reclaim filters claimed_at — select id alone FAILS', () => {\n    const bad = selectCoversFilterColumns('id, claim_token', [\n      { column: 'id' },\n      { column: 'status' },\n      { column: 'claimed_at' },\n    ]);\n    expect(bad.ok).toBe(false);\n    expect(bad.missing).toContain('claimed_at');\n\n    const good = selectCoversFilterColumns(ENROLLMENT_CLAIM_SELECT, [\n      { column: 'id' },\n      { column: 'status' },\n      { column: 'claimed_at' },\n    ]);\n    expect(good.missing).not.toContain('claimed_at');\n    expect(good.missing).not.toContain('claim_token');\n  });\n});\n"},"src/services/enrollment-urgency.test.ts":{"tests":[{"id":"614","name":"enrollLeadInCampaign null urgency → Standard (QC r6) > enrolls into Standard when lead.urgency is null","location":{"start":{"column":3,"line":59}}},{"id":"615","name":"enrollLeadInCampaign null urgency → Standard (QC r6) > processMissedCall enrolls after recovery","location":{"start":{"column":3,"line":114}}}],"source":"/**\n * QC r6: null urgency enrolls into Standard (non-responder path).\n * Classification still switches Emergency/High on reply.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nconst mockFrom = vi.fn();\n\nvi.mock('@/lib/supabase', () => ({\n  createServerClient: () => ({ from: (...a: unknown[]) => mockFrom(...a) }),\n}));\n\nvi.mock('@/services/send', () => ({\n  resolveRecoveryOutcome: vi.fn(async () => 'absent'),\n  reconcileAmbiguousSms: vi.fn(),\n  sendMessage: vi.fn(),\n  parkNextAt: vi.fn(() => new Date()),\n}));\n\nvi.mock('@/services/sms', () => ({\n  sendRecoverySMS: vi.fn(),\n  processDeferredRecoveries: vi.fn(async () => ({ sent: 0, deferred: 0, errors: 0 })),\n}));\n\nvi.mock('@/services/suppressions', () => ({\n  isPhoneSuppressed: vi.fn(async () => false),\n  SuppressionLookupError: class extends Error {},\n}));\n\nvi.mock('@/services/quiet-hours', () => ({\n  deferUntilQuietHoursOpen: () => ({\n    allowed: true,\n    zones: ['America/New_York'],\n    endHour: 21,\n  }),\n}));\n\nimport { enrollLeadInCampaign } from './campaigns';\n\nfunction chain(result: { data: unknown; error: unknown }) {\n  const obj: Record<"+"string, any> = {};\n  const self = () => obj;\n  for (const m of [\n    'select', 'insert', 'update', 'eq', 'single', 'maybeSingle', 'order',\n  ]) {\n    obj[m] = vi.fn(self);\n  }\n  obj.single = vi.fn(async () => result);\n  obj.maybeSingle = vi.fn(async () => result);\n  obj.then = (resolve: (v: unknown) => unknown, reject?: (e: unknown) => unknown) =>\n    Promise.resolve(result).then(resolve, reject);\n  return obj;\n}\n\ndescribe('enrollLeadInCampaign null urgency → Standard (QC r6)', () => {\n  beforeEach(() => mockFrom.mockReset());\n\n  it('enrolls into Standard when lead.urgency is null', async () => {\n    const inserts: unknown[] = [];\n    mockFrom.mockImplementation((table: string) => {\n      if (table === 'leads') {\n        return chain({\n          data: {\n            id: 'L1',\n            urgency: null,\n            opted_out: false,\n            sms_outbound_sid: null,\n            businesses: { id: 'B' },\n          },\n          error: null,\n        });\n      }\n      if (table === 'campaign_enrollments') {\n        const c = chain({ data: null, error: null });\n        c.insert = vi.fn((row: unknown) => {\n          inserts.push(row);\n          return c;\n        });\n        c.maybeSingle = vi.fn(async () => ({ data: null, error: null }));\n        return c;\n      }\n      if (table === 'campaigns') {\n        return chain({\n          data: [\n            {\n              id: 'std',\n              name: 'Standard',\n              urgency_filter: null,\n              status: 'active',\n              auto_enroll: true,\n              campaign_steps: [\n                { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n                { step_number: 2, delay_minutes: 60, template_key: 'standard_followup_1' },\n              ],\n            },\n          ],\n          error: null,\n        });\n      }\n      if (table === 'sms_messages') {\n        return chain({ data: null, error: null });\n      }\n      return chain({ data: null, error: null });\n    });\n\n    const result = await enrollLeadInCampaign('L1');\n    expect(result.enrolled).toBe(true);\n    if (result.enrolled) {\n      expect(result.campaignName).toBe('Standard');\n    }\n  });\n\n  it('processMissedCall enrolls after recovery', async () => {\n    const src = await import('fs').then((fs) =>\n      fs.readFileSync(new URL('./missed-call.ts', import.meta.url), 'utf8')\n    );\n    expect(src).toMatch(/enrollLeadInCampaign\\s*\\(/);\n  });\n});\n"},"src/services/adversarial-campaign.sim.test.ts":{"tests":[{"id":"616","name":"adversarial: Standard→Emergency sid collision fixed > first Emergency step after switch is NOT dropped as duplicate","location":{"start":{"column":3,"line":69}}},{"id":"617","name":"adversarial: mid-send pause loses advance ownership > pause mid-send clears token; advance then fails","location":{"start":{"column":3,"line":89}}},{"id":"618","name":"adversarial: mid-send switch is deferred > decideReplyEnrollmentAction returns defer_switch under fresh claim","location":{"start":{"column":3,"line":106}}},{"id":"619","name":"adversarial: timeout reconcile requeues instead of silent skip > stuck sending with definite never_sent frees sid and reschedules exact step","location":{"start":{"column":3,"line":125}}},{"id":"620","name":"adversarial: timeout reconcile requeues instead of silent skip > duplicate sid with unknown status parks (does not advance)","location":{"start":{"column":3,"line":140}}},{"id":"621","name":"adversarial: concurrent claim still single-winner > two claimers → one wins","location":{"start":{"column":3,"line":147}}},{"id":"622","name":"adversarial: concurrent claim still single-winner > stale claim can be reclaimed after CLAIM_STALE_MS","location":{"start":{"column":3,"line":156}}}],"source":"/**\n * Adversarial simulations for QC r2: campaign-scoped sids, claim ownership,\n * mid-send pause/switch, timeout reconcile.\n */\nimport { describe, expect, it } from 'vitest';\nimport {\n  CLAIM_STALE_MS,\n  campaignStepMessageSid,\n  classifyMessageInsertError,\n  decideReplyEnrollmentAction,\n  hasFreshClaim,\n  isEnrollmentClaimable,\n} from './campaign-logic';\nimport { decideOnDuplicateSid } from './reconcile-logic';\n\ntype Enrollment = {\n  id: string;\n  lead_id: string;\n  campaign_id: string;\n  status: 'active' | 'paused' | 'completed';\n  step: number;\n  next: number | null;\n  claimed_at: number | null;\n  claim_token: string | null;\n};\n\ntype SmsRow = { sid: string; status: string };\n\nfunction makeDb(campaignId = 'c-std') {\n  const e: Enrollment = {\n    id: 'E1',\n    lead_id: 'L1',\n    campaign_id: campaignId,\n    status: 'active',\n    step: 2,\n    next: 0,\n    claimed_at: null,\n    claim_token: null,\n  };\n  const sms: SmsRow[] = [];\n  return { e, sms };\n}\n\nfunction claim(e: Enrollment, now: number, token: string): boolean {\n  const row = {\n    status: e.status,\n    next_send_at: e.next == null ? null : new Date(e.next).toISOString(),\n    claimed_at:\n      e.claimed_at == null ? null : new Date(e.claimed_at).toISOString(),\n  };\n  if (!isEnrollmentClaimable(row, new Date(now))) return false;\n  e.next = null;\n  e.claimed_at = now;\n  e.claim_token = token;\n  return true;\n}\n\nfunction advanceOwned(e: Enrollment, token: string, now: number): boolean {\n  if (e.status !== 'active' || e.claim_token !== token) return false;\n  e.step++;\n  e.next = now + 1e9;\n  e.claimed_at = null;\n  e.claim_token = null;\n  return true;\n}\n\ndescribe('adversarial: Standard→Emergency sid collision fixed', () => {\n  it('first Emergency step after switch is NOT dropped as duplicate', () => {\n    const db = makeDb('c-std');\n    // Prior Standard step 2 already sent\n    db.sms.push({\n      sid: campaignStepMessageSid('E1', 'c-std', 2),\n      status: 'queued',\n    });\n\n    // Switch to Emergency\n    db.e.campaign_id = 'c-em';\n    db.e.step = 2;\n\n    const emSid = campaignStepMessageSid('E1', 'c-em', 2);\n    const isDup = db.sms.some((r) => r.sid === emSid);\n    expect(isDup).toBe(false);\n    expect(emSid).not.toBe(db.sms[0].sid);\n  });\n});\n\ndescribe('adversarial: mid-send pause loses advance ownership', () => {\n  it('pause mid-send clears token; advance then fails', () => {\n    const db = makeDb();\n    const now = Date.now();\n    expect(claim(db.e, now, 'tok-1')).toBe(true);\n\n    // Customer replies → pause clears claim\n    db.e.status = 'paused';\n    db.e.claim_token = null;\n    db.e.claimed_at = null;\n    db.e.next = null;\n\n    expect(advanceOwned(db.e, 'tok-1', now + 1000)).toBe(false);\n    expect(db.e.step).toBe(2); // did not advance\n  });\n});\n\ndescribe('adversarial: mid-send switch is deferred', () => {\n  it('decideReplyEnrollmentAction returns defer_switch under fresh claim', () => {\n    const now = new Date();\n    const decision = decideReplyEnrollmentAction(\n      {\n        id: 'E1',\n        campaign_id: 'c-std',\n        status: 'active',\n        claimed_at: now.toISOString(),\n        claim_token: 'tok',\n      },\n      { id: 'c-em', name: 'Emergency', urgency_filter: 'emergency' },\n      { now }\n    );\n    expect(decision.action).toBe('defer_switch');\n    expect(hasFreshClaim({ claimed_at: now.toISOString() }, now)).toBe(true);\n  });\n});\n\ndescribe('adversarial: timeout reconcile requeues instead of silent skip', () => {\n  it('stuck sending with definite never_sent frees sid and reschedules exact step', () => {\n    const db = makeDb();\n    const sid = campaignStepMessageSid('E1', 'c-std', 2);\n    db.sms.push({ sid, status: 'sending' });\n\n    // Simulate relay miss → abandon sid\n    const abandoned = `${sid}:abandoned:1`;\n    db.sms[0].sid = abandoned;\n    db.sms[0].status = 'abandoned_retry';\n\n    // Fresh send for same logical step uses original sid again\n    expect(db.sms.some((r) => r.sid === sid)).toBe(false);\n    expect(classifyMessageInsertError({ code: '23505' })).toBe('duplicate');\n  });\n\n  it('duplicate sid with unknown status parks (does not advance)', () => {\n    expect(decideOnDuplicateSid('unknown').action).toBe('park');\n    expect(decideOnDuplicateSid('queued').action).toBe('advance');\n  });\n});\n\ndescribe('adversarial: concurrent claim still single-winner', () => {\n  it('two claimers → one wins', () => {\n    const db = makeDb();\n    const now = Date.now();\n    const a = claim(db.e, now, 'a');\n    const b = claim(db.e, now, 'b');\n    expect(a).toBe(true);\n    expect(b).toBe(false);\n  });\n\n  it('stale claim can be reclaimed after CLAIM_STALE_MS', () => {\n    const db = makeDb();\n    const now = Date.now();\n    claim(db.e, now, 'old');\n    expect(claim(db.e, now + 60_000, 'new')).toBe(false);\n    expect(claim(db.e, now + CLAIM_STALE_MS + 1, 'new')).toBe(true);\n    expect(db.e.claim_token).toBe('new');\n  });\n});\n"},"src/services/campaign-logic.switch.property.test.ts":{"tests":[{"id":"623","name":"staging (c) property: urgency campaigns never skip step 1 for recovery > for any recoveryAlreadySent, treatRecoveryAsInitial:false → step 1 now","location":{"start":{"column":3,"line":23}}},{"id":"624","name":"staging (c) property: urgency campaigns never skip step 1 for recovery > Standard still skips delay-0 when recovery sent","location":{"start":{"column":3,"line":42}}}],"source":"/**\n * Staging evidence (c) invariant: Standard→Emergency switch (and first-reply\n * Emergency enroll) must schedule Emergency step 1 immediately — recovery SMS\n * is not a substitute for the Emergency initial.\n */\nimport { describe, expect, it } from 'vitest';\nimport * as fc from 'fast-check';\nimport { planEnrollmentStart } from './campaign-logic';\n\nconst emergencySteps = [\n  { step_number: 1, delay_minutes: 0, template_key: 'emergency_initial' },\n  { step_number: 2, delay_minutes: 60, template_key: 'emergency_followup_1' },\n  { step_number: 3, delay_minutes: 180, template_key: 'emergency_followup_2' },\n];\n\nconst highSteps = [\n  { step_number: 1, delay_minutes: 0, template_key: 'high_initial' },\n  { step_number: 2, delay_minutes: 120, template_key: 'high_followup_1' },\n];\n\ndescribe('staging (c) property: urgency campaigns never skip step 1 for recovery', () => {\n  it('for any recoveryAlreadySent, treatRecoveryAsInitial:false → step 1 now', () => {\n    fc.assert(\n      fc.property(fc.boolean(), fc.boolean(), (recoverySent, isEmergency) => {\n        const steps = isEmergency ? emergencySteps : highSteps;\n        const plan = planEnrollmentStart(steps, {\n          recoveryAlreadySent: recoverySent,\n          treatRecoveryAsInitial: false, // switch / urgency enroll\n          now: new Date('2026-10-28T15:00:00.000Z'),\n        });\n        expect(plan.currentStep).toBe(1);\n        expect(plan.skippedInitial).toBe(false);\n        expect(plan.nextSendAt.getTime()).toBe(\n          new Date('2026-10-28T15:00:00.000Z').getTime()\n        );\n      }),\n      { numRuns: 40 }\n    );\n  });\n\n  it('Standard still skips delay-0 when recovery sent', () => {\n    const std = [\n      { step_number: 1, delay_minutes: 0, template_key: 'standard_initial' },\n      { step_number: 2, delay_minutes: 240, template_key: 'standard_followup_1' },\n    ];\n    const plan = planEnrollmentStart(std, {\n      recoveryAlreadySent: true,\n      treatRecoveryAsInitial: true,\n      now: new Date('2026-10-28T15:00:00.000Z'),\n    });\n    expect(plan.currentStep).toBe(2);\n    expect(plan.skippedInitial).toBe(true);\n  });\n});\n"},"src/lib/pii.test.ts":{"tests":[{"id":"625","name":"redactPhone > masks US numbers keeping last 4 digits","location":{"start":{"column":3,"line":5}}},{"id":"626","name":"redactPhone > handles missing / short input","location":{"start":{"column":3,"line":10}}},{"id":"627","name":"redactId > keeps first 8 characters of a uuid","location":{"start":{"column":3,"line":18}}},{"id":"628","name":"redactId > handles missing ids","location":{"start":{"column":3,"line":22}}}],"source":"import { describe, it, expect } from 'vitest';\nimport { redactPhone, redactId } from './pii';\n\ndescribe('redactPhone', () => {\n  it('masks US numbers keeping last 4 digits', () => {\n    expect(redactPhone('+15551234567')).toBe('***-***-4567');\n    expect(redactPhone('(555) 123-4567')).toBe('***-***-4567');\n  });\n\n  it('handles missing / short input', () => {\n    expect(redactPhone(null)).toBe('[no-phone]');\n    expect(redactPhone('')).toBe('[no-phone]');\n    expect(redactPhone('12')).toBe('***');\n  });\n});\n\ndescribe('redactId', () => {\n  it('keeps first 8 characters of a uuid', () => {\n    expect(redactId('abcdef12-3456-7890-abcd-ef1234567890')).toBe('abcdef12…');\n  });\n\n  it('handles missing ids', () => {\n    expect(redactId(undefined)).toBe('[no-id]');\n    expect(redactId('short')).toBe('********');\n  });\n});\n"},"src/services/campaign-reply-plan.test.ts":{"tests":[{"id":"629","name":"planReplyEnrollment > enroll when no enrollment","location":{"start":{"column":3,"line":13}}},{"id":"630","name":"planReplyEnrollment > noop when already on matching campaign and replyMode=continue","location":{"start":{"column":3,"line":23}}},{"id":"631","name":"planReplyEnrollment > pause when same campaign and replyMode=pause (explicit)","location":{"start":{"column":3,"line":41}}},{"id":"632","name":"planReplyEnrollment > explicit replyMode wins over env default (?? not &&)","location":{"start":{"column":3,"line":57}}},{"id":"633","name":"planReplyEnrollment > switch to Emergency on high urgency when enrolled in Standard","location":{"start":{"column":3,"line":81}}},{"id":"634","name":"planReplyEnrollment > defer_switch when fresh claim held","location":{"start":{"column":3,"line":100}}},{"id":"635","name":"mapSwitchResultToReplyAction > maps deferred reason to defer_switch","location":{"start":{"column":3,"line":120}}},{"id":"636","name":"mapSwitchResultToReplyAction > maps success and non-deferred failure","location":{"start":{"column":3,"line":130}}},{"id":"637","name":"mapSwitchResultToReplyAction > startsWith deferred is required (not endsWith)","location":{"start":{"column":3,"line":148}}},{"id":"638","name":"mapSwitchResultToReplyAction > undefined reason coalesces to empty for startsWith and failed for skip","location":{"start":{"column":3,"line":158}}}],"source":"import { describe, expect, it } from 'vitest';\nimport {\n  mapSwitchResultToReplyAction,\n  planReplyEnrollment,\n} from './campaign-reply-plan';\n\nconst campaigns = [\n  { id: 'S', name: 'Standard', urgency_filter: null as string | null },\n  { id: 'E', name: 'Emergency', urgency_filter: 'emergency' },\n];\n\ndescribe('planReplyEnrollment', () => {\n  it('enroll when no enrollment', () => {\n    expect(\n      planReplyEnrollment({\n        enrollment: null,\n        campaigns,\n        urgency: null,\n      })\n    ).toEqual({ type: 'enroll' });\n  });\n\n  it('noop when already on matching campaign and replyMode=continue', () => {\n    // Forces !enrollment guard false (must not enroll) and keeps replyMode\n    // in the options object (ObjectLiteral {} would default to pause → pause).\n    const p = planReplyEnrollment({\n      enrollment: {\n        id: 'enr',\n        campaign_id: 'S',\n        status: 'active',\n        claimed_at: null,\n        claim_token: null,\n      },\n      campaigns,\n      urgency: null,\n      replyMode: 'continue',\n    });\n    expect(p).toEqual({ type: 'noop' });\n  });\n\n  it('pause when same campaign and replyMode=pause (explicit)', () => {\n    const p = planReplyEnrollment({\n      enrollment: {\n        id: 'enr',\n        campaign_id: 'S',\n        status: 'active',\n        claimed_at: null,\n        claim_token: null,\n      },\n      campaigns,\n      urgency: null,\n      replyMode: 'pause',\n    });\n    expect(p).toEqual({ type: 'pause' });\n  });\n\n  it('explicit replyMode wins over env default (?? not &&)', () => {\n    const prev = process.env.CAMPAIGN_REPLY_MODE;\n    process.env.CAMPAIGN_REPLY_MODE = 'pause';\n    try {\n      const p = planReplyEnrollment({\n        enrollment: {\n          id: 'enr',\n          campaign_id: 'S',\n          status: 'active',\n          claimed_at: null,\n          claim_token: null,\n        },\n        campaigns,\n        urgency: null,\n        replyMode: 'continue',\n      });\n      // If && were used, env pause would win and we'd get pause — must be noop.\n      expect(p.type).toBe('noop');\n    } finally {\n      if (prev === undefined) delete process.env.CAMPAIGN_REPLY_MODE;\n      else process.env.CAMPAIGN_REPLY_MODE = prev;\n    }\n  });\n\n  it('switch to Emergency on high urgency when enrolled in Standard', () => {\n    const p = planReplyEnrollment({\n      enrollment: {\n        id: 'enr',\n        campaign_id: 'S',\n        status: 'active',\n        claimed_at: null,\n        claim_token: null,\n      },\n      campaigns,\n      urgency: 'emergency',\n    });\n    expect(p.type).toBe('switch');\n    if (p.type === 'switch') {\n      expect(p.targetCampaignId).toBe('E');\n      expect(p.campaignName).toBe('Emergency');\n    }\n  });\n\n  it('defer_switch when fresh claim held', () => {\n    const p = planReplyEnrollment({\n      enrollment: {\n        id: 'enr',\n        campaign_id: 'S',\n        status: 'active',\n        claimed_at: new Date().toISOString(),\n        claim_token: 'tok',\n      },\n      campaigns,\n      urgency: 'emergency',\n    });\n    expect(p.type).toBe('defer_switch');\n    if (p.type === 'defer_switch') {\n      expect(p.campaignName).toBe('Emergency');\n    }\n  });\n});\n\ndescribe('mapSwitchResultToReplyAction', () => {\n  it('maps deferred reason to defer_switch', () => {\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: false,\n        reason: 'deferred_or_switch_failed',\n        targetCampaignName: 'Emergency',\n      })\n    ).toEqual({ action: 'defer_switch', campaignName: 'Emergency' });\n  });\n\n  it('maps success and non-deferred failure', () => {\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: true,\n        campaignName: 'Emergency',\n        targetCampaignName: 'Emergency',\n      })\n    ).toEqual({ action: 'switch', campaignName: 'Emergency' });\n\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: false,\n        reason: 'no_steps',\n        targetCampaignName: 'Emergency',\n      })\n    ).toEqual({ action: 'skip:no_steps', campaignName: 'Emergency' });\n  });\n\n  it('startsWith deferred is required (not endsWith)', () => {\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: false,\n        reason: 'x_deferred',\n        targetCampaignName: 'E',\n      }).action\n    ).toBe('skip:x_deferred');\n  });\n\n  it('undefined reason coalesces to empty for startsWith and failed for skip', () => {\n    // reason ?? '' — filler string would still not start with deferred\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: false,\n        targetCampaignName: 'E',\n      })\n    ).toEqual({ action: 'skip:failed', campaignName: 'E' });\n\n    // reason ?? 'failed' must be the exact token\n    expect(\n      mapSwitchResultToReplyAction({\n        enrolled: false,\n        reason: undefined,\n        targetCampaignName: 'E',\n      }).action\n    ).toBe('skip:failed');\n  });\n});\n\n"},"src/lib/templates.test.ts":{"tests":[{"id":"639","name":"getTemplate > personalizes known templates and appends STOP footer (FCC 26-67)","location":{"start":{"column":3,"line":11}}},{"id":"640","name":"getTemplate > appends STOP footer; originals kept (Alex must approve any rewrite)","location":{"start":{"column":3,"line":22}}},{"id":"641","name":"getTemplate > appendOptOutFooter is idempotent","location":{"start":{"column":3,"line":32}}}],"source":"import { describe, it, expect } from 'vitest';\nimport {\n  ALL_TEMPLATES,\n  OPT_OUT_FOOTER,\n  appendOptOutFooter,\n  getTemplate,\n  smsSegmentCount,\n} from './templates';\n\ndescribe('getTemplate', () => {\n  it('personalizes known templates and appends STOP footer (FCC 26-67)', () => {\n    const body = getTemplate('emergency_initial', {\n      business: 'Acme Plumbing',\n      name: '',\n      issue: '',\n    });\n    expect(body).toContain('Acme Plumbing');\n    expect(body).not.toContain('{business}');\n    expect(body).toContain(OPT_OUT_FOOTER);\n  });\n\n  it('appends STOP footer; originals kept (Alex must approve any rewrite)', () => {\n    // QC r5 H: do not silently rewrite customer copy for GSM-7. Segment\n    // count may be >1 for emergency templates with emoji + STOP footer.\n    for (const key of Object.keys(ALL_TEMPLATES)) {\n      const body = getTemplate(key, { business: 'Acme', name: '', issue: '' });\n      expect(body).toContain(OPT_OUT_FOOTER);\n      expect(smsSegmentCount(body), key).toBeGreaterThanOrEqual(1);\n    }\n  });\n\n  it('appendOptOutFooter is idempotent', () => {\n    const once = appendOptOutFooter('Hello');\n    expect(appendOptOutFooter(once)).toBe(once);\n  });\n});\n"},"src/services/campaign-runtime.deferred-catch.test.ts":{"tests":[{"id":"642","name":"processDue deferred recovery isolation > continues cron when processDeferredRecoveries throws","location":{"start":{"column":3,"line":82}}}],"source":"/**\n * QC r7: processDeferredRecoveries throw must not abort processDue.\n */\nimport { beforeEach, describe, expect, it, vi } from 'vitest';\n\nvi.mock('@/services/send', async () => {\n  const actual = await vi.importActual<"+"typeof import('@/services/send')>(\n    '@/services/send'\n  );\n  return {\n    ...actual,\n    reconcileAmbiguousSms: vi.fn(async () => ({\n      unknownCount: 0,\n      stuckSendingCount: 0,\n      requeued: 0,\n      confirmed: 0,\n      parked: 0,\n      needsReview: 0,\n      alert: false,\n    })),\n  };\n});\n\nimport { processDueCampaignsWithDeps } from './campaign-runtime';\nimport type { CampaignDeps } from './campaign-deps';\n\nfunction chainList(data: unknown[] = []) {\n  const api: Record<"+"string, unknown> = {};\n  const self = () => api;\n  for (const m of [\n    'select',\n    'update',\n    'eq',\n    'lte',\n    'lt',\n    'is',\n    'or',\n    'in',\n    'like',\n    'order',\n    'limit',\n  ]) {\n    api[m] = self;\n  }\n  api.maybeSingle = async () => ({ data: null, error: null });\n  api.then = (resolve: (v: unknown) => unknown) =>\n    Promise.resolve({ data, error: null }).then(resolve);\n  return api;\n}\n\nfunction baseDeps(overrides: Partial<"+"CampaignDeps> = {}): CampaignDeps {\n  return {\n    db: () => ({ from: () => chainList([]) }) as never,\n    clock: () => new Date('2026-06-15T18:00:00.000Z'),\n    adapter: () =>\n      ({\n        name: 'mock',\n        checkLookupSupport: async () => ({ supported: true }),\n      }) as never,\n    sendMessage: vi.fn(),\n    sendRecoverySMS: vi.fn(),\n    processDeferredRecoveries: vi.fn(async () => ({\n      sent: 0,\n      deferred: 0,\n      errors: 0,\n    })),\n    isPhoneSuppressed: async () => false,\n    SuppressionLookupError: class extends Error {},\n    getTemplate: () => 'hi',\n    uuid: () => 'u',\n    sleep: async () => undefined,\n    ...overrides,\n  } as CampaignDeps;\n}\n\ndescribe('processDue deferred recovery isolation', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n\n  it('continues cron when processDeferredRecoveries throws', async () => {\n    const deps = baseDeps({\n      processDeferredRecoveries: vi.fn(async () => {\n        throw new Error('deferred boom');\n      }),\n    });\n    const r = await processDueCampaignsWithDeps(deps);\n    expect(r.processed).toBe(0);\n    expect(r.messagingProvider).toBe('mock');\n  });\n});\n"},"src/lib/gemini.test.ts":{"tests":[{"id":"643","name":"resolveGatewayUrl > fails closed when unset outside production","location":{"start":{"column":3,"line":5}}},{"id":"644","name":"resolveGatewayUrl > requires ONE_GATEWAY_URL explicitly in production (no implicit default)","location":{"start":{"column":3,"line":11}}},{"id":"645","name":"resolveGatewayUrl > normalizes trailing slashes","location":{"start":{"column":3,"line":20}}},{"id":"646","name":"resolveGatewayUrl > allows http only for localhost","location":{"start":{"column":3,"line":26}}},{"id":"647","name":"resolveGatewayUrl > rejects invalid URLs and schemes","location":{"start":{"column":3,"line":35}}}],"source":"import { describe, it, expect } from 'vitest';\nimport { PRODUCTION_DEFAULT_GATEWAY_URL, resolveGatewayUrl } from './gemini';\n\ndescribe('resolveGatewayUrl', () => {\n  it('fails closed when unset outside production', () => {\n    expect(() => resolveGatewayUrl(undefined, { isProduction: false })).toThrow(\n      /fail closed/i\n    );\n  });\n\n  it('requires ONE_GATEWAY_URL explicitly in production (no implicit default)', () => {\n    expect(() => resolveGatewayUrl(undefined, { isProduction: true })).toThrow(\n      /explicitly/i\n    );\n    expect(\n      resolveGatewayUrl(PRODUCTION_DEFAULT_GATEWAY_URL, { isProduction: true })\n    ).toBe(PRODUCTION_DEFAULT_GATEWAY_URL);\n  });\n\n  it('normalizes trailing slashes', () => {\n    expect(resolveGatewayUrl('https://example.com/gw/', { isProduction: false })).toBe(\n      'https://example.com/gw'\n    );\n  });\n\n  it('allows http only for localhost', () => {\n    expect(resolveGatewayUrl('http://localhost:8787', { isProduction: false })).toBe(\n      'http://localhost:8787'\n    );\n    expect(() =>\n      resolveGatewayUrl('http://evil.example', { isProduction: false })\n    ).toThrow(/https/);\n  });\n\n  it('rejects invalid URLs and schemes', () => {\n    expect(() =>\n      resolveGatewayUrl('not a url', { isProduction: false })\n    ).toThrow(/not a valid URL/);\n    expect(() =>\n      resolveGatewayUrl('ftp://example.com', { isProduction: false })\n    ).toThrow(/http: and https/);\n  });\n});\n"},"src/lib/safe-redirect.test.ts":{"tests":[{"id":"648","name":"safeRedirectPath > allows same-origin relative paths","location":{"start":{"column":3,"line":5}}},{"id":"649","name":"safeRedirectPath > rejects open redirects","location":{"start":{"column":3,"line":10}}},{"id":"650","name":"safeRedirectPath > uses custom fallback","location":{"start":{"column":3,"line":17}}}],"source":"import { describe, it, expect } from 'vitest';\nimport { safeRedirectPath } from './safe-redirect';\n\ndescribe('safeRedirectPath', () => {\n  it('allows same-origin relative paths', () => {\n    expect(safeRedirectPath('/leads')).toBe('/leads');\n    expect(safeRedirectPath('/settings?tab=sms')).toBe('/settings?tab=sms');\n  });\n\n  it('rejects open redirects', () => {\n    expect(safeRedirectPath('https://evil.com')).toBe('/');\n    expect(safeRedirectPath('//evil.com')).toBe('/');\n    expect(safeRedirectPath('\\\\evil.com')).toBe('/');\n    expect(safeRedirectPath('/\\nevil')).toBe('/');\n  });\n\n  it('uses custom fallback', () => {\n    expect(safeRedirectPath(null, '/login')).toBe('/login');\n    expect(safeRedirectPath('https://x', '/dashboard')).toBe('/dashboard');\n  });\n});\n"}},"projectRoot":"/workspace","config":{"packageManager":"npm","reporters":["clear-text","html","json"],"testRunner":"vitest","vitest":{"related":false,"pool":"threads"},"coverageAnalysis":"perTest","mutate":["src/services/inbound.ts","src/services/missed-call.ts"],"ignoreStatic":true,"thresholds":{"high":90,"low":60,"break":null},"timeoutMS":60000,"concurrency":4,"htmlReporter":{"fileName":"reports/mutation/mutation.html"},"jsonReporter":{"fileName":"reports/mutation/mutation.json"},"allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":false,"fileLogLevel":"off","inPlace":false,"logLevel":"info","maxConcurrentTestRunners":9007199254740991,"maxTestRunnerReuse":0,"mutator"
