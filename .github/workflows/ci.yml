name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholder env so Next can compile without real credentials.
      # No secrets — values are fake and only used for build/typecheck.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-placeholder
      BRWN_RELAY_URL: https://relay.example.com
      BRWN_RELAY_SENDER_TOKEN: ci-sender-token-not-real
      BRWN_WEBHOOK_SECRET: ci-webhook-secret-not-real
      BRWN_DEFAULT_BUSINESS_PHONE: '+15555550100'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard rolldown optional binding pin
        run: npm run check:rolldown-pin

      - name: Opt-out SQL list parity (mig 003 ↔ opt-out-data)
        run: npm run check:opt-out-sql

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  mutation:
    runs-on: ubuntu-latest
    # QC r9: quiet-hours-zones back under mutate (static map is expensive).
    timeout-minutes: 90
    needs: build-and-test
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-placeholder
      BRWN_RELAY_URL: https://relay.example.com
      BRWN_RELAY_SENDER_TOKEN: ci-sender-token-not-real
      BRWN_WEBHOOK_SECRET: ci-webhook-secret-not-real
      BRWN_DEFAULT_BUSINESS_PHONE: '+15555550100'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret-not-real
      MUTATION_MIN: '90'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stryker mutation
        run: npm run test:mutation

      - name: Mutation score gate (≥90, ignored disclosed)
        run: node scripts/check-mutation-scores.mjs
