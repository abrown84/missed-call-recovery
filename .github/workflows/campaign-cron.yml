# Follow-up sender every 5 minutes.
#
# Why GitHub Actions (not vercel.json */5):
# Vercel Hobby only allows once-daily cron; */5 in vercel.json fails deploy.
#
# Required repo secrets:
#   CRON_APP_URL  — staging / preview origin (e.g. https://…vercel.app)
#   CRON_SECRET   — same value as the app's CRON_SECRET env var
# Optional:
#   ALLOW_PROD_CRON=yes — required if CRON_APP_URL contains prod/production
#   ALLOW_LIVE_CRON_PROVIDER=yes — required if messagingProvider is not dry-run
#
# Staging apps MUST set MESSAGING_PROVIDER=dry-run. The workflow fails unless
# the cron JSON reports messagingProvider=dry-run (unless override is set).

name: Campaign follow-up cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: campaign-cron
  cancel-in-progress: false

jobs:
  process-due-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require secrets and guard production URL
        env:
          CRON_APP_URL: ${{ secrets.CRON_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALLOW_PROD_CRON: ${{ secrets.ALLOW_PROD_CRON }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing required secrets CRON_APP_URL and/or CRON_SECRET. Follow-ups will not run until they are set."
            exit 1
          fi
          lower="$(printf '%s' "$CRON_APP_URL" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "$lower" | grep -Eq '(^|[./-])(prod|production)([./-]|$)'; then
            if [ "${ALLOW_PROD_CRON:-}" != "yes" ]; then
              echo "::error::CRON_APP_URL looks like production. Set secret ALLOW_PROD_CRON=yes to override, or point at staging."
              exit 1
            fi
          fi

      - name: Process due campaign SMS
        env:
          CRON_APP_URL: ${{ secrets.CRON_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALLOW_LIVE_CRON_PROVIDER: ${{ secrets.ALLOW_LIVE_CRON_PROVIDER }}
        run: |
          set -euo pipefail
          url="${CRON_APP_URL%/}/api/cron/campaigns"
          echo "POST ${CRON_APP_URL%/}/api/cron/campaigns at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          http_code=$(curl -sS -o /tmp/cron-body.json -w '%{http_code}' \
            -X POST "$url" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $http_code"
          cat /tmp/cron-body.json || true
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Cron endpoint failed with HTTP $http_code"
            exit 1
          fi
          provider=$(python3 -c "import json; print(json.load(open('/tmp/cron-body.json')).get('messagingProvider',''))")
          echo "messagingProvider=${provider}"
          if [ "$provider" != "dry-run" ]; then
            if [ "${ALLOW_LIVE_CRON_PROVIDER:-}" != "yes" ]; then
              echo "::error::Cron response messagingProvider='${provider}' is not dry-run. Force MESSAGING_PROVIDER=dry-run on the preview, or set ALLOW_LIVE_CRON_PROVIDER=yes."
              exit 1
            fi
          fi
